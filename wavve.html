<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웨이브 랭킹 — 오뜨랑</title>
<meta name="description" content="웨이브 TV 시리즈·영화·예능 TOP 랭킹을 오뜨랑에서 확인하세요.">
<meta name="keywords" content="웨이브 순위, 웨이브 랭킹, 웨이브 TOP10, 오뜨랑">
<meta property="og:title" content="웨이브 랭킹 — 오뜨랑">
<meta property="og:description" content="웨이브 오늘의 TOP 랭킹을 한눈에">
<meta property="og:type" content="website">
<meta property="og:site_name" content="오뜨랑">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* ── CSS 변수 (공통 + 웨이브 브랜드 컬러) ── */
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  /* 웨이브 브랜드: 공식 블루-퍼플 */
  --accent:#006FE6;       /* 웨이브 공식 블루 */
  --accent2:#3385ff;      /* 밝은 블루 호버 */
  --accent-glow:rgba(0,111,230,0.18);
  --accent-border:rgba(0,111,230,0.35);
  --green:#34d399; --gold:#f0b429;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
html { scroll-behavior:smooth }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.6; overflow-x:hidden;
}

/* ── 헤더 sticky ── */
#ottrang-header { position:sticky; top:0; z-index:200 }
.main-outer { max-width:var(--max-w); margin:0 auto; padding:0 24px 80px }

/* ── 히어로 배너 ── */
.hero {
  position:relative; padding:30px 0 20px; margin-bottom:20px;
  border-bottom:1px solid var(--border); overflow:hidden;
}
.hero::before {
  content:''; position:absolute; top:-40px; right:-60px;
  width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,111,230,0.18) 0%, transparent 70%);
  pointer-events:none;
}
.hero-eyebrow {
  font-family:var(--mono); font-size:11px; color:#006FE6;
  letter-spacing:3px; text-transform:uppercase; margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.hero-eyebrow::before {
  content:''; display:block; width:24px; height:1px; background:#006FE6;
}
.hero-title {
  font-family:var(--disp); font-size:52px; letter-spacing:3px;
  line-height:1; margin-bottom:10px;
}
.hero-title .wv { color:#006FE6 !important } /* 웨이브 블루 고정 — 헤더 CSS 덮어쓰기 방지 */
.hero-sub {
  font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.5px;
  position:absolute; bottom:54px; right:0; text-align:right;
}
/* WAVVE 대형 배경 글자 */
.hero-logo {
  position:absolute; right:0; top:50%; transform:translateY(-50%);
  font-family:var(--disp); font-size:200px; color:rgba(0,111,230,0.06);
  line-height:1; pointer-events:none; user-select:none; letter-spacing:-8px;
}

/* ── 섹션 ── */
.rank-section { margin-bottom:52px }
.sec-hd {
  display:flex; align-items:center; gap:12px;
  margin-bottom:20px; padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.sec-num {
  font-family:var(--disp); font-size:13px; color:#006FE6;
  background:rgba(0,111,230,0.18); border:1px solid rgba(0,111,230,0.35);
  padding:2px 10px; border-radius:4px; letter-spacing:1px; white-space:nowrap;
}
.sec-title {
  font-family:var(--disp); font-size:24px; letter-spacing:1.5px; color:var(--text);
}
.sec-count {
  font-family:var(--disp); font-size:24px; letter-spacing:1.5px; color:var(--muted);
}
/* 업데이트 시간 표시 (live dot) */
.sec-live {
  margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);
  display:flex; align-items:center; gap:7px;
}
.sec-live-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--green); animation:pulse 2s infinite; flex-shrink:0;
}

/* ── 스와이프 트랙 ── */
.swipe-wrap { position:relative }
.swipe-track {
  display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory;
  scrollbar-width:none; -ms-overflow-style:none; padding-bottom:6px; cursor:grab;
}
.swipe-track::-webkit-scrollbar { display:none }
.swipe-track.dragging { cursor:grabbing; user-select:none }

/* ── 랭킹 카드 ── */
.rk-card {
  flex:0 0 calc(20% - 13px); min-width:200px; max-width:230px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--r);
  overflow:hidden; cursor:pointer; transition:all .22s; scroll-snap-align:start;
  position:relative;
}
.rk-card:hover {
  border-color:rgba(0,111,230,0.35); transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(0,111,230,0.18);
}

/* 순위 번호 */
.rk-num {
  position:absolute; top:0; left:0;
  font-family:var(--disp); font-size:42px; line-height:1;
  color:rgba(255,255,255,.9); z-index:2; padding:4px 8px;
  text-shadow:0 2px 8px rgba(0,0,0,.8); letter-spacing:-1px;
}
.rk-num.top3 {
  color:#006FE6 !important; text-shadow:0 2px 12px rgba(0,111,230,0.5);
}

/* 포스터 */
.rk-poster {
  position:relative; width:100%; aspect-ratio:2/3;
  background:var(--bg3); overflow:hidden;
}
.rk-poster img {
  width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s;
}
.rk-card:hover .rk-poster img { transform:scale(1.04) }
.rk-poster-ph {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:48px; background:linear-gradient(135deg,var(--bg3),var(--bg2));
}

/* 호버 오버레이 */
.rk-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);
  display:flex; align-items:flex-end; padding:12px;
  opacity:0; transition:opacity .2s;
}
.rk-card:hover .rk-overlay { opacity:1 }
.rk-play {
  width:40px; height:40px; border-radius:50%;
  background:rgba(0,111,230,0.9); display:flex; align-items:center; justify-content:center;
  margin:0 auto;
}
.rk-play svg { width:16px; height:16px; fill:#fff; margin-left:2px }

/* 카드 본문 */
.rk-body { padding:10px 12px 12px }
.rk-title-row { display:flex; align-items:center; gap:5px; margin-bottom:3px; min-width:0 }
.rk-title {
  font-size:14px; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;
}
.rk-en {
  font-family:var(--mono); font-size:12px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px;
}
.rk-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.rk-year { font-family:var(--mono); font-size:12px; color:var(--muted) }
.rk-season {
  font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:3px;
  background:rgba(0,111,230,0.18); color:#006FE6; border:1px solid rgba(0,111,230,0.35);
}
.rk-memo {
  font-family:var(--mono); font-size:12px; color:var(--gold);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.rk-rating {
  font-family:var(--mono); font-size:12px; color:var(--gold);
  display:flex; align-items:center; gap:2px; margin-left:auto;
}

/* ── 스와이프 화살표 ── */
.swipe-btn {
  position:absolute; top:38%; transform:translateY(-50%);
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(0,111,230,0.35); background:var(--bg2);
  color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:10;
  transition:all .15s; opacity:0;
}
.swipe-wrap:hover .swipe-btn { opacity:1 }
.swipe-btn:hover { background:rgba(0,111,230,0.18); border-color:#006FE6 }
.swipe-btn.prev { left:-19px }
.swipe-btn.next { right:-19px }
.swipe-btn:disabled { opacity:0!important; pointer-events:none }

/* ── 스켈레톤 ── */
.skel-card {
  flex:0 0 calc(20% - 13px); min-width:200px; border-radius:var(--r);
  background:var(--card); border:1px solid var(--border); overflow:hidden;
}
.skel-poster {
  width:100%; aspect-ratio:2/3;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
}
.skel-line {
  height:12px; border-radius:4px; margin:10px 12px 6px;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
}
.skel-line.short { width:55%; height:10px; margin-top:0 }

/* ── 빈 상태 / 에러 ── */
.sec-empty {
  padding:40px; text-align:center; font-size:14px; color:var(--muted);
  background:var(--card); border:1px solid var(--border); border-radius:var(--r);
}

/* ── 애니메이션 ── */
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── 모바일 ── */
@media(max-width:768px) {
  .main-outer { padding:0 14px 60px }
  .hero { padding:32px 0 28px }
  .hero-title { font-size:38px }
  .hero-logo { font-size:120px; opacity:.5 }
  .rk-card { min-width:160px; max-width:180px }
  .hero-sub { display:none }

  /* ── 섹션 헤더 1줄화 ── */
  .sec-hd{ flex-wrap:nowrap; padding:18px 16px 10px; gap:6px; overflow:hidden; }
  .sec-title{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:1; min-width:0; letter-spacing:0.5px; }
  .sec-sub{ display:none; }
  .sec-live{ display:none; }  /* 모바일: 날짜 섹션헤더에서 숨김 */
  /* ── 슬라이드 화살표 — 모바일 상시 표시 ── */
  .swipe-btn{ display:flex !important; opacity:1 !important; }
  .swipe-btn.prev{ left:-14px; }
  .swipe-btn.next{ right:-14px; }
}

/* ott-date-bottom — 모바일 전용, 첫 섹션 하단 날짜 */
.ott-date-bottom{
  display:none;
  font-family:var(--mono);font-size:10px;color:var(--muted);
}
.ott-live-dot{
  width:6px;height:6px;border-radius:50%;
  background:#006FE6;animation:pulse 2s infinite;flex-shrink:0;
}
@media(max-width:768px){
  .ott-date-bottom{
    display:flex;align-items:center;justify-content:flex-end;
    gap:5px;padding:2px 16px 10px;
  }
}
</style>
</head>
<body>

<!-- ── 헤더 ── -->
<div id="ottrang-header"></div>
<script>
fetch('/header.html')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(h => {
    const el = document.getElementById('ottrang-header');
    el.innerHTML = h;
    // header.html 내부 script 태그 재실행
    el.querySelectorAll('script').forEach(s => {
      const ns = document.createElement('script');
      ns.textContent = s.textContent;
      document.body.appendChild(ns);
    });
    if (typeof initHeader === 'function') initHeader();
  })
  .catch(() => {})
  .finally(() => {
    loadAll(); // 헤더 로드 완료 후 콘텐츠 로드
  });
</script>

<div class="main-outer">

  <!-- ── 히어로 배너 ── -->
  <div class="hero">
    <div class="hero-eyebrow">OTT RANKING</div>
    <div class="hero-title"><span class="wv">WAVVE</span> 랭킹</div>
    <div class="hero-sub">웨이브 오늘의 TOP 랭킹 · 오뜨랑 집계</div>
    <div class="hero-logo">W</div>
  </div>

  <!-- ── 섹션 컨테이너 (동적 렌더링) ── -->
  <div id="sectionsWrap"></div>

</div>

<!-- ── 푸터 ── -->
<div id="ottrang-footer"></div>
<script>
fetch('/footer.html')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(h => { document.getElementById('ottrang-footer').innerHTML = h; })
  .catch(() => {});
</script>

<script>
/* ════════════════════════════════════════════════════
   웨이브 랭킹 페이지
   - /rankings/platform?platform=wavve 단일 API 호출
   - ott_categories의 platform_section/platform_order/platform_limit 반영
   - 어드민에서 노출/순서/개수 변경 시 자동 반영 (하드코딩 없음)
════════════════════════════════════════════════════ */

const API      = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
const PLATFORM = 'wavve';

/* ── 작품 상세 페이지 이동 ── */
function goWork(tmdbId, title) {
  if (!tmdbId) return;
  const y   = new Date().getFullYear();
  const url = `/title/1-${y}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: 'tv', title: title || '', platform: PLATFORM
  }));
  location.href = url;
}

/* ── 랭킹 카드 HTML 생성 ── */
function makeCard(item, idx) {
  const rank    = item.rank || (idx + 1);
  const isTop3  = rank <= 3;

  // 포스터: 이미지 있으면 img 태그, 없으면 이모지 placeholder
  const posterHtml = item.poster_path
    ? `<img src="${TMDB_IMG}${item.poster_path}"
            alt="${escAttr(item.title_ko || '')}"
            loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const posterPh = `<div class="rk-poster-ph">🎬</div>`;

  // 메타 정보
  const season = item.season
    ? `<span class="rk-season">시즌 ${item.season}</span>` : '';
  const memo   = item.memo
    ? `<span class="rk-memo">${escHtml(item.memo)}</span>` : '';
  const year   = item.release_year
    ? `<span class="rk-year">${item.release_year}</span>` : '';
  const rating = item.tmdb_rating
    ? `<span class="rk-rating">★ ${parseFloat(item.tmdb_rating).toFixed(1)}</span>` : '';

  return `
    <div class="rk-card" onclick="goWork(${item.tmdb_id},'${escAttr(item.title_ko || '')}')">
      <div class="rk-poster">
        ${posterHtml}${posterPh}
        <div class="rk-overlay">
          <div class="rk-play">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
      </div>
      <span class="rk-num${isTop3 ? ' top3' : ''}">${rank}</span>
      <div class="rk-body">
        <div class="rk-title-row">
          <span class="rk-title">${escHtml(item.title_ko || item.title_en || '—')}</span>
          ${season}
        </div>
        <div class="rk-en">${escHtml(item.title_en || '')}</div>
        <div class="rk-meta">${year}${memo}${rating}</div>
      </div>
    </div>`;
}

/* ── 스켈레톤 카드 HTML ── */
function makeSkel(n = 5) {
  return Array(n).fill(0).map(() => `
    <div class="skel-card">
      <div class="skel-poster"></div>
      <div class="skel-line"></div>
      <div class="skel-line short"></div>
    </div>`).join('');
}

/* ── 스와이프 드래그 초기화 ── */
function initSwipe(track) {
  let down = false, startX = 0, sl = 0;
  track.addEventListener('mousedown', e => {
    down = true; track.classList.add('dragging');
    startX = e.pageX - track.offsetLeft; sl = track.scrollLeft;
  });
  ['mouseleave', 'mouseup'].forEach(ev =>
    track.addEventListener(ev, () => { down = false; track.classList.remove('dragging'); })
  );
  track.addEventListener('mousemove', e => {
    if (!down) return; e.preventDefault();
    track.scrollLeft = sl - (e.pageX - track.offsetLeft - startX) * 1.2;
  });
}

/* ── 트랙 좌우 스크롤 ── */
function scrollTrack(id, dir) {
  const t = document.getElementById(id);
  if (!t) return;
  t.scrollBy({ left: dir * (210 * 3), behavior: 'smooth' });
  // 스크롤 후 화살표 표시/숨김 갱신
  setTimeout(() => updateSwipeBtns(t), 350);
}

function updateSwipeBtns(track) {
  const wrap = track.closest('.swipe-wrap');
  if (!wrap) return;
  const prev = wrap.querySelector('.swipe-btn.prev');
  const next = wrap.querySelector('.swipe-btn.next');
  const atStart = track.scrollLeft <= 4;
  const atEnd   = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  // PC와 동일한 방식: disabled 속성 → .swipe-btn:disabled CSS 적용
  if (prev) prev.disabled = atStart;
  if (next) next.disabled = atEnd;
}

/* 초기 화살표 상태 설정 — 로드 시 */
function initSwipeBtns() {
  document.querySelectorAll('.swipe-track').forEach(track => {
    updateSwipeBtns(track);
    track.addEventListener('scroll', () => updateSwipeBtns(track), { passive:true });
  });
}

/* ── 날짜 포맷: 오늘 기준 업데이트 텍스트 ── */
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 업데이트`;
}

/* ── 메인 데이터 로드 및 렌더링 ── */
async function loadAll() {
  const wrap = document.getElementById('sectionsWrap');

  // 1) 로딩 중 스켈레톤 먼저 표시 (UX 개선)
  wrap.innerHTML = `
    <div class="rank-section">
      <div class="sec-hd">
        <span class="sec-num">TOP 10</span>
        <span class="sec-title">불러오는 중...</span>
      </div>
      <div class="swipe-wrap">
        <div class="swipe-track">${makeSkel(5)}</div>
      </div>
    </div>`;

  let groups = [];
  try {
    // 2) /rankings/platform API 호출
    //    - ott_categories.platform_section IS NOT NULL 인 카테고리만 반환
    //    - platform_order 순으로 정렬
    //    - platform_limit 개수만큼 items 포함
    const res = await fetch(`${API}/rankings/platform?platform=${PLATFORM}`);
    if (!res.ok) throw new Error(`API 오류: ${res.status}`);
    const json = await res.json();
    groups = json.data || [];
  } catch (e) {
    wrap.innerHTML = `
      <div class="sec-empty">
        랭킹 데이터를 불러오지 못했습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${e.message}</span>
      </div>`;
    return;
  }

  // 3) 데이터 없을 때
  if (!groups.length) {
    wrap.innerHTML = `
      <div class="sec-empty">
        아직 등록된 랭킹이 없습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">
          어드민 OTT 페이지 설정에서 카테고리를 노출로 설정해주세요.
        </span>
      </div>`;
    return;
  }

  const dateStr = getTodayStr();

  // 4) platform_order 순으로 이미 정렬되어 있음 (API 보장)
  //    각 그룹을 섹션으로 렌더링
  wrap.innerHTML = groups.map((group, i) => {
    const trackId  = `trk-${i}`;
    const topLabel = `TOP ${group.items?.length || 0}`;

    return `
      <div class="rank-section">
        <div class="sec-hd">
          <span class="sec-num">WAVVE</span>
          <span class="sec-title">${escHtml(getSectionTitle(group.display_name))}</span>
          <span class="sec-count" id="cnt-${i}"></span>
          <div class="sec-live">
            <div class="sec-live-dot"></div>
            <span>${dateStr}</span>
          </div>
        </div>
        <div class="swipe-wrap">
          <button class="swipe-btn prev" onclick="scrollTrack('${trackId}',-1)">‹</button>
          <div class="swipe-track" id="${trackId}">${makeSkel(5)}</div>
          <button class="swipe-btn next" onclick="scrollTrack('${trackId}',1)">›</button>
        </div>
        ${i === 0 ? `<div class="ott-date-bottom"><div class="ott-live-dot"></div><span>${dateStr}</span></div>` : ''}
      </div>`;
  }).join('');

  // 5) 각 섹션 카드 렌더링 및 스와이프 초기화
  groups.forEach((group, i) => {
    const track = document.getElementById(`trk-${i}`);
    const items = group.items || [];

    if (!items.length) {
      track.innerHTML = `<div class="sec-empty">아직 등록된 랭킹이 없습니다.</div>`;
      return;
    }

    // TOP N 카운트 업데이트
    const cntEl = document.getElementById(`cnt-${i}`);
    if (cntEl) cntEl.textContent = `TOP ${items.length}`;

    // 카드 렌더링
    track.innerHTML = items.map((item, idx) => makeCard(item, idx)).join('');

    // 스와이프 드래그 초기화
    initSwipe(track);
  });
}

/* ── 카테고리 타이틀 — 어드민에서 설정한 display_name 그대로 표시 ──
   플랫폼명 프리픽스나 "일간" 접두어 없이 그대로 사용
   OTT 브랜드 태그(WAVVE)는 sec-num에 별도 표시됨 ── */
function getSectionTitle(displayName) {
  return displayName || '';
}

/* ── XSS 방지 유틸 ── */
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
