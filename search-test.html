<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>검색 - 오뜨랑 (테스트)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96;
  --sans:'Noto Sans KR',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px}
.logo{font-size:22px;font-weight:700;color:var(--text);letter-spacing:.5px}
.logo span{color:#e50914}
.search-wrap{width:100%;max-width:480px;position:relative}
.search-input{
  width:100%;padding:16px 52px 16px 20px;border-radius:14px;
  border:1px solid var(--border2);background:var(--card);color:var(--text);
  font-size:16px;font-family:var(--sans);outline:none;transition:border-color .15s;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:#e50914}
.search-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:10px;border:none;background:var(--bg3);
  color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.search-btn:hover{background:var(--border2)}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="logo">오뜨<span>랑</span></div>

<div class="search-wrap">
  <input class="search-input" id="searchInput" type="text"
    placeholder="키워드, 장르, 감정 검색" autofocus
    onkeydown="if(event.key==='Enter')doSearch()">
  <button class="search-btn" onclick="doSearch()" aria-label="검색">⌕</button>
</div>

<div class="hint">검색어를 입력하고 Enter를 누르세요</div>

<script>
function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  location.href = `search-results.html?q=${encodeURIComponent(q)}`;
}
</script>

</body>
</html>
