<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넷플릭스 랭킹 — 오뜨랑</title>
<meta name="description" content="넷플릭스 역대 TV 시리즈·영화 TOP 20, 일간 TV·영화 TOP 10 랭킹을 오뜨랑에서 확인하세요.">
<meta name="keywords" content="넷플릭스 순위, 넷플릭스 랭킹, 넷플릭스 역대 흥행작, 넷플릭스 TOP10, 오뜨랑">
<meta property="og:title" content="넷플릭스 랭킹 — 오뜨랑">
<meta property="og:description" content="넷플릭스 역대 흥행작부터 오늘의 TOP 10까지 한눈에">
<meta property="og:type" content="website">
<meta property="og:site_name" content="오뜨랑">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e50914;--accent2:#ff4757;--gold:#f0b429;--green:#34d399;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif;--r:10px;--max-w:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;overflow-x:hidden}

#ottrang-header{position:sticky;top:0;z-index:200}
.main-outer{max-width:var(--max-w);margin:0 auto;padding:0 24px 80px}

/* ── 히어로 배너 ── */
.hero{
  position:relative;padding:30px 0 20px;margin-bottom:20px;
  border-bottom:1px solid var(--border);overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-40px;right:-60px;
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(229,9,20,.18) 0%, transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  font-family:var(--mono);font-size:11px;color:var(--accent);
  letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.hero-eyebrow::before{content:'';display:block;width:24px;height:1px;background:var(--accent)}
.hero-title{
  font-family:var(--disp);font-size:52px;letter-spacing:3px;
  line-height:1;margin-bottom:10px;
}
.hero-title .nf{color:var(--accent)}
.hero-sub{
  font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.5px;
  position:absolute;bottom:54px;right:0;text-align:right;
}
/* N 로고 */
.hero-logo{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-family:var(--disp);font-size:200px;color:rgba(229,9,20,.06);
  line-height:1;pointer-events:none;user-select:none;letter-spacing:-8px;
}

/* ── 섹션 ── */
.rank-section{margin-bottom:52px}
.sec-hd{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.sec-num{
  font-family:var(--disp);font-size:13px;color:var(--accent);
  background:rgba(229,9,20,.12);border:1px solid rgba(229,9,20,.25);
  padding:2px 10px;border-radius:4px;letter-spacing:1px;white-space:nowrap;
}
.sec-title{font-family:var(--disp);font-size:24px;letter-spacing:1.5px;color:var(--text)}
.sec-subtitle{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.sec-count{font-family:var(--disp);font-size:24px;letter-spacing:1.5px;color:var(--muted)}
.sec-more{
  margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);
  text-decoration:none;padding:6px 14px;border:1px solid var(--border);
  border-radius:6px;transition:all .15s;white-space:nowrap;
}
.sec-more:hover{color:var(--text);border-color:var(--accent);background:rgba(229,9,20,.06)}

/* ── 스와이프 ── */
.swipe-wrap{position:relative}
.swipe-track{
  display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:6px;cursor:grab;
}
.swipe-track::-webkit-scrollbar{display:none}
.swipe-track.dragging{cursor:grabbing;user-select:none}

/* ── 랭킹 카드 ── */
.rk-card{
  flex:0 0 calc(20% - 13px);min-width:200px;max-width:230px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:all .22s;scroll-snap-align:start;
  position:relative;
}
.rk-card:hover{
  border-color:rgba(229,9,20,.4);transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(229,9,20,.12);
}

/* 순위 번호 */
.rk-num{
  position:absolute;top:0;left:0;
  font-family:var(--disp);font-size:42px;line-height:1;
  color:rgba(255,255,255,.9);z-index:2;padding:4px 8px;
  text-shadow:0 2px 8px rgba(0,0,0,.8);letter-spacing:-1px;
}
.rk-num.top3{color:var(--accent);text-shadow:0 2px 12px rgba(229,9,20,.5)}

/* 포스터 */
.rk-poster{
  position:relative;width:100%;aspect-ratio:2/3;
  background:var(--bg3);overflow:hidden;
}
.rk-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.rk-card:hover .rk-poster img{transform:scale(1.04)}
.rk-poster-ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:48px;background:linear-gradient(135deg,var(--bg3),var(--bg2));
}

/* 호버 오버레이 */
.rk-overlay{
  position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);
  display:flex;align-items:flex-end;padding:12px;opacity:0;transition:opacity .2s;
}
.rk-card:hover .rk-overlay{opacity:1}
.rk-play{
  width:40px;height:40px;border-radius:50%;
  background:rgba(229,9,20,.9);display:flex;align-items:center;justify-content:center;
  margin:0 auto;
}
.rk-play svg{width:16px;height:16px;fill:#fff;margin-left:2px}

/* 카드 본문 */
.rk-body{padding:10px 12px 12px}
/* 제목 + 시즌 뱃지 한 줄 */
.rk-title-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;min-width:0}
.rk-title{
  font-size:14px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.rk-en{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;
}
.rk-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rk-year{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rk-season{
  font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;
  background:rgba(229,9,20,.12);color:var(--accent);border:1px solid rgba(229,9,20,.2);
}
.rk-memo{
  font-family:var(--mono);font-size:12px;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rk-rating{
  font-family:var(--mono);font-size:12px;color:var(--gold);
  display:flex;align-items:center;gap:2px;margin-left:auto;
}

/* ── 스와이프 화살표 ── */
.swipe-btn{
  position:absolute;top:38%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(229,9,20,.3);background:var(--bg2);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:10;
  transition:all .15s;opacity:0;
}
.swipe-wrap:hover .swipe-btn{opacity:1}
.swipe-btn:hover{background:rgba(229,9,20,.12);border-color:var(--accent)}
.swipe-btn.prev{left:-19px}
.swipe-btn.next{right:-19px}
.swipe-btn:disabled{opacity:0!important;pointer-events:none}

/* ── 스켈레톤 ── */
.skel-card{
  flex:0 0 calc(20% - 13px);min-width:200px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--border);overflow:hidden;
}
.skel-poster{width:100%;aspect-ratio:2/3;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-line{height:12px;border-radius:4px;margin:10px 12px 6px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-line.short{width:55%;height:10px;margin-top:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sec-empty{padding:40px;text-align:center;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:var(--r)}

/* ── 모바일 ── */
@media(max-width:768px){
  .main-outer{padding:0 14px 60px}
  .hero{padding:32px 0 28px}
  .hero-title{font-size:38px}
  .hero-logo{font-size:120px;opacity:.5}
  .rk-card{min-width:160px;max-width:180px}
  .swipe-btn{display:none}
}
</style>
</head>
<body>

<div id="ottrang-header"></div>
<script>
fetch('/header.html')
  .then(r=>r.ok?r.text():Promise.reject())
  .then(h=>{
    const el=document.getElementById('ottrang-header');
    el.innerHTML=h;
    el.querySelectorAll('script').forEach(s=>{
      const ns=document.createElement('script');ns.textContent=s.textContent;
      document.body.appendChild(ns);
    });
    if(typeof initHeader==='function') initHeader();
  })
  .catch(()=>{});
</script>

<div class="main-outer">

  <!-- 히어로 배너 -->
  <div class="hero">
    <div class="hero-eyebrow">OTT RANKING</div>
    <div class="hero-title"><span class="nf">NETFLIX</span> 랭킹</div>
    <div class="hero-sub">넷플릭스 역대 흥행작 · 오늘의 TOP 10 · 오뜨랑 집계</div>
    <div class="hero-logo">N</div>
  </div>

  <!-- 섹션 컨테이너 -->
  <div id="sectionsWrap"></div>

</div>

<!-- 푸터 -->
<div id="ottrang-footer"></div>
<script>
fetch('/footer.html')
  .then(r=>r.ok?r.text():Promise.reject())
  .then(h=>{ document.getElementById('ottrang-footer').innerHTML=h; })
  .catch(()=>{});
</script>

<script>
const API       = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_IMG  = 'https://image.tmdb.org/t/p/w342';
const TMDB_PRXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';

/* ── 섹션 정의 ── */
const SECTIONS = [
  {
    slot     : 'category05',
    title    : '넷플릭스 역대 TV 시리즈',
    subtitle : 'ALL TIME TOP 20',
    isManual : true,   // date='manual' (수동 랭킹)
  },
  {
    slot     : 'category06',
    title    : '넷플릭스 역대 영화',
    subtitle : 'ALL TIME TOP 20',
    isManual : true,
  },
  {
    slot     : 'category02',
    title    : '넷플릭스 일간 TV 시리즈',
    subtitle : 'DAILY TOP 10',
    isManual : false,  // 크롤링 최신 데이터
  },
  {
    slot     : 'category01',
    title    : '넷플릭스 일간 영화',
    subtitle : 'DAILY TOP 10',
    isManual : false,
  },
];

/* ── 날짜 포맷 ── */
function fmtYear(y){ return y ? String(y) : ''; }

/* ── 작품 상세 이동 ── */
function goWork(tmdbId, tmdbType, title){
  if(!tmdbId) return;
  const y    = new Date().getFullYear();
  const url  = `/title/1-${y}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id:tmdbId, type:tmdbType||'tv', title:title||'', platform:'netflix'
  }));
  location.href = url;
}

/* ── 카드 HTML ── */
function makeCard(item, idx){
  const rank     = item.rank || (idx + 1);
  const isTop3   = rank <= 3;
  const poster   = item.poster_path
    ? `<img src="${TMDB_IMG}${item.poster_path}" alt="${(item.title_ko||'').replace(/"/g,'')}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const posterPh = `<div class="rk-poster-ph">🎬</div>`;
  const season   = item.season ? `<span class="rk-season">시즌 ${item.season}</span>` : '';
  const memo     = item.memo   ? `<span class="rk-memo">${item.memo}</span>` : '';
  const year     = item.release_year ? `<span class="rk-year">${item.release_year}</span>` : '';
  const rating   = item.tmdb_rating
    ? `<span class="rk-rating">★ ${parseFloat(item.tmdb_rating).toFixed(1)}</span>` : '';
  const type     = item.category === 'movie' ? 'movie' : 'tv';

  return `<div class="rk-card" onclick="goWork(${item.tmdb_id},'${type}','${(item.title_ko||'').replace(/'/g,"\\'")}')">
    <div class="rk-poster">
      ${poster}${posterPh}
      <div class="rk-overlay">
        <div class="rk-play" style="margin:0 auto">
          <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
      </div>
    </div>
    <span class="rk-num${isTop3?' top3':''}">${rank}</span>
    <div class="rk-body">
      <div class="rk-title-row">
        <span class="rk-title">${item.title_ko || item.title_en || '—'}</span>
        ${season}
      </div>
      <div class="rk-en">${item.title_en || ''}</div>
      <div class="rk-meta">
        ${year}${memo}${rating}
      </div>
    </div>
  </div>`;
}

/* ── 스켈레톤 ── */
function makeSkel(n=5){
  return Array(n).fill(0).map(()=>`
    <div class="skel-card">
      <div class="skel-poster"></div>
      <div class="skel-line"></div>
      <div class="skel-line short"></div>
    </div>`).join('');
}

/* ── 스와이프 드래그 ── */
function initSwipe(track){
  let down=false, startX=0, sl=0;
  track.addEventListener('mousedown', e=>{
    down=true; track.classList.add('dragging');
    startX=e.pageX-track.offsetLeft; sl=track.scrollLeft;
  });
  ['mouseleave','mouseup'].forEach(ev=>
    track.addEventListener(ev,()=>{ down=false; track.classList.remove('dragging'); })
  );
  track.addEventListener('mousemove', e=>{
    if(!down) return; e.preventDefault();
    track.scrollLeft = sl-(e.pageX-track.offsetLeft-startX)*1.2;
  });
}
function scrollTrack(id, dir){
  const t=document.getElementById(id);
  if(t) t.scrollBy({ left:dir*(210*3), behavior:'smooth' });
}

/* ── 섹션 HTML 생성 ── */
function buildSections(){
  document.getElementById('sectionsWrap').innerHTML = SECTIONS.map((s,i)=>`
    <div class="rank-section">
      <div class="sec-hd">
        <span class="sec-num">${s.subtitle}</span>
        <span class="sec-title">${s.title}</span>
        <span class="sec-count" id="cnt-${i}"></span>
      </div>
      <div class="swipe-wrap">
        <button class="swipe-btn prev" onclick="scrollTrack('trk-${i}',-1)">‹</button>
        <div class="swipe-track" id="trk-${i}">${makeSkel()}</div>
        <button class="swipe-btn next" onclick="scrollTrack('trk-${i}',1)">›</button>
      </div>
    </div>`).join('');
}

/* ── 데이터 로드 ── */
async function loadAll(){
  buildSections();

  let manualItems = [];  // 수동 랭킹 (category05, category06)
  let mainItems   = [];  // 일간 랭킹 (category01, category02) — /rankings/main 사용
  try {
    const [manualRes, mainRes] = await Promise.all([
      fetch(`${API}/rankings?platform=netflix&date=manual`), // 수동 랭킹
      fetch(`${API}/rankings/main`),                          // 일간 랭킹 (index.html과 동일)
    ]);
    if(manualRes.ok){ const j = await manualRes.json(); manualItems = j.data || []; }
    if(mainRes.ok){
      const j = await mainRes.json();
      // /rankings/main 응답 구조: { tv: [ { platform, category_slot, items } ], movie: [ ... ] }
      // tv + movie 합쳐서 netflix만 추출 후 flat 배열로 변환
      const tvGroups    = (j.tv    || []).filter(g => g.platform === 'netflix');
      const movieGroups = (j.movie || []).filter(g => g.platform === 'netflix');
      mainItems = [...tvGroups, ...movieGroups].flatMap(group =>
        (group.items || []).map(row => ({ ...row, category_slot: group.category_slot }))
      );
    }
  } catch(e){
    console.error('랭킹 로드 실패:', e);
  }

  // 섹션별 필터링해서 렌더
  SECTIONS.forEach((s, i) => {
    const track    = document.getElementById(`trk-${i}`);
    const srcItems = s.isManual ? manualItems : mainItems;
    const items    = srcItems
      .filter(r => r.category_slot === s.slot)
      .sort((a,b) => (a.rank || 0) - (b.rank || 0));

    if(!items.length){
      track.innerHTML = `<div class="sec-empty">아직 등록된 랭킹이 없습니다.</div>`;
      return;
    }

    document.getElementById(`cnt-${i}`).textContent = `TOP ${items.length}`;
    track.innerHTML = items.map((item, idx) => makeCard(item, idx)).join('');
    initSwipe(track);
  });
}

loadAll();
</script>
