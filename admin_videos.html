<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 관리 | 오뜨랑 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;--red:#e63946;
  --sans:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh}

/* ── 로그인 화면 ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-input{width:100%;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);outline:none;margin-bottom:12px}
.login-input:focus{border-color:var(--border2)}
.login-btn{width:100%;padding:11px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.login-btn:hover{background:#ff4d58}
.login-err{font-size:13px;color:var(--accent);margin-top:10px;display:none}

/* ── 메인 레이아웃 ── */
.admin-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.admin-header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--border);background:transparent;
  color:var(--muted2);font-size:13px;cursor:pointer;
  text-decoration:none;transition:background .15s;
}
.back-btn:hover{background:var(--bg3);color:var(--text)}

.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}

/* ── 검색 ── */
.search-row{display:flex;gap:10px;margin-bottom:24px;align-items:center}
.search-input{
  flex:1;padding:10px 14px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:14px;font-family:var(--sans);outline:none;
}
.search-input:focus{border-color:var(--border2)}
.btn-primary{padding:10px 20px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn-primary:hover{background:#ff4d58}
.btn-secondary{padding:10px 16px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:14px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn-secondary:hover{background:var(--bg3);color:var(--text)}

/* ── 작품 정보 ── */
.work-info-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:20px;display:flex;gap:14px;align-items:center;
}
.work-poster{width:52px;height:78px;border-radius:6px;overflow:hidden;background:var(--bg3);flex-shrink:0}
.work-poster img{width:100%;height:100%;object-fit:cover;display:block}
.work-title{font-size:16px;font-weight:700;margin-bottom:4px}
.work-sub{font-size:12px;color:var(--muted);font-family:var(--mono)}

/* ── 영상 추가 폼 ── */
.add-form{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:20px;margin-bottom:24px}
.add-form h3{font-size:15px;font-weight:600;margin-bottom:14px}
.form-row{display:flex;flex-direction:column;gap:10px}
.form-input{padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);outline:none}
.form-input:focus{border-color:var(--border2)}
.form-actions{display:flex;gap:8px;margin-top:4px}

/* ── 영상 목록 ── */
.video-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:center;
  transition:border-color .15s;
}
.video-card:hover{border-color:var(--border2)}
.video-thumb{
  width:140px;height:79px;border-radius:8px;overflow:hidden;
  background:var(--bg3);flex-shrink:0;position:relative;cursor:pointer;
}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.video-thumb-play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);opacity:0;transition:opacity .15s;
}
.video-thumb:hover .video-thumb-play{opacity:1}
.video-play-icon{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.video-info{flex:1;min-width:0}
.video-title{font-size:14px;font-weight:600;margin-bottom:6px}
.video-url{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.video-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge-main{font-size:11px;padding:2px 10px;border-radius:10px;background:rgba(240,180,41,.15);color:var(--gold);font-family:var(--mono)}
.video-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.btn-main{padding:6px 14px;border-radius:var(--r);border:1px solid rgba(240,180,41,.4);background:rgba(240,180,41,.1);color:var(--gold);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn-main:hover{background:rgba(240,180,41,.2)}
.btn-delete{padding:6px 14px;border-radius:var(--r);border:1px solid rgba(230,57,70,.3);background:rgba(230,57,70,.1);color:var(--red);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn-delete:hover{background:rgba(230,57,70,.2)}

/* ── 미리보기 모달 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal-inner{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;overflow:hidden;width:90%;max-width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.modal-player{position:relative;width:100%;aspect-ratio:16/9}
.modal-player iframe{width:100%;height:100%;border:none;display:block}

/* ── 빈 상태 ── */
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}

/* ── 토스트 ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;border-radius:22px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;font-family:var(--mono)}
.toast.show{opacity:1}

/* ── 작품명 검색 탭 + 드롭다운 ── */
.search-tabs{display:flex;gap:6px;margin-bottom:10px}
.search-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--mono);transition:all .15s}
.search-tab.on{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.search-dropdown{position:relative;flex:1}
.search-results{
  display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);
  max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.search-results.show{display:block}
.search-result-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--bg3)}
.sri-poster{width:32px;height:48px;border-radius:4px;overflow:hidden;background:var(--bg3);flex-shrink:0}
.sri-poster img{width:100%;height:100%;object-fit:cover;display:block}
.sri-title{font-size:14px;font-weight:600}
.sri-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}

/* ── 자동 채우기 버튼 + 결과 ── */
.btn-crawl{padding:10px 18px;border-radius:var(--r);border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:#34d399;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all .15s}
.btn-crawl:hover{background:rgba(52,211,153,.2)}
.btn-crawl:disabled{opacity:.4;cursor:default}
.crawl-result{font-size:13px;padding:10px 14px;border-radius:var(--r);background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);color:#34d399;font-family:var(--mono);margin-bottom:16px;display:none}

/* ── MBTI 관리 ── */
.mbti-add-chip{
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted2);font-size:13px;cursor:pointer;
  font-family:var(--mono);transition:all .15s;
}
.mbti-add-chip:hover:not(:disabled){background:rgba(55,138,221,.15);color:#7ec8e3;border-color:rgba(55,138,221,.4)}
.mbti-add-chip:disabled{opacity:.3;cursor:default}
.mbti-add-chip.used{background:rgba(52,211,153,.1);color:var(--green);border-color:rgba(52,211,153,.3)}

/* 드래그 행 */
.mbti-drag-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;cursor:grab;transition:border-color .15s;
  user-select:none;
}
.mbti-drag-row:active{cursor:grabbing}
.mbti-drag-row.dragging{opacity:.4;background:rgba(255,255,255,.05)}
.mbti-drag-row.drag-over{border-color:var(--green);border-top:2px solid var(--green)}
.mbti-drag-handle{color:var(--muted);font-size:18px;flex-shrink:0}
.mbti-rank-num{
  font-family:'DM Mono',monospace;font-size:18px;font-weight:700;
  color:var(--gold);width:28px;text-align:center;flex-shrink:0;
}
.mbti-label{
  font-family:'DM Mono',monospace;font-size:15px;font-weight:700;
  color:var(--text);min-width:50px;
}
.mbti-pct-inp{
  width:70px;padding:6px 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-family:'DM Mono',monospace;font-size:14px;
  outline:none;text-align:right;
}
.mbti-pct-inp:focus{border-color:var(--border2)}
.mbti-pct-unit{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);flex-shrink:0}
.mbti-del-btn{
  margin-left:auto;padding:4px 12px;border-radius:6px;
  border:1px solid rgba(230,57,70,.3);background:rgba(230,57,70,.1);
  color:var(--red);font-size:12px;cursor:pointer;flex-shrink:0;
}
.mbti-del-btn:hover{background:rgba(230,57,70,.2)}

@media(max-width:600px){
  .mbti-drag-row{flex-wrap:wrap;gap:8px}
  .mbti-pct-inp{width:60px}
}
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>🎬 영상 관리</h2>
    <p>관리자 인증이 필요합니다</p>
    <input class="login-input" id="secretInput" type="password" placeholder="관리자 비밀번호"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">확인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- ── 메인 페이지 ── -->
<div id="mainWrap" style="display:none">

  <div class="admin-header">
    <h1 id="adminHeaderTitle">🎬 영상 관리</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <!-- 페이지 탭 -->
      <div style="display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px">
        <button id="tabVideo" onclick="switchPageTab('video')"
          style="padding:5px 16px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)">
          🎬 영상 관리
        </button>
        <button id="tabMbti" onclick="switchPageTab('mbti')"
          style="padding:5px 16px;border-radius:6px;border:none;background:transparent;color:var(--muted2);font-size:13px;cursor:pointer;font-family:var(--sans)">
          ✦ MBTI 관리
        </button>
      </div>
      <a class="back-btn" href="/admin.html">← 어드민으로</a>
    </div>
  </div>

  <div class="wrap">

    <!-- 작품 검색 -->
    <div class="search-tabs">
      <button class="search-tab" id="tabId" onclick="switchTab('id')">TMDB ID</button>
      <button class="search-tab on" id="tabName" onclick="switchTab('name')">작품명 검색</button>
    </div>
    <div class="search-row">
      <!-- TMDB ID 입력 -->
      <input class="search-input" id="tmdbInput" type="number" placeholder="tmdb_id 입력 (예: 259837)"
        onkeydown="if(event.key==='Enter')loadWork()" style="display:none">
      <!-- 작품명 검색 -->
      <div class="search-dropdown" id="nameSearchWrap" style="display:block;flex:1">
        <input class="search-input" id="nameInput" type="text"
          placeholder="한글 또는 영어 작품명 입력"
          oninput="onNameInput(this.value)"
          onkeydown="if(event.key==='Enter')searchByName()"
          autocomplete="off" style="width:100%">
        <div class="search-results" id="searchResults"></div>
      </div>
      <button class="btn-primary" onclick="handleSearch()">작품 조회</button>
    </div>

    <!-- 작품 정보 -->
    <div class="work-info-box" id="workInfoBox" style="display:none">
      <div class="work-poster" id="workPoster"></div>
      <div>
        <div class="work-title" id="workTitle"></div>
        <div class="work-sub" id="workSub"></div>
      </div>
    </div>

    <!-- 영상 추가 폼 -->
    <div class="add-form" id="addForm" style="display:none">

      <!-- 유튜브 자동 채우기 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h3 style="margin-bottom:0">🤖 유튜브 자동 채우기</h3>
        <button class="btn-crawl" id="crawlBtn" onclick="crawlVideos()">▶ 자동 채우기</button>
      </div>
      <div class="crawl-result" id="crawlResult"></div>

      <!-- 수동 추가 -->
      <div style="border-top:1px solid var(--border);padding-top:14px">
        <h3 style="margin-bottom:14px">+ 수동으로 영상 추가</h3>
        <div class="form-row">
          <input class="form-input" id="ytUrlInput" type="text"
            placeholder="유튜브 URL (예: https://www.youtube.com/watch?v=xxxxx)">
          <input class="form-input" id="ytTitleInput" type="text"
            placeholder="영상 제목 (비워두면 유튜브 제목 자동 입력)">
          <div class="form-actions">
            <button class="btn-primary" onclick="addVideo()">추가</button>
            <button class="btn-secondary" onclick="clearForm()">초기화</button>
          </div>
        </div>
      </div>

    </div>

    <!-- 영상 목록 -->
    <div id="videosList"></div>

  </div>

  <!-- ══ MBTI 관리 섹션 ══ -->
  <div class="wrap" id="mbtiWrap" style="display:none">

    <!-- 작품 검색 (영상관리와 동일 UI) -->
    <div class="search-tabs">
      <button class="search-tab" id="mTabId" onclick="switchMbtiTab('id')">TMDB ID</button>
      <button class="search-tab on" id="mTabName" onclick="switchMbtiTab('name')">작품명 검색</button>
    </div>
    <div class="search-row">
      <input class="search-input" id="mTmdbInput" type="number" placeholder="tmdb_id 입력 (예: 259837)"
        onkeydown="if(event.key==='Enter')loadMbtiWork()" style="display:none">
      <div class="search-dropdown" id="mNameSearchWrap" style="display:block;flex:1">
        <input class="search-input" id="mNameInput" type="text"
          placeholder="한글 또는 영어 작품명 입력"
          oninput="onMbtiNameInput(this.value)"
          onkeydown="if(event.key==='Enter')searchMbtiByName()"
          autocomplete="off" style="width:100%">
        <div class="search-results" id="mSearchResults"></div>
      </div>
      <button class="btn-primary" onclick="handleMbtiSearch()">작품 조회</button>
    </div>

    <!-- 작품 정보 -->
    <div class="work-info-box" id="mWorkInfoBox" style="display:none">
      <div class="work-poster" id="mWorkPoster"></div>
      <div>
        <div class="work-title" id="mWorkTitle"></div>
        <div class="work-sub" id="mWorkSub"></div>
      </div>
    </div>

    <!-- MBTI 편집 영역 -->
    <div id="mbtiEditArea" style="display:none">

      <!-- 안내 메시지 -->
      <div style="background:rgba(55,138,221,.08);border:1px solid rgba(55,138,221,.25);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--muted2);font-family:var(--mono);line-height:1.7">
        💡 드래그로 순서 변경 · % 직접 입력 가능 (비워두면 자동계산)<br>
        저장 형식: <span style="color:var(--green)">ENFP:95,ENTJ:80,ISTJ:75</span> — % 없으면 <span style="color:var(--gold)">ENFP,ENTJ,ISTJ</span> (자동계산 유지)
      </div>

      <!-- MBTI 추가 -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px">✦ MBTI 추가 <span style="font-size:12px;color:var(--muted);font-weight:400">(최대 5개)</span></div>
        <div id="mbtiAddChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>

      <!-- 현재 MBTI 목록 (드래그 재정렬) -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <div style="font-size:14px;font-weight:600">✦ 현재 MBTI 순위</div>
          <span style="font-size:12px;color:var(--muted);font-family:var(--mono)" id="mbtiCountLabel">0 / 5</span>
        </div>
        <div id="mbtiDragList"></div>
        <div id="mbtiEmpty" style="padding:24px;text-align:center;color:var(--muted);font-size:13px;display:none">
          위에서 MBTI를 선택해 추가하세요
        </div>
      </div>

      <!-- 저장 버튼 -->
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="saveMbtiTags()" id="mbtiSaveBtn"
          style="flex:1;padding:13px">
          💾 저장
        </button>
        <button class="btn-secondary" onclick="resetMbtiTags()"
          style="padding:13px 20px">
          🔄 자동계산으로 초기화
        </button>
      </div>

    </div>
  </div>
</div>

<!-- 미리보기 모달 -->
<div class="modal-bg" id="previewModal">
  <div class="modal-inner">
    <div class="modal-head">
      <span id="previewTitle" style="font-size:14px;font-weight:500"></span>
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="modal-player">
      <iframe id="previewFrame" src="" allowfullscreen allow="autoplay;encrypted-media"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
const IMG = 'https://image.tmdb.org/t/p/w185';
let ADMIN_SECRET = '';
let currentTmdbId = null;
let searchTab = 'name';     // 기본 탭: 작품명 검색
let nameSearchTimer = null; // 작품명 검색 디바운스 타이머

/* ══ 로그인 ══ */
function doLogin(){
  const val = document.getElementById('secretInput').value.trim();
  if(!val) return;
  ADMIN_SECRET = val;
  verifySecret();
}
async function verifySecret(){
  try{
    const res = await fetch(`${API}/admin/rankings?limit=1`, {
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
    });
    if(res.ok){
      localStorage.setItem('admin_token', ADMIN_SECRET);
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('mainWrap').style.display = 'block';
    } else {
      document.getElementById('loginErr').style.display = 'block';
      ADMIN_SECRET = '';
    }
  }catch(e){
    document.getElementById('loginErr').style.display = 'block';
  }
}

/* ══ 초기화 ══ */
(function init(){
  const stored = localStorage.getItem('admin_token');
  if(stored){
    ADMIN_SECRET = stored;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
  }
  // 드롭다운 외부 클릭 시 닫기 (영상관리 + MBTI관리 공통)
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-dropdown')) {
      document.getElementById('searchResults').classList.remove('show');
      document.getElementById('mSearchResults').classList.remove('show');
    }
  });
})();

/* ══ 검색 탭 전환 ══ */
function switchTab(tab){
  searchTab = tab;
  document.getElementById('tabId').classList.toggle('on', tab === 'id');
  document.getElementById('tabName').classList.toggle('on', tab === 'name');
  document.getElementById('tmdbInput').style.display    = tab === 'id'   ? 'block' : 'none';
  document.getElementById('nameSearchWrap').style.display = tab === 'name' ? 'block' : 'none';
  document.getElementById('searchResults').classList.remove('show');
}

/* ══ 검색 버튼 분기 ══ */
function handleSearch(){
  if(searchTab === 'id') loadWork();
  else searchByName();
}

/* ══ TMDB ID로 작품 조회 ══ */
async function loadWork(){
  const tmdbId = parseInt(document.getElementById('tmdbInput').value.trim());
  if(!tmdbId){ showToast('tmdb_id를 입력해주세요'); return; }
  await loadWorkById(tmdbId);
}

/* ══ 작품명 입력 — 디바운스 0.4초 ══ */
function onNameInput(val){
  clearTimeout(nameSearchTimer);
  const results = document.getElementById('searchResults');
  if(!val.trim()){ results.classList.remove('show'); return; }
  nameSearchTimer = setTimeout(() => searchByName(val), 400);
}

/* ══ 작품명으로 works 테이블 검색 ══ */
async function searchByName(query){
  const val = query || document.getElementById('nameInput').value.trim();
  if(!val){ showToast('작품명을 입력해주세요'); return; }
  const results = document.getElementById('searchResults');
  results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">검색 중...</div>';
  results.classList.add('show');
  try{
    const res = await fetch(`${API}/works/search?q=${encodeURIComponent(val)}&limit=8`, {
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
    });
    const data = await res.json();
    if(!data.ok || !data.data?.length){
      results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">검색 결과가 없습니다</div>';
      return;
    }
    results.innerHTML = data.data.map(w => `
      <div class="search-result-item" onclick="selectWork(${w.tmdb_id})">
        <div class="sri-poster">
          ${w.poster_path
            ? `<img src="https://image.tmdb.org/t/p/w92${w.poster_path}" alt="${w.title_ko||''}" loading="lazy">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px">🎬</div>`}
        </div>
        <div>
          <div class="sri-title">${w.title_ko || ''}</div>
          <div class="sri-sub">${[w.title_en, `tmdb: ${w.tmdb_id}`].filter(Boolean).join(' · ')}</div>
        </div>
      </div>`).join('');
  }catch(e){
    results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--accent)">검색 오류</div>';
  }
}

/* ══ 검색 결과에서 작품 선택 ══ */
async function selectWork(tmdbId){
  document.getElementById('searchResults').classList.remove('show');
  await loadWorkById(tmdbId);
}

/* ══ tmdb_id로 작품 정보 로드 (공통) ══ */
async function loadWorkById(tmdbId){
  currentTmdbId = tmdbId;
  try{
    const [worksRes, tmdbRes] = await Promise.allSettled([
      fetch(`${API}/works/${tmdbId}`).then(r=>r.json()),
      fetch(`${TMDB_PROXY}/tv/${tmdbId}?language=ko-KR`).then(r=>r.json()).catch(()=>
        fetch(`${TMDB_PROXY}/movie/${tmdbId}?language=ko-KR`).then(r=>r.json())
      ),
    ]);
    const works = worksRes.status==='fulfilled'&&worksRes.value?.ok ? worksRes.value.data : null;
    const tmdb  = tmdbRes.status==='fulfilled' ? tmdbRes.value : null;
    const title   = works?.title_ko || tmdb?.name || tmdb?.title || `tmdb_id: ${tmdbId}`;
    const titleEn = works?.title_en || tmdb?.original_name || tmdb?.original_title || '';
    const poster  = tmdb?.poster_path ? `${IMG}${tmdb.poster_path}` : null;

    document.getElementById('workPoster').innerHTML = poster
      ? `<img src="${poster}" alt="${title}">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px">🎬</div>`;
    document.getElementById('workTitle').textContent = title;
    document.getElementById('workSub').textContent   = [titleEn, `tmdb_id: ${tmdbId}`].filter(Boolean).join(' · ');
    document.getElementById('workInfoBox').style.display = 'flex';
    document.getElementById('addForm').style.display     = 'block';

    // 크롤링 결과 초기화
    const crawlResult = document.getElementById('crawlResult');
    crawlResult.style.display = 'none';
    crawlResult.textContent   = '';

    loadVideos();
  }catch(e){
    showToast('작품 조회 실패');
  }
}

/* ══ 영상 목록 로드 ══ */
async function loadVideos(){
  if(!currentTmdbId) return;
  const el = document.getElementById('videosList');
  el.innerHTML = '<div class="empty">로딩 중...</div>';
  try{
    const res  = await fetch(`${API}/videos/${currentTmdbId}`);
    const data = await res.json();
    renderVideos(data.data || []);
  }catch(e){
    el.innerHTML = '<div class="empty">오류 발생</div>';
  }
}

function renderVideos(videos){
  const el = document.getElementById('videosList');
  if(!videos.length){
    el.innerHTML = '<div class="empty">등록된 영상이 없어요<br><span style="font-size:13px">자동 채우기를 실행하거나 URL을 직접 추가해주세요</span></div>';
    return;
  }
  el.innerHTML = videos.map(v => `
    <div class="video-card">
      <div class="video-thumb" onclick="openPreview('${v.youtube_id}','${(v.title||'').replace(/'/g,"\\'")}')">
        <img src="https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg" alt="${v.title||''}"
          onerror="this.style.display='none'">
        <div class="video-thumb-play"><div class="video-play-icon">▶</div></div>
      </div>
      <div class="video-info">
        <div class="video-title">${v.title || v.youtube_id}</div>
        <div class="video-url">${v.youtube_url}</div>
        <div class="video-badges">${v.is_main ? '<span class="badge-main">⭐ 메인 영상</span>' : ''}</div>
      </div>
      <div class="video-actions">
        ${!v.is_main
          ? `<button class="btn-main" onclick="setMain(${v.id})">⭐ 메인 지정</button>`
          : '<button class="btn-main" style="opacity:.4;cursor:default" disabled>⭐ 메인</button>'}
        <button class="btn-delete" onclick="deleteVideo(${v.id})">🗑 삭제</button>
      </div>
    </div>`).join('');
}

/* ══ 유튜브 자동 채우기 (관리자 수동 크롤링) ══ */
async function crawlVideos(){
  if(!currentTmdbId){ showToast('먼저 작품을 조회해주세요'); return; }
  const btn      = document.getElementById('crawlBtn');
  const resultEl = document.getElementById('crawlResult');
  btn.disabled     = true;
  btn.textContent  = '⏳ 검색 중...';
  resultEl.style.display = 'none';
  try{
    const res  = await fetch(`${API}/admin/videos/crawl`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ADMIN_SECRET}` },
      body:    JSON.stringify({ tmdb_id: currentTmdbId }),
    });
    const data = await res.json();
    if(data.ok){
      const count = data.saved || 0;
      resultEl.textContent   = count > 0 ? `✅ 영상 ${count}개를 새로 가져왔어요!` : `ℹ️ 새로 가져올 영상이 없어요 (이미 등록된 영상과 중복)`;
      resultEl.style.display = 'block';
      if(count > 0) loadVideos();
    } else {
      resultEl.textContent   = `❌ ${data.message || '크롤링 실패'}`;
      resultEl.style.display = 'block';
    }
  }catch(e){
    resultEl.textContent   = '❌ 네트워크 오류';
    resultEl.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = '▶ 자동 채우기';
  }
}

/* ══ 영상 추가 ══ */
async function addVideo(){
  const url   = document.getElementById('ytUrlInput').value.trim();
  const title = document.getElementById('ytTitleInput').value.trim();
  if(!url){ showToast('유튜브 URL을 입력해주세요'); return; }
  const ytMatch = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
  if(!ytMatch){ showToast('유효한 유튜브 URL이 아닙니다'); return; }
  try{
    const res  = await fetch(`${API}/admin/videos`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ADMIN_SECRET}` },
      body:    JSON.stringify({ tmdb_id: currentTmdbId, youtube_url: url, title }),
    });
    const data = await res.json();
    if(data.ok){ clearForm(); loadVideos(); showToast('영상이 추가됐어요!'); }
    else showToast(data.message || '오류 발생');
  }catch(e){ showToast('네트워크 오류'); }
}
function clearForm(){
  document.getElementById('ytUrlInput').value  = '';
  document.getElementById('ytTitleInput').value = '';
}

/* ══ 메인 지정 ══ */
async function setMain(id){
  try{
    const res  = await fetch(`${API}/admin/videos/${id}/main`, {
      method:  'PATCH',
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` },
    });
    const data = await res.json();
    if(data.ok){ loadVideos(); showToast('메인 영상으로 지정됐어요!'); }
    else showToast(data.message || '오류 발생');
  }catch(e){ showToast('네트워크 오류'); }
}

/* ══ 삭제 ══ */
async function deleteVideo(id){
  if(!confirm('이 영상을 삭제할까요?')) return;
  try{
    const res  = await fetch(`${API}/admin/videos/${id}`, {
      method:  'DELETE',
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` },
    });
    const data = await res.json();
    if(data.ok){ loadVideos(); showToast('삭제됐어요'); }
    else showToast(data.message || '오류 발생');
  }catch(e){ showToast('네트워크 오류'); }
}

/* ══ 미리보기 ══ */
function openPreview(ytId, title){
  document.getElementById('previewTitle').textContent = title || ytId;
  document.getElementById('previewFrame').src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
  document.getElementById('previewModal').classList.add('show');
}
function closePreview(){
  document.getElementById('previewFrame').src = '';
  document.getElementById('previewModal').classList.remove('show');
}

/* ══ 페이지 탭 전환 (영상관리 ↔ MBTI 관리) ══ */
let currentPageTab = 'video';
function switchPageTab(tab) {
  currentPageTab = tab;
  const isVideo = tab === 'video';
  // 컨텐츠 영역 토글
  document.querySelector('.wrap:not(#mbtiWrap)').style.display = isVideo ? 'block' : 'none';
  document.getElementById('mbtiWrap').style.display = isVideo ? 'none' : 'block';
  // 탭 버튼 스타일
  const tabVideo = document.getElementById('tabVideo');
  const tabMbti  = document.getElementById('tabMbti');
  tabVideo.style.background = isVideo ? 'var(--accent)' : 'transparent';
  tabVideo.style.color      = isVideo ? '#fff' : 'var(--muted2)';
  tabMbti.style.background  = isVideo ? 'transparent' : 'rgba(55,138,221,.2)';
  tabMbti.style.color       = isVideo ? 'var(--muted2)' : '#7ec8e3';

}

/* ══ MBTI 관리 — 상태 ══ */
const MBTI_16 = [
  'INTJ','INTP','ENTJ','ENTP',
  'INFJ','INFP','ENFJ','ENFP',
  'ISTJ','ISFJ','ESTJ','ESFJ',
  'ISTP','ISFP','ESTP','ESFP',
];
let mbtiCurrentTmdbId = null; // 현재 선택된 작품 tmdb_id
let mbtiItems = [];            // [{ mbti: 'ENFP', pct: 95 }, ...]  pct=0 은 자동계산
let mbtiSearchTab = 'name';
let mbtiNameTimer = null;
let _mbtiDragSrc  = null;

/* ── 검색 탭 전환 ── */
function switchMbtiTab(tab) {
  mbtiSearchTab = tab;
  document.getElementById('mTabId').classList.toggle('on', tab === 'id');
  document.getElementById('mTabName').classList.toggle('on', tab === 'name');
  document.getElementById('mTmdbInput').style.display     = tab === 'id'   ? 'block' : 'none';
  document.getElementById('mNameSearchWrap').style.display = tab === 'name' ? 'block' : 'none';
  document.getElementById('mSearchResults').classList.remove('show');
}

function handleMbtiSearch() {
  if (mbtiSearchTab === 'id') loadMbtiWork();
  else searchMbtiByName();
}

/* ── 작품명 디바운스 검색 ── */
function onMbtiNameInput(val) {
  clearTimeout(mbtiNameTimer);
  const results = document.getElementById('mSearchResults');
  if (!val.trim()) { results.classList.remove('show'); return; }
  mbtiNameTimer = setTimeout(() => searchMbtiByName(val), 400);
}

async function searchMbtiByName(query) {
  const val = query || document.getElementById('mNameInput').value.trim();
  if (!val) { showToast('작품명을 입력해주세요'); return; }
  const results = document.getElementById('mSearchResults');
  results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">검색 중...</div>';
  results.classList.add('show');
  try {
    const res  = await fetch(`${API}/works/search?q=${encodeURIComponent(val)}&limit=8`, {
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
    });
    const data = await res.json();
    if (!data.ok || !data.data?.length) {
      results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">검색 결과가 없습니다</div>';
      return;
    }
    results.innerHTML = data.data.map(w => `
      <div class="search-result-item" onclick="selectMbtiWork(${w.tmdb_id})">
        <div class="sri-poster">
          ${w.poster_path
            ? `<img src="https://image.tmdb.org/t/p/w92${w.poster_path}" alt="${w.title_ko||''}" loading="lazy">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px">🎬</div>`}
        </div>
        <div>
          <div class="sri-title">${w.title_ko || ''}</div>
          <div class="sri-sub">${[w.title_en, `tmdb: ${w.tmdb_id}`].filter(Boolean).join(' · ')}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    results.innerHTML = '<div style="padding:12px 14px;font-size:13px;color:var(--accent)">검색 오류</div>';
  }
}

async function loadMbtiWork() {
  const id = parseInt(document.getElementById('mTmdbInput').value.trim());
  if (!id) { showToast('tmdb_id를 입력해주세요'); return; }
  await loadMbtiWorkById(id);
}
async function selectMbtiWork(tmdbId) {
  document.getElementById('mSearchResults').classList.remove('show');
  await loadMbtiWorkById(tmdbId);
}

/* ── tmdb_id로 작품 + 현재 mbti_tags 로드 ── */
async function loadMbtiWorkById(tmdbId) {
  mbtiCurrentTmdbId = tmdbId;
  try {
    const [worksRes, tmdbRes] = await Promise.allSettled([
      fetch(`${API}/works/${tmdbId}`).then(r => r.json()),
      fetch(`${TMDB_PROXY}/tv/${tmdbId}?language=ko-KR`).then(r => r.json())
        .catch(() => fetch(`${TMDB_PROXY}/movie/${tmdbId}?language=ko-KR`).then(r => r.json())),
    ]);
    const works = worksRes.status === 'fulfilled' && worksRes.value?.ok ? worksRes.value.data : null;
    const tmdb  = tmdbRes.status  === 'fulfilled' ? tmdbRes.value : null;
    const title   = works?.title_ko || tmdb?.name || tmdb?.title || `tmdb_id: ${tmdbId}`;
    const titleEn = works?.title_en || tmdb?.original_name || tmdb?.original_title || '';
    const poster  = tmdb?.poster_path ? `${IMG}${tmdb.poster_path}` : null;

    document.getElementById('mWorkPoster').innerHTML = poster
      ? `<img src="${poster}" alt="${title}">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px">🎬</div>`;
    document.getElementById('mWorkTitle').textContent = title;
    document.getElementById('mWorkSub').textContent   = [titleEn, `tmdb_id: ${tmdbId}`].filter(Boolean).join(' · ');
    document.getElementById('mWorkInfoBox').style.display = 'flex';
    document.getElementById('mbtiEditArea').style.display = 'block';

    // mbti_tags 파싱 → mbtiItems 초기화
    const mbtiTagsRaw = works?.mbti_tags || '';
    mbtiItems = parseMbtiTags(mbtiTagsRaw);
    renderMbtiEditor();
  } catch(e) {
    showToast('작품 조회 실패');
  }
}

/* ── mbti_tags 문자열 파싱 ── */
function parseMbtiTags(raw) {
  if (!raw) return [];
  return raw.split(',')
    .map(s => s.trim())
    .filter(Boolean)
    .slice(0, 5)
    .map(s => {
      const [mbti, pctStr] = s.split(':');
      return { mbti: (mbti || '').trim(), pct: pctStr !== undefined ? parseInt(pctStr) || 0 : 0 };
    })
    .filter(item => item.mbti);
}

/* ── MBTI 편집기 렌더링 ── */
function renderMbtiEditor() {
  // 추가 칩 (16개 - 이미 등록된 것 비활성)
  const usedSet = new Set(mbtiItems.map(i => i.mbti));
  document.getElementById('mbtiAddChips').innerHTML = MBTI_16.map(m => `
    <button class="mbti-add-chip ${usedSet.has(m) ? 'used' : ''}"
      ${usedSet.has(m) || mbtiItems.length >= 5 ? 'disabled' : ''}
      onclick="addMbtiItem('${m}')">${m}</button>`).join('');

  // 카운트 레이블
  document.getElementById('mbtiCountLabel').textContent = `${mbtiItems.length} / 5`;

  // 드래그 목록
  const listEl = document.getElementById('mbtiDragList');
  const emptyEl = document.getElementById('mbtiEmpty');
  if (!mbtiItems.length) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = '';

  mbtiItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className   = 'mbti-drag-row';
    row.draggable   = true;
    row.dataset.idx = idx;
    row.innerHTML = `
      <span class="mbti-drag-handle">⠿</span>
      <span class="mbti-rank-num">${idx + 1}</span>
      <span class="mbti-label">${item.mbti}</span>
      <input class="mbti-pct-inp" type="number" min="0" max="100"
        placeholder="자동" value="${item.pct || ''}"
        oninput="updateMbtiPct(${idx}, this.value)"
        title="% 입력 (비워두면 자동계산)">
      <span class="mbti-pct-unit">%</span>
      <button class="mbti-del-btn" onclick="removeMbtiItem(${idx})">✕ 삭제</button>`;

    // 드래그 이벤트
    row.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      row.classList.add('dragging');
      _mbtiDragSrc = row;
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      listEl.querySelectorAll('.mbti-drag-row').forEach(r => r.classList.remove('drag-over'));
      _syncMbtiFromDom(listEl);
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      listEl.querySelectorAll('.mbti-drag-row').forEach(r => r.classList.remove('drag-over'));
      if (row !== _mbtiDragSrc) row.classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      if (_mbtiDragSrc && _mbtiDragSrc !== row) {
        const allRows = [...listEl.querySelectorAll('.mbti-drag-row')];
        const srcIdx  = allRows.indexOf(_mbtiDragSrc);
        const tgtIdx  = allRows.indexOf(row);
        if (srcIdx < tgtIdx) row.after(_mbtiDragSrc);
        else row.before(_mbtiDragSrc);
        _syncMbtiFromDom(listEl);
      }
    });
    listEl.appendChild(row);
  });
}

/* ── DOM 순서 → mbtiItems 동기화 (드래그 후) ── */
function _syncMbtiFromDom(listEl) {
  const rows = [...listEl.querySelectorAll('.mbti-drag-row')];
  mbtiItems = rows.map((row, i) => {
    const mbti  = row.querySelector('.mbti-label').textContent.trim();
    const pctEl = row.querySelector('.mbti-pct-inp');
    const pct   = pctEl ? (parseInt(pctEl.value) || 0) : 0;
    row.querySelector('.mbti-rank-num').textContent = i + 1;
    row.dataset.idx = i;
    return { mbti, pct };
  });
}

/* ── MBTI 추가 ── */
function addMbtiItem(mbti) {
  if (mbtiItems.length >= 5) { showToast('최대 5개까지 추가할 수 있어요'); return; }
  if (mbtiItems.some(i => i.mbti === mbti)) { showToast('이미 추가된 MBTI예요'); return; }
  mbtiItems.push({ mbti, pct: 0 });
  renderMbtiEditor();
}

/* ── MBTI 삭제 ── */
function removeMbtiItem(idx) {
  mbtiItems.splice(idx, 1);
  renderMbtiEditor();
}

/* ── % 입력 업데이트 ── */
function updateMbtiPct(idx, val) {
  if (mbtiItems[idx] !== undefined) {
    mbtiItems[idx].pct = parseInt(val) || 0;
  }
}

/* ── DOM에서 최신 % 값 읽어 mbtiItems 동기화 ── */
function _syncPctFromDom() {
  document.querySelectorAll('#mbtiDragList .mbti-drag-row').forEach((row, i) => {
    const pctEl = row.querySelector('.mbti-pct-inp');
    if (pctEl && mbtiItems[i] !== undefined) {
      mbtiItems[i].pct = parseInt(pctEl.value) || 0;
    }
  });
}

/* ── 저장 ── */
async function saveMbtiTags() {
  if (!mbtiCurrentTmdbId) { showToast('작품을 먼저 조회해주세요'); return; }
  _syncPctFromDom(); // 저장 직전 최신 % 반영

  // mbti_tags 문자열 조합
  // % 있으면 "MBTI:%" 형식, 없으면 "MBTI" 형식
  const tagsStr = mbtiItems.map(item =>
    item.pct > 0 ? `${item.mbti}:${item.pct}` : item.mbti
  ).join(',');

  const btn = document.getElementById('mbtiSaveBtn');
  btn.disabled    = true;
  btn.textContent = '저장 중...';
  try {
    const res  = await fetch(`${API}/admin/works/${mbtiCurrentTmdbId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ADMIN_SECRET}` },
      body:    JSON.stringify({ mbti_tags: tagsStr || null }),
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`✅ MBTI 저장 완료! (${tagsStr || '초기화'})`);
    } else {
      showToast(data.message || '저장 실패');
    }
  } catch(e) {
    showToast('네트워크 오류');
  } finally {
    btn.disabled    = false;
    btn.textContent = '💾 저장';
  }
}

/* ── 자동계산으로 초기화 ── */
async function resetMbtiTags() {
  if (!mbtiCurrentTmdbId) return;
  if (!confirm('MBTI를 자동계산 방식으로 초기화합니다. (장르 기반 자동 재계산)\n계속할까요?')) return;
  const btn = document.getElementById('mbtiSaveBtn');
  btn.disabled = true;
  try {
    // mbti_tags = null 로 저장 → 작품 페이지에서 장르 기반 재계산
    const res  = await fetch(`${API}/admin/works/${mbtiCurrentTmdbId}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ADMIN_SECRET}` },
      body:    JSON.stringify({ mbti_tags: null }),
    });
    const data = await res.json();
    if (data.ok) {
      mbtiItems = [];
      renderMbtiEditor();
      showToast('✅ 자동계산으로 초기화됐어요');
    } else {
      showToast(data.message || '초기화 실패');
    }
  } catch(e) {
    showToast('네트워크 오류');
  } finally {
    btn.disabled = false;
  }
}

/* ══ 토스트 ══ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
