<style>
/* ── 디자인 토큰 (_title_detail.html 동일) ── */
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;
  --info:#378ADD;--info-bg:rgba(55,138,221,.12);--info-border:rgba(55,138,221,.35);
  --font-sans:'Noto Sans KR',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-disp:'Bebas Neue',sans-serif;
  --r:10px;--r-lg:14px;
  --content-w:900px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
#ottrang-header{position:sticky;top:0;z-index:200}

/* ── 페이지 래퍼 ── */
.page-wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
/* [2026-07-19 신규] 레이아웃 테스트 모드일 때만 폭 확장 — 일반 방문자는 900px 그대로 */
body.layout-test .page-wrap{max-width:1200px}
/* [2026-07-20 수정] 헤더(스티키)와 본문 사이 간격 25px로 (!important로 확실히 적용) */
@media(min-width:641px){
  body.layout-test .page-wrap{padding-top:25px !important}
}

/* [2026-07-19 신규] 2단 레이아웃 뼈대
   ⚠️ body에 layout-test 클래스가 항상 붙어있어서(2026-07-20부터 전체 적용) 모든 방문자에게 보임.
   PC(641px 이상): 왼쪽 380px 고정 + 오른쪽 나머지.
   모바일(640px 이하): 그리드 해제하고 기존처럼 세로로 그대로 쌓임(순서 안 바뀜) */
@media(min-width:641px){
  body.layout-test .person-layout{
    display:grid;
    grid-template-columns:220px 1fr;
    column-gap:30px;
    align-items:start;
  }
  /* [2026-07-19 신규] 그리드 아이템 기본값(min-width:auto)이 가로 스크롤 카드행의
     콘텐츠 폭만큼 컬럼 자체를 밀어내는 CSS 함정 방지 — 이전에 대표작 카드에서
     겪었던 flex min-width 버그와 같은 종류. 이걸 안 넣으면 전체 폭이 1200px을
     넘어 화면 밖까지 늘어남 */
  body.layout-test .person-col-left,
  body.layout-test .person-col-right{
    min-width:0;
  }
  /* [2026-07-19 신규] 필모그래피를 1줄에 정확히 5개로 고정 (기존 auto-fill 대신) */
  body.layout-test .works-grid{
    grid-template-columns:repeat(5, 1fr);
  }
  /* [2026-07-19 신규] 대표작도 필모그래피와 완전히 같은 5열 그리드로 통일
     (기존 가로스크롤 flex+고정120px 대신 — 카드 크기를 정확히 똑같이 맞추기 위함) */
  body.layout-test .known-for-row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:16px;
    overflow-x:visible;
  }
  body.layout-test .known-for-row .work-card{
    flex:none;
    width:auto;
  }
}
/* [2026-07-19 신규] 더보기 버튼 — 오른쪽 컬럼이 넓어지면서 버튼이 과하게 길어보여서
   원래 크기(내용만큼)로 줄이고, 눈에 띄게 골드색으로.
   [2026-07-20 수정] PC 전용이었던 걸 모바일에도 동일하게 적용 */
body.layout-test .load-more-btn{
  display:block; width:fit-content; margin:20px auto 0; padding:10px 32px;
  border-color:var(--gold); color:var(--gold);
}
body.layout-test .load-more-btn:hover{
  background:rgba(240,180,41,.1); border-color:var(--gold); color:var(--gold);
}
body.layout-test .person-col-left > *{ margin-bottom:24px }
body.layout-test .person-col-left > *:last-child{ margin-bottom:0 }
/* [2026-07-20 신규] 모바일 — 사진(왼쪽컬럼)과 이름(오른쪽컬럼) 사이 간격이 너무 넓어서 축소.
   .person-hero 기본 margin-bottom(32px)이 실제 원인이라 이것도 같이 줄임 */
@media(max-width:640px){
  body.layout-test .person-col-left > *{ margin-bottom:8px }
  body.layout-test .person-hero{ margin-bottom:8px }
}

/* [2026-07-19 신규] 왼쪽 컬럼(380px)은 폭이 좁아서, 사진이 가로로 배치되는
   기존 PC 스타일 대신 세로로 확실히 쌓이게 강제함 (기존 모바일 스타일과 동일 패턴 재사용,
   "혹시 wrap될 수도"에 기대지 않고 명시적으로 고정) */
body.layout-test .person-hero{ flex-direction:column; gap:16px; align-items:center }
body.layout-test .person-photo-wrap{ width:200px }
body.layout-test .person-photo{ width:200px }
/* [2026-07-20 수정] back-btn이 다시 정상 흐름으로 복귀해서, mobile-photo-row를
   별도 flex로 만들 필요 없어짐 (person-hero의 flex-direction:column이 back-btn/사진을
   그대로 세로로 쌓아줌) — 기본값(display:contents) 유지

/* [2026-07-19 신규] person-info(이름/SNS/공유/메타/약력)는 JS가 오른쪽 컬럼
   맨 위로 옮김 — 왼쪽의 좁은 가운데정렬 스타일이 아니라, 넓은 오른쪽 컬럼에
   맞는 왼쪽정렬 + 아래쪽 구분선으로 표시 */
body.layout-test .person-info{
  width:100%; text-align:left; margin-bottom:28px;
  padding-bottom:24px; border-bottom:.5px solid var(--border);
}
body.layout-test .person-meta-row{ justify-content:flex-start }
/* [2026-07-20 신규] 모바일에서는 이름+인스타+공유 줄을 가운데 정렬 */
@media(max-width:640px){
  body.layout-test .person-info{ text-align:center }
}

/* [2026-07-20 수정] 기능 없는 상태로 노출하지 않기로 결정 — 다시 숨김 (여백도 없앰) */
.person-like-btn{
  display:none;
}

/* ── 뒤로가기 ── */
/* [2026-07-11 6차 수정] back-btn이 person-hero 안(mobile-photo-row 안)으로 이동했지만,
   버튼 자체 크기는 원래(내용물 크기만큼만) 그대로 유지 — "혼자 한 줄 차지"는
   버튼이 아니라 바로 아래 보이지 않는 .hero-line-break 요소가 담당함.
   ⚠️ 이전 시도(flex-basis:100%를 버튼 자체에 줌)는 버튼의 테두리 상자 자체가
   화면 전체 폭으로 늘어나버리는 버그였음 — 폐기. */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;
  text-decoration:none;padding:7px 14px;border:1px solid var(--border);
  border-radius:7px;transition:all .15s;font-family:var(--font-mono);cursor:pointer;background:transparent;
  margin-bottom:24px}
/* [2026-07-11 6차 수정] 보이지 않는 줄바꿈 전용 요소 — 폭 100%를 혼자 차지해서
   그 다음에 오는 person-photo-wrap을 다음 줄로 밀어냄. 높이 0이라 화면에 아무
   영향 없음. 모바일에서는 back-btn이 absolute라 필요 없으므로 미디어쿼리에서 숨김. */
.hero-line-break{flex-basis:100%;height:0;overflow:hidden}
/* [2026-07-11 7차 수정] row-gap을 0으로 껐으니, back-btn 자체의 margin-bottom:24px가
   버튼 줄과 사진 줄 사이의 유일한 세로 간격원. 원래(수정 전) 있던 24px 그대로 복원. */
.back-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}

/* ── 히어로 영역 ── */
/* ⚠️ 2026-07-11 7차 수정: gap:32px가 가로/세로 모두에 적용되면서, hero-line-break가
   만드는 줄바꿈 지점마다(버튼줄→break줄, break줄→사진줄) 세로 간격이 두 번 겹쳐서
   64px(원래 의도 32px의 2배)로 벌어지는 버그 발생. row-gap(세로)은 0으로 끄고,
   column-gap(가로, 사진-정보 사이 간격)만 32px 유지. 세로 간격은 아래 back-btn의
   margin-bottom으로 한 번만 명시적으로 줌. */
.person-hero{display:flex;flex-wrap:wrap;gap:0 32px;margin-bottom:32px;align-items:flex-start}
/* [2026-07-11 5차 수정] mobile-photo-row: PC에서는 display:contents로 완전히
   투명해져서(자기 자신은 레이아웃에 관여 안 함) back-btn/person-photo-wrap이
   person-hero의 직속 flex 아이템처럼 동작 — 기존 PC 모습 그대로 유지됨.
   모바일에서만 실제 flex row로 바뀜(아래 미디어쿼리). */
.mobile-photo-row{display:contents}
.person-photo-wrap{flex-shrink:0;width:200px}
.person-photo{width:200px;aspect-ratio:2/3;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 64px rgba(0,0,0,.6);
  background:var(--bg3);position:relative}
.person-photo img{width:100%;height:100%;object-fit:cover;display:block}
.person-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:700;color:var(--info);font-family:var(--font-mono)}

/* [2026-07-11 재수정] SNS 아이콘 — 박스/배경/패딩으로 만들었던 버전은 관리자님
   피드백으로 폐기. 원래 인스타 아이콘(.person-insta-icon)이 박스 없이 이미지
   자체가 꽉 차게 나오던 방식이 더 낫다는 판단 → 그 스타일을 여러 개(인스타/트위터/
   틱톡)에도 동일하게 적용하도록 일반화. */
.person-social-row{display:inline-flex;align-items:center;gap:8px;margin-left:10px;
  vertical-align:middle;position:relative;top:-3px}
.person-social-icon{display:inline-flex;align-items:center;opacity:.75;
  transition:opacity .15s;text-decoration:none}
.person-social-icon:hover{opacity:1}
.person-social-icon img{width:48px;height:48px;border-radius:12px;display:block}

/* [2026-07-11 재수정] 공유 버튼 — my_review.html의 "공유하기" 태그(.share-tag)를
   그대로 참조. 정체를 알 수 없는 아이콘 하나만 덩그러니 있던 버전은 폐기하고,
   무엇을 하는 버튼인지 텍스트로 바로 보이게 함. SNS 아이콘과 같은 줄에 배치. */
.share-tag{
  font-size:12px;padding:5px 12px;border-radius:14px;
  background:rgba(240,180,41,.18);color:var(--gold);border:.5px solid rgba(240,180,41,.4);
  cursor:pointer;font-family:var(--font-sans);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  transition:background .15s;
}
.share-tag:hover{background:rgba(240,180,41,.28)}

/* [2026-07-11 추가] 토스트 알림 — my_review.html과 동일한 스타일/동작 재사용 */
.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;
  border-radius:22px;z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .25s;font-family:var(--font-mono);word-break:keep-all}
.toast.show{opacity:1}

/* [2026-07-11 추가] 랭킹 배지 — 필모그래피 카드에 지금 랭킹에 있으면 표시 */
/* [2026-07-20 수정] left:6px 고정 대신 가운데 정렬로 변경 */
.work-rank-badge{display:none;align-items:center;gap:3px;position:absolute;
  bottom:6px;left:50%;transform:translateX(-50%);background:rgba(230,57,70,.92);color:#fff;
  font-size:10px;font-weight:700;font-family:var(--font-mono);
  padding:3px 7px;border-radius:5px;backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}

/* [2026-07-11 추가] 대표작(인기순) 섹션 — 가로 스크롤 */
.known-for-section{margin-top:8px}
.known-for-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.known-for-row::-webkit-scrollbar{display:none}

/* [2026-07-11 추가] 오늘의 랭킹 위젯 — 방문객 전원에게 노출되는 유입 장치.
   포스터 카드는 대표작(.known-for-row .work-card)과 완전히 동일한 크기를 쓰려고
   새 CSS를 만들지 않고 .known-for-row 클래스를 그대로 재사용함(아래 rankingWidgetRow).
   헤더(OTT 네임태그 + 제목)는 netflix.html의 .sec-num/.sec-title 패턴을 재현. */
.ranking-widget-section{margin:32px 0;padding:18px 18px 20px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg)}
.ranking-widget-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;text-decoration:none;cursor:pointer}
.ranking-widget-hd .sec-num{font-family:var(--font-mono);font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:4px;letter-spacing:1px;white-space:nowrap}
.ranking-widget-title-row{display:flex;align-items:baseline;gap:10px}
.ranking-widget-hd .sec-title{font-size:17px;font-weight:700;color:var(--text);transition:color .15s}
.ranking-widget-hd .sec-count{font-family:var(--disp);font-size:17px;letter-spacing:1px;color:var(--muted)}
.ranking-widget-hd:hover .sec-title{color:var(--info)}
/* [2026-07-11 추가] 랭킹 위젯 전용 행 — .known-for-row(대표작과 공유)에서 분리해서
   대표작 카드 크기에 영향 안 주고 이 위젯만 사진갤러리(90px)와 동일 사이즈로 줄임 */
.ranking-widget-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.ranking-widget-row::-webkit-scrollbar{display:none}
.ranking-widget-row.few-items{justify-content:center}
.ranking-widget-row .work-card{flex:0 0 90px;min-width:0}
.ranking-widget-rank{position:absolute;top:6px;left:6px;
  background:rgba(230,57,70,.92);color:#fff;font-family:var(--font-mono);
  font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 2px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.4)}
/* ⚠️ 2026-07-11 4차 수정: 얇게 만든 스크롤바(6px)도 여전히 못생기고 UX를 해친다는
   피드백 — 스크롤바 자체를 완전히 숨기고, 대신 좌우 화살표 버튼(PC 전용)으로 조작.
   scrollbar-width:none(파이어폭스), -ms-overflow-style:none(구형 엣지),
   ::-webkit-scrollbar{display:none}(크롬/사파리) 3종 다 처리해야 브라우저별로
   안 남는 데 없이 확실히 숨겨짐. */
.known-for-row .work-card{flex:0 0 120px;min-width:0}
/* ⚠️ 2026-07-11 수정: min-width:0이 빠져있었음 — flex 아이템은 기본적으로
   min-width:auto라서, 배역명처럼 white-space:nowrap인 긴 텍스트가 있으면
   flex-shrink:0과 맞물려 카드 자체가 텍스트 길이만큼 억지로 커지는 버그 발생
   ("Kim Young-ho / John Kim"처럼 긴 배역명 카드만 유독 커지던 원인).
   min-width:0으로 자동 최소크기 계산을 꺼야 text-overflow:ellipsis가 정상 작동함. */
/* [2026-07-11 추가] 아이템 2개 이하면 왼쪽에 몰려있지 않게 가운데 정렬 */
.known-for-row.few-items{justify-content:center}

/* [2026-07-11 추가] 사진 갤러리 */
.photo-gallery-section{margin-top:24px}
.photo-gallery-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.photo-gallery-row::-webkit-scrollbar{display:none}
/* [2026-07-11 추가] 아이템 2개 이하면 왼쪽에 몰려있지 않게 가운데 정렬 */
.photo-gallery-row.few-items{justify-content:center}
.photo-gallery-thumb{flex:0 0 90px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;background:var(--bg3);transition:border-color .15s}
.photo-gallery-thumb:hover{border-color:var(--info)}
.photo-gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* [2026-07-11 추가] 좌우 스크롤 화살표 — PC 전용(대표작/사진갤러리 공통).
   모바일은 스와이프로 충분히 잘 동작하고 있어서 의도적으로 미적용(하단 미디어쿼리에서 숨김). */
.scroll-row-wrap{position:relative}
.scroll-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;
  background:rgba(20,20,28,.8);border:1px solid var(--border2);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;cursor:pointer;z-index:3;
  opacity:0;transition:opacity .2s;user-select:none;
}
.scroll-row-wrap:hover .scroll-arrow{opacity:.9}
.scroll-arrow:hover{background:rgba(30,30,42,.95)}
.scroll-arrow-left{left:-14px}
.scroll-arrow-right{right:-14px}
.scroll-arrow.hidden{display:none} /* 스크롤 끝(또는 스크롤 필요 없음)에 도달하면 자동으로 숨김 */

/* ── 인물 정보 ── */
.person-info{flex:1;min-width:0}
.person-name{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.5px;margin-bottom:4px}
.person-name-en{display:none} /* [2026-07-20 수정] 이름 옆 괄호 표기 방식으로 변경, 기존 별도줄은 숨김 */
.person-name-en-inline{font-size:16px;color:var(--muted);font-weight:400;margin-left:6px} /* [2026-07-20 신규] */
.person-meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.person-meta-chip{display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;border:.5px solid var(--border);
  background:var(--bg2);font-size:13px;color:var(--muted2);font-family:var(--font-mono)}
.person-meta-chip .chip-label{color:var(--muted);font-size:12px;margin-right:2px}

/* 약력 */
.bio-section{margin-bottom:0}

/* [2026-07-19 신규] 위키백과 보강 데이터 — 테스트 전용 섹션
   위키 데이터가 있는 배우만 JS에서 display:block으로 켜짐(2026-07-20부터 전체 적용). */
.wiki-test-section{
  display:none; margin:16px 0 24px; padding:16px;
  background:var(--bg); border:.5px solid rgba(255,255,255,0.05); border-radius:var(--r);
}
.wiki-test-summary{ font-size:14px; line-height:1.6; color:var(--muted); margin-bottom:14px; }
.wiki-test-meta{ display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted); margin-bottom:14px; }

/* [2026-07-19 신규] 데뷔작/학력 — 오른쪽 프로필(person-info) 안, 메타칩과 약력 사이에 표시 */
.profile-debut-edu{
  display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted);
  margin:12px 0; padding:10px 0;
  border-top:.5px solid var(--border); border-bottom:.5px solid var(--border);
}
.profile-debut-edu b{ color:var(--text); font-weight:600; margin-right:4px; }

/* [2026-07-19 신규] 수상내역 — 약력 바로 아래. 윗줄만 유지(약력과 구분),
   아랫줄은 뺌 — person-info 전체의 아래쪽 줄이 대표작 앞 구분선 역할을 이미 하고 있어서
   바로 밑에 또 줄이 있으면 줄 2개가 겹쳐 보임 */
.profile-awards{
  font-size:13px; color:var(--muted2); line-height:1.7;
  margin-top:12px; padding-top:10px;
  border-top:.5px solid var(--border);
}
.wiki-test-meta b{ color:var(--text); font-weight:600; }
.wiki-test-awards{ font-size:13px; color:var(--muted2); margin-bottom:14px; line-height:1.6; }
/* [2026-07-20 수정] 검색엔진용 데이터라 사람 눈에 안 띄게 — 글자 연한 회색톤 */
.wiki-career-preview{ font-size:13px; line-height:1.7; color:var(--muted); white-space:pre-line; }
.wiki-career-preview.collapsed{
  max-height:calc(1.7em * 4); overflow:hidden;
}
/* [2026-07-19 신규] 펼친 상태도 무한정 안 늘어나고 박스 안에서만 스크롤 (페이지 길이 유지) */
.wiki-career-preview.expanded{
  max-height:calc(1.7em * 12); overflow-y:auto; padding-right:8px;
}
.wiki-career-toggle{
  margin-top:8px; background:none; border:none; color:var(--muted);
  font-size:12px; cursor:pointer; padding:0;
}
.wiki-test-source{ margin-top:14px; font-size:11px; color:var(--muted); }
#wikiSource{ display:none; } /* [2026-07-20 신규] PC는 "전체 이력 더보기" 눌러야 출처도 같이 보이게 */

/* [2026-07-19 신규] 전체이력 — 모바일 전용 UI (랭킹위젯~필모그래피 사이).
   PC의 wikiTestSection과 데이터는 같지만 화면에 따라 하나만 보임 */
.wiki-career-mobile-section{ margin:20px 0; text-align:center; }
/* [2026-07-20 수정] 검색엔진용이라 눈에 안 띄게 — 얇고 진한 회색톤 버튼, 가운데 정렬, 글자 1px 키움 */
.wiki-career-mobile-toggle{
  display:inline-block; width:auto; margin:0 auto; padding:6px 12px; text-align:center;
  background:transparent; border:.5px solid rgba(255,255,255,0.08); border-radius:6px;
  color:var(--muted); font-size:12px; font-family:var(--font-sans); cursor:pointer;
}
.wiki-career-mobile-box{
  margin-top:10px; padding:14px; background:var(--bg);
  border:.5px solid rgba(255,255,255,0.05); border-radius:var(--r);
}
.wiki-career-mobile-text{
  font-size:13px; line-height:1.7; color:var(--muted); white-space:pre-line;
  max-height:calc(1.7em * 5); overflow-y:auto; padding-right:6px; /* 5줄 정도만, 그 안에서 스크롤 */
}

/* [2026-07-20 신규] 스크롤바를 얇고 눈에 안 띄게 (Chrome/Safari + Firefox 둘 다 대응) */
.wiki-career-preview.expanded,
.wiki-career-mobile-text{
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.12) transparent;
}
.wiki-career-preview.expanded::-webkit-scrollbar,
.wiki-career-mobile-text::-webkit-scrollbar{ width:5px; }
.wiki-career-preview.expanded::-webkit-scrollbar-track,
.wiki-career-mobile-text::-webkit-scrollbar-track{ background:transparent; }
.wiki-career-preview.expanded::-webkit-scrollbar-thumb,
.wiki-career-mobile-text::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.12); border-radius:10px;
}

/* [2026-07-19 신규] PC/모바일 중 하나만 보이게 — 화면 폭 641px 기준으로 서로 반대로 숨김 */
@media(min-width:641px){
  .wiki-career-mobile-section{ display:none !important; }
}
@media(max-width:640px){
  #wikiTestSection{ display:none !important; }
}
.wiki-test-source a{ color:var(--muted); }
.bio-text{font-size:14px;color:var(--muted2);line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  transition:all .3s}
.bio-text.expanded{-webkit-line-clamp:unset;overflow:visible}
.bio-toggle{margin-top:8px;background:none;border:none;color:var(--info);
  font-size:13px;cursor:pointer;font-family:var(--font-mono);padding:0;
  display:none} /* JS로 필요시 표시 */
.bio-toggle:hover{text-decoration:underline}

/* ── 필모그래피 ── */
.filmography-section{margin-top:32px}
.section-title{font-size:17px;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:10px}
.section-title small{font-size:13px;color:var(--muted);font-weight:400;font-family:var(--font-mono)}
/* [2026-07-20 신규] 필모그래피 정렬 토글 버튼 */
.filmo-sort-toggle{
  margin-left:auto; padding:5px 12px; font-size:12px; font-weight:500;
  background:transparent; border:.5px solid var(--border); border-radius:20px;
  color:var(--muted); cursor:pointer; font-family:var(--font-sans);
}
.filmo-sort-toggle:hover{background:var(--bg3); color:var(--text); border-color:var(--border2)}

/* 탭 */
.tab-row{display:flex;gap:6px;margin-bottom:20px}
.tab-btn{padding:7px 18px;border-radius:20px;border:.5px solid var(--border);
  font-size:14px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);
  background:transparent;transition:all .15s}
.tab-btn.on{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.tab-btn:hover:not(.on){color:var(--muted2);border-color:var(--border)}

/* 작품 그리드 */
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.work-card{cursor:pointer;text-decoration:none;display:block;transition:transform .2s ease;min-width:0}
/* ⚠️ 2026-07-11 수정: min-width:0 추가 — CSS Grid 아이템도 flex와 동일하게
   기본 min-width:auto라서, 긴 배역명이 나오면 known-for-row와 같은 이유로
   그리드 트랙(카드)이 억지로 커질 수 있는 잠재 버그가 있어 예방 차원에서 수정 */
.work-card:hover{transform:translateY(-4px)}
.work-poster{width:100%;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;
  background:var(--bg3);border:.5px solid var(--border);position:relative;margin-bottom:8px}
.work-poster img{width:100%;height:100%;object-fit:cover;display:block}
.work-poster-ph{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:28px}
/* [2026-07-20 신규] 연도(왼쪽)/평점(오른쪽) — 제목 밑, 배역 위 줄 */
.work-year-rating-row{display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:2px}
.work-rating{color:var(--gold)}
/* [2026-07-20 신규] OTT 로고 — 우리 DB에 있는 작품만 표시 (검색결과 페이지와 동일 스타일) */
.work-ott-badges{position:absolute;top:6px;left:6px;right:6px;
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
/* [2026-07-20 수정] .work-poster img{width:100%;height:100%} 규칙이 이 로고
   이미지에도 적용돼서 커지던 문제 — 선택자를 더 구체적으로 만들어 우선순위 확보 */
.work-poster .ott-logo{width:20px;height:20px;border-radius:50%;object-fit:cover;
  flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.work-poster .ott-logo-ph{width:20px;height:20px;border-radius:50%;flex-shrink:0;
  font-size:10px;color:#fff;font-weight:700;display:flex;
  align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.work-title{font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.work-role{font-size:12px;color:var(--muted);font-family:var(--font-mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-type-dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-right:4px;vertical-align:middle}
.work-type-dot.tv{background:var(--info)}
.work-type-dot.movie{background:var(--gold)}

/* 더보기 버튼 */
.load-more-btn{display:block;width:100%;margin-top:20px;padding:12px;
  border-radius:var(--r);border:.5px solid var(--border);
  background:transparent;color:var(--muted2);font-size:14px;
  cursor:pointer;font-family:var(--font-sans);transition:all .15s;text-align:center}
.load-more-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}

/* ── 로딩 ── */
.page-loading{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:80px;gap:16px}
.page-loading p{font-size:14px;color:var(--muted);font-family:var(--font-mono)}
.spin{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--info);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 반응형 ── */
.hero-wrap{position:relative}

@media(max-width:640px){
  .person-hero{flex-direction:column;gap:20px;align-items:center}
  .person-photo-wrap{width:160px}
  .person-photo{width:160px}
  .person-info{width:100%;text-align:center}
  .person-name{font-size:26px}
  .person-meta-row{justify-content:center}
  .works-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
  /* [2026-07-11 추가] 오늘의 랭킹 위젯 — 모바일은 OTT 태그(1줄) / 제목+카운트(2줄)로 분리 */
  .ranking-widget-title-row{flex-basis:100%;margin-top:4px}
  /* [2026-07-11 추가] 모바일 전용 — 태그 위아래 여백 축소 */
  .ranking-widget-hd .sec-num{padding:2px 10px}
  /* [2026-07-11 추가] 모바일 전용 — 랭킹 위젯 화살표는 PC(호버 시에만 노출)와 달리
     기본값으로 바로 노출. 스크롤 끝(맨 앞/맨 뒤) 도달 시 자동 숨기는 기존 JS 로직
     (.hidden 클래스)은 그대로 살아있어서, 처음엔 오른쪽 화살표만 보이고
     왼쪽은 스크롤해야 나타남 — "더 있다"는 걸 알려주는 효과 */
  /* [2026-07-20 수정] 원래 랭킹위젯에만 있던 규칙 — 대표작/갤러리는 모바일에
     호버가 없어서 화살표가 계속 opacity:0으로 안 보이다가, 슬라이딩할 때 터치로
     우연히 hover 비슷한 상태가 잠깐 걸려야만 보이는 버그였음. 동일하게 적용 */
  .ranking-widget-section .scroll-arrow,
  .known-for-section .scroll-arrow,
  #photoGallerySection .scroll-arrow{opacity:.9}

  /* ⚠️ 2026-07-11 6차 수정(최종): justify-content:center로 화살표+사진을 "하나로 묶어서"
     가운데 정렬했더니, 화살표까지 같이 오른쪽으로 밀려서 진짜 왼쪽 상단이 아니게 됨.
     "왼쪽 상단"은 사진 기준이 아니라 화면(컨테이너) 기준 고정 자리를 뜻했음.
     → 화살표는 position:absolute로 컨테이너 진짜 왼쪽 위 모서리에 고정(사진과 무관).
     → 사진은 화살표 흐름에서 완전히 분리되어(화살표가 absolute라 flex 정렬에 안 끼임)
       원래처럼 독립적으로 가운데 정렬됨 — 정렬되면서 생기는 왼쪽 여백에 화살표가
       자연스럽게 들어가서 겹치지 않음. */
  .mobile-photo-row{
    position:relative;display:flex;justify-content:center;width:100%;
  }
  .back-btn{
    position:absolute;top:0;left:0;z-index:5;
    padding:9px;border-radius:50%;gap:0;margin:0;
    background:rgba(10,10,14,.55);border-color:rgba(255,255,255,.3);backdrop-filter:blur(2px);
  }
  .back-label{display:none}
  .back-arrow{font-size:16px;line-height:1;color:#fff}
  .hero-line-break{display:none} /* [2026-07-11 6차 수정] 모바일은 back-btn이 absolute라 줄바꿈 불필요 */
}
</style>

<!-- 헤더 -->
<div id="ottrang-header"></div>
<script>
(function(){
  fetch('/header.html')
    .then(r=>r.ok?r.text():Promise.reject())
    .then(h=>{
      const el=document.getElementById('ottrang-header');
      el.innerHTML=h;
      el.querySelectorAll('script').forEach(s=>{
        const ns=document.createElement('script');ns.textContent=s.textContent;
        document.body.appendChild(ns);
      });
      if(typeof initHeader==='function') initHeader();
    })
    .catch(()=>{});
  // [2026-07-18 수정] 원래는 헤더 fetch가 끝나야(.finally) initPage()가 시작되는 구조였음 —
  // 헤더와 인물 정보는 서로 전혀 무관한 데이터인데도, 헤더 로딩 시간만큼 콘텐츠 시작이

function scrollRowBy(rowId, dir){
  const row = document.getElementById(rowId);
  if(!row) return;
  const amount = Math.round(row.clientWidth * 0.8) * dir;
  row.scrollBy({ left: amount, behavior: 'smooth' });
}

function updateScrollArrows(rowId){
  const row = document.getElementById(rowId);
  if(!row) return;
  const wrap = row.closest('.scroll-row-wrap');
  if(!wrap) return;
  const leftBtn  = wrap.querySelector('.scroll-arrow-left');
  const rightBtn = wrap.querySelector('.scroll-arrow-right');
  const maxScroll = row.scrollWidth - row.clientWidth;
  if(leftBtn)  leftBtn.classList.toggle('hidden', row.scrollLeft <= 4);
  if(rightBtn) rightBtn.classList.toggle('hidden', row.scrollLeft >= maxScroll - 4);
}

function setupScrollRow(rowId){
  const row = document.getElementById(rowId);
  if(!row) return;
  row.addEventListener('scroll', () => updateScrollArrows(rowId));
  window.addEventListener('resize', () => updateScrollArrows(rowId));
}

  const gallery = document.getElementById('photoGallerySection');

  }else{
    const anchor = document.getElementById('photoGalleryAnchor');
    if(anchor && anchor.parentNode){

}

/* ── 탭 전환 ── */

      .classList.toggle('on', t===tab);

/* ── 현재 탭 데이터 ── */
function currentList(){
  const base = currentTab==='act' ? actCredits
    : currentTab==='direct' ? directCredits
    : allCredits;
  // [2026-07-20 신규] 기본값은 OTT 있는 작품 우선 — 원래 연도순 배열을 안정정렬로
  // 재배치만 하는 거라, 같은 그룹(OTT 있음/없음) 안에서는 연도순이 그대로 유지됨
  return filmoSortMode==='ott' ? sortByOtt(base) : base;
}

/* [2026-07-20 신규] OTT 뱃지 있는 작품을 앞으로 — 안정정렬(stable partition) */
function sortByOtt(list){
  const withOtt = [];
  const withoutOtt = [];
  list.forEach(item=>{
    const keys = ottBadgeCache[item.id];
    (keys && keys.length) ? withOtt.push(item) : withoutOtt.push(item);
  });
  return [...withOtt, ...withoutOtt];
}

/* [2026-07-11 추가] HTML 이스케이프 — 작품 제목/배역명에 특수문자(따옴표, <, > 등)가
   섞여 있으면 카드 HTML 구조가 깨져서 레이아웃이 이상해질 수 있어 방어적으로 처리.
   기존엔 data-title 속성만 따옴표 이스케이프하고 있었고, 화면에 실제 보이는
   텍스트(work-title, work-role, alt)는 그대로 넣고 있었음. */
function escHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  }[ch]));
}

/* ── 작품 카드 HTML ── */
function workCardHtml(item){
  const titleRaw = item.title || item.name || '제목 없음';
  const roleRaw  = item.character || item.job || '';
  const title    = escHtml(titleRaw);
  const role     = escHtml(roleRaw);
  const year     = (item.release_date||item.first_air_date||'').slice(0,4);
  const rating   = item.vote_average ? item.vote_average.toFixed(1).replace(/\.0$/,'') : ''; // [2026-07-20 신규]
  const mediaType= item.media_type || 'tv';
  const poster   = item.poster_path
    ? `<img src="${IMG}${item.poster_path}" alt="${title}" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  // [2026-07-11 추가] 랭킹 배지 placeholder — loadRankBadges()가 데이터 도착 후 채움
  const badgeId = `rankBadge-${item.id}-${mediaType}`;
  return `
    <a class="work-card" data-tmdb="${item.id}" data-type="${mediaType}"
       data-title="${title}" onclick="goWork(this)">
      <div class="work-poster">
        ${poster}
        <div class="work-ott-badges" id="ottBadge-${item.id}-${mediaType}"></div>
        <span class="work-rank-badge" id="${badgeId}"></span>
      </div>
      <div class="work-title">${title}</div>
      <!-- [2026-07-20 신규] 연도(왼쪽) / 평점(오른쪽) — 포스터 하단 랭킹배지와 겹쳐서 밖으로 뺌 -->
      <div class="work-year-rating-row">
        <span>${year||''}</span>
        ${rating?`<span class="work-rating">★ ${rating}</span>`:''}
      </div>
      <div class="work-role">
        <span class="work-type-dot ${mediaType}"></span>${role}
      </div>
    </a>`;
}

/* [2026-07-11 추가] 랭킹 배지 로드 — 화면에 보이는 카드들의 tmdb_id를 모아 한 번에 조회
   /rankings/platforms-batch는 한 번에 최대 50개까지만 받으므로, 이미 캐시된 것은 제외하고
   요청 — "더보기" 클릭 시에도 새로 추가된 24개 정도만 실제로 네트워크 요청이 나감. */
async function loadRankBadges(items){
  const uncachedIds = [...new Set(
    items.filter(it => !(it.id in rankBadgeCache)).map(it => it.id)
  )];

  if(uncachedIds.length){
    try{
      const res  = await fetch(`${OTTRANK_API}/rankings/platforms-batch?tmdb_ids=${uncachedIds.join(',')}`);
      const json = await res.json();
      if(json.ok){
        uncachedIds.forEach(id => { rankBadgeCache[id] = json.data[id] || null; });
      }
    }catch(e){
      // 배지 조회 실패해도 페이지 본 기능(필모그래피 표시)엔 영향 없게 조용히 무시
      uncachedIds.forEach(id => { rankBadgeCache[id] = null; });
    }
  }

  // 캐시 기준으로 이번에 렌더된 카드들에 배지 적용
  items.forEach(item => {
    const badges = rankBadgeCache[item.id];
    if(!badges || !badges.length) return;
    const best = badges.reduce((a,b) => a.rank < b.rank ? a : b); // 여러 플랫폼이면 순위 가장 높은 것 하나만
    const els = document.querySelectorAll(`#rankBadge-${item.id}-${item.media_type||'tv'}`); // [2026-07-20 수정] 같은 작품이 대표작+필모그래피에 중복 id로 나올 때 전부 채우기
    els.forEach(el => {
      const label = PLATFORM_LABELS[best.platform] || best.platform;
      el.textContent = `🔥 ${label} ${best.rank}위`;
      el.style.display = 'inline-flex';
    });
  });
}

/* [2026-07-20 신규] OTT 배지 로드 — 화면에 보이는 카드들의 tmdb_id를 모아 한 번에 조회.
   /works/ott-map은 "우리 DB에 있는 작품"만 응답에 포함되므로, DB 미등록 작품은
   자동으로 배지가 안 뜸(실시간 TMDB 조회 없음 — 검색결과 페이지와 다르게 가볍게 처리). */
async function loadOttBadges(items){
  const uncachedIds = [...new Set(
    items.filter(it => !(it.id in ottBadgeCache)).map(it => it.id)
  )];

  if(uncachedIds.length){
    try{
      const res  = await fetch(`${OTTRANK_API}/works/ott-map?tmdb_ids=${uncachedIds.join(',')}`);
      const json = await res.json();
      if(json.ok){
        uncachedIds.forEach(id => { ottBadgeCache[id] = (json.map && json.map[id]) || null; });
      }
    }catch(e){
      // 실패해도 필모그래피 표시엔 영향 없게 조용히 무시
      uncachedIds.forEach(id => { ottBadgeCache[id] = null; });
    }
  }

  items.forEach(item => {
    const keys = ottBadgeCache[item.id];
    if(!keys || !keys.length) return;
    // [2026-07-20 수정] 같은 작품이 대표작+필모그래피에 중복 id로 나올 때 전부 채우기
    const els = document.querySelectorAll(`#ottBadge-${item.id}-${item.media_type||'tv'}`);
    els.forEach(el => { el.innerHTML = keys.map(ottLogoHtml).join(''); });
  });
}

/* ── 작품 상세 이동 ── */
function goWork(el){
  const tmdbId= parseInt(el.dataset.tmdb);
  const type  = el.dataset.type || 'tv';
  const title = el.dataset.title || '';
  if(!tmdbId) return;
  const y    = new Date().getFullYear();
  const slug = `1-${y}${tmdbId}`;
  // platform을 지정하지 않음 → _title_detail.html의 loadPlatforms()가
  // 실제 OTT 순위 API를 조회해서 올바른 플랫폼을 표시
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type, title, platform: ''
  }));
  location.href = `/title/${slug}`;
}

function fmtBirth(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
}

/* ── 나이 계산 ── */
function calcAge(birthday, deathday){
  if(!birthday) return '';
  const end = deathday ? new Date(deathday) : new Date();
  const birth = new Date(birthday);
  let age = end.getFullYear() - birth.getFullYear();
  const m = end.getMonth() - birth.getMonth();
  if(m < 0 || (m===0 && end.getDate() < birth.getDate())) age--;
  return deathday ? `향년 ${age}세` : `${age}세`;
}

/* [2026-07-11 재수정] 공유 버튼 클릭 시 현재 페이지 URL을 클립보드에 복사.
   my_review.html의 shareCurrentPage()/showToast() 패턴 그대로 재사용 —
   버튼 자체가 바뀌는(아이콘 스왑) 방식 대신, 화면 중앙 상단에 토스트 메시지로 안내.
   navigator.clipboard는 HTTPS 환경(오뜨랑은 항상 HTTPS)에서만 동작하므로,
   혹시 지원 안 되는 구형 브라우저 대비 textarea+execCommand 폴백도 같이 둠. */
async function shareProfile(){
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    fallbackCopy(url);
  }
  showToast('이 페이지 주소가 복사되었습니다.');
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){ /* 복사 실패해도 조용히 무시 */ }
  document.body.removeChild(ta);
}

/* [2026-07-11 추가] my_review.html과 동일한 토스트 알림 함수 */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function initPage(){
  if(!personId){
    document.getElementById('pageLoading').innerHTML =
      `<p>잘못된 접근입니다.</p>`;
    return;
  }

  try{
    /* ① TMDB Person + external_ids + combined_credits 한 번에 호출 */
    const res  = await fetch(
      `${TMDB_PROXY}/person/${personId}?language=ko-KR&append_to_response=external_ids,combined_credits`
    );
    const data = await res.json();

    if(!data || !data.id){
      document.getElementById('pageLoading').innerHTML =
        `<p>인물 정보를 찾을 수 없습니다.</p>`;
      return;
    }

    /* ── 로딩 숨김 / 콘텐츠 표시 ── */
    document.getElementById('pageLoading').style.display = 'none';
    document.getElementById('personHero').style.display = 'flex';

    /* ② 이름 */
    // also_known_as에서 한국어 이름 찾기
    const alsoKnown = data.also_known_as || [];
    const koName = alsoKnown.find(n => /[가-힣]/.test(n)) || '';
    const displayName = koName || data.name || '';
    // [2026-07-11 추가] koName이 data.name과 완전히 같으면(=TMDB에 애초에 영문 이름
    // 없이 한글로만 등록된 인물) 작은 줄에 같은 이름이 중복 표시되던 문제 수정
    const enName      = (koName && koName !== data.name) ? data.name : '';

    document.getElementById('personName').textContent   = displayName;
    document.getElementById('personNameEn').textContent = enName;
    personDisplayName = displayName; // [2026-07-20 신규]

    /* ③ 프로필 사진 */
    if(data.profile_path){
      document.getElementById('personPhoto').innerHTML =
        `<img src="${IMG_PROFILE}${data.profile_path}" alt="${displayName}" loading="eager">`;
    } else {
      document.getElementById('personPhotoPh').textContent = (displayName||'?')[0];
    }

    /* ④ 메타 칩 (생년월일, 나이, 성별, 출생지) */
    const chips = [];
    if(data.birthday){
      chips.push(`<span class="person-meta-chip">
        <span class="chip-label">생년월일</span>${fmtBirth(data.birthday)}
      </span>`);
      const age = calcAge(data.birthday, data.deathday);
      if(age) chips.push(`<span class="person-meta-chip">${age}</span>`);
    }
    if(data.deathday){
      chips.push(`<span class="person-meta-chip">
        <span class="chip-label">사망일</span>${fmtBirth(data.deathday)}
      </span>`);
    }
    const gender = genderLabel(data.gender);
    if(gender) chips.push(`<span class="person-meta-chip">${gender}</span>`);
    if(data.place_of_birth){
      chips.push(`<span class="person-meta-chip">
        <span class="chip-label">출생지</span>${data.place_of_birth}
      </span>`);
    }
    document.getElementById('personMetaRow').innerHTML = chips.join('');

    /* [2026-07-11 추가] 사진 갤러리 — 메인 흐름을 안 막게 await 없이 별도 호출 */
    loadPhotoGallery(personId, IMG_PROFILE);

    /* [2026-07-11 추가] 오늘의 랭킹 위젯 — 이 인물과 무관한 전역 데이터라
       personId 로딩 성공 여부와 상관없이 독립적으로 호출, await 없이 별도 호출 */
    loadRankingWidget();

    /* [2026-07-20 수정] 위키백과 보강 데이터 — 항상 조회 시도 (2026-07-20부터 전체 적용) */
    loadWikiTest(personId);

    /* ⑤ 약력 — ko-KR 없으면 영어 fallback */
    let bio = data.biography || '';
    if(!bio){
      try{
        // language 파라미터 없이 재호출 → 영어 약력
        const enRes  = await fetch(`${TMDB_PROXY}/person/${personId}?language=en-US`);
        const enData = await enRes.json();
        bio = enData.biography || '';
      }catch(e){}
    }
    const bioEl = document.getElementById('bioText');
    tmdbBioText = bio; // [2026-07-19 신규] 위키 데이터 로드 시 참조용으로 저장
    if(bio){
      bioEl.textContent = bio;
      requestAnimationFrame(()=>{
        const lineH = parseFloat(getComputedStyle(bioEl).lineHeight) || 24;
        if(bioEl.scrollHeight > lineH * 4 + 4){
          document.getElementById('bioToggle').style.display = 'inline';
        }
      });
    } else {
      bioEl.textContent = '약력 정보가 없습니다.';
    }

    /* ⑥ SNS 아이콘 + 공유버튼 — 이름 옆 한 줄에 나란히 표시
       [2026-07-11 재수정] 공유버튼을 이름 아래 별도 줄에 뒀더니 위치가 어색하다는
       피드백 → SNS 아이콘과 같은 줄(person-social-row)에 포함시킴. SNS 계정이
       하나도 없어도 공유버튼은 항상 나와야 하므로, socialLinks가 비어있어도
       이 블록 자체는 항상 실행되도록 조건을 없앰. */
    const ext = data.external_ids || {};
    const socialLinks = [];
    if(ext.instagram_id) socialLinks.push({ url:`https://www.instagram.com/${ext.instagram_id}/`, label:`Instagram @${ext.instagram_id}`, icon:'/img/instagram.png' });
    if(ext.twitter_id)   socialLinks.push({ url:`https://x.com/${ext.twitter_id}/`, label:`X(Twitter) @${ext.twitter_id}`, icon:'/img/twitter.png' });
    if(ext.tiktok_id)    socialLinks.push({ url:`https://www.tiktok.com/@${ext.tiktok_id}`, label:`TikTok @${ext.tiktok_id}`, icon:'/img/tiktok.png' });

    const nameEl = document.getElementById('personName');
    const iconsHtml = socialLinks.map(s => `<a class="person-social-icon"
        href="${s.url}" target="_blank" rel="noopener" title="${s.label}"
        onclick="event.stopPropagation()">
        <img src="${s.icon}" alt="${s.label}" onerror="this.style.display='none'">
      </a>`).join('');
    const shareTagHtml = `<button class="share-tag" id="shareBtn"
        onclick="event.stopPropagation();shareProfile()">🔗 공유</button>`;
    const enNameHtml = enName
      ? `<span class="person-name-en-inline">(${escHtml(enName)})</span>` : ''; // [2026-07-20 신규]
    nameEl.innerHTML = nameEl.textContent + enNameHtml
      + `<span class="person-social-row">${iconsHtml}${shareTagHtml}</span>`;

    /* ⑦ SEO */
    const profileImgUrl = data.profile_path
      ? `https://poster.ottrank.kr/tmdb-img/w342${data.profile_path}` : '';
    const jobLabel = data.known_for_department === 'Directing' ? '감독' : '배우';
    const seoDesc = bio
      ? bio.slice(0, 120).replace(/\n/g,' ') + '...'
      : `${displayName} 필모그래피와 프로필을 오뜨랑에서 확인하세요.`;
    updateSEO(displayName, seoDesc, profileImgUrl, jobLabel, ext.instagram_id);

    /* ⑧ 필모그래피 */
    const credits = data.combined_credits || {};
    const cast   = (credits.cast   || []).map(c=>({...c, media_type: c.media_type||'tv',  _kind:'act'}));
    const crew   = (credits.crew   || []).map(c=>({...c, media_type: c.media_type||'movie',_kind:'direct'}));

    // 중복 제거 (tmdb_id + media_type 기준)
    const dedup = (arr) => {
      const seen = new Set();
      return arr.filter(item=>{
        const key = `${item.id}_${item.media_type}`;
        if(seen.has(key)) return false;
        seen.add(key); return true;
      });
    };

    // 최신순 정렬
    const sortByDate = (arr) => [...arr].sort((a,b)=>{
      const da = a.release_date||a.first_air_date||'0000';
      const db = b.release_date||b.first_air_date||'0000';
      return db.localeCompare(da);
    });

    actCredits    = sortByDate(dedup(cast));
    directCredits = sortByDate(dedup(crew.filter(c=>
      c.job==='Director'||c.job==='Creator'||c.department==='Directing'
    )));
    // 전체 = 출연 + 연출 합쳐서 중복 제거 후 정렬
    allCredits = sortByDate(dedup([...cast, ...crew]));

    const total = allCredits.length;
    if(total > 0){
      document.getElementById('filmographySection').style.display = 'block';
      document.getElementById('filmCount').textContent =
        `총 ${total}편`;
      // 탭 카운트 표시
      document.getElementById('tabAll').textContent    = `전체 (${allCredits.length})`;
      document.getElementById('tabAct').textContent    = `출연 (${actCredits.length})`;
      document.getElementById('tabDirect').textContent = `연출 (${directCredits.length})`;

      // [2026-07-20 신규] "OTT 있는 작품 우선" 정렬이 기본값이라, 렌더 전에
      // 전체 작품의 OTT 여부를 미리 한 번에 조회해둠 (loadOttBadges 재사용 —
      // 아직 카드가 없어 화면 반영은 안 되지만 ottBadgeCache는 채워짐, 중복요청 없음)
      await loadOttBadges(allCredits);

      renderWorks();

      // [2026-07-11 추가] 대표작(popularity 기반 + 게스트출연 감점) — 이미 받아온
      // combined_credits 데이터만 재사용, 추가 API 호출 없음. 포스터 없는 작품은
      // 그리드 깨지므로 제외.
      //
      // ⚠️ 2026-07-11 개선: popularity만 쓰면 "예능 1회 게스트 출연"이 "본인 주연 드라마"보다
      // 앞에 나오는 문제 발견(예: 배우가 5년 전 예능에 1번 나온 게 popularity가 더 높았음).
      // 장르(예능/드라마)로 구분하지 않음 — 예능인 본인에게는 예능이 진짜 대표작이기 때문.
      // 대신 TV 출연작의 episode_count(이 작품에 몇 회 나왔는지)로 "게스트성 출연"인지
      // 판단: 회차 수가 적을수록 감점 폭을 크게(연속적으로) 적용. 예능 고정 멤버처럼
      // 회차 수가 많으면 감점 거의 없음 — 장르 상관없이 "비중"만 봄.
      // episode_count는 지금 이미 호출 중인 combined_credits 응답에 원래 포함된 필드라
      // 추가 TMDB 호출 없음(트래픽 영향 없음).
      // ⚠️ 2026-07-11 2차 개선: episode_count만으로는 부족했음 — "런닝맨" 게스트 출연이
      // episode_count=14로 나와서(여러 해에 걸쳐 여러 번 게스트로 나온 게 누적됨) 기존
      // 임계값(10회)을 넘어버려 감점이 전혀 안 걸리는 문제 발견.
      // 더 정확한 신호로 교체: TMDB의 character 필드 — 예능/리얼리티는 배역명 없이
      // "Self"로 찍히고, 드라마/영화는 실제 배역명이 있음. "회차 수"보다 "진짜 배역이
      // 있는지"가 대표작 여부를 훨씬 정확하게 구분함. 이것도 추가 호출 없는 기존 데이터.
      // ⚠️ 2026-07-11 3차 개선: 60회 기준 + 선형 감점으로도 부족했음 — "런닝맨",
      // "무한도전"처럼 10년~20년 넘게 방영된 장수 예능은, 몇 년에 한 번씩만 게스트로
      // 나와도 다 합치면 episode_count가 쉽게 14~수십 회까지 쌓임(TMDB가 한 사람의
      // 여러 해에 걸친 출연을 전부 합쳐서 기록하기 때문). 그 결과 "장수 예능=고정 출연"
      // 취급을 너무 쉽게 받아버려서, 거의 모든 배우 대표작에 런닝맨/무한도전이 나오는
      // 문제 발생. 두 가지로 보정:
      //   1) 임계값 60 → 180으로 상향 (진짜 고정 MC급만 감점 면제)
      //   2) 감점 곡선을 선형(ep/기준)에서 제곱((ep/기준)²)으로 변경
      //      → 14회처럼 어중간한 회차는 지금보다 훨씬 세게 깎이고(14/180≈0.08 → 제곱하면
      //      0.006 수준), 진짜 고정 출연(150회 이상)만 확실히 살아남게 됨
      const scoreFor = (it) => {
        const pop = it.popularity || 0;
        const charName = (it.character || '').trim().toLowerCase();
        const isSelfAppearance = it.media_type === 'tv' && (!charName || charName === 'self');
        if(isSelfAppearance){
          // 본인 출연(예능/리얼리티) — 회차 수로 정도만 조절.
          // 고정 MC급(150회 이상)만 감점 거의 없고, 그 외(장수 예능 게스트 포함)는
          // 제곱 곡선으로 세게 깎임.
          const ep = typeof it.episode_count === 'number' ? it.episode_count : 1;
          const ratio = Math.max(0, Math.min(1, ep / 180));
          const factor = Math.max(0.02, ratio * ratio);
          return pop * factor;
        }
        return pop; // 실제 배역이 있는 드라마/영화 — 감점 없음
      };

      const knownFor = [...allCredits]
        .filter(it => it.poster_path)
        .sort((a,b) => scoreFor(b) - scoreFor(a))
        .slice(0, document.body.classList.contains('layout-test') ? 5 : 6); // [2026-07-19] PC 2단 레이아웃은 5개만
      if(knownFor.length){
        document.getElementById('knownForSection').style.display = 'block';
        const knownForRow = document.getElementById('knownForRow');
        knownForRow.classList.toggle('few-items', knownFor.length <= 2); // [2026-07-11 추가]
        knownForRow.innerHTML = knownFor.map(workCardHtml).join('');
        loadRankBadges(knownFor); // 대표작 카드도 랭킹배지 대상(캐시 공유라 필모그래피와 겹쳐도 중복요청 안 됨)
        loadOttBadges(knownFor); // [2026-07-20 신규]
        updateScrollArrows('knownForRow'); // [2026-07-11 추가] 콘텐츠 채워진 뒤 화살표 표시여부 갱신
      }
    }

  }catch(e){
    console.error('[person.html]', e);
    document.getElementById('pageLoading').innerHTML =
      `<p>오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>`;
  }
}

// [2026-07-18 수정] 예전엔 "헤더 로드 전에 initPage가 호출되지 않도록" 헤더 fetch의
// .finally()에서만 호출했는데, initPage()는 헤더 DOM을 전혀 안 건드리고 자기 자신의
// 요소(personHero, personName 등 이 페이지 body에 이미 존재하는 요소)만 사용하기 때문에
// 헤더를 기다릴 이유가 없었음. 헤더 로딩 시간만큼 인물 정보 조회 시작이 매번 늦춰지고 있던
// 것을 없애기 위해, 이 함수가 정의되자마자(=페이지 파싱이 여기 도달하자마자) 바로 호출.
initPage();
</script>
