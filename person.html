<style>
/* ── 디자인 토큰 (_title_detail.html 동일) ── */
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;
  --info:#378ADD;--info-bg:rgba(55,138,221,.12);--info-border:rgba(55,138,221,.35);
  --font-sans:'Noto Sans KR',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-disp:'Bebas Neue',sans-serif;
  --r:10px;--r-lg:14px;
  --content-w:900px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
#ottrang-header{position:sticky;top:0;z-index:200}

/* ── 페이지 래퍼 ── */
.page-wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
/* [2026-07-19 신규] 레이아웃 테스트 모드일 때만 폭 확장 — 일반 방문자는 900px 그대로 */
body.layout-test .page-wrap{max-width:1200px}
/* [2026-07-20 수정] 헤더(스티키)와 본문 사이 간격 25px로 (!important로 확실히 적용) */
@media(min-width:641px){
  body.layout-test .page-wrap{padding-top:25px !important}
}

/* [2026-07-19 신규] 2단 레이아웃 뼈대
   ⚠️ body에 layout-test 클래스가 항상 붙어있어서(2026-07-20부터 전체 적용) 모든 방문자에게 보임.
   PC(641px 이상): 왼쪽 380px 고정 + 오른쪽 나머지.
   모바일(640px 이하): 그리드 해제하고 기존처럼 세로로 그대로 쌓임(순서 안 바뀜) */
@media(min-width:641px){
  body.layout-test .person-layout{
    display:grid;
    grid-template-columns:220px 1fr;
    column-gap:30px;
    align-items:start;
  }
  /* [2026-07-19 신규] 그리드 아이템 기본값(min-width:auto)이 가로 스크롤 카드행의
     콘텐츠 폭만큼 컬럼 자체를 밀어내는 CSS 함정 방지 — 이전에 대표작 카드에서
     겪었던 flex min-width 버그와 같은 종류. 이걸 안 넣으면 전체 폭이 1200px을
     넘어 화면 밖까지 늘어남 */
  body.layout-test .person-col-left,
  body.layout-test .person-col-right{
    min-width:0;
  }
  /* [2026-07-19 신규] 필모그래피를 1줄에 정확히 5개로 고정 (기존 auto-fill 대신) */
  body.layout-test .works-grid{
    grid-template-columns:repeat(5, 1fr);
  }
  /* [2026-07-19 신규] 대표작도 필모그래피와 완전히 같은 5열 그리드로 통일
     (기존 가로스크롤 flex+고정120px 대신 — 카드 크기를 정확히 똑같이 맞추기 위함) */
  body.layout-test .known-for-row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:16px;
    overflow-x:visible;
  }
  body.layout-test .known-for-row .work-card{
    flex:none;
    width:auto;
  }
}
/* [2026-07-19 신규] 더보기 버튼 — 오른쪽 컬럼이 넓어지면서 버튼이 과하게 길어보여서
   원래 크기(내용만큼)로 줄이고, 눈에 띄게 골드색으로.
   [2026-07-20 수정] PC 전용이었던 걸 모바일에도 동일하게 적용 */
body.layout-test .load-more-btn{
  display:block; width:fit-content; margin:20px auto 0; padding:10px 32px;
  border-color:var(--gold); color:var(--gold);
}
body.layout-test .load-more-btn:hover{
  background:rgba(240,180,41,.1); border-color:var(--gold); color:var(--gold);
}
body.layout-test .person-col-left > *{ margin-bottom:24px }
body.layout-test .person-col-left > *:last-child{ margin-bottom:0 }
/* [2026-07-20 신규] 모바일 — 사진(왼쪽컬럼)과 이름(오른쪽컬럼) 사이 간격이 너무 넓어서 축소.
   .person-hero 기본 margin-bottom(32px)이 실제 원인이라 이것도 같이 줄임 */
@media(max-width:640px){
  body.layout-test .person-col-left > *{ margin-bottom:8px }
  body.layout-test .person-hero{ margin-bottom:8px }
}

/* [2026-07-19 신규] 왼쪽 컬럼(380px)은 폭이 좁아서, 사진이 가로로 배치되는
   기존 PC 스타일 대신 세로로 확실히 쌓이게 강제함 (기존 모바일 스타일과 동일 패턴 재사용,
   "혹시 wrap될 수도"에 기대지 않고 명시적으로 고정) */
body.layout-test .person-hero{ flex-direction:column; gap:16px; align-items:center }
body.layout-test .person-photo-wrap{ width:200px }
body.layout-test .person-photo{ width:200px }
/* [2026-07-20 수정] back-btn이 다시 정상 흐름으로 복귀해서, mobile-photo-row를
   별도 flex로 만들 필요 없어짐 (person-hero의 flex-direction:column이 back-btn/사진을
   그대로 세로로 쌓아줌) — 기본값(display:contents) 유지

/* [2026-07-19 신규] person-info(이름/SNS/공유/메타/약력)는 JS가 오른쪽 컬럼
   맨 위로 옮김 — 왼쪽의 좁은 가운데정렬 스타일이 아니라, 넓은 오른쪽 컬럼에
   맞는 왼쪽정렬 + 아래쪽 구분선으로 표시 */
body.layout-test .person-info{
  width:100%; text-align:left; margin-bottom:28px;
  padding-bottom:24px; border-bottom:.5px solid var(--border);
}
body.layout-test .person-meta-row{ justify-content:flex-start }
/* [2026-07-22 수정] 모바일에서는 이름+인스타+공유 줄을 가운데 정렬 —
   메타 정보 줄(생년월일/나이/성별/출생지)도 같이 가운데 정렬되어야 하는데,
   위 133번 줄의 flex-start 규칙이 특정도가 더 높아서(body.layout-test 포함)
   기존 모바일 center 규칙(548번 줄)을 항상 이기고 있었음 — 여기서 같은
   특정도로 다시 덮어써서 실제로 모바일에서 가운데 정렬되게 함. */
@media(max-width:640px){
  body.layout-test .person-info{ text-align:center }
  body.layout-test .person-meta-row{ justify-content:center }
}

/* [2026-07-22 신규] 인물 좋아요 — 사진 바로 밑, 박스 형태로 복원(포스터 위 오버레이는
   숫자가 잘 안 보여서 폐기 — 사진 innerHTML이 갤러리 클릭 시 통째로 교체되는 구조라
   포스터 안에 두면 사라지는 버그 위험도 있었음, 사진 밖 별도 요소가 더 안전함).
   사진 폭(200px/모바일 160px)에 맞춰 같이 줄어들도록 width:100% */
.person-like-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; margin-top:10px; padding:10px 0;
  border:none; border-radius:var(--r-lg);
  background:#15803d; cursor:pointer; position:relative; overflow:visible;
  font-family:var(--font-mono); font-size:15px; font-weight:700; color:#fff;
  transition:background .15s;
}
.person-like-btn:hover{background:#178f45}
.person-like-btn.liked{background:#136b34}
.person-like-btn:disabled{cursor:default}
.person-like-btn .like-heart{font-size:22px; line-height:1; transition:transform .15s}
.person-like-btn.liked .like-heart{transform:scale(1.15)}
.person-like-btn .like-label{font-size:14px; color:#fff; font-family:var(--font-sans)}
.person-like-btn .like-count{font-size:14px; color:#fff}

/* 클릭 시 튀어 오르는 하트 파티클 — JS가 개수만큼 span을 만들어서 넣고,
   애니메이션 끝나면 그 span들만 지움(버튼 자체 DOM은 안 건드림).
   [2026-07-22 추가] 타입 2종을 하트마다 랜덤으로 섞음 — 입체감을 주기 위함
   ① like-float: 위로 두둥실 떠오르며 사라짐 (기존)
   ② like-zoom : 작게 시작해서 화면 쪽으로 커지며 다가오다가 사라짐 (신규) */
.like-burst{position:absolute; left:50%; top:0; width:0; height:0; pointer-events:none}
.like-burst-particle{
  position:absolute; left:0; top:0; font-size:16px;
  will-change:transform, opacity;
}
.like-burst-particle.like-float{ animation:likeFloat 3s ease-out forwards; }
.like-burst-particle.like-zoom{  animation:likeZoom 3s ease-out forwards; }
@keyframes likeFloat{
  0%{  transform:translate(-50%,0) scale(.6); opacity:0; }
  10%{ opacity:1; }
  70%{ opacity:1; }
  100%{transform:translate(var(--dx),var(--dy)) scale(1); opacity:0; }
}
/* 화면 쪽으로 다가오는 느낌 — 이동은 float보다 훨씬 적게(살짝만 흔들리듯) 하고,
   대신 scale을 크게 키워서 "가까워진다"는 착시를 줌. 커지면서 흐려지다 사라짐. */
@keyframes likeZoom{
  0%{  transform:translate(-50%,0) scale(.3); opacity:0; }
  10%{ opacity:1; }
  55%{ opacity:1; }
  100%{transform:translate(var(--dxZoom),var(--dyZoom)) scale(2.6); opacity:0; }
}

/* ── 뒤로가기 ── */
/* [2026-07-11 6차 수정] back-btn이 person-hero 안(mobile-photo-row 안)으로 이동했지만,
   버튼 자체 크기는 원래(내용물 크기만큼만) 그대로 유지 — "혼자 한 줄 차지"는
   버튼이 아니라 바로 아래 보이지 않는 .hero-line-break 요소가 담당함.
   ⚠️ 이전 시도(flex-basis:100%를 버튼 자체에 줌)는 버튼의 테두리 상자 자체가
   화면 전체 폭으로 늘어나버리는 버그였음 — 폐기. */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;
  text-decoration:none;padding:7px 14px;border:1px solid var(--border);
  border-radius:7px;transition:all .15s;font-family:var(--font-mono);cursor:pointer;background:transparent;
  margin-bottom:24px}
/* [2026-07-11 6차 수정] 보이지 않는 줄바꿈 전용 요소 — 폭 100%를 혼자 차지해서
   그 다음에 오는 person-photo-wrap을 다음 줄로 밀어냄. 높이 0이라 화면에 아무
   영향 없음. 모바일에서는 back-btn이 absolute라 필요 없으므로 미디어쿼리에서 숨김. */
.hero-line-break{flex-basis:100%;height:0;overflow:hidden}
/* [2026-07-11 7차 수정] row-gap을 0으로 껐으니, back-btn 자체의 margin-bottom:24px가
   버튼 줄과 사진 줄 사이의 유일한 세로 간격원. 원래(수정 전) 있던 24px 그대로 복원. */
.back-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}

/* ── 히어로 영역 ── */
/* ⚠️ 2026-07-11 7차 수정: gap:32px가 가로/세로 모두에 적용되면서, hero-line-break가
   만드는 줄바꿈 지점마다(버튼줄→break줄, break줄→사진줄) 세로 간격이 두 번 겹쳐서
   64px(원래 의도 32px의 2배)로 벌어지는 버그 발생. row-gap(세로)은 0으로 끄고,
   column-gap(가로, 사진-정보 사이 간격)만 32px 유지. 세로 간격은 아래 back-btn의
   margin-bottom으로 한 번만 명시적으로 줌. */
.person-hero{display:flex;flex-wrap:wrap;gap:0 32px;margin-bottom:32px;align-items:flex-start}
/* [2026-07-11 5차 수정] mobile-photo-row: PC에서는 display:contents로 완전히
   투명해져서(자기 자신은 레이아웃에 관여 안 함) back-btn/person-photo-wrap이
   person-hero의 직속 flex 아이템처럼 동작 — 기존 PC 모습 그대로 유지됨.
   모바일에서만 실제 flex row로 바뀜(아래 미디어쿼리). */
.mobile-photo-row{display:contents}
.person-photo-wrap{flex-shrink:0;width:200px}
/* [2026-07-22 rev.10 신규] 프레임은 사진 크기에만 딱 맞는 래퍼 — 좋아요 버튼은 이
   프레임 바깥(person-photo-wrap 안, 프레임 다음)에 있으므로 영향 없음. 국화 배지가
   이 프레임 기준으로 절대위치 잡히므로 항상 "사진의" 우측하단에 고정됨. */
.person-photo-frame{position:relative;width:100%}
.person-photo{width:200px;aspect-ratio:2/3;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 64px rgba(0,0,0,.6);
  background:var(--bg3);position:relative}
.person-photo img{width:100%;height:100%;object-fit:cover;display:block}
.person-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:700;color:var(--info);font-family:var(--font-mono)}
/* [2026-07-22 rev.10 신규] 추모 국화 배지 — 사진 우측하단에 여백 없이 겹쳐서 표시.
   PC/모바일 동일하게 80px 폭으로 우선 확인 후 조정 예정(사용자 요청).
   pointer-events:none — 사진 위 클릭/호버 동작을 막지 않기 위함. */
.person-memorial-flower{
  position:absolute; right:0; bottom:0;
  width:80px; height:auto;
  pointer-events:none;
  z-index:2;
}

/* [2026-07-11 재수정] SNS 아이콘 — 박스/배경/패딩으로 만들었던 버전은 관리자님
   피드백으로 폐기. 원래 인스타 아이콘(.person-insta-icon)이 박스 없이 이미지
   자체가 꽉 차게 나오던 방식이 더 낫다는 판단 → 그 스타일을 여러 개(인스타/트위터/
   틱톡)에도 동일하게 적용하도록 일반화. */
.person-social-row{display:inline-flex;align-items:center;gap:8px;margin-left:10px;
  vertical-align:middle;position:relative;top:-3px}
.person-social-icon{display:inline-flex;align-items:center;opacity:.75;
  transition:opacity .15s;text-decoration:none}
.person-social-icon:hover{opacity:1}
.person-social-icon img{width:48px;height:48px;border-radius:12px;display:block}

/* [2026-07-11 재수정] 공유 버튼 — my_review.html의 "공유하기" 태그(.share-tag)를
   그대로 참조. 정체를 알 수 없는 아이콘 하나만 덩그러니 있던 버전은 폐기하고,
   무엇을 하는 버튼인지 텍스트로 바로 보이게 함. SNS 아이콘과 같은 줄에 배치. */
.share-tag{
  font-size:12px;padding:5px 12px;border-radius:14px;
  background:rgba(240,180,41,.18);color:var(--gold);border:.5px solid rgba(240,180,41,.4);
  cursor:pointer;font-family:var(--font-sans);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  transition:background .15s;
}
.share-tag:hover{background:rgba(240,180,41,.28)}

/* [2026-07-11 추가] 토스트 알림 — my_review.html과 동일한 스타일/동작 재사용 */
.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;
  border-radius:22px;z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .25s;font-family:var(--font-mono);word-break:keep-all}
.toast.show{opacity:1}

/* [2026-07-11 추가] 랭킹 배지 — 필모그래피 카드에 지금 랭킹에 있으면 표시 */
/* [2026-07-20 수정] left:6px 고정 대신 가운데 정렬로 변경 */
.work-rank-badge{display:none;align-items:center;gap:3px;position:absolute;
  bottom:6px;left:50%;transform:translateX(-50%);background:rgba(230,57,70,.92);color:#fff;
  font-size:10px;font-weight:700;font-family:var(--font-mono);
  padding:3px 7px;border-radius:5px;backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}

/* [2026-07-11 추가] 대표작(인기순) 섹션 — 가로 스크롤 */
.known-for-section{margin-top:8px}
.known-for-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.known-for-row::-webkit-scrollbar{display:none}

/* [2026-07-31 추가] 인물 관련 영상 — 랭킹위젯과 같은 자리를 공유(영상 있으면 이 섹션,
   없으면 랭킹위젯). 타이틀은 대표작(.section-title)과 동일한 스타일 재사용.
   그리드/카드/재생창 CSS는 _title_detail.html의 "관련영상" 패턴을 그대로 가져옴. */
.related-video-section{margin:32px 0}
.yt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.yt-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.yt-card:hover{border-color:var(--border2)}
.yt-thumb{position:relative;aspect-ratio:16/9;background:var(--bg3);overflow:hidden}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
.yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.yt-card:hover .yt-play{opacity:1}
.yt-play-icon{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.yt-info{padding:12px}
.yt-title{font-size:15px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal-wrap{display:none;border:.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;background:var(--bg2)}
.modal-wrap.show{display:block}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border)}
.modal-ttl{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-close{background:none;border:none;font-size:13px;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.yt-player-wrap{position:relative;width:100%;aspect-ratio:16/9}
.yt-player-wrap iframe{width:100%;height:100%;border:none;display:block}

/* [2026-07-11 추가] 오늘의 랭킹 위젯 — 방문객 전원에게 노출되는 유입 장치.
   포스터 카드는 대표작(.known-for-row .work-card)과 완전히 동일한 크기를 쓰려고
   새 CSS를 만들지 않고 .known-for-row 클래스를 그대로 재사용함(아래 rankingWidgetRow).
   헤더(OTT 네임태그 + 제목)는 netflix.html의 .sec-num/.sec-title 패턴을 재현. */
.ranking-widget-section{margin:32px 0;padding:18px 18px 20px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg)}
.ranking-widget-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;text-decoration:none;cursor:pointer}
.ranking-widget-hd .sec-num{font-family:var(--font-mono);font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:4px;letter-spacing:1px;white-space:nowrap}
.ranking-widget-title-row{display:flex;align-items:baseline;gap:10px}
.ranking-widget-hd .sec-title{font-size:17px;font-weight:700;color:var(--text);transition:color .15s}
.ranking-widget-hd .sec-count{font-family:var(--disp);font-size:17px;letter-spacing:1px;color:var(--muted)}
.ranking-widget-hd:hover .sec-title{color:var(--info)}
/* [2026-07-11 추가] 랭킹 위젯 전용 행 — .known-for-row(대표작과 공유)에서 분리해서
   대표작 카드 크기에 영향 안 주고 이 위젯만 사진갤러리(90px)와 동일 사이즈로 줄임 */
.ranking-widget-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.ranking-widget-row::-webkit-scrollbar{display:none}
.ranking-widget-row.few-items{justify-content:center}
.ranking-widget-row .work-card{flex:0 0 90px;min-width:0}
.ranking-widget-rank{position:absolute;top:6px;left:6px;
  background:rgba(230,57,70,.92);color:#fff;font-family:var(--font-mono);
  font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 2px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.4)}
/* ⚠️ 2026-07-11 4차 수정: 얇게 만든 스크롤바(6px)도 여전히 못생기고 UX를 해친다는
   피드백 — 스크롤바 자체를 완전히 숨기고, 대신 좌우 화살표 버튼(PC 전용)으로 조작.
   scrollbar-width:none(파이어폭스), -ms-overflow-style:none(구형 엣지),
   ::-webkit-scrollbar{display:none}(크롬/사파리) 3종 다 처리해야 브라우저별로
   안 남는 데 없이 확실히 숨겨짐. */
.known-for-row .work-card{flex:0 0 120px;min-width:0}
/* ⚠️ 2026-07-11 수정: min-width:0이 빠져있었음 — flex 아이템은 기본적으로
   min-width:auto라서, 배역명처럼 white-space:nowrap인 긴 텍스트가 있으면
   flex-shrink:0과 맞물려 카드 자체가 텍스트 길이만큼 억지로 커지는 버그 발생
   ("Kim Young-ho / John Kim"처럼 긴 배역명 카드만 유독 커지던 원인).
   min-width:0으로 자동 최소크기 계산을 꺼야 text-overflow:ellipsis가 정상 작동함. */
/* [2026-07-11 추가] 아이템 2개 이하면 왼쪽에 몰려있지 않게 가운데 정렬 */
.known-for-row.few-items{justify-content:center}

/* [2026-07-11 추가] 사진 갤러리 */
.photo-gallery-section{margin-top:24px}
.photo-gallery-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none}
.photo-gallery-row::-webkit-scrollbar{display:none}
/* [2026-07-11 추가] 아이템 2개 이하면 왼쪽에 몰려있지 않게 가운데 정렬 */
.photo-gallery-row.few-items{justify-content:center}
.photo-gallery-thumb{flex:0 0 90px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;background:var(--bg3);transition:border-color .15s}
.photo-gallery-thumb:hover{border-color:var(--info)}
.photo-gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* [2026-07-27 신규] 메인사진/갤러리 라이트박스 — _title_detail.html 관련이미지 팝업과 동일한 방식.
   배경/이미지/✕ 클릭 시 닫힘, 화살표는 stopPropagation으로 닫힘 동작에서 제외되어 넘기기만 함.
   모바일 스와이프(좌우 50px 이상)로도 넘길 수 있음. */
.person-photo{cursor:pointer}
.img-lightbox{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.92);align-items:center;justify-content:center;
  padding:40px 70px;cursor:pointer;
}
.img-lightbox.show{display:flex}
.lightbox-slide-viewport{
  position:relative;overflow:hidden;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);
  width:90vw;height:85vh;max-width:700px;max-height:700px;
}
.lightbox-slide-track{display:flex;height:100%}
.lightbox-slide-img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;touch-action:pan-y}
.lightbox-close{
  position:fixed;top:16px;right:20px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.18);color:#fff;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);z-index:1001;transition:background .15s;
}
.lightbox-close:hover{background:rgba(255,255,255,.18)}
.lightbox-arrow{
  position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.18);color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);z-index:1001;transition:background .15s;
}
.lightbox-arrow:hover{background:rgba(255,255,255,.18)}
.lightbox-arrow-left{left:20px}
.lightbox-arrow-right{right:20px}
@media(max-width:640px){
  .img-lightbox{padding:20px}
  .lightbox-close{top:10px;right:12px;width:34px;height:34px;font-size:16px}
  .lightbox-arrow{width:36px;height:36px;font-size:18px}
  .lightbox-arrow-left{left:8px}
  .lightbox-arrow-right{right:8px}
}


/* [2026-07-11 추가] 좌우 스크롤 화살표 — PC 전용(대표작/사진갤러리 공통).
   모바일은 스와이프로 충분히 잘 동작하고 있어서 의도적으로 미적용(하단 미디어쿼리에서 숨김). */
.scroll-row-wrap{position:relative}
.scroll-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;
  background:rgba(20,20,28,.8);border:1px solid var(--border2);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;cursor:pointer;z-index:3;
  opacity:0;transition:opacity .2s;user-select:none;
}
.scroll-row-wrap:hover .scroll-arrow{opacity:.9}
.scroll-arrow:hover{background:rgba(30,30,42,.95)}
.scroll-arrow-left{left:-14px}
.scroll-arrow-right{right:-14px}
.scroll-arrow.hidden{display:none} /* 스크롤 끝(또는 스크롤 필요 없음)에 도달하면 자동으로 숨김 */

/* ── 인물 정보 ── */
.person-info{flex:1;min-width:0;margin-top:20px}
.person-name{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.5px;margin-bottom:4px}
.person-name-en{display:none} /* [2026-07-20 수정] 이름 옆 괄호 표기 방식으로 변경, 기존 별도줄은 숨김 */
.person-name-en-inline{font-size:16px;color:var(--muted);font-weight:400;margin-left:6px} /* [2026-07-20 신규] */
.person-meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.person-meta-chip{display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;border:.5px solid var(--border);
  background:var(--bg2);font-size:13px;color:var(--muted2);font-family:var(--font-mono)}
.person-meta-chip .chip-label{color:var(--muted);font-size:12px;margin-right:2px}
/* [2026-07-27 신규] MBTI 칩 — 다른 칩과 구분되게 연한 흰색 배경 */
.person-meta-chip.mbti-chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:var(--text)}

/* 약력 */
.bio-section{margin-bottom:0}

/* [2026-07-19 신규] 위키백과 보강 데이터 — 테스트 전용 섹션
   위키 데이터가 있는 배우만 JS에서 display:block으로 켜짐(2026-07-20부터 전체 적용). */
.wiki-test-section{
  display:none; margin:16px 0 24px; padding:16px;
  background:var(--bg); border:.5px solid rgba(255,255,255,0.05); border-radius:var(--r);
}
.wiki-test-summary{ font-size:14px; line-height:1.6; color:var(--muted); margin-bottom:14px; }
.wiki-test-meta{ display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted); margin-bottom:14px; }

/* [2026-07-19 신규] 데뷔작/학력 — 오른쪽 프로필(person-info) 안, 메타칩과 약력 사이에 표시 */
.profile-debut-edu{
  display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted);
  margin:12px 0; padding:10px 0;
  border-top:.5px solid var(--border); border-bottom:.5px solid var(--border);
}
.profile-debut-edu b{ color:var(--text); font-weight:600; margin-right:4px; }

/* [2026-07-19 신규] 수상내역 — 약력 바로 아래. 윗줄만 유지(약력과 구분),
   아랫줄은 뺌 — person-info 전체의 아래쪽 줄이 대표작 앞 구분선 역할을 이미 하고 있어서
   바로 밑에 또 줄이 있으면 줄 2개가 겹쳐 보임 */
.profile-awards{
  font-size:13px; color:var(--muted2); line-height:1.7;
  margin-top:12px; padding-top:10px;
  border-top:.5px solid var(--border);
}
.profile-awards-text{
  white-space:pre-line; /* [2026-07-20 신규] 입력창에서 엔터로 나눈 줄이 화면에도 줄바꿈되게 */
}
/* [2026-07-20 신규] 수상내역 "더보기" — 약력(bio-toggle)과 동일 스타일 재사용.
   모바일은 2줄, PC는 4줄 넘을 때 등장(JS가 계산해서 버튼 표시 여부만 토글) */
.profile-awards-toggle{
  display:none; margin-top:6px; background:none; border:none; color:var(--info);
  font-size:13px; cursor:pointer; font-family:var(--font-mono); padding:0;
}
.profile-awards-toggle:hover{text-decoration:underline}
@media(max-width:640px){
  .profile-awards-text{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; transition:all .3s;
  }
  .profile-awards-text.expanded{ -webkit-line-clamp:unset; overflow:visible; }
}
@media(min-width:641px){

   - 클릭 시 컨테이너 폭의 80%만큼 부드럽게 스크롤
   - 스크롤이 맨 왼쪽/맨 오른쪽 끝에 도달하면(또는 애초에 스크롤할 내용이 없으면)
     해당 방향 화살표를 자동으로 숨김 — UX 방해 최소화 */
function scrollRowBy(rowId, dir){
  const row = document.getElementById(rowId);
  if(!row) return;
  const amount = Math.round(row.clientWidth * 0.8) * dir;
  row.scrollBy({ left: amount, behavior: 'smooth' });
}

function updateScrollArrows(rowId){
  const row = document.getElementById(rowId);
  if(!row) return;
  const wrap = row.closest('.scroll-row-wrap');
  if(!wrap) return;
  const leftBtn  = wrap.querySelector('.scroll-arrow-left');
  const rightBtn = wrap.querySelector('.scroll-arrow-right');
  const maxScroll = row.scrollWidth - row.clientWidth;
  if(leftBtn)  leftBtn.classList.toggle('hidden', row.scrollLeft <= 4);
  if(rightBtn) rightBtn.classList.toggle('hidden', row.scrollLeft >= maxScroll - 4);
}

function setupScrollRow(rowId){
  const row = document.getElementById(rowId);
  if(!row) return;
  row.addEventListener('scroll', () => updateScrollArrows(rowId));
  window.addEventListener('resize', () => updateScrollArrows(rowId));
}

const mobileGalleryMQ = window.matchMedia('(max-width:640px)');

function relocatePhotoGallery(){
  const gallery = document.getElementById('photoGallerySection');
  if(!gallery) return;

  if(mobileGalleryMQ.matches){
    const metaRow     = document.getElementById('personMetaRow');
    const bioSection  = document.querySelector('.bio-section');
    if(metaRow && bioSection && metaRow.parentNode){
      metaRow.parentNode.insertBefore(gallery, bioSection);

  }else{
    const anchor = document.getElementById('photoGalleryAnchor');
    if(anchor && anchor.parentNode){
      anchor.parentNode.insertBefore(gallery, anchor.nextSibling);
    }
  }
}

function openProfileEditModal(){
  const sid = localStorage.getItem('ottrang_sid');
  if(!sid){
    location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  const currentBio = document.getElementById('bioText')?.textContent || '';
  const overlay = document.createElement('div');
  overlay.className = 'pe-overlay';
  overlay.id = 'peOverlay';
  overlay.innerHTML = `
    <div class="pe-modal">
      <h3>✏️ 프로필 수정 제안</h3>
      <div class="pe-sub">${escHtml(personDisplayName || '이 인물')}님의 약력을 고쳐서 보내주세요. 검토 후 반영돼요.</div>
      <textarea id="peTextarea">${escHtml(currentBio)}</textarea>
      <div class="pe-btns">
        <button class="pe-cancel-btn" onclick="closeProfileEditModal()">취소</button>
        <button class="pe-submit-btn" id="peSubmitBtn" onclick="submitProfileEdit()">제출하기</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeProfileEditModal(); });
  document.body.appendChild(overlay);
}

function closeProfileEditModal(){
  document.getElementById('peOverlay')?.remove();
}

async function submitProfileEdit(){
  const sid = localStorage.getItem('ottrang_sid');
  const bio = (document.getElementById('peTextarea')?.value || '').trim();
  if(!bio){ alert('내용을 입력해주세요.'); return; }

  const btn = document.getElementById('peSubmitBtn');
  btn.disabled = true;
  btn.textContent = '제출 중...';

  try{
    const res = await fetch(`${OTTRANK_API}/person-wiki/${personId}/profile-edit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sid },
      body: JSON.stringify({ bio }),
    });
    const json = await res.json();
    closeProfileEditModal();
    if(json && json.ok){
      alert(`보내주신 ${personDisplayName || '이 인물'}님의 프로필이 수정되었습니다. 검토 후 적극 반영됩니다.`);
    } else {
      alert(json?.message || '제출에 실패했어요. 잠시 후 다시 시도해주세요.');
    }
  }catch(e){
    closeProfileEditModal();
    alert('제출 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
  }
}

/* [2026-07-22 신규] 인물 좋아요 — 로그인/횟수 제한 없음. 클릭할 때마다 서버에 +1 요청을

const LIKE_COOLDOWN_MS = 2000;
const LIKE_EMOJIS = ['💕','💖','💗','❤️','💘','💓'];
let likeCount = 0;
let likeBusy  = false; // 쿨다운 중이면 true — 버튼 재클릭 방지

// 사운드는 미리 한 번 만들어두고 재사용(클릭마다 새 Audio 객체를 만들면 첫 재생이
// 느릴 수 있어서). 파일이 아직 안 올라와 있거나 재생 실패해도 화면 기능엔 영향 없음.

function initLikeCount(count){
  likeCount = count || 0;
  const countEl = document.getElementById('likeCount');
  if(!countEl) return;
  if(likeCount > 0){
    countEl.textContent = likeCount.toLocaleString();

// 버튼 안에 하트 이모지 여러 개를 즉석으로 만들어서 위로 퐁퐁 띄우고, 애니메이션이
// 끝나면 그 요소들만 지움(버튼 자체 구조는 안 건드림). 개수는 일단 PC/모바일 동일하게
// 시작 — 실제로 보고 나서 모바일만 개수 줄일지 다음에 조정하기로 함.
function burstHearts(container){
  const burst = document.createElement('div');
  burst.className = 'like-burst';
  const n = 18; // [2026-07-22 수정] 6 → 18 (3배)
  for(let i=0; i<n; i++){
    const p = document.createElement('span');
    // [2026-07-22 추가] 하트마다 랜덤으로 "위로 두둥실" / "커지며 다가오기" 중 하나 선택
    // — 비율 고정 안 하고 매번 다르게(50:50 랜덤) 섞여서 누를 때마다 느낌이 달라짐
    const isZoom = Math.random() < 0.5;
    p.className = 'like-burst-particle ' + (isZoom ? 'like-zoom' : 'like-float');
    p.textContent = LIKE_EMOJIS[Math.floor(Math.random()*LIKE_EMOJIS.length)];
    // 부채꼴로 퍼지면서 위로 — 각도를 좌우로 흩뿌리고, 거리도 조금씩 다르게 해서 자연스럽게
    // [2026-07-22 수정] 퍼지는 거리 5배 확대 (50~80px → 250~400px)
    const angle = (Math.random()*140 - 70) * (Math.PI/180); // -70~70도
    const dist  = 250 + Math.random()*150; // px
    const dx = Math.sin(angle) * dist;
    const dy = -Math.cos(angle) * dist - 20;
    p.style.setProperty('--dx', `${dx}px`);
    p.style.setProperty('--dy', `${dy}px`);
    // zoom 타입도 float처럼 각도를 기반으로 넓게 흩어지게 함 — 기존엔 -30~30px 정사각형
    // 범위 안에서만 랜덤이라 다들 중앙 근처에 몰려서(뭉쳐서) 날아오는 것처럼 보였음.
    // 거리(dist)만 float보다 짧게 줘서 "멀리 안 날아가고 그 자리 근처에서 커진다"는
    // 느낌은 유지하되, 각도(angleZoom)는 훨씬 넓은 범위(360도 전체)로 흩뿌림.
    const angleZoom = Math.random() * Math.PI * 2; // 0~360도, 사방으로
    const distZoom  = 60 + Math.random()*140; // px
    const dxZoom = Math.cos(angleZoom) * distZoom;
    const dyZoom = Math.sin(angleZoom) * distZoom;
    p.style.setProperty('--dxZoom', `${dxZoom}px`);
    p.style.setProperty('--dyZoom', `${dyZoom}px`);
    p.style.animationDelay = `${Math.random()*0.4}s`;
    burst.appendChild(p);
  }
  container.appendChild(burst);
  // [2026-07-22 수정] 애니메이션이 3초짜리로 느려졌으니 제거 타이밍도 그만큼 늦춤.
  // 버튼 잠금(2초)과는 완전히 별개 타이머라, 다시 눌러도 이전 하트들이 화면에
  // 남아서 같이 떠 있을 수 있음(의도된 동작 — "1~2개 남아서 둥둥 떠 있어도 됨").
  setTimeout(()=>burst.remove(), 3300);
}

function playLikeSound(){

  }catch(e){ /* 무시 */ }
}

async function toggleLike(btn){
  if(likeBusy) return; // 쿨다운 중이면 무시
  likeBusy = true;
  btn.disabled = true;

  const heartEl = document.getElementById('likeHeart');
  heartEl.textContent = '❤️';
  btn.classList.add('liked');
  burstHearts(btn);
  playLikeSound();

  // 화면은 즉시 반응(낙관적 업데이트), 서버 응답은 뒤에서 조용히 받아서 정확한 값으로 보정
  initLikeCount(likeCount + 1);

  fetch(`${OTTRANK_API}/person-wiki/${personId}/like`, { method:'POST' })
    .then(r => r.ok ? r.json() : null)
    .then(json => {
      if(json && json.ok && typeof json.like_count === 'number') initLikeCount(json.like_count);
    })
    .catch(()=>{ /* 실패해도 화면엔 이미 반영돼 있어 조용히 무시 */ });

  // 2초 후 원상복귀 — 빈 하트로 돌아가고 다시 누를 수 있게 됨
  setTimeout(()=>{
    heartEl.textContent = '🤍';
    btn.classList.remove('liked');
    btn.disabled = false;
    likeBusy = false;
  }, LIKE_COOLDOWN_MS);
}

/* [2026-07-20 수정] 테스트 기간 종료 — 항상 위키 데이터 조회 시도.
   캐시에 데이터 없는 배우(대부분)는 아래 "if(!d) return"에서 조용히 종료됨. */
async function loadWikiTest(personId){
  try{
    const res  = await fetch(`${OTTRANK_API}/person-wiki/${personId}`);
    const json = await res.json();
    if(!json || !json.ok) return;

    // [2026-07-22 신규] 좋아요 초기값 — 0이면 하트만, 1 이상이면 숫자까지 표시.
    // data(위키 매칭)나 manual 여부와 무관하게 항상 처리(early return보다 위에 둠).
    if(typeof json.like_count === 'number') initLikeCount(json.like_count);

    // [2026-07-20 재수정] 생년월일/성별/출생지는 평생 거의 안 바뀌는 정보라,
    // "한 번 확정하면 계속 쓰는" persons 테이블 수동입력값(manual)을 우선시하고
    // manual이 없을 때만 TMDB 값을 씀 (기존엔 반대였음 — TMDB 우선이었음).
    // 위키 매칭 여부(json.data)와 무관하게 항상 처리 — early return 전에 실행.
    const manual = json.manual;
    if(manual){
      const merged = {
        birthday: manual.birthday || tmdbMeta.birthday || '',
        deathday: tmdbMeta.deathday, // 사망일은 TMDB 전용 — 수동 보완 대상 아님
        gender: manual.gender || tmdbMeta.gender || null,
        place_of_birth: manual.place_of_birth || tmdbMeta.place_of_birth || '',
        mbti: manual.mbti || tmdbMeta.mbti || '', // [2026-07-27 신규] TMDB엔 없는 값이라 사실상 항상 manual.mbti
      };
      const changed = merged.birthday !== tmdbMeta.birthday ||
                       merged.gender !== tmdbMeta.gender ||
                       merged.place_of_birth !== tmdbMeta.place_of_birth ||
                       merged.mbti !== tmdbMeta.mbti;
      if(changed) renderMetaChips(merged);

      // [2026-07-27 수정] 표시 이름을 DB 우선(name_ko)으로 통일 — 화면 이름이 원래
      // TMDB also_known_as 자동탐색이었는데, 예명(활동명)으로 알려진 인물(예: 아이유=이지은)은
      // 자동탐색 결과가 실제 통용되는 이름과 다를 수 있어서 우리 DB의 name_ko가 있으면
      // 그걸 우선 씀(person-wiki.js가 manual.display_name으로 name_ko 값을 내려줌).
      // renderPersonNameEl() 공용 함수로 다시 그려야, SNS아이콘/공유버튼 블록이 이 코드보다
      // 먼저 끝났든 나중에 끝났든 관계없이 항상 최종 상태가 올바르게 유지됨(레이스 컨디션 방지).
      if(manual.display_name){
        personDisplayName = manual.display_name;
        // [2026-07-28 신규] DB 이름(메인)과 괄호 속 보조 이름이 같아지면(예: 예명 대신
        // 본명을 메인으로 바꿨는데 TMDB 보조이름도 마침 그 본명이었던 경우) 같은 이름이
        // "이지은 (이지은)"처럼 중복 표시되므로, 이땐 보조 이름을 아예 지움.
        if(personEnName && personEnName === manual.display_name){
          personEnName = '';
          personEnNameHtml = '';
          document.getElementById('personNameEn').textContent = '';
        }
        renderPersonNameEl();
      }
    }
    // [2026-07-22 rev.11 신규] 포스터 배지(추모 국화 등) — TMDB 사망일과는 별개로
    // 관리자가 수동 지정한 값도 같이 확인. manual이 없어도(위 if(manual) 밖에서)
    // 항상 재호출해야, "manual 자체가 없는 사람"도 TMDB 사망일 기준 상태가 유지됨.
    renderMemorialFlower(tmdbMeta.deathday, manual ? manual.poster_badge : null);


    const d = json.data;
    if(!d) return; // 캐시에 데이터 없음 — 조용히 종료

    /* [2026-07-25 신규] 봇용으로 미리 만들어둔 필모그래피 문장 — 약력이 부실할 때
       화면에도 같이 보여주기로 함(관리자님 결정). '__NONE__'은 채우기 시도했지만
       필모그래피 자체를 못 찾은 센티널이라 빈 값과 동일하게 처리. */
    const rawAutoFilmo = (d.auto_filmography_text || '').trim();
    const autoFilmoText = (rawAutoFilmo && rawAutoFilmo !== '__NONE__') ? rawAutoFilmo : '';

    /* [2026-07-26 신규] 국적 분기 — korean_confirmed=1(한국인)만 기존 로직 그대로 두고,
       외국인/미확인(0 또는 null)은 별도 분기 추가. 한국인은 TMDB 약력을 아예 안 쓰지만
       (TMDB 한국어 약력이 부실한 경우가 많아서), 외국인은 반대로 TMDB 약력이 잘 되어있는
       경우가 많아서 위키 다음으로 우선시하고, 그것도 100자 미만으로 부실할 때만
       필모문장(SEO용)을 보충으로 붙임 — 한국인과 완전히 같은 "부실할 때만 보충" 규칙. */
    const koreanConfirmed = json.korean_confirmed;

    if(koreanConfirmed === 1){
    if(d.bio_summary || autoFilmoText){
      /* [2026-07-19 신규] 오른쪽 상단 프로필의 "약력" 자리를 위키 요약글로 대체.
         TMDB 약력은 영어인 경우가 대부분이라, 한국어인 위키 요약글을 우선시함.
         단, 위키 요약글이 너무 짧으면(80자 미만) 정보가 부족하니 TMDB 약력을 이어붙임.
         [2026-07-25 수정] 그렇게 만든 텍스트가 여전히 100자 미만이면, 필모그래피
         문장까지 추가로 이어붙임. 약력이 아예 없으면 필모문장만 단독으로 표시. */
      const bioEl = document.getElementById('bioText');
      if(bioEl){
        let combined = d.bio_summary
          ? (d.bio_summary.length < 80 && tmdbBioText ? `${d.bio_summary} ${tmdbBioText}` : d.bio_summary)
          : '';
        if(combined.length < 100 && autoFilmoText){
          combined = combined ? `${combined} ${autoFilmoText}` : autoFilmoText;
        }
        bioEl.textContent = combined;
        wikiBioApplied = true; // [2026-07-20 신규] TMDB 약력 폴백이 이걸 덮어쓰지 않게 표시
        requestAnimationFrame(()=>{
          const lineH = parseFloat(getComputedStyle(bioEl).lineHeight) || 24;
          const toggleBtn = document.getElementById('bioToggle');
          if(toggleBtn) toggleBtn.style.display = (bioEl.scrollHeight > lineH * 4 + 4) ? 'inline' : 'none';
        });
      }
    }
    } else {
      // 외국인/미확인 — 기본 텍스트는 위키 있으면 위키, 없으면 TMDB 약력.
      // 그 기본 텍스트가 100자 미만으로 부실할 때만 필모문장(SEO용)을 보충으로 붙임.
      const bioEl = document.getElementById('bioText');
      if(bioEl){
        let combined = d.bio_summary || tmdbBioText || '';
        if(combined.length < 100 && autoFilmoText){
          combined = combined ? `${combined} ${autoFilmoText}` : autoFilmoText;
        }
        if(combined){
          bioEl.textContent = combined;
          wikiBioApplied = true;
          requestAnimationFrame(()=>{
            const lineH = parseFloat(getComputedStyle(bioEl).lineHeight) || 24;
            const toggleBtn = document.getElementById('bioToggle');
            if(toggleBtn) toggleBtn.style.display = (bioEl.scrollHeight > lineH * 4 + 4) ? 'inline' : 'none';
          });
        }
      }
    }

    const metaParts = [];
    if(d.debut_work) metaParts.push(`<span><b>데뷔작</b> ${d.debut_work}${d.debut_year ? ' ('+d.debut_year+')' : ''}</span>`);
    if(d.education)  metaParts.push(`<span><b>학력</b> ${d.education}</span>`);
    if(metaParts.length){
      const debutEduEl = document.getElementById('profileDebutEdu');
      debutEduEl.innerHTML = metaParts.join('');
      debutEduEl.style.display = 'flex';
    }

    if(d.awards_text){
      const awardsEl = document.getElementById('profileAwards');
      const awardsTextEl = document.getElementById('profileAwardsText');
      awardsTextEl.textContent = d.awards_text;
      awardsEl.style.display = 'block';
      // [2026-07-24 신규] SEO 목적 — "OO 수상내역"처럼 인물 이름을 제목에 같이 노출.
      // loadWikiTest는 TMDB 기본 정보 로딩과 타이밍이 겹칠 수 있어, personDisplayName이
      // 아직 비어있으면(초기값 '') 기본 제목("🏆 수상내역")을 그대로 둠(안전한 폴백).
      const awardsTitleEl = document.getElementById('profileAwardsTitle');
      if(awardsTitleEl && personDisplayName) awardsTitleEl.textContent = `🏆 ${personDisplayName} 수상내역`;
      // [2026-07-20 수정] 모바일 2줄 / PC 4줄 초과 여부 계산 — CSS 미디어쿼리 기준(640px)과 동일하게 분기
      requestAnimationFrame(()=>{
        const lineH = parseFloat(getComputedStyle(awardsTextEl).lineHeight) || 22;
        const maxLines = window.innerWidth <= 640 ? 2 : 4;
        const toggleBtn = document.getElementById('profileAwardsToggle');
        if(toggleBtn) toggleBtn.style.display = (awardsTextEl.scrollHeight > lineH * maxLines + 4) ? 'inline' : 'none';
      });
    }

    if(d.career_history){
      document.getElementById('wikiCareerPreview').textContent = d.career_history;
      document.getElementById('wikiCareerMobileText').textContent = d.career_history; // [2026-07-19 신규] 모바일용
    } else {
      document.getElementById('wikiCareerToggle').style.display = 'none';
    }

    if(d.source_url){
      const sourceHtml = `출처: <a href="${d.source_url}" target="_blank" rel="noopener">위키백과</a> (CC BY-SA)`;
      document.getElementById('wikiSource').innerHTML = sourceHtml;
      document.getElementById('wikiSourceMobile').innerHTML = sourceHtml; // [2026-07-19 신규] 모바일용
    }

    document.getElementById('wikiTestSection').style.display = 'block';
    if(d.career_history){
      document.getElementById('wikiCareerMobileSection').style.display = 'block'; // [2026-07-19 신규]
      const mobileToggleBtn = document.getElementById('wikiCareerMobileToggle');
      if(mobileToggleBtn && personDisplayName){
        mobileToggleBtn.textContent = `${personDisplayName} 전체 이력 더보기 ▾`; // [2026-07-20 신규]
      }
    }
  }catch(e){
    console.log('[wiki-test] load failed:', e.message); // 실패해도 화면엔 영향 없음
  }
}

/* ── 탭 전환 ── */
function switchTab(tab){
  currentTab = tab;
  ['all','act','direct'].forEach(t=>{
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1))
      .classList.toggle('on', t===tab);
  });
  shownCount = 0;
  renderWorks();
}

/* ── 현재 탭 데이터 ── */
function currentList(){
  const base = currentTab==='act' ? actCredits
    : currentTab==='direct' ? directCredits
    : allCredits;
  // [2026-07-20 신규] 기본값은 OTT 있는 작품 우선 — 원래 연도순 배열을 안정정렬로
  // 재배치만 하는 거라, 같은 그룹(OTT 있음/없음) 안에서는 연도순이 그대로 유지됨
  return filmoSortMode==='ott' ? sortByOtt(base) : base;
}

/* [2026-07-20 신규] OTT 뱃지 있는 작품을 앞으로 — 안정정렬(stable partition) */
function sortByOtt(list){
  const withOtt = [];
  const withoutOtt = [];
  list.forEach(item=>{
    const keys = ottBadgeCache[item.id];
    (keys && keys.length) ? withOtt.push(item) : withoutOtt.push(item);
  });
  return [...withOtt, ...withoutOtt];
}

/* [2026-07-11 추가] HTML 이스케이프 — 작품 제목/배역명에 특수문자(따옴표, <, > 등)가
   섞여 있으면 카드 HTML 구조가 깨져서 레이아웃이 이상해질 수 있어 방어적으로 처리.
   기존엔 data-title 속성만 따옴표 이스케이프하고 있었고, 화면에 실제 보이는
   텍스트(work-title, work-role, alt)는 그대로 넣고 있었음. */
function escHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  }[ch]));
}

/* ── 작품 카드 HTML ── */
function workCardHtml(item){
  const titleRaw = item.title || item.name || '제목 없음';
  const roleRaw  = item.character || item.job || '';
  const title    = escHtml(titleRaw);
  const role     = escHtml(roleRaw);
  const year     = (item.release_date||item.first_air_date||'').slice(0,4);
  const rating   = item.vote_average ? item.vote_average.toFixed(1).replace(/\.0$/,'') : ''; // [2026-07-20 신규]
  // [2026-07-21 수정] media_type을 모를 때 'tv'로 억지로 채우지 않음 — data-type이 빈 값이면
  // goWork()가 이걸 "확정 안 됨"으로 정확히 넘겨서, 목적지 페이지의 잘못된 확정 방지로 이어짐.
  const mediaType= item.media_type || '';
  const badgeMediaType = mediaType || 'tv'; // 배지 DOM id 등 화면 표시용 키는 기존처럼 'tv' 폴백 유지(단순 id 문자열이라 안전)
  const poster   = item.poster_path
    ? `<img src="${IMG}${item.poster_path}" alt="${title}" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  // [2026-07-11 추가] 랭킹 배지 placeholder — loadRankBadges()가 데이터 도착 후 채움
  const badgeId = `rankBadge-${item.id}-${badgeMediaType}`;
  return `
    <a class="work-card" data-tmdb="${item.id}" data-type="${mediaType}"
       data-title="${title}" data-year="${year}" onclick="goWork(this)">
      <div class="work-poster">
        ${poster}
        <div class="work-ott-badges" id="ottBadge-${item.id}-${badgeMediaType}"></div>
        <span class="work-rank-badge" id="${badgeId}"></span>
      </div>
      <div class="work-title">${title}</div>
      <!-- [2026-07-20 신규] 연도(왼쪽) / 평점(오른쪽) — 포스터 하단 랭킹배지와 겹쳐서 밖으로 뺌 -->
      <div class="work-year-rating-row">
        <span>${year||''}</span>
        ${rating?`<span class="work-rating">★ ${rating}</span>`:''}
      </div>
      <div class="work-role">
        <span class="work-type-dot ${badgeMediaType}"></span>${role}
      </div>
    </a>`;
}

/* ── 작품 렌더 ── */
function renderWorks(){
  const list   = currentList();
  const grid   = document.getElementById('worksGrid');
  const moreBtn= document.getElementById('loadMoreBtn');
  const slice  = list.slice(0, shownCount + getPageSize());
  shownCount   = slice.length;
  grid.innerHTML = slice.map(workCardHtml).join('');
  moreBtn.style.display = shownCount < list.length ? 'block' : 'none';
  loadRankBadges(slice); // [2026-07-11 추가] 화면에 보이는 카드만 배지 조회 (더보기 시 새로 늘어난 만큼만 실제 요청됨 — 캐시 재사용)
  loadOttBadges(slice); // [2026-07-20 신규]
}

/* [2026-07-11 추가] 랭킹 배지 로드 — 화면에 보이는 카드들의 tmdb_id를 모아 한 번에 조회
   /rankings/platforms-batch는 한 번에 최대 50개까지만 받으므로, 이미 캐시된 것은 제외하고
   요청 — "더보기" 클릭 시에도 새로 추가된 24개 정도만 실제로 네트워크 요청이 나감. */
async function loadRankBadges(items){
  const uncachedIds = [...new Set(
    items.filter(it => !(it.id in rankBadgeCache)).map(it => it.id)
  )];

  if(uncachedIds.length){
    try{
      const res  = await fetch(`${OTTRANK_API}/rankings/platforms-batch?tmdb_ids=${uncachedIds.join(',')}`);
      const json = await res.json();
      if(json.ok){
        uncachedIds.forEach(id => { rankBadgeCache[id] = json.data[id] || null; });
      }
    }catch(e){
      // 배지 조회 실패해도 페이지 본 기능(필모그래피 표시)엔 영향 없게 조용히 무시
      uncachedIds.forEach(id => { rankBadgeCache[id] = null; });
    }
  }

  // 캐시 기준으로 이번에 렌더된 카드들에 배지 적용
  items.forEach(item => {
    const badges = rankBadgeCache[item.id];
    if(!badges || !badges.length) return;
    const best = badges.reduce((a,b) => a.rank < b.rank ? a : b); // 여러 플랫폼이면 순위 가장 높은 것 하나만
    const els = document.querySelectorAll(`#rankBadge-${item.id}-${item.media_type||'tv'}`); // [2026-07-20 수정] 같은 작품이 대표작+필모그래피에 중복 id로 나올 때 전부 채우기
    els.forEach(el => {
      const label = PLATFORM_LABELS[best.platform] || best.platform;
      el.textContent = `🔥 ${label} ${best.rank}위`;
      el.style.display = 'inline-flex';
    });
  });
}

/* [2026-07-29 신규] 관리자가 지정한 대표작(최대 5개) 조회 — 공개 API, 인증 불필요.

/* [2026-07-20 신규] OTT 배지 로드 — 화면에 보이는 카드들의 tmdb_id를 모아 한 번에 조회.
   /works/ott-map은 "우리 DB에 있는 작품"만 응답에 포함되므로, DB 미등록 작품은
   자동으로 배지가 안 뜸(실시간 TMDB 조회 없음 — 검색결과 페이지와 다르게 가볍게 처리). */
async function loadOttBadges(items){
  const uncachedIds = [...new Set(
    items.filter(it => !(it.id in ottBadgeCache)).map(it => it.id)
  )];

  if(uncachedIds.length){
    try{
      const res  = await fetch(`${OTTRANK_API}/works/ott-map?tmdb_ids=${uncachedIds.join(',')}`);
      const json = await res.json();
      if(json.ok){
        uncachedIds.forEach(id => { ottBadgeCache[id] = (json.map && json.map[id]) || null; });
      }
    }catch(e){
      // 실패해도 필모그래피 표시엔 영향 없게 조용히 무시
      uncachedIds.forEach(id => { ottBadgeCache[id] = null; });
    }
  }

  items.forEach(item => {
    const keys = ottBadgeCache[item.id];
    if(!keys || !keys.length) return;
    // [2026-07-20 수정] 같은 작품이 대표작+필모그래피에 중복 id로 나올 때 전부 채우기
    const els = document.querySelectorAll(`#ottBadge-${item.id}-${item.media_type||'tv'}`);
    els.forEach(el => { el.innerHTML = keys.map(ottLogoHtml).join(''); });
  });
}

/* [2026-07-20 신규] 필모그래피 정렬 토글 — OTT 우선(기본) ↔ 연도순 */

/* ── 작품 상세 이동 ── */
function goWork(el){
  const tmdbId= parseInt(el.dataset.tmdb);
  // [2026-07-21 수정] data-type이 비어있으면(=media_type을 몰랐던 카드) 'tv'로 억지로 채우지 않고
  // null로 넘김 — 목적지 페이지가 이걸 "확정된 값"으로 착각해서 movie 쪽을 아예 확인 안 하는
  // 버그(스타트렉 199 사례) 방지.
  const type  = el.dataset.type || null;
  const title = el.dataset.title || '';
  if(!tmdbId) return;
  // [2026-07-25 수정] 슬러그 규칙을 "오늘 날짜의 현재 연도"라는 눈속임 값 대신, 카드에
  // 실제로 있는 방영/개봉연도(data-year)를 쓰도록 변경 — 서버가 tmdb_id만으로도 찾아주긴
  // 하지만(release_year는 동일 tmdb_id로 movie/tv가 충돌할 때만 구분용으로 쓰임), 값 자체가
  // 사실과 다르면 나중에 링크 규칙이 헷갈리는 원인이 되므로 정확한 값을 우선 사용.
  // data-year가 없는 극히 일부 카드(랭킹위젯 등 연도 정보를 안 주는 소스)만 현재연도로 폴백.
  const y    = el.dataset.year || new Date().getFullYear();
  const slug = `1-${y}${tmdbId}`;
  // platform을 지정하지 않음 → _title_detail.html의 loadPlatforms()가
  // 실제 OTT 순위 API를 조회해서 올바른 플랫폼을 표시
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type, title, platform: ''
  }));
  location.href = `/title/${slug}`;
}

/* ── 날짜 포맷 ── */
function fmtBirth(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  // [2026-07-20 신규] 정확한 월/일을 모를 때는 "00-00"으로 저장하기로 함(관리자 요청) —
  // 이 경우 특정 날짜(예: 1월 1일)로 오해되지 않게 "YYYY년생"으로만 표시
  if(m === '00' || d === '00') return `${y}년생`;
  return `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
}

/* ── 나이 계산 ── */
function calcAge(birthday, deathday){
  if(!birthday) return '';
  const [by, bm, bd] = birthday.split('-');
  const end = deathday ? new Date(deathday) : new Date();
  // [2026-07-20 신규] 월/일 모르면(00-00) 정확한 생일 기준 계산이 불가능하니
  // 연도 차이로만 대략 계산(최대 ±1살 오차 있을 수 있음)
  if(bm === '00' || bd === '00'){
    const age = end.getFullYear() - parseInt(by, 10);
    return deathday ? `향년 ${age}세` : `${age}세`;
  }
  const birth = new Date(birthday);
  let age = end.getFullYear() - birth.getFullYear();
  const m = end.getMonth() - birth.getMonth();
  if(m < 0 || (m===0 && end.getDate() < birth.getDate())) age--;
  return deathday ? `향년 ${age}세` : `${age}세`;
}

/* [2026-07-20 신규] TMDB 원본 메타값 보관 — 위키 로딩 시점에 persons 테이블
   수동입력값(manual)으로 빈 항목만 보완하기 위해 필요 (아래 loadWikiTest 참고) */
let tmdbMeta = { birthday: '', deathday: '', gender: null, place_of_birth: '', mbti: '' };

/* [2026-07-22 rev.11 수정] 추모 국화 — 아래 둘 중 하나라도 참이면 노출:
   ① data.deathday(TMDB 사망일자)가 실제 날짜 형식으로 존재
   ② 관리자가 어드민 "인물 개별 검색"에서 수동으로 'flower' 배지를 지정(persons.poster_badge)
      — TMDB에 사망일 정보가 아직 없는 경우를 관리자가 직접 보완하기 위한 용도.
   두 조건 다 "값이 있는 것처럼 보이는 모든 경우"를 배제하고 정확한 값일 때만 통과시킴.
   엉뚱한 인물에게 잘못 표시되면 안 되는 민감한 기능이라 이중 체크는 계속 엄격하게 유지. */
function renderMemorialFlower(deathday, manualBadge){
  const el = document.getElementById('personMemorialFlower');
  if(!el) return;
  const raw = (deathday == null) ? '' : String(deathday).trim();
  // TMDB deathday는 'YYYY-MM-DD' 형식 — 이 패턴에 맞는 진짜 날짜값일 때만 인정
  const hasDeathday = /^\d{4}-\d{2}-\d{2}$/.test(raw);
  // 화이트리스트 방식 — 백엔드 ALLOWED_POSTER_BADGES와 동일하게 'flower'만 인정
  const hasManualFlower = manualBadge === 'flower';
  el.style.display = (hasDeathday || hasManualFlower) ? 'block' : 'none';
}

/* [2026-07-20 신규] 영어 약력이 먼저 번쩍이고 한글로 바뀌는 깜빡임 방지용 플래그.
   loadWikiTest가 bio_summary로 이미 화면을 채웠으면 true — 이후 TMDB 약력 폴백을
   또 덮어쓰지 않게 막는 용도 (아래 initPage 참고) */

/* [2026-07-20 신규] 메타 칩(생년월일/나이/사망일/성별/출생지) 렌더링 —
   TMDB 값과 persons 테이블 수동입력값(manual)을 합쳐서 넘겨받음.
   TMDB에 없는 항목만 manual 값으로 채워지는 방식(TMDB 값이 항상 우선). */
function renderMetaChips(meta){
  const chips = [];
  if(meta.birthday){
    chips.push(`<span class="person-meta-chip">
      <span class="chip-label">생년월일</span>${fmtBirth(meta.birthday)}
    </span>`);
    const age = calcAge(meta.birthday, meta.deathday);
    if(age) chips.push(`<span class="person-meta-chip">${age}</span>`);
  }
  if(meta.deathday){
    chips.push(`<span class="person-meta-chip">
      <span class="chip-label">사망일</span>${fmtBirth(meta.deathday)}
    </span>`);
  }
  const genderText = genderLabel(meta.gender);
  if(genderText) chips.push(`<span class="person-meta-chip">${genderText}</span>`);
  if(meta.place_of_birth){
    chips.push(`<span class="person-meta-chip">
      <span class="chip-label">출생지</span>${meta.place_of_birth}
    </span>`);
  }
  // [2026-07-27 신규] MBTI — persons.mbti_naver, 없거나 "공개안함" 확정인 경우는
  // person-wiki.js가 애초에 manual.mbti를 null로 내려주므로 여기선 값 존재 여부만 체크.
  if(meta.mbti){
    chips.push(`<span class="person-meta-chip mbti-chip">
      <span class="chip-label">MBTI</span>${meta.mbti}
    </span>`);
  }
  document.getElementById('personMetaRow').innerHTML = chips.join('');
}

/* ── 성별 ── */
function genderLabel(g){
  if(g===1) return '여성';
  if(g===2) return '남성';
  return '';
}

/* ── SEO 업데이트 ── */
function updateSEO(name, desc, imgUrl, jobLabel, instaId, enName){
  // title: "임윤아 출연작·필모그래피 | 배우 프로필 | 오뜨랑"
  // [2026-07-20 신규] 두번째 이름(영문명/본명 등)이 있으면 "이름(두번째이름)" 형태로 병기
  const job = jobLabel || '배우';
  // [2026-07-31 신규] [id].js SSR과 동일 기준 — 감독은 "연출작", 배우는 "출연작"
  const workLabel = job === '감독' ? '연출' : '출연';
  const nameLabel = enName ? `${name}(${enName})` : name;
  const t = `${nameLabel} 필모그래피·${workLabel}작 | ${job} 프로필·나이 | 오뜨랑`;

  // keywords: 이름 변형 + 인스타 키워드 포함 (두번째 이름 있으면 그 변형도 함께)
  const kw = [
    name,
    enName || '',
    `${name} ${workLabel}작`,
    `${name} 드라마`,
    `${name} 영화`,
    `${name} 필모그래피`,
    `${name} 프로필`,
    `${name} 나이`,
    `${name} 인스타그램`,
    `${name} SNS`,
    enName ? `${enName} 필모그래피` : '',
    enName ? `${enName} 프로필` : '',
    instaId ? `${name} 인스타 @${instaId}` : '',
    `${job} 프로필`,
    'OTT 배우',
    '드라마 배우 출연작',
  ].filter(Boolean).join(', ');

  document.title = t;
  const _seoTitleEl = document.getElementById('seoTitle');
  if (_seoTitleEl) _seoTitleEl.textContent = t;
  document.getElementById('seoDesc')?.setAttribute('content', desc);
  document.getElementById('seoKw')?.setAttribute('content', kw);
  document.getElementById('seoOgTitle')?.setAttribute('content', t);
  document.getElementById('seoOgDesc')?.setAttribute('content', desc);
  document.getElementById('seoTwTitle')?.setAttribute('content', t);
  document.getElementById('seoTwDesc')?.setAttribute('content', desc);
  if(imgUrl){
    document.getElementById('seoOgImg')?.setAttribute('content', imgUrl);
  }
}

/* ── 메인 초기화 ── */
/* [2026-07-11 추가] 사진 갤러리 로드 — TMDB /person/{id}/images 추가 호출 1개
   메인 initPage 흐름과 분리된 fire-and-forget 호출이라, 이게 느리거나 실패해도
   나머지 페이지 렌더링(이름/필모그래피 등)엔 전혀 영향 없음. */
async function loadPhotoGallery(personId, imgBase){
  try{
    const res  = await fetch(`${TMDB_PROXY}/person/${personId}/images`);
    const data = await res.json();
    const profiles = (data.profiles || []).slice(0, 10);
    // [2026-07-11 수정] 사진 1장뿐이면 이미 메인 프로필 사진으로 보이는 것과
    // 중복이라 갤러리 자체를 안 보여줌
    if(profiles.length <= 1) return;

    // [2026-07-27 신규] 라이트박스용 전체 이미지 목록 — 메인사진이 갤러리 목록에 이미
    // 포함돼 있으면 그대로, 없으면(메인사진과 갤러리가 다른 소스일 수 있어서) 0번에 추가
    personGalleryImages = personMainPhotoPath && !profiles.some(p => p.file_path === personMainPhotoPath)
      ? [{ file_path: personMainPhotoPath }, ...profiles]
      : profiles;

    const row = document.getElementById('photoGalleryRow');
    row.classList.toggle('few-items', profiles.length <= 2); // [2026-07-11 추가]
    row.innerHTML = profiles.map((p, i) => {
      // 라이트박스 배열에서의 실제 인덱스를 찾음(메인사진이 0번으로 추가됐을 수 있어서 그냥 i가 아님)
      const galleryIdx = personGalleryImages.findIndex(g => g.file_path === p.file_path);
      return `
      <div class="photo-gallery-thumb" onclick="openPersonLightbox(${galleryIdx})">
        <img src="${imgBase}${p.file_path}" alt="사진" loading="lazy">
      </div>
    `;
    }).join('');
    document.getElementById('photoGallerySection').style.display = 'block';
    updateScrollArrows('photoGalleryRow'); // [2026-07-11 추가] 콘텐츠 채워진 뒤 화살표 표시여부 갱신

    // [2026-07-28 신규] 라이트박스용 큰 사이즈(w780) 사진들을 미리 백그라운드로
    // 다운로드해둠 — 사용자가 실제로 클릭/스와이프해서 넘길 때 버벅이지 않게 하기 위함.
    // 페이지의 다른 콘텐츠(필모그래피 등) 로딩을 방해하면 안 되므로, "페이지 전체가
    // 다 로딩된 뒤"에 시작하도록 window의 load 이벤트를 기다림. 이미 load가 끝난
    // 상태(느린 갤러리 API 응답 등)라면 바로 실행.
    if(document.readyState === 'complete'){
      preloadGalleryLargeImages();
    } else {
      window.addEventListener('load', preloadGalleryLargeImages, { once:true });
    }
  }catch(e){
    // 갤러리는 부가 기능 — 실패해도 조용히 무시 (메인 페이지 기능에 영향 없음)
  }
}

// [2026-07-28 신규] personGalleryImages에 담긴 사진들을 화면에 그리지 않고
// new Image()로 다운로드만 시켜서 브라우저 캐시에 미리 채워둠(브라우저가 자동으로
// 처리 — 별도로 저장/관리 안 해도 나중에 같은 주소로 <img>가 요청되면 캐시에서 즉시 나옴).
function preloadGalleryLargeImages(){
  if(!personGalleryImages || !personGalleryImages.length) return;
  personGalleryImages.forEach(p => {
    if(!p || !p.file_path) return;
    const img = new Image();
    img.src = personPhotoSrc(p.file_path);
  });
}

/* [2026-07-27 신규] 메인사진/갤러리 라이트박스 — _title_detail.html 관련이미지 팝업과 동일한 구조.
   메인사진 클릭 시엔 아직 갤러리를 못 불러왔을 수도 있어서(비동기), 그때는 메인사진 하나만
   보여주는 임시 배열로 열고, 화살표는 이미지가 1장뿐이면 자동으로 숨김. */
let personGalleryImages = [];
let personMainPhotoPath = '';
let personLightboxIndex = 0;

function handlePersonPhotoClick(){
  if(!personGalleryImages.length && personMainPhotoPath){
    personGalleryImages = [{ file_path: personMainPhotoPath }];
  }
  openPersonLightbox(0);
}

function openPersonLightbox(index){
  if(!personGalleryImages.length) return;
  personLightboxIndex = index;
  showPersonLightboxImage(personGalleryImages[index].file_path); // 처음 열 때는 슬라이딩 없이 바로 표시
  document.getElementById('personImgLightbox').classList.add('show');
  document.body.style.overflow = 'hidden'; // 팝업 열린 동안 뒤 배경 스크롤 방지
  updatePersonLightboxArrows();
}
function closePersonLightbox(){
  document.getElementById('personImgLightbox').classList.remove('show');
  document.body.style.overflow = '';
}
// 트랙을 사진 1장짜리로 되돌림(전환 없이 즉시) — 열 때, 슬라이딩 끝난 뒤 정리할 때 사용
function showPersonLightboxImage(filePath){
  const track = document.getElementById('personSlideTrack');
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = `<img class="lightbox-slide-img" src="${personPhotoSrc(filePath)}" alt="사진">`;
}
function updatePersonLightboxArrows(){
  const showArrows = personGalleryImages.length > 1;
  document.getElementById('personLightboxPrev').style.display = showArrows ? '' : 'none';
  document.getElementById('personLightboxNext').style.display = showArrows ? '' : 'none';
}
// [2026-07-27 신규] 진짜 슬라이딩 전환 — 현재 사진+다음(또는 이전) 사진을 트랙에 나란히
// 놓고 한 번에 밀어서, 사진이 옆으로 밀려나가며 다음 사진이 들어오는 느낌을 냄.
let personSlideAnimating = false; // 애니메이션 도중 중복 클릭/스와이프 방지
function personLightboxNav(e, dir){
  e.stopPropagation(); // 화살표 클릭은 팝업이 안 닫히고 이미지만 넘어가야 함
  if(personSlideAnimating) return;
  const total = personGalleryImages.length;
  if(total <= 1) return;
  personSlideAnimating = true;

  const nextIndex = (personLightboxIndex + dir + total) % total;
  const currentPath = personGalleryImages[personLightboxIndex].file_path;
  const nextPath = personGalleryImages[nextIndex].file_path;
  const track = document.getElementById('personSlideTrack');

  // dir=1(다음): 현재 사진 뒤에 다음 사진을 붙이고, 트랙을 왼쪽으로 밀어서 다음 사진이 들어오게 함
  // dir=-1(이전): 이전 사진을 현재 사진 앞에 붙이고, 트랙을 처음엔 왼쪽으로 밀어둔 뒤 오른쪽(0)으로 되돌리며 보여줌
  track.style.transition = 'none';
  if(dir === 1){
    track.innerHTML =
      `<img class="lightbox-slide-img" src="${personPhotoSrc(currentPath)}" alt="사진">` +
      `<img class="lightbox-slide-img" src="${personPhotoSrc(nextPath)}" alt="사진">`;
    track.style.transform = 'translateX(0)';
  } else {
    track.innerHTML =
      `<img class="lightbox-slide-img" src="${personPhotoSrc(nextPath)}" alt="사진">` +
      `<img class="lightbox-slide-img" src="${personPhotoSrc(currentPath)}" alt="사진">`;
    track.style.transform = 'translateX(-100%)';
  }

  void track.offsetWidth; // 강제 리플로우 — 위에서 transition:none으로 순간이동한 걸 화면에 먼저 반영시킴
  track.style.transition = 'transform .3s ease';
  track.style.transform = dir === 1 ? 'translateX(-100%)' : 'translateX(0)';

  setTimeout(() => {
    personLightboxIndex = nextIndex;
    showPersonLightboxImage(nextPath); // 트랙을 다시 사진 1장짜리로 정리(전환 없이)
    personSlideAnimating = false;
  }, 300); // transition 시간(.3s)과 맞춤
}

// 모바일 스와이프(좌우 50px 이상)로 넘기기 — 탭은 닫기, 스와이프는 넘기기로 구분
let personLightboxSwiping = false, personLightboxTouchX = 0;
const personLightboxEl = document.getElementById('personImgLightbox');
if(personLightboxEl){
  personLightboxEl.addEventListener('touchstart', (e) => {
    personLightboxTouchX = e.touches[0].clientX;
  }, { passive: true });
  personLightboxEl.addEventListener('touchend', (e) => {
    const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : personLightboxTouchX;
    const deltaX = endX - personLightboxTouchX;
    if(Math.abs(deltaX) > 50){
      personLightboxSwiping = true;
      personLightboxNav(e, deltaX < 0 ? 1 : -1); // 왼쪽으로 밀면 다음, 오른쪽으로 밀면 이전
      setTimeout(() => { personLightboxSwiping = false; }, 300);
    }
  });
}
function handlePersonLightboxBgClick(){
  if(personLightboxSwiping){ personLightboxSwiping = false; return; }
  closePersonLightbox();
}

/* [2026-07-31 신규] 인물 관련 영상 — 랭킹위젯과 같은 자리를 공유. 등록된 영상이
   있으면 이 섹션을 노출하고 랭킹위젯은 호출하지 않음(자리 하나에 하나만).
   조회 실패/영상 없음이면 기존처럼 랭킹위젯으로 폴백. */
async function loadPersonVideosOrRanking(personId, displayName){
  try{
    const res  = await fetch(`${OTTRANK_API}/videos/person/${personId}`);
    const json = await res.json();
    const items = (json.ok && Array.isArray(json.data)) ? json.data : [];
    if(!items.length){
      loadRankingWidget();
      return;
    }
    document.getElementById('personVideoTitle').textContent = `🎥 ${displayName} 관련 영상`;
    renderPersonVideoArea(items);
    document.getElementById('personVideoSection').style.display = 'block';
  }catch(e){
    loadRankingWidget(); // 조회 실패해도 랭킹위젯은 정상 노출되도록 폴백
  }
}

function renderPersonVideoArea(items){

  if(items.length === 1){
    const v = items[0];
    area.innerHTML = `
      <div class="yt-player-wrap" style="border:.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden">
        <iframe src="https://www.youtube.com/embed/${v.youtube_id}" allowfullscreen allow="autoplay;encrypted-media" title="${escHtml(v.title||'')}"></iframe>
      </div>`;

  area.innerHTML = `<div class="yt-grid">${items.map(v => `
    <div class="yt-card" onclick="openPersonVideoPlayer('${v.youtube_id}','${(v.title||'').replace(/'/g,"\\'")}')">
      <div class="yt-thumb">
        <img src="https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg" alt="${escHtml(v.title||'')}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="yt-thumb-ph" style="display:none">▶</div>
        <div class="yt-play"><div class="yt-play-icon">▶</div></div>
      </div>
      <div class="yt-info"><div class="yt-title">${escHtml(v.title||'')}</div></div>
    </div>`).join('')}</div>`;
}

/* [2026-07-11 추가] 오늘의 랭킹 위젯 — 어드민이 "인물페이지 설정"에서 켜놓은 카테고리
   1개를 노출. 이 배우/인물과 무관하게 방문객 전원에게 보이는 유입 장치라, 사진갤러리와
   동일하게 initPage 메인 흐름과 분리된 fire-and-forget 호출로 둠 — 느리거나 실패해도
   필모그래피 등 본 기능엔 전혀 영향 없음. 관리자가 아무것도 안 켜놨으면(data===null)
   섹션 자체를 계속 숨김 상태로 둠(HTML 기본값 display:none 그대로 유지). */
async function loadRankingWidget(){
  try{
    const res  = await fetch(`${OTTRANK_API}/rankings/person-widget`);
    const json = await res.json();
    if(!json.ok || !json.data || !json.data.items || !json.data.items.length) return;

    const { platform, display_name, items } = json.data;
    const pageUrl = PLATFORM_PAGES[platform] || '/netflix.html';
    const color   = PLATFORM_COLORS[platform] || '#888';
    const label   = PLATFORM_LABELS[platform] || platform;

    document.getElementById('rankingWidgetLink').href = pageUrl;

    const tag = document.getElementById('rankingWidgetTag');
    tag.textContent      = label;
    tag.style.color      = color;
    tag.style.background = color + '2e'; // 약 18% 알파 배경
    tag.style.border     = `1px solid ${color}59`; // 약 35% 알파 보더

    document.getElementById('rankingWidgetTitle').textContent = `🔥 ${display_name}`;
    document.getElementById('rankingWidgetCount').textContent = `TOP ${items.length}`;

    const row = document.getElementById('rankingWidgetRow');
    row.classList.toggle('few-items', items.length <= 2);
    row.innerHTML = items.map(rankingWidgetCardHtml).join('');

    document.getElementById('rankingWidgetSection').style.display = 'block';
    updateScrollArrows('rankingWidgetRow');
  }catch(e){
    // 위젯은 부가 기능 — 실패해도 조용히 무시 (메인 페이지 기능에 영향 없음)
  }
}

/* [2026-07-11 추가] 오늘의 랭킹 위젯 카드 — 대표작(workCardHtml)과 같은
   .work-card/.work-poster 클래스를 재사용해 크기를 동일하게 맞춤.
   클릭 시 이동은 기존 goWork()를 그대로 재사용(작품 상세페이지, media_type 포함) */
function rankingWidgetCardHtml(item){
  const title     = escHtml(item.title_ko || item.title_en || '');
  // [2026-07-21 수정] media_type 미확정 케이스를 'tv'로 억지로 채우지 않음 —
  // goWork()가 data-type을 그대로 읽어서 목적지 페이지에 넘기므로, 빈 값이면 정확히 "확정 안 됨"으로 전달됨.
  const mediaType = item.media_type || '';
  const poster    = item.poster_path
    ? `<img src="${IMG}${item.poster_path}" alt="${title}" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  return `
    <a class="work-card" data-tmdb="${item.tmdb_id}" data-type="${mediaType}"
       data-title="${title}" data-year="${item.release_year || ''}" onclick="goWork(this)">
      <div class="work-poster">
        ${poster}
        <span class="ranking-widget-rank">${item.rank}</span>
      </div>
      <div class="work-title">${title}</div>
    </a>`;
}

/* [2026-07-11 재수정] 공유 버튼 클릭 시 현재 페이지 URL을 클립보드에 복사.
   my_review.html의 shareCurrentPage()/showToast() 패턴 그대로 재사용 —
   버튼 자체가 바뀌는(아이콘 스왑) 방식 대신, 화면 중앙 상단에 토스트 메시지로 안내.
   navigator.clipboard는 HTTPS 환경(오뜨랑은 항상 HTTPS)에서만 동작하므로,
   혹시 지원 안 되는 구형 브라우저 대비 textarea+execCommand 폴백도 같이 둠. */
async function shareProfile(){
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    fallbackCopy(url);
  }
  showToast('이 페이지 주소가 복사되었습니다.');
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){ /* 복사 실패해도 조용히 무시 */ }
  document.body.removeChild(ta);
}

/* [2026-07-11 추가] my_review.html과 동일한 토스트 알림 함수 */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function initPage(){

      `<p>잘못된 접근입니다.</p>`;
    return;
  }
  wikiBioApplied = false; // [2026-07-20 신규] 혹시 모를 재호출 대비 초기화

  try{
    /* ① TMDB Person + external_ids + combined_credits 한 번에 호출
       [2026-07-29 수정] 관리자 지정 대표이미지 조회를 병렬로 같이 실행(추가 대기시간 없음) */
    const [res, customProfilePath] = await Promise.all([
      fetch(`${TMDB_PROXY}/person/${personId}?language=ko-KR&append_to_response=external_ids,combined_credits`),
      loadCustomProfileImage(personId),

    // [2026-07-21 신규] 실시간 조회 이벤트 — 진짜 유효한 인물 페이지로 확인된 시점에만 전송
    trackPageView('person', data.id);

    /* ── 로딩 숨김 / 콘텐츠 표시 ── */

    document.getElementById('personHero').style.display = 'flex';

    /* ② 이름 */
    // also_known_as에서 한국어 이름 찾기
    const alsoKnown = data.also_known_as || [];
    const koName = alsoKnown.find(n => /[가-힣]/.test(n)) || '';
    const displayName = koName || data.name || '';
    // [2026-07-11 추가] koName이 data.name과 완전히 같으면(=TMDB에 애초에 영문 이름
    // 없이 한글로만 등록된 인물) 작은 줄에 같은 이름이 중복 표시되던 문제 수정
    const enName      = (koName && koName !== data.name) ? data.name : '';

    // [2026-07-27 수정] 서버(SSR)가 이미 personName 칸에 정확한 이름(DB 우선)을 채워둔
    // 상태라면(ssrPersonName 있음) 여기서 TMDB 이름으로 다시 덮어쓰지 않음 — 이게 바로
    // "TMDB 이름이 잠깐 떴다가 DB 이름으로 바뀌는" 깜빡임의 원인이었음. 서버가 못 채운
    // 경우(구버전 캐시, DB 조회 실패 등)에만 기존처럼 TMDB 이름으로 채움(안전한 폴백).
    if(!ssrPersonName){
      document.getElementById('personName').textContent = displayName; // 임시(아래 renderPersonNameEl이 최종 다시 그림)
      personDisplayName = displayName; // [2026-07-20 신규]
    }
    document.getElementById('personNameEn').textContent = enName;
    personEnName = enName; // [2026-07-28 신규] 위키 DB 이름과 비교용 원본 텍스트 보관
    personEnNameHtml = enName
      ? `<span class="person-name-en-inline">(${escHtml(enName)})</span>` : ''; // [2026-07-27 이동]
    // [2026-07-24 신규] 수상내역 제목에 이름 넣기 — 위키 데이터(loadWikiTest)가 이 코드보다
    // 먼저 실행돼서 그때는 personDisplayName이 비어있었을 경우를 대비한 보정.
    const awardsTitleElNow = document.getElementById('profileAwardsTitle');
    if(awardsTitleElNow && awardsTitleElNow.textContent === '🏆 수상내역') {
      awardsTitleElNow.textContent = `🏆 ${personDisplayName || displayName} 수상내역`;
    }

    /* ③ 프로필 사진 — [2026-07-29 수정] 관리자가 지정한 대표이미지가 있으면 그걸 우선 사용,
       없으면 기존처럼 TMDB 사진 사용 */
    if(customProfilePath){
      document.getElementById('personPhoto').innerHTML =
        `<img src="${customProfilePath}" alt="${displayName}" loading="eager">`;
      // [2026-07-29 수정] personPhotoSrc()가 전체 URL/TMDB 상대경로를 둘 다 처리하도록
      // 고쳐서, 커스텀 이미지도 클릭하면 정상적으로 크게보기(라이트박스)가 열림.
      personMainPhotoPath = customProfilePath;
    } else if(data.profile_path){
      document.getElementById('personPhoto').innerHTML =
        `<img src="${IMG_PROFILE}${data.profile_path}" alt="${displayName}" loading="eager">`;
      personMainPhotoPath = data.profile_path; // [2026-07-27 신규] 라이트박스용 — 메인사진을 갤러리 0번으로 사용
    } else {
      document.getElementById('personPhotoPh').textContent = (displayName||'?')[0];
    }

    /* ④ 메타 칩 (생년월일, 나이, 성별, 출생지)
       [2026-07-20 수정] TMDB에 값이 없는 항목(예: 최정규 감독처럼 TMDB에
       생년월일 자체가 없는 인물)을 나중에 위키 로딩 시점에 persons 테이블
       수동입력값(manual)으로 보완할 수 있게, 원본 TMDB 값을 따로 저장해두고
       칩 렌더링 자체는 재사용 함수(renderMetaChips)로 분리함 */
    tmdbMeta = {
      birthday: data.birthday || '',
      deathday: data.deathday || '',
      gender: data.gender || null,
      place_of_birth: data.place_of_birth || '',
      mbti: '', // [2026-07-27 신규] TMDB엔 없는 값 — 항상 빈 값으로 시작(위키 데이터 도착 시 loadWikiTest가 채움)
    };
    renderMetaChips(tmdbMeta);
    renderMemorialFlower(tmdbMeta.deathday, null); // [2026-07-22 rev.11] 최초엔 TMDB 사망일만 확인, manual 배지는 loadWikiTest에서 도착 시 재평가

    /* [2026-07-11 추가] 사진 갤러리 — 메인 흐름을 안 막게 await 없이 별도 호출 */
    loadPhotoGallery(personId, IMG_PROFILE);

    /* [2026-07-31 수정] 오늘의 랭킹 위젯 자리에 인물 관련 영상이 등록돼 있으면 그걸
       우선 노출하고, 없을 때만 랭킹 위젯을 노출함. 이 인물과 무관한 전역 데이터/부가
       기능이라 personId 로딩 성공 여부와 상관없이 독립적으로 호출, await 없이 별도 호출 */
    loadPersonVideosOrRanking(personId, displayName);

    /* ⑤ 약력 준비 — ko-KR 없으면 영어 fallback. [2026-07-20 수정] 여기서 바로
       화면에 그리지 않음 — 영어 약력이 먼저 번쩍 보였다가 위키 한글 요약으로
       바뀌는 깜빡임이 있었음. TMDB 약력은 변수로만 준비해두고(tmdbBioText),
       실제 화면 표시는 아래에서 위키 로딩까지 기다린 뒤 딱 한 번만 결정함. */
    let bio = data.biography || '';
    if(!bio){
      try{
        // language 파라미터 없이 재호출 → 영어 약력
        const enRes  = await fetch(`${TMDB_PROXY}/person/${personId}?language=en-US`);
        const enData = await enRes.json();
        bio = enData.biography || '';
      }catch(e){}
    }
    tmdbBioText = bio; // loadWikiTest 안에서 "위키 요약이 짧으면 이어붙이기"용으로 참조

    /* [2026-07-20 수정] 위키백과 보강 데이터 로딩 + 약력 최종 결정은 별도로 병렬
       처리(await 안 함) — SNS/SEO/필모그래피 등 아래 이어지는 렌더링이 위키 로딩
       때문에 늦어지지 않게 함. 늦어지는 건 약력 텍스트 하나뿐이고, 나머지는
       기존과 동일한 속도로 진행됨. 내부에서 bio_summary가 있으면 loadWikiTest가
       bioEl을 직접 채우고 wikiBioApplied=true로 표시함. */
    (async () => {
      await loadWikiTest(personId);
      if(!wikiBioApplied){
        // 위키가 약력을 못 채웠을 때만 TMDB 약력(또는 안내문구)으로 폴백
        const bioEl = document.getElementById('bioText');
        if(bio){
          bioEl.textContent = bio;
          requestAnimationFrame(()=>{
            const lineH = parseFloat(getComputedStyle(bioEl).lineHeight) || 24;
            if(bioEl.scrollHeight > lineH * 4 + 4){
              document.getElementById('bioToggle').style.display = 'inline';
            }
          });
        } else {
          // [2026-07-27 수정] "약력 정보가 없습니다." 문구를 없애고, 그 자리 공간까지 통째로
          // 숨김 처리 — 문구가 있으면 마치 페이지 전체에 정보가 없는 것처럼 보인다는 피드백.
          // 프로필 수정하기 버튼은 그대로 둬서(아래에서 계속 보임) 관리자가 직접 입력할 수 있게 함.
          bioEl.textContent = '';
          bioEl.style.display = 'none';
        }
      }
    })();

    /* ⑥ SNS 아이콘 + 공유버튼 — 이름 옆 한 줄에 나란히 표시
       [2026-07-11 재수정] 공유버튼을 이름 아래 별도 줄에 뒀더니 위치가 어색하다는
       피드백 → SNS 아이콘과 같은 줄(person-social-row)에 포함시킴. SNS 계정이
       하나도 없어도 공유버튼은 항상 나와야 하므로, socialLinks가 비어있어도
       이 블록 자체는 항상 실행되도록 조건을 없앰. */
    const ext = data.external_ids || {};
    const socialLinks = [];
    if(ext.instagram_id) socialLinks.push({ url:`https://www.instagram.com/${ext.instagram_id}/`, label:`Instagram @${ext.instagram_id}`, icon:'/img/instagram.png' });
    if(ext.twitter_id)   socialLinks.push({ url:`https://x.com/${ext.twitter_id}/`, label:`X(Twitter) @${ext.twitter_id}`, icon:'/img/twitter.png' });
    if(ext.tiktok_id)    socialLinks.push({ url:`https://www.tiktok.com/@${ext.tiktok_id}`, label:`TikTok @${ext.tiktok_id}`, icon:'/img/tiktok.png' });

    const nameEl = document.getElementById('personName');
    const iconsHtml = socialLinks.map(s => `<a class="person-social-icon"
        href="${s.url}" target="_blank" rel="noopener" title="${s.label}"
        onclick="event.stopPropagation()">
        <img src="${s.icon}" alt="${s.label}" onerror="this.style.display='none'">
      </a>`).join('');
    const shareTagHtml = `<button class="share-tag" id="shareBtn"
        onclick="event.stopPropagation();shareProfile()">🔗 공유</button>`;
    // [2026-07-27 수정] nameEl.innerHTML을 여기서 직접 조립하지 않고 공용 렌더 함수로 위임.
    // loadWikiTest(관리자 수동 이름)가 await 없이 백그라운드로 돌기 때문에, 이 블록보다
    // 먼저 끝날 수도 나중에 끝날 수도 있음 — 순서 상관없이 항상 최종 상태가 맞도록 함.
    personSocialRowHtml = `<span class="person-social-row">${iconsHtml}${shareTagHtml}</span>`;
    renderPersonNameEl();

    /* ⑦ SEO */
    const profileImgUrl = customProfilePath
      ? customProfilePath
      : (data.profile_path ? `https://poster.ottrank.kr/tmdb-img/w342${data.profile_path}` : '');
    const jobLabel = data.known_for_department === 'Directing' ? '감독' : '배우';
    // [2026-07-20 신규] 두번째 이름(영문명/본명 등)이 있으면 설명에도 "이름(두번째이름)"로 병기
    const seoNameLabel = enName ? `${displayName}(${enName})` : displayName;
    const seoDesc = bio
      ? `${seoNameLabel} - ${bio.slice(0, 110).replace(/\n/g,' ')}...`
