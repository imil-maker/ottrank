<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>닉네임 설정 — 오뜨랑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24;
      --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
      --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
      --accent:#e63946; --sans:'Noto Sans KR',sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:var(--sans); min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px;
    }

    /* ── 카드 ── */
    .card {
      background:var(--bg2); border:1px solid var(--border2);
      border-radius:16px; padding:40px 36px; width:100%; max-width:420px;
    }

    /* ── 로고 ── */
    .logo { text-align:center; margin-bottom:28px; }
    .logo-img {
      height:64px; width:auto; max-width:280px;
      object-fit:contain; border-radius:8px;
    }
    .logo-text {
      font-family:'Bebas Neue',sans-serif; font-size:28px;
      letter-spacing:2px; color:var(--text); line-height:1;
    }
    .logo-text span { color:var(--accent); }

    /* ── 타이틀/설명 ── */
    h1 {
      font-size:20px; font-weight:700; text-align:center;
      margin-bottom:8px; color:var(--text);
    }
    .desc {
      font-size:14px; color:var(--muted2); text-align:center;
      margin-bottom:32px; line-height:1.6;
    }

    /* ── 라벨 ── */
    label {
      display:block; font-size:13px; color:var(--muted2);
      margin-bottom:8px; font-weight:500;
    }

    /* ── 닉네임 입력 + 랜덤 버튼 ── */
    .nickname-row {
      display:flex; gap:8px; align-items:center;
    }
    input[type=text] {
      flex:1; height:48px; background:var(--bg3);
      border:1px solid var(--border2); border-radius:10px;
      padding:0 16px; color:var(--text); font-family:var(--sans);
      font-size:16px; outline:none; transition:border-color .2s;
    }
    input[type=text]:focus { border-color:var(--accent); }
    input[type=text]::placeholder { color:var(--muted); }

    /* 🎲 랜덤 버튼 */
    .btn-random {
      flex-shrink:0; width:48px; height:48px;
      background:var(--bg3); border:1px solid var(--border2);
      border-radius:10px; cursor:pointer; font-size:20px;
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s, background .2s; color:var(--text);
    }
    .btn-random:hover { border-color:var(--accent); background:var(--bg); }
    .btn-random.loading { opacity:0.5; cursor:not-allowed; }

    .hint { font-size:12px; color:var(--muted); margin-top:8px; }
    .error { font-size:13px; color:var(--accent); margin-top:8px; display:none; }

    /* ── MBTI 섹션 ── */
    .mbti-section { margin-top:28px; }
    .mbti-label-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .mbti-label-row label { margin-bottom:0; }
    .mbti-optional {
      font-size:11px; color:var(--muted);
      background:var(--bg3); border:1px solid var(--border);
      padding:2px 8px; border-radius:20px;
    }

    /* MBTI 그리드 — 4열 */
    .mbti-grid {
      display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
    }
    .mbti-btn {
      height:40px; background:var(--bg3);
      border:1px solid var(--border2); border-radius:8px;
      color:var(--muted2); font-family:'DM Mono', monospace;
      font-size:13px; font-weight:500; cursor:pointer;
      transition:all .15s; letter-spacing:0.5px;
    }
    .mbti-btn:hover {
      border-color:var(--accent); color:var(--text);
      background:rgba(230,57,70,0.08);
    }
    .mbti-btn.selected {
      border-color:var(--accent); color:var(--accent);
      background:rgba(230,57,70,0.15); font-weight:700;
    }

    /* ── 제출 버튼 ── */
    .btn-submit {
      width:100%; height:48px; background:var(--accent);
      border:none; border-radius:10px; color:#fff;
      font-family:var(--sans); font-size:16px; font-weight:700;
      cursor:pointer; margin-top:28px; transition:background .15s;
    }
    .btn-submit:hover { background:#ff4d58; }
    .btn-submit:disabled { background:#555; cursor:not-allowed; }

    /* ── 모바일 대응 ── */
    @media (max-width: 480px) {
      .card { padding:32px 20px; }
      .mbti-grid { gap:6px; }
      .mbti-btn { height:36px; font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 로고 -->
    <div class="logo">
      <img class="logo-img" src="/login-logo.jpg" alt="오뜨랑 OTTRANK"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="logo-text" style="display:none">오뜨랑<span>.</span></div>
    </div>

    <h1>OTT 오늘 뭐 볼까?</h1>
    <p class="desc">닉네임을 설정하고 시작하세요.<br>나중에 마이페이지에서 변경할 수 있어요.</p>

    <!-- 닉네임 입력 -->
    <label for="nickname">닉네임 &nbsp;·&nbsp; 🎲 버튼으로 랜덤 닉네임 추천</label>
    <div class="nickname-row">
      <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="20" autocomplete="off">
      <button class="btn-random" id="btnRandom" onclick="fetchRandomNickname()" title="랜덤 닉네임 생성">🎲</button>
    </div>
    <p class="hint">&nbsp; 2~20자, 한글/영문/숫자 사용 가능 </p>
    <p class="error" id="errMsg"></p>

    <!-- MBTI 선택 -->
    <div class="mbti-section">
      <div class="mbti-label-row">
        <label>나의 MBTI</label>
        <span class="mbti-optional">선택사항</span>
      </div>
      <div class="mbti-grid" id="mbtiGrid">
        <!-- 분석가형 -->
        <button class="mbti-btn" data-mbti="INTJ" onclick="selectMbti(this)">INTJ</button>
        <button class="mbti-btn" data-mbti="INTP" onclick="selectMbti(this)">INTP</button>
        <button class="mbti-btn" data-mbti="ENTJ" onclick="selectMbti(this)">ENTJ</button>
        <button class="mbti-btn" data-mbti="ENTP" onclick="selectMbti(this)">ENTP</button>
        <!-- 외교관형 -->
        <button class="mbti-btn" data-mbti="INFJ" onclick="selectMbti(this)">INFJ</button>
        <button class="mbti-btn" data-mbti="INFP" onclick="selectMbti(this)">INFP</button>
        <button class="mbti-btn" data-mbti="ENFJ" onclick="selectMbti(this)">ENFJ</button>
        <button class="mbti-btn" data-mbti="ENFP" onclick="selectMbti(this)">ENFP</button>
        <!-- 관리자형 -->
        <button class="mbti-btn" data-mbti="ISTJ" onclick="selectMbti(this)">ISTJ</button>
        <button class="mbti-btn" data-mbti="ISFJ" onclick="selectMbti(this)">ISFJ</button>
        <button class="mbti-btn" data-mbti="ESTJ" onclick="selectMbti(this)">ESTJ</button>
        <button class="mbti-btn" data-mbti="ESFJ" onclick="selectMbti(this)">ESFJ</button>
        <!-- 탐험가형 -->
        <button class="mbti-btn" data-mbti="ISTP" onclick="selectMbti(this)">ISTP</button>
        <button class="mbti-btn" data-mbti="ISFP" onclick="selectMbti(this)">ISFP</button>
        <button class="mbti-btn" data-mbti="ESTP" onclick="selectMbti(this)">ESTP</button>
        <button class="mbti-btn" data-mbti="ESFP" onclick="selectMbti(this)">ESFP</button>
      </div>
    </div>

    <!-- 시작하기 버튼 -->
    <button class="btn-submit" id="btnSubmit" onclick="submitNickname()">시작하기</button>

  </div>

  <script>
    const API = 'https://ottrank-api.tdidream.workers.dev';

    // ── URL에서 sid 파라미터 추출 ─────────────────────────────
    const sid = new URLSearchParams(location.search).get('sid');
    if (!sid) location.href = '/';
    if (sid) localStorage.setItem('ottrang_sid', sid);

    // ── 선택된 MBTI 저장 변수 ─────────────────────────────────
    let selectedMbti = null;

    // ── 페이지 진입 시 랜덤 닉네임 자동 로드 ─────────────────
    window.addEventListener('DOMContentLoaded', () => {
      fetchRandomNickname();
    });

    // ── 랜덤 닉네임 API 호출 ──────────────────────────────────
    async function fetchRandomNickname() {
      const btn   = document.getElementById('btnRandom');
      const input = document.getElementById('nickname');

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res  = await fetch(`${API}/auth/random-nickname`);
        const data = await res.json();
        if (data.ok && data.nickname) {
          input.value = data.nickname;
        }
      } catch(e) {
        // 네트워크 오류 시 조용히 실패 (input 비워두기)
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
        // 랜덤 닉네임 로드 후 input에 포커스
        input.focus();
        input.select();
      }
    }

    // ── MBTI 버튼 선택/해제 토글 ─────────────────────────────
    function selectMbti(el) {
      const mbti = el.getAttribute('data-mbti');

      // 이미 선택된 버튼을 다시 누르면 해제
      if (selectedMbti === mbti) {
        el.classList.remove('selected');
        selectedMbti = null;
        return;
      }

      // 기존 선택 해제 후 새 선택
      document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedMbti = mbti;
    }

    // ── 닉네임 + MBTI 저장 ────────────────────────────────────
    async function submitNickname() {
      const nickname = document.getElementById('nickname').value.trim();
      const errMsg   = document.getElementById('errMsg');
      const btn      = document.getElementById('btnSubmit');

      errMsg.style.display = 'none';

      // 유효성 검사
      if (nickname.length < 2) {
        errMsg.textContent = '닉네임은 2자 이상 입력해주세요.';
        errMsg.style.display = 'block';
        return;
      }
      if (!/^[가-힣a-zA-Z0-9]+$/.test(nickname)) {
        errMsg.textContent = '한글, 영문, 숫자만 사용할 수 있어요.';
        errMsg.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = '저장 중...';

      try {
        const res = await fetch(`${API}/auth/nickname`, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({
            nickname,
            sid,
            mbti: selectedMbti,  // null이면 API에서 무시
          }),
        });
        const data = await res.json();

        if (data.ok) {
          // 신규 가입 완료 → 오뜨 안내 페이지로 이동
          location.href = `/ott_intro.html?sid=${sid}`;
        } else {
          errMsg.textContent  = data.message || '오류가 발생했어요. 다시 시도해주세요.';
          errMsg.style.display = 'block';
          btn.disabled         = false;
          btn.textContent      = '시작하기';
        }
      } catch(e) {
        errMsg.textContent   = '네트워크 오류가 발생했어요.';
        errMsg.style.display = 'block';
        btn.disabled         = false;
        btn.textContent      = '시작하기';
      }
    }

    // ── 엔터키 제출 ───────────────────────────────────────────
    document.getElementById('nickname').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitNickname();
    });
  </script>
</body>
</html>
