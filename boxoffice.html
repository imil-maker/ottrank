<style>
/* ── CSS 변수 (공통 + 박스오피스 골드 컬러) ── */
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  /* 박스오피스 브랜드: 골드 */
  --accent:#f0b429;
  --green:#34d399; --gold:#f0b429; --red:#f87171;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
html { scroll-behavior:smooth }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.6; overflow-x:hidden;
}

/* ── 헤더 sticky ── */
#ottrang-header { position:sticky; top:0; z-index:200 }
.main-outer { max-width:var(--max-w); margin:0 auto; padding:0 24px 80px }

/* ── 히어로 배너 ── */
.hero {
  position:relative; padding:30px 0 20px; margin-bottom:20px;
  border-bottom:1px solid var(--border); overflow:hidden;
}
.hero::before {
  content:''; position:absolute; top:-40px; right:-60px;
  width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle, rgba(240,180,41,0.16) 0%, transparent 70%);
  pointer-events:none;
}
.hero-eyebrow {
  font-family:var(--mono); font-size:11px; color:#f0b429;
  letter-spacing:3px; text-transform:uppercase; margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.hero-eyebrow::before {
  content:''; display:block; width:24px; height:1px; background:#f0b429;
}
.hero-title {
  font-family:var(--disp); font-size:52px; letter-spacing:3px;
  line-height:1; margin-bottom:10px;
}
/* 박스오피스 골드 고정 — 헤더 CSS 덮어쓰기 방지 */
.hero-title .bo { color:#f0b429 !important }
.hero-sub {
  font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.5px;
  position:absolute; bottom:54px; right:0; text-align:right;
}
/* BOX 대형 배경 글자 */
.hero-logo {
  position:absolute; right:0; top:50%; transform:translateY(-50%);
  font-family:var(--disp); font-size:160px; color:rgba(240,180,41,0.05);
  line-height:1; pointer-events:none; user-select:none; letter-spacing:-4px;
}

/* ── 섹션 ── */
.rank-section { margin-bottom:52px }
.sec-hd {
  display:flex; align-items:center; gap:12px;
  margin-bottom:20px; padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.sec-num {
  font-family:var(--disp); font-size:13px; color:#f0b429;
  background:rgba(240,180,41,0.12); border:1px solid rgba(240,180,41,0.3);
  padding:2px 10px; border-radius:4px; letter-spacing:1px; white-space:nowrap;
}
.sec-title {
  font-family:var(--disp); font-size:24px; letter-spacing:1.5px; color:var(--text);
}
.sec-count {
  font-family:var(--disp); font-size:24px; letter-spacing:1.5px; color:var(--muted);
}
.sec-live {
  margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);
  display:flex; align-items:center; gap:7px;
}
.sec-live-dot {
  width:6px; height:6px; border-radius:50%;
  background:#f0b429; animation:pulse 2s infinite; flex-shrink:0;
}

/* ── 카드 그리드 (5열) ── */
.rank-grid {
  display:grid;
  grid-template-columns:repeat(5, minmax(0,1fr));
  gap:14px;
  margin-bottom:8px;
}
@media(max-width:900px) { .rank-grid { grid-template-columns:repeat(3, minmax(0,1fr)) } }
@media(max-width:600px) { .rank-grid { grid-template-columns:repeat(2, minmax(0,1fr)) } }

/* ── 포스터 카드 ── */
.pk-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden; cursor:pointer;
  transition:border-color .15s, transform .2s, box-shadow .2s;
}
.pk-card:hover {
  border-color:rgba(240,180,41,0.4); transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(240,180,41,0.10);
}
.pk-poster {
  position:relative; aspect-ratio:2/3;
  background:var(--bg3); overflow:hidden;
}
.pk-poster img {
  width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s;
}
.pk-card:hover .pk-poster img { transform:scale(1.04) }
.pk-poster-ph {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:40px; background:linear-gradient(135deg,var(--bg3),var(--bg2));
}

/* 순위 번호 */
.pk-rank-num {
  position:absolute; top:7px; left:9px;
  font-family:var(--disp); font-size:44px; line-height:1;
  color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.9);
}
.pk-rank-top3 { color:#f0b429 !important; text-shadow:0 2px 12px rgba(240,180,41,0.5) !important }

/* TMDB 평점 */
.pk-rating {
  position:absolute; bottom:7px; right:7px;
  font-family:var(--mono); font-size:11px;
  background:rgba(0,0,0,.78); color:var(--gold);
  padding:3px 8px; border-radius:4px;
}

/* 호버 오버레이 */
.pk-overlay {
  position:absolute; inset:0; opacity:0; transition:opacity .2s;
  background:linear-gradient(to top,rgba(12,12,16,.97) 0%,transparent 55%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:12px 14px;
}
.pk-card:hover .pk-overlay { opacity:1 }
.ov-title {
  font-size:13px; font-weight:500; color:var(--text); margin-bottom:4px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.ov-meta { font-family:var(--mono); font-size:10px; color:var(--muted2) }

/* 카드 하단 정보 */
.pk-info { padding:10px 12px }
.pk-title {
  font-size:13px; font-weight:500; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;
}
/* 영어제목 — 다른 OTT 페이지(index.html의 .ft-en)와 동일한 스타일로 통일 */
.pk-en {
  font-family:var(--mono); font-size:11px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px;
}
.pk-year {
  font-family:var(--mono); font-size:11px; color:var(--muted);
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.pk-memo {
  font-family:var(--mono); font-size:11px; color:var(--gold);
  background:rgba(240,180,41,.1); border:1px solid rgba(240,180,41,.2);
  border-radius:3px; padding:1px 6px; white-space:nowrap;
}

/* ── 스켈레톤 ── */
.skel-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden;
}
.skel-poster {
  width:100%; aspect-ratio:2/3;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
}
.skel-line {
  height:12px; border-radius:4px; margin:10px 12px 6px;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
}
.skel-line.short { width:55%; height:10px; margin-top:0 }

/* ── 빈 상태 / 에러 ── */
.sec-empty {
  padding:40px; text-align:center; font-size:14px; color:var(--muted);
  background:var(--card); border:1px solid var(--border); border-radius:var(--r);
  grid-column:1/-1;
}

/* ── 애니메이션 ── */
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── 모바일 ── */
@media(max-width:768px) {
  .main-outer { padding:0 14px 60px }
  .hero { padding:32px 0 28px }
  .hero-title { font-size:38px }
  .hero-logo { font-size:100px; opacity:.5 }
  .hero-sub { display:none }

  /* ── 섹션 헤더 1줄화 ── */
  .sec-hd{ flex-wrap:nowrap; padding:18px 16px 10px; gap:6px; overflow:hidden; }
  .sec-title{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:1; min-width:0; letter-spacing:0.5px; }
  .sec-sub{ display:none; }
  .sec-live{ display:none; }  /* 모바일: 날짜 섹션헤더에서 숨김 */
}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════
   박스오피스 순위 페이지
   - /rankings/platform?platform=boxoffice 단일 API 호출
   - ott_categories의 platform_section/platform_order/platform_limit 반영
   - 어드민에서 노출/순서/개수 변경 시 자동 반영 (하드코딩 없음)
   - 카드 그리드 나열 방식 (슬라이드 X)
════════════════════════════════════════════════════ */

const API      = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
const PLATFORM = 'boxoffice';
const PLATFORM_LABEL = '박스오피스'; // ItemList JSON-LD의 name에 사용

/* ── 작품 상세 페이지 이동 ── */
function goWork(tmdbId, title) {
  if (!tmdbId) return;
  const y   = new Date().getFullYear();
  const url = `/title/1-${y}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: 'movie', title: title || '', platform: PLATFORM
  }));
  location.href = url;
}

/* ── 포스터 카드 HTML 생성 ── */
function makeCard(item, rank) {
  const isTop3 = rank <= 3;
  const poster = item.poster_path
    ? `<img src="${TMDB_IMG}${item.poster_path}"
            alt="${escAttr(item.title_ko || '')}"
            loading="lazy"
            onerror="this.parentNode.innerHTML='<div class=\\'pk-poster-ph\\'>🎬</div>'">`
    : `<div class="pk-poster-ph">🎬</div>`;
  const rating = item.tmdb_rating
    ? `<div class="pk-rating">★ ${parseFloat(item.tmdb_rating).toFixed(1)}</div>` : '';
  const memo   = item.memo
    ? `<span class="pk-memo">${escHtml(item.memo)}</span>` : '';
  // 영어제목 — title_en이 없거나 한글제목과 동일하면(데이터 미보완 상태) 중복 노출 방지
  const enHtml = (item.title_en && item.title_en !== item.title_ko)
    ? `<div class="pk-en">${escHtml(item.title_en)}</div>` : '';

  return `
    <div class="pk-card" onclick="goWork(${item.tmdb_id},'${escAttr(item.title_ko || '')}')">
      <div class="pk-poster">
        ${poster}
        <div class="pk-rank-num${isTop3 ? ' pk-rank-top3' : ''}">${rank}</div>
        ${rating}
        <div class="pk-overlay">
          <div class="ov-title">${escHtml(item.title_ko || item.title_en || '')}</div>
          <div class="ov-meta">${item.release_year || ''} ${item.genre ? '· ' + item.genre.split(',')[0] : ''}</div>
        </div>
      </div>
      <div class="pk-info">
        <div class="pk-title">${escHtml(item.title_ko || item.title_en || '')}</div>
        ${enHtml}
        <div class="pk-year">
          ${item.release_year || '-'}
          ${memo}
        </div>
      </div>
    </div>`;
}

/* ── 스켈레톤 그리드 HTML ── */
function makeSkel(n = 5) {
  return Array(n).fill(0).map(() => `
    <div class="skel-card">
      <div class="skel-poster"></div>
      <div class="skel-line"></div>
      <div class="skel-line short"></div>
    </div>`).join('');
}

/* ── 날짜 포맷 ── */
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 업데이트`;
}

/* ── 메인 데이터 로드 및 렌더링 ── */
async function loadAll() {
  const wrap = document.getElementById('sectionsWrap');

  // 1) 로딩 스켈레톤 표시
  wrap.innerHTML = `
    <div class="rank-section">
      <div class="sec-hd">
        <span class="sec-num">TOP 10</span>
        <span class="sec-title">불러오는 중...</span>
      </div>
      <div class="rank-grid">${makeSkel(5)}</div>
    </div>`;

  let groups = [];
  try {
    // 2) /rankings/platform API 호출
    //    - platform_section IS NOT NULL 인 카테고리만 반환
    //    - platform_order 순으로 정렬
    //    - platform_limit 개수만큼 items 포함
    const res = await fetch(`${API}/rankings/platform?platform=${PLATFORM}`);
    if (!res.ok) throw new Error(`API 오류: ${res.status}`);
    const json = await res.json();
    groups = json.data || [];
  } catch (e) {
    wrap.innerHTML = `
      <div class="sec-empty" style="grid-column:unset;padding:60px;text-align:center">
        순위 데이터를 불러오지 못했습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${e.message}</span>
      </div>`;
    return;
  }

  // 3) 데이터 없을 때
  if (!groups.length) {
    wrap.innerHTML = `
      <div class="sec-empty" style="grid-column:unset;padding:60px;text-align:center">
        아직 등록된 순위이 없습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">
          어드민 OTT 페이지 설정에서 카테고리를 노출로 설정해주세요.
        </span>
      </div>`;
    return;
  }

  const dateStr = getTodayStr();

  // 4) 각 그룹을 카드 그리드 섹션으로 렌더링
  wrap.innerHTML = groups.map((group, i) => {
    const items    = group.items || [];
    const topLabel = `TOP ${items.length}`;

    const cardsHtml = items.length
      ? items.map((item, idx) => makeCard(item, idx + 1)).join('')
      : `<div class="sec-empty">아직 등록된 순위이 없습니다.</div>`;

    return `
      <div class="rank-section">
        <div class="sec-hd">
          <span class="sec-num">BOXOFFICE</span>
          <span class="sec-title">${escHtml(getSectionTitle(group.display_name))}</span>
          <span class="sec-count">${topLabel}</span>
          <div class="sec-live">
            <div class="sec-live-dot"></div>
            <span>${dateStr}</span>
          </div>
        </div>
        <div class="rank-grid">${cardsHtml}</div>
      </div>`;
  }).join('');

  // 렌더링에 사용한 데이터 그대로 JSON-LD ItemList 생성 (화면에 보이는 것과 마크업 내용 일치)
  updateItemListSEO(groups);
}

/* ── 구조화 데이터 (JSON-LD) — TOP10 목록 페이지용 ItemList ──
   구글 캐러셀(ItemList) 리치 결과는 Course/Movie/Recipe/Restaurant 4개 타입만 지원하며
   TVSeries는 지원 대상이 아니다 (netflix.html 등에서 실제 테스트로 확인된 제약).
   boxoffice.html은 카테고리 전부가 극장 개봉 영화라 별도 media_type 판별 없이
   그룹 전체를 Movie로 마크업한다. */
function updateItemListSEO(groups) {
  const y = new Date().getFullYear();
  const graph = [];
  // 캐러셀 position은 "이 그룹 안에서 몇 번째"가 아니라 "페이지 전체에서 몇 번째"여야 함 —
  // 그룹(카테고리)마다 1부터 다시 세면 서로 다른 그룹의 항목이 같은 position(예: 1)을 갖게 되어
  // 구글이 "여러 ListItem 요소가 정의됨" 오류로 판정한다 (실제 테스트로 확인됨).
  // 그룹이 바뀌어도 리셋하지 않는 전역 카운터 사용 — 카테고리가 몇 개든 자동으로 이어짐.
  let globalPos = 0;

  (groups || []).forEach(group => {
    // 상세페이지 링크가 없는(tmdb_id 없는) 항목은 목록에서 제외 — 클릭해도 갈 곳 없는 항목을 마크업하면 안 됨
    const items = (group.items || []).filter(it => it.tmdb_id);
    if (!items.length) return;

    graph.push({
      '@type': 'ItemList',
      'name' : `${PLATFORM_LABEL} ${group.display_name || 'TOP10'} 순위 — 오뜨랑`,
      'itemListElement': items.map((it) => {
        globalPos += 1;
        const entry = {
          '@type': 'Movie',
          'name' : it.title_ko || it.title_en || '',
          'url'  : `https://ottrank.kr/title/1-${y}${it.tmdb_id}`,
        };
        // 평점(aggregateRating)은 이 API에 투표수(vote_count)가 없어 신뢰도 낮은 마크업이 되므로 넣지 않음
        if (it.poster_path) entry.image = `${TMDB_IMG}${it.poster_path}`;
        return { '@type': 'ListItem', 'position': globalPos, 'item': entry };
      }),
    });
  });

  const ld   = { '@context': 'https://schema.org', '@graph': graph };
  const ldEl = document.getElementById('ldJsonList');
  if (ldEl) ldEl.textContent = JSON.stringify(ld);
}

/* ── 카테고리 타이틀 — 어드민에서 설정한 display_name 그대로 표시 ──
   플랫폼명 프리픽스나 "일간" 접두어 없이 그대로 사용
   OTT 브랜드 태그(BOXOFFICE)는 sec-num에 별도 표시됨 ── */
function getSectionTitle(displayName) {
  return displayName || '';
}

/* ── XSS 방지 유틸 ── */
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
