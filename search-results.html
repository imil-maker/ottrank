<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>검색결과 - 오뜨랑 (테스트)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --accent:#e50914;
  --sans:'Noto Sans KR',sans-serif; --mono:'DM Mono',monospace; --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}

/* 페이지 레이아웃 — 왼쪽 사이드바(검색+OTT+MBTI) + 오른쪽 결과그리드 */
.page-layout{max-width:1200px;margin:0 auto;padding:32px 20px 80px;display:flex;gap:24px;align-items:flex-start}

/* 사이드바 — 포스터 1개 폭 정도로 좁게 고정 (넓으면 포스터가 작아짐) */
.sidebar{width:200px;flex-shrink:0}

.search-row{display:flex;gap:6px;margin-bottom:12px}
.search-input-wrap{position:relative;flex:1;min-width:0}
.search-input{
  width:100%;height:38px;padding:0 30px 0 12px;border-radius:8px;
  border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);
  font-size:13px;font-family:var(--sans);outline:none;transition:border-color .15s;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--accent)}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:16px;line-height:1;
  cursor:pointer;padding:2px;display:none;
}
.search-clear.show{display:block}
.search-clear:hover{color:var(--text)}
.search-btn{
  width:38px;height:38px;border-radius:8px;border:none;flex-shrink:0;
  background:var(--accent);color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s;
}
.search-btn:hover{opacity:.85}

.result-bar{
  background:var(--bg3);border-radius:8px;padding:9px 12px;margin-bottom:20px;
  text-align:center;font-size:12px;color:var(--muted2);
}
.result-bar .count{color:var(--accent);font-weight:700;font-family:var(--mono)}

.sidebar-title{font-size:13px;font-weight:500;color:var(--muted2);margin-bottom:10px;text-align:right}

.ott-filter-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 20px}
.ott-filter-row{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;cursor:pointer;
  background:none;border:none;padding:2px 0;width:100%;font-family:var(--sans);
}
.ott-filter-row span{font-size:13px;color:var(--muted2);transition:color .15s}
.ott-filter-row.active span{color:var(--accent);font-weight:600}
.ott-filter-row img, .ott-filter-row .ott-ph{width:22px;height:22px;border-radius:5px;object-fit:cover;flex-shrink:0}
.ott-filter-row .ott-ph{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}

.mbti-select{
  width:100%;height:36px;padding:0 10px;border-radius:8px;
  border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);
  font-size:13px;font-family:var(--sans);outline:none;cursor:pointer;text-align:right;
  direction:rtl;
}
.mbti-select:focus{border-color:var(--accent)}

.main-content{flex:1;min-width:0}

.work-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 14px}
@media (max-width:768px){
  .work-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
}
.work-card{cursor:pointer;min-width:0}
.work-poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3);margin-bottom:8px}
.work-poster > img{width:100%;height:100%;object-fit:cover;display:block}
.work-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.work-rank{position:absolute;bottom:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.65);
  backdrop-filter:blur(2px);color:#f0b429;font-weight:700;font-family:var(--mono)}
.work-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.work-meta-left{display:flex;align-items:center;gap:5px}
.work-rating{color:#f0b429;flex-shrink:0}

/* 포스터 우상단 OTT 서비스중 뱃지 — 크게, 최대 3개 + 나머지는 +N */
.work-ott{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.ott-logo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ott-logo-ph{width:24px;height:24px;border-radius:50%;flex-shrink:0;font-size:11px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.more-wrap{grid-column:1/-1;display:flex;justify-content:center;margin-top:8px}
.more-btn{padding:10px 24px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);
  color:var(--text);font-size:13px;font-family:var(--sans);cursor:pointer;transition:background .15s}
.more-btn:hover{background:var(--bg2)}
.more-btn:disabled{opacity:.5;cursor:default}

.empty, .loading{padding:40px 0;text-align:center;color:var(--muted);font-size:14px;grid-column:1/-1}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="page-layout">

  <div class="sidebar">
    <div class="search-row">
      <div class="search-input-wrap">
        <input class="search-input" id="searchInput" type="text" placeholder="작품, 배우 검색"
          oninput="onSearchInputChange()" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="search-clear" id="searchClearBtn" onclick="clearSearchInput()" aria-label="지우기">×</button>
      </div>
      <button class="search-btn" onclick="doSearch()" aria-label="검색">⌕</button>
    </div>

    <div class="result-bar">검색결과 <span class="count" id="cntWorks">0</span>개</div>

    <div class="ott-filter-list" id="ottFilterList"></div>

    <div class="sidebar-title">MBTI별 추천</div>
    <select class="mbti-select" id="mbtiSelect" onchange="onMbtiSelectChange()">
      <option value="">선택하세요</option>
      <option value="INTJ">INTJ</option>
      <option value="INTP">INTP</option>
      <option value="ENTJ">ENTJ</option>
      <option value="ENTP">ENTP</option>
      <option value="INFJ">INFJ</option>
      <option value="INFP">INFP</option>
      <option value="ENFJ">ENFJ</option>
      <option value="ENFP">ENFP</option>
      <option value="ISTJ">ISTJ</option>
      <option value="ISFJ">ISFJ</option>
      <option value="ESTJ">ESTJ</option>
      <option value="ESFJ">ESFJ</option>
      <option value="ISTP">ISTP</option>
      <option value="ISFP">ISFP</option>
      <option value="ESTP">ESTP</option>
      <option value="ESFP">ESFP</option>
    </select>
  </div>

  <div class="main-content">
    <div class="work-grid" id="workGrid">
      <div class="loading"><span class="spin"></span>검색 중...</div>
    </div>
  </div>

</div>

<script>
const API        = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
const IMG        = 'https://image.tmdb.org/t/p/w342';
// [2026-07-15] 더보기 기준 개수 — PC 15개 / 모바일(768px 이하) 10개
// (header.html의 모바일 분기 기준과 동일하게 768px 사용)
const PAGE_SIZE  = window.innerWidth <= 768 ? 10 : 15;

// OTT 로고/색상 — 메인사이트와 동일한 self-hosted 로고 경로(/img/{file}-icon.jpg) 사용
// file: 실제 GitHub에 올려둔 로고 파일명 (디즈니+/쿠팡플레이는 키와 파일명이 다름 — 2026-07-12 OTT 로고교체 세션 기준)
const OTT_META = {
  netflix: { name:'넷플릭스',   color:'#e50914', file:'netflix' },
  tving:   { name:'티빙',       color:'#ff153c', file:'tving' },
  disney:  { name:'디즈니+',   color:'#06b6d4', file:'disneyplus' },
  coupang: { name:'쿠팡플레이', color:'#1ac44d', file:'coupangplay' },
  wavve:   { name:'웨이브',     color:'#0070f3', file:'wavve' },
  watcha:  { name:'왓챠',       color:'#ff0558', file:'watcha' },
};
// TMDB Watch Providers의 provider_name → 우리 OTT 키 매칭용
const OTT_NAME_MATCH = [
  [/netflix/i,  'netflix'],
  [/tving/i,    'tving'],
  [/disney/i,   'disney'],
  [/coupang/i,  'coupang'],
  [/wavve/i,    'wavve'],
  [/watcha/i,   'watcha'],
];

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();

document.getElementById('searchInput').value = q;
onSearchInputChange();

function onSearchInputChange(){
  const v = document.getElementById('searchInput').value;
  document.getElementById('searchClearBtn').classList.toggle('show', !!v);
}
function clearSearchInput(){
  const inp = document.getElementById('searchInput');
  inp.value = '';
  inp.focus();
  onSearchInputChange();
}

function doSearch(){
  const v = document.getElementById('searchInput').value.trim();
  if(!v) return;
  location.href = `search-results.html?q=${encodeURIComponent(v)}`;
}

function onMbtiSelectChange(){
  // UI만 우선 구현 — 실제 추천 로직은 다음 단계에서 붙일 예정
}

function hesc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function slug(tmdbId){ return `/title/1-${new Date().getFullYear()}${tmdbId}`; }
function fmtScore(r){ if(!r||r<=0) return null; return parseFloat(r).toFixed(1).replace(/\.0$/,''); }

function goWork(tmdbId, type, title){
  if(!tmdbId) return;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id:tmdbId, type:type||'tv', platform:'', rank:1, title, season:1, year:new Date().getFullYear()
  }));
  location.href = slug(tmdbId);
}

/* ── OTT 서비스 여부 판단 — 오뜨랑 4단계 우선순위 원칙 (_title_detail.html과 동일 원칙) ──
   Priority 1: 오뜨랑 DB 랭킹(ott_ranks) — 오늘 그 플랫폼 랭킹에 있으면 가장 신뢰도 높음
   Priority 2: 쿠팡플레이는 TMDB Watch Providers에 데이터가 거의 없어서, TMDB Networks(id=5169)로 보완 (TV만 해당)
   Priority 3: TMDB Watch Providers — 위 두 개로 못 채운 나머지 보완
   Priority 4: 어드민 "OTT 보러가기" 수동 오버라이드(/work-ott) — action:'add'는 강제 표시,
               action:'remove'는 강제 제외. 자동 판단(1~3)보다 항상 우선 적용된다.
               [2026-07-15 추가] 기존엔 이 단계가 빠져있어 어드민에서 수동 설정해도
               검색결과 페이지엔 반영이 안 되던 버그 수정.
   ※ 캐싱 없이 매번 실시간 조회 — 트래픽 이슈로 추후 D1 캐싱 별도 검토 예정 (테스트 단계) */
const _ottCache = new Map(); // `${mediaType}:${tmdbId}` -> ['netflix','tving', ...]
// [2026-07-17 재검토] 이 함수는 이 파일(검색결과 페이지)에서 "TMDB 보충 작품(아직 우리 DB
// 미등록)"에만 쓰인다. DB 작품은 /works/search가 work_ott를 이미 조인해서 내려주므로 이 함수를
// 아예 안 거침. 그런데 원래 코드는 작품페이지(_title_detail.html)의 4단계 판정 로직을 그대로
// 가져다 쓰고 있었음 — 미등록 작품엔 안 맞는 확인들이 섞여 있었음:
//   Priority 1(오늘자 랭킹)   — 미등록 작품은 랭킹 데이터 자체가 없어 항상 빈 값 (무의미)
//   Priority 2(쿠팡 Network) — Watch Providers 보완용 미세 정확도, 검색 보충 수준엔 불필요
//   Priority 4(관리자 오버라이드) — 오버라이드는 "이미 등록된" 작품 대상 기록이라 미등록 작품엔 사실상 없음
// 그래서 3번(Watch Providers) 하나만 남김 — 매 호출 왕복 횟수가 3번→1번으로 줄어 그만큼 빨라짐.
async function fetchOttKeys(tmdbId, mediaType, rankKeys){
  const cacheKey = `${mediaType}:${tmdbId}`;
  if(_ottCache.has(cacheKey)) return _ottCache.get(cacheKey);

  const keys = new Set(rankKeys || []);
  const type = mediaType === 'movie' ? 'movie' : 'tv';

  try{
    const wpRes = await fetch(`${TMDB_PROXY}/${type}/${tmdbId}/watch/providers`);
    if(wpRes.ok){
      const wp = await wpRes.json();
      const flatrate = (wp.results && wp.results.KR && wp.results.KR.flatrate) || [];
      flatrate.forEach(p=>{
        const match = OTT_NAME_MATCH.find(([re])=>re.test(p.provider_name||''));
        if(match) keys.add(match[1]);
      });
    }
  }catch(e){
    // 실패해도 검색 화면엔 영향 없음 — 이 작품만 OTT 배지가 안 뜨는 정도
  }

  const result = [...keys];
  _ottCache.set(cacheKey, result);
  return result;
}

function ottLogoHtml(key){
  const meta = OTT_META[key];
  if(!meta) return '';
  return `<img class="ott-logo" src="/img/${meta.file}-icon.jpg" alt="${meta.name}" title="${meta.name}"
    onerror="this.outerHTML='<div class=\\'ott-logo-ph\\' style=\\'background:${meta.color}\\' title=\\'${meta.name}\\'>${meta.name[0]}</div>'">`;
}

// TMDB 보충 작품들의 OTT 여부를 화면에 안 보이는 상태로 미리 확인해서 cardOttKeys에 캐싱해둠.
// (fetchOttKeys 내부에 이미 _ottCache가 있어서, 나중에 카드가 실제로 그려지거나 OTT 필터를
//  누를 때 이 캐시를 그대로 재사용 — 첫 번째 OTT 필터 클릭이 느렸던 이유가 이 확인 작업을
//  그때서야 시작해서였는데, 검색결과 뜨자마자 미리 끝내두면 체감상 항상 빠르게 느껴짐)
// TMDB에 한꺼번에 몰리지 않게 5개씩 나눠서 순차 처리, 검색 자체 속도엔 영향 없음(await 안 함).
function _prewarmTmdbOtt(){
  const items = tmdbPool.filter(w=>{
    const id = w.tmdb_id || w.id;
    return id && !cardOttKeys.has(id);
  });
  (async ()=>{
    for(let i=0; i<items.length; i+=8){
      const batch = items.slice(i, i+8);
      await Promise.all(batch.map(w=>{
        const id    = w.tmdb_id || w.id;
        const mtype = w.media_type || w._type || 'tv';
        return fetchOttKeys(id, mtype, Object.keys(w.ott_ranks||{})).then(keys=>{
          cardOttKeys.set(id, keys);
        });
      }));
    }
  })();
}

/* ── 사이드바 OTT 필터 ──
   [2026-07-17 재설계] 예전엔 우리DB 페이지를 계속 더 불러오면서(offset 증가) 프론트에서
   OTT가 맞는지 걸러내는 방식이라, 매칭 비율 낮은 OTT일수록 왕복이 몇 번이고 늘어났음.
   지금은 /works/search에 ott= 파라미터를 붙여서 D1이 SQL에서 한 번에 걸러 응답하도록 변경 —
   TMDB 미등록 보충 작품은 OTT 필터 결과에 안 나옴(정확도를 우리 DB 기준으로만 보장). */
let activeOttFilter = null;
const cardOttKeys = new Map(); // tmdbId -> 확인된 OTT 키 배열 (일반 검색결과 카드용)
let ottOffset  = 0;
let ottHasMore = false;

function renderOttFilterList(){
  const wrap = document.getElementById('ottFilterList');
  wrap.innerHTML = Object.entries(OTT_META).map(([key, meta]) => `
    <button class="ott-filter-row" data-ott-key="${key}" onclick="toggleOttFilter('${key}')">
      <span>${meta.name}</span>
      <img src="/img/${meta.file}-icon.jpg" alt="" class="ott-filter-logo"
        onerror="this.outerHTML='<div class=\\'ott-ph\\' style=\\'background:${meta.color}\\'>${meta.name[0]}</div>'">
    </button>
  `).join('');
}

// 필터 없이(전체 보기) 지금까지 확보한 풀 기준 첫 페이지를 처음부터 다시 그림 — 필터 해제 시 사용
function _renderUnfilteredFirstPage(){
  workGrid.innerHTML = '';
  dbInsertMarker = document.createElement('span');
  dbInsertMarker.style.display = 'none';
  workGrid.appendChild(dbInsertMarker);

  renderedDbCount = 0;
  renderedTmdbCount = 0;
  if(combinedAvailable()){
    renderMore(Math.min(PAGE_SIZE, combinedAvailable()));
    renderMoreButton();
  } else {
    workGrid.innerHTML = `<div class="empty">작품 검색 결과가 없습니다.</div>`;
  }
  updateWorkCount();
}

async function renderOttFilterPage(isMore){
  const key = activeOttFilter;
  if(!isMore){
    ottOffset = 0;
    workGrid.innerHTML = `<div class="loading"><span class="spin"></span>불러오는 중...</div>`;
  }

  let json;
  try{
    const res = await fetch(`${API}/works/search?q=${encodeURIComponent(q)}&ott=${key}&limit=${PAGE_SIZE}&offset=${ottOffset}`);
    json = res.ok ? await res.json() : { data: [], has_more: false, total: 0 };
  }catch(e){
    json = { data: [], has_more: false, total: 0 };
  }

  ottOffset += PAGE_SIZE;
  ottHasMore = !!json.has_more;
  const items = json.data || [];

  if(!isMore){
    workGrid.innerHTML = '';
    dbInsertMarker = document.createElement('span');
    dbInsertMarker.style.display = 'none';
    workGrid.appendChild(dbInsertMarker);
  }

  if(!isMore && !items.length){
    workGrid.innerHTML = `<div class="empty">이 OTT에서 볼 수 있는 검색결과가 없습니다.</div>`;
  } else {
    items.forEach(w=>{
      if(w.tmdb_id) cardOttKeys.set(w.tmdb_id, w.ott_keys || []); // 카드가 다시 조회 안 하게 캐시 채워둠
      workGrid.insertBefore(workCard(w), dbInsertMarker);
    });
  }

  document.querySelector('.more-wrap')?.remove();
  if(ottHasMore){
    const wrap = document.createElement('div');
    wrap.className = 'more-wrap';
    wrap.innerHTML = `<button class="more-btn">더보기</button>`;
    wrap.querySelector('.more-btn').onclick = (e)=>{
      e.target.disabled = true; e.target.textContent = '불러오는 중...';
      renderOttFilterPage(true);
    };
    workGrid.insertBefore(wrap, dbInsertMarker.nextSibling);
  }

  document.getElementById('cntWorks').textContent = json.total ?? items.length;
}

function toggleOttFilter(key){
  activeOttFilter = (activeOttFilter === key) ? null : key;

  document.querySelectorAll('.ott-filter-row').forEach(row=>{
    row.classList.toggle('active', row.dataset.ottKey === activeOttFilter);
  });

  document.querySelector('.more-wrap')?.remove();

  if(!activeOttFilter){
    _renderUnfilteredFirstPage();
    return;
  }

  renderOttFilterPage(false);
}

/* ── 작품 카드 ── */
function workCard(w){
  const poster  = w.poster_path
    ? `<img src="${IMG}${w.poster_path}" alt="" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  const title   = w.title_ko || w.title || w.name || '';
  const year    = (w.release_year || (w.first_air_date || w.release_date || '').slice(0,4)) || '';
  const mtype   = w.media_type || w._type || '';
  const typeLabel = mtype==='movie' ? '영화' : 'TV';
  const tmdbId  = w.tmdb_id || w.id;
  const rating  = fmtScore(w.tmdb_rating || w.vote_average);

  // 오늘자 OTT 순위 배지 (우리 DB 작품만 해당 — ott_ranks는 /works/search 응답에만 있음)
  const ranks = w.ott_ranks || {};
  const firstRankKey = Object.keys(ranks)[0];
  const rankBadge = firstRankKey
    ? `<span class="work-rank">${OTT_META[firstRankKey]?.name || firstRankKey} ${ranks[firstRankKey]}위</span>`
    : '';

  const card = document.createElement('div');
  card.className = 'work-card';
  card.dataset.tmdbId = tmdbId || '';
  card.innerHTML = `
    <div class="work-poster">
      ${poster}
      <div class="work-ott" data-tmdb-id="${tmdbId}" data-media-type="${mtype||'tv'}"></div>
      ${rankBadge}
    </div>
    <div class="work-title">${hesc(title)}</div>
    <div class="work-meta">
      <span class="work-meta-left">${year||'-'} · ${typeLabel}</span>
      ${rating?`<span class="work-rating">★ ${rating}</span>`:''}
    </div>
  `;
  card.onclick = ()=>goWork(tmdbId, mtype, title);

  // 서비스중 OTT 로고
  const ottBox = card.querySelector('.work-ott');
  if(tmdbId){
    if(Array.isArray(w.ott_keys)){
      // 우리 DB 작품 — /works/search가 work_ott를 이미 조인해서 내려줌 → TMDB 실시간 조회 없이 즉시 표시
      cardOttKeys.set(tmdbId, w.ott_keys);
      if(w.ott_keys.length) ottBox.innerHTML = w.ott_keys.map(ottLogoHtml).join('');
    } else {
      // TMDB 보충 작품 — 실시간으로 OTT만 확인해서 표시 (DB 자동등록은 하지 않음.
      // [2026-07-17] 한때 여기서 /works/register로 자동등록했었는데, 검색어와 실제 관련
      // 없는 TMDB 매칭(줄거리 매칭 등으로 새어 들어온 옛날 작품 등)까지 그대로 DB에 쌓여서,
      // 다음 검색부터 그 작품들이 "DB 작품"으로 취급되어 TMDB 보충 결과보다 우선 노출되는
      // 부작용이 있어 제거함. 등록은 기존처럼 작품페이지 방문 시에만 이뤄짐.)
      fetchOttKeys(tmdbId, mtype, Object.keys(ranks)).then(keys=>{
        cardOttKeys.set(tmdbId, keys);
        if(keys.length) ottBox.innerHTML = keys.map(ottLogoHtml).join('');
      });
    }
  }

  return card;
}

/* ── 상태 ──
   [2026-07-15 재설계] 우리DB와 TMDB 보충결과를 처음부터 하나의 풀(pool)로 합쳐서 관리.
   화면엔 이 풀에서 PAGE_SIZE개씩 순서대로("더보기"마다) 꺼내서 보여준다.
   순서는 항상 "우리DB 먼저 → TMDB 나중"을 지킨다(신뢰도 높은 DB 매칭 우선 노출).
   TMDB는 최초 1회만 조회(페이지네이션 없음, 최대 약 40개) — 우리DB는 "더보기"로
   모자라면 그때그때 다음 페이지를 추가로 불러온다(최대 100개, 백엔드 상한). */
let dbPool      = [];      // 우리DB 결과 누적 (더보기 시 계속 늘어남)
let tmdbPool    = [];      // TMDB 보충 결과 (최초 1회 고정)
let seenIds     = new Set(); // 풀 전체 중복 제거용(tmdb_id 기준)
let dbOffset    = 0;
let dbHasMore   = false;
let dbTotal     = 0;       // 이번 검색어의 우리DB 전체 매칭 개수 (포스터 필터링 반영, 서버가 계산)
let dbCapped    = false;   // true면 dbTotal이 상한(100개) 안에서만 집계된 하한선일 뿐, 실제로는 더 있을 수 있음
let renderedDbCount   = 0;  // dbPool 중 화면에 그린 개수
let renderedTmdbCount = 0;  // tmdbPool 중 화면에 그린 개수

const workGrid = document.getElementById('workGrid');
let dbInsertMarker = null; // 카드들이 항상 이 앞(="더보기" 버튼 앞)에 꽂히는 기준점

function hasPoster(w){ return !!w.poster_path; } // 포스터 없는 작품은 목록에서 제외

// TMDB 요청 전용 제한시간 래퍼 — TMDB가 응답을 안 주고 붙잡고 있어도(오늘 같은 장애 상황)
// 5초 지나면 그냥 포기하고 넘어감. DB 검색은 이 함수를 안 거치므로 영향 없음.
function _fetchWithTimeout(url, ms = 5000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

// list를 pool에 추가하되, seenIds에 이미 있는 tmdb_id는 건너뜀(전역 중복 제거)
function addUnique(pool, list){
  list.filter(hasPoster).forEach(w=>{
    const id = w.tmdb_id || w.id;
    if(!id || seenIds.has(id)) return;
    seenIds.add(id);
    pool.push(w);
  });
}

// 우리DB 다음 페이지를 가져와서 dbPool에 추가 (호출 시마다 dbOffset 전진)
async function fetchDbPage(){
  const res = await fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=${PAGE_SIZE}&offset=${dbOffset}`);
  dbOffset += PAGE_SIZE;
  if(!res.ok){ dbHasMore = false; return; }
  const j = await res.json();
  dbHasMore = !!j.has_more;
  addUnique(dbPool, j.data || []);
}

// TMDB TV/영화를 조회해서 "이미 우리DB에 등록된 작품"만 걸러낸, 아직 병합 전인 원본 배열을 반환
// (dbPool과의 중복 제거는 호출부에서 DB를 먼저 병합한 뒤에 진행 — 우선순위 보장을 위해 순서 중요)
async function fetchTmdbRaw(){
  const [tvRes, mvRes] = await Promise.allSettled([
    _fetchWithTimeout(`${TMDB_PROXY}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR&include_adult=false`),
    _fetchWithTimeout(`${TMDB_PROXY}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR&include_adult=false`),
  ]);
  let tmdbTv = [];
  if(tvRes.status==='fulfilled' && tvRes.value.ok){
    const j = await tvRes.value.json();
    tmdbTv = (j.results||[]).filter(r=>!r.adult).map(r=>({...r, _type:'tv', tmdb_id:r.id}));
  }
  let tmdbMv = [];
  if(mvRes.status==='fulfilled' && mvRes.value.ok){
    const j = await mvRes.value.json();
    tmdbMv = (j.results||[]).filter(r=>!r.adult).map(r=>({...r, _type:'movie', tmdb_id:r.id}));
  }
  let combined = [...tmdbTv, ...tmdbMv].filter(hasPoster);

  // "이미 우리 DB에 등록된 작품인데 이번 검색어로는 안 걸린 것"은 TMDB 줄거리 매칭으로
  // 새어 들어온 것일 수 있어 제외 (기존 로직 그대로 유지)
  if(combined.length){
    try{
      const idsParam = combined.map(w=>w.tmdb_id).join(',');
      const existsRes = await fetch(`${API}/works/exists?ids=${idsParam}`);
      if(existsRes.ok){
        const existsJson = await existsRes.json();
        const existingIds = new Set(existsJson.existing_ids || []);
        combined = combined.filter(w=>!existingIds.has(w.tmdb_id));
      }
    }catch(e){
      // 확인 실패해도 검색 자체는 계속 진행 (TMDB 보충 결과만 필터링 스킵)
    }
  }
  return combined;
}

function combinedAvailable(){ return dbPool.length + tmdbPool.length; }
function _renderedTotal(){ return renderedDbCount + renderedTmdbCount; }

// [2026-07-17 수정] 예전엔 [...dbPool, ...tmdbPool]를 이어붙인 배열에서 "몇 번째~몇 번째"로
// 잘라 그리는 방식(renderRange)이었는데, dbPool이 "더보기"마다 계속 커지다 보니 tmdbPool의
// 위치가 매번 뒤로 밀리면서 이미 그린 TMDB 카드가 다시 안 그려진 자리로 취급돼 중복 렌더링되는
// 버그가 있었음. dbPool/tmdbPool 각각 "몇 개 그렸는지"를 따로 세는 방식으로 교체 —
// dbPool이 아무리 커져도 tmdbPool 쪽 진행 상황(renderedTmdbCount)은 흔들리지 않음.
function renderMore(need){
  if(need <= 0) return;

  const fromDb = Math.min(need, dbPool.length - renderedDbCount);
  dbPool.slice(renderedDbCount, renderedDbCount + fromDb).forEach(w=>{
    workGrid.insertBefore(workCard(w), dbInsertMarker);
  });
  renderedDbCount += fromDb;
  need -= fromDb;

  if(need > 0){
    const fromTmdb = Math.min(need, tmdbPool.length - renderedTmdbCount);
    tmdbPool.slice(renderedTmdbCount, renderedTmdbCount + fromTmdb).forEach(w=>{
      workGrid.insertBefore(workCard(w), dbInsertMarker);
    });
    renderedTmdbCount += fromTmdb;
  }
}

function shouldShowMore(){
  return _renderedTotal() < combinedAvailable() || dbHasMore;
}

function updateWorkCount(){
  // [2026-07-15 변경] "화면에 실제로 보이는 개수" 대신 "전체 매칭 개수"를 표시.
  // 지금은 DB+TMDB가 하나의 풀로 합쳐져 있고 더보기로 끝까지 다 볼 수 있는 구조라,
  // 총 개수를 미리 알아야 사용자가 더보기를 계속할지 판단할 수 있음.
  // TMDB는 최초 조회 시점에 이미 전체(최대 약 40개)를 다 확보해두므로 tmdbPool.length가
  // 곧 TMDB 쪽 정확한 전체 개수 — DB쪽 total과 단순 합산하면 됨(둘 사이 중복은 서버가 이미 제거).
  // [2026-07-15 수정] "개"라는 글자를 HTML 쪽("검색결과 · ")에서 이미 문맥으로 표현하므로
  // 여기서는 숫자만 넣는다 (중복 표기로 "24개개"처럼 보이던 문제 원인 제거).
  const total = dbTotal + tmdbPool.length;
  const label = dbCapped ? `${total}+` : `${total}`;
  document.getElementById('cntWorks').textContent = label;
}

async function loadMore(btn){
  btn.disabled = true;
  btn.textContent = '불러오는 중...';

  const target = _renderedTotal() + PAGE_SIZE;

  // 풀에 목표 개수만큼 없으면, 우리DB에 다음 페이지가 남아있는 동안 계속 보충
  while(combinedAvailable() < target && dbHasMore){
    await fetchDbPage();
  }

  const need = Math.min(target, combinedAvailable()) - _renderedTotal();
  renderMore(need);

  btn.disabled = false;
  btn.textContent = '더보기';
  if(!shouldShowMore()) btn.closest('.more-wrap')?.remove();
  updateWorkCount();
}

function renderMoreButton(){
  document.querySelector('.more-wrap')?.remove();
  if(!shouldShowMore()) return;
  const wrap = document.createElement('div');
  wrap.className = 'more-wrap';
  wrap.innerHTML = `<button class="more-btn">더보기</button>`;
  wrap.querySelector('.more-btn').onclick = (e)=>loadMore(e.target);
  workGrid.insertBefore(wrap, dbInsertMarker.nextSibling);
}

async function runSearch(){

  if(!q){
    workGrid.innerHTML = `<div class="empty">검색어를 입력해주세요.</div>`;
    return;
  }

  // 화면 초기화 + 마커 생성 (DB/TMDB 공통으로 쓰는 삽입 기준점)
  function _resetGrid(){
    workGrid.innerHTML = '';
    dbInsertMarker = document.createElement('span');
    dbInsertMarker.style.display = 'none';
    workGrid.appendChild(dbInsertMarker);
  }

  // 지금까지 확보한 풀 기준으로 "아직 안 그린 만큼"만 추가로 그려주는 공용 함수
  // (최초 DB 렌더링과, TMDB가 늦게 도착했을 때의 추가 렌더링 둘 다 이걸 재사용)
  function _renderUpTo(target){
    const need = target - _renderedTotal();
    if(need > 0) renderMore(need);
  }

  try{
    // ── 1) 우리 DB부터 먼저 기다렸다가 즉시 화면에 그림 (TMDB를 기다리지 않음) ──
    const res = await fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=${PAGE_SIZE}&offset=0`);
    dbOffset = PAGE_SIZE;
    const dbJson = res.ok ? await res.json() : { data: [], has_more: false, total: 0, capped: false };

    dbHasMore = !!dbJson.has_more;
    dbTotal   = dbJson.total || 0;
    dbCapped  = !!dbJson.capped;
    addUnique(dbPool, dbJson.data || []);   // ① DB 먼저 풀에 채움 (우선순위 확보)

    _resetGrid();

    if(combinedAvailable()){
      _renderUpTo(Math.min(PAGE_SIZE, combinedAvailable()));
      renderMoreButton();
      updateWorkCount();
    } else {
      workGrid.innerHTML = `<div class="empty">작품 검색 결과가 없습니다.</div>`;
    }

    // ── 2) TMDB는 백그라운드로 보충 — DB 화면은 이미 떠 있으므로 TMDB가 느리거나
    //      실패해도(제한시간 5초, _fetchWithTimeout) 사용자 경험에 영향 없음 ──
    fetchTmdbRaw().then(tmdbRaw => {
      if(!tmdbRaw.length) return;
      addUnique(tmdbPool, tmdbRaw);        // ② TMDB는 DB와 겹치는 건 자동으로 제외됨
      _prewarmTmdbOtt();                   // 화면엔 안 보이지만 미리 OTT 확인해서 캐싱 (OTT 필터 첫 클릭 대비)

      // DB 결과가 0개라 "결과 없음" 문구가 떠 있던 상태였다면, TMDB 보충분으로 다시 그려야 함
      if(_renderedTotal() === 0) _resetGrid();

      _renderUpTo(Math.min(PAGE_SIZE, combinedAvailable()));
      renderMoreButton();
      updateWorkCount();
    }).catch(() => {
      // TMDB 보충 실패해도 DB 결과는 이미 표시돼 있으므로 별도 에러 처리 불필요
    });

  }catch(e){
    console.warn('검색 실패:', e);
    workGrid.innerHTML = `<div class="empty">검색 중 오류가 발생했습니다.</div>`;
  }
}

renderOttFilterList();
runSearch();
</script>
