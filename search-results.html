<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>검색결과 - 오뜨랑 (테스트)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --sans:'Noto Sans KR',sans-serif; --mono:'DM Mono',monospace; --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}

/* 상단 검색바 */
.topbar{border-bottom:1px solid var(--border);padding:14px 20px}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:700;flex-shrink:0}
.logo span{color:#e50914}
.search-wrap{flex:1;max-width:420px;position:relative}
.search-input{width:100%;padding:10px 42px 10px 14px;border-radius:10px;border:1px solid var(--border2);
  background:var(--bg2);color:var(--text);font-size:14px;font-family:var(--sans);outline:none}
.search-input:focus{border-color:#e50914}
.search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:7px;border:none;background:var(--bg3);color:var(--text);cursor:pointer}

/* 레이아웃 */
.layout{max-width:1100px;margin:0 auto;padding:28px 20px 80px;display:grid;grid-template-columns:200px 1fr;gap:32px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}

.page-title{font-size:26px;font-weight:700;margin-bottom:20px;grid-column:1/-1}
.page-title .q{color:#7ec8e3}

/* 사이드바 탭 */
.side{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:20px}
.side-tab{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:9px;
  cursor:pointer;color:var(--muted2);font-size:15px;font-weight:500;transition:background .15s}
.side-tab:hover{background:var(--bg3)}
.side-tab.active{background:#3778dd;color:#fff}
.side-tab .cnt{font-family:var(--mono);font-size:13px;color:inherit;opacity:.85}

/* 콘텐츠 */
.content{min-width:0}
.sec{margin-bottom:36px}
.sec-title{font-size:17px;font-weight:700;margin-bottom:14px}

.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
.work-card{cursor:pointer}
.work-poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3);margin-bottom:8px}
.work-poster > img{width:100%;height:100%;object-fit:cover;display:block}
.work-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.work-rank{position:absolute;bottom:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.65);
  backdrop-filter:blur(2px);color:#f0b429;font-weight:700;font-family:var(--mono)}
.work-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.work-meta-left{display:flex;align-items:center;gap:5px}
.work-rating{color:#f0b429;flex-shrink:0}

/* 포스터 우상단 OTT 서비스중 뱃지 — 크게, 최대 3개 + 나머지는 +N */
.work-ott{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.ott-logo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ott-logo-ph{width:24px;height:24px;border-radius:50%;flex-shrink:0;font-size:11px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ott-more{width:24px;height:24px;border-radius:50%;flex-shrink:0;font-size:10px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}

.more-wrap{grid-column:1/-1;display:flex;justify-content:center;margin-top:8px}
.more-btn{padding:10px 24px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);
  color:var(--text);font-size:13px;font-family:var(--sans);cursor:pointer;transition:background .15s}
.more-btn:hover{background:var(--bg2)}
.more-btn:disabled{opacity:.5;cursor:default}

.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 24px}
.person-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.person-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.person-photo-ph{width:44px;height:44px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--muted);flex-shrink:0}
.person-name{font-size:15px;font-weight:500;color:var(--text)}
.person-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty, .loading{padding:40px 0;text-align:center;color:var(--muted);font-size:14px;grid-column:1/-1}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:#7ec8e3;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">오뜨<span>랑</span></div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="작품, 배우 검색"
        onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">⌕</button>
    </div>
  </div>
</div>

<div class="layout">
  <div class="page-title">"<span class="q" id="qLabel"></span>" 검색결과</div>

  <div class="side">
    <div class="side-tab active" data-target="secWorks">작품 <span class="cnt" id="cntWorks">0</span></div>
    <div class="side-tab" data-target="secPersons">인물 <span class="cnt" id="cntPersons">0</span></div>
  </div>

  <div class="content">
    <div class="sec" id="secWorks">
      <div class="sec-title">작품</div>
      <div class="work-grid" id="workGrid">
        <div class="loading"><span class="spin"></span>검색 중...</div>
      </div>
    </div>
    <div class="sec" id="secPersons">
      <div class="sec-title">인물</div>
      <div class="person-grid" id="personGrid"></div>
    </div>
  </div>
</div>

<script>
const API        = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
const IMG        = 'https://image.tmdb.org/t/p/w342';
const IMG_PROFILE= 'https://image.tmdb.org/t/p/w185';
const PAGE_SIZE  = 15;

// OTT 로고/색상 — 메인사이트와 동일한 self-hosted 로고 경로(/img/{key}-icon.jpg) 사용
const OTT_META = {
  netflix: { name:'넷플릭스',   color:'#e50914' },
  tving:   { name:'티빙',       color:'#ff153c' },
  disney:  { name:'디즈니+',   color:'#06b6d4' },
  coupang: { name:'쿠팡플레이', color:'#1ac44d' },
  wavve:   { name:'웨이브',     color:'#0070f3' },
  watcha:  { name:'왓챠',       color:'#ff0558' },
};
// TMDB Watch Providers의 provider_name → 우리 OTT 키 매칭용
const OTT_NAME_MATCH = [
  [/netflix/i,  'netflix'],
  [/tving/i,    'tving'],
  [/disney/i,   'disney'],
  [/coupang/i,  'coupang'],
  [/wavve/i,    'wavve'],
  [/watcha/i,   'watcha'],
];

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();

document.getElementById('qLabel').textContent = q;
document.getElementById('searchInput').value = q;

function doSearch(){
  const v = document.getElementById('searchInput').value.trim();
  if(!v) return;
  location.href = `search-results.html?q=${encodeURIComponent(v)}`;
}

/* 사이드바 탭 클릭 → 해당 섹션으로 스크롤 */
document.querySelectorAll('.side-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.side-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.target)?.scrollIntoView({behavior:'smooth', block:'start'});
  });
});

function hesc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function slug(tmdbId){ return `/title/1-${new Date().getFullYear()}${tmdbId}`; }
function fmtScore(r){ if(!r||r<=0) return null; return parseFloat(r).toFixed(1).replace(/\.0$/,''); }

function goWork(tmdbId, type, title){
  if(!tmdbId) return;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id:tmdbId, type:type||'tv', platform:'', rank:1, title, season:1, year:new Date().getFullYear()
  }));
  location.href = slug(tmdbId);
}

/* ── OTT 서비스 여부 (TMDB Watch Providers 실시간 조회, 캐싱 없음 — 테스트용) ── */
const _ottCache = new Map(); // tmdb_id -> ['netflix','tving', ...]
async function fetchOttKeys(tmdbId, mediaType){
  const cacheKey = `${mediaType}:${tmdbId}`;
  if(_ottCache.has(cacheKey)) return _ottCache.get(cacheKey);
  try{
    const type = mediaType === 'movie' ? 'movie' : 'tv';
    const res  = await fetch(`${TMDB_PROXY}/${type}/${tmdbId}/watch/providers`);
    if(!res.ok){ _ottCache.set(cacheKey, []); return []; }
    const j = await res.json();
    const flatrate = (j.results && j.results.KR && j.results.KR.flatrate) || [];
    const keys = [];
    flatrate.forEach(p=>{
      const match = OTT_NAME_MATCH.find(([re])=>re.test(p.provider_name||''));
      if(match && !keys.includes(match[1])) keys.push(match[1]);
    });
    _ottCache.set(cacheKey, keys);
    return keys;
  }catch(e){
    _ottCache.set(cacheKey, []);
    return [];
  }
}

function ottLogoHtml(key){
  const meta = OTT_META[key];
  if(!meta) return '';
  return `<img class="ott-logo" src="/img/${key}-icon.jpg" alt="${meta.name}" title="${meta.name}"
    onerror="this.outerHTML='<div class=\\'ott-logo-ph\\' style=\\'background:${meta.color}\\' title=\\'${meta.name}\\'>${meta.name[0]}</div>'">`;
}

/* ── 작품 카드 ── */
function workCard(w){
  const poster  = w.poster_path
    ? `<img src="${IMG}${w.poster_path}" alt="" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  const title   = w.title_ko || w.title || w.name || '';
  const year    = (w.release_year || (w.first_air_date || w.release_date || '').slice(0,4)) || '';
  const mtype   = w.media_type || w._type || '';
  const typeLabel = mtype==='movie' ? '영화' : 'TV';
  const tmdbId  = w.tmdb_id || w.id;
  const rating  = fmtScore(w.tmdb_rating || w.vote_average);

  // 오늘자 OTT 순위 배지 (우리 DB 작품만 해당 — ott_ranks는 /works/search 응답에만 있음)
  const ranks = w.ott_ranks || {};
  const firstRankKey = Object.keys(ranks)[0];
  const rankBadge = firstRankKey
    ? `<span class="work-rank">${OTT_META[firstRankKey]?.name || firstRankKey} ${ranks[firstRankKey]}위</span>`
    : '';

  const card = document.createElement('div');
  card.className = 'work-card';
  card.innerHTML = `
    <div class="work-poster">
      ${poster}
      <div class="work-ott" data-tmdb-id="${tmdbId}" data-media-type="${mtype||'tv'}"></div>
      ${rankBadge}
    </div>
    <div class="work-title">${hesc(title)}</div>
    <div class="work-meta">
      <span class="work-meta-left">${year||'-'} · ${typeLabel}</span>
      ${rating?`<span class="work-rating">★ ${rating}</span>`:''}
    </div>
  `;
  card.onclick = ()=>goWork(tmdbId, mtype, title);

  // 서비스중 OTT 로고 — 비동기로 채워넣음 (포스터 우상단, 최대 3개 + 나머지는 +N)
  const ottBox = card.querySelector('.work-ott');
  if(tmdbId){
    fetchOttKeys(tmdbId, mtype).then(keys=>{
      if(!keys.length) return;
      const shown = keys.slice(0, 3);
      let html = shown.map(ottLogoHtml).join('');
      if(keys.length > 3) html += `<div class="ott-more">+${keys.length-3}</div>`;
      ottBox.innerHTML = html;
    });
  }

  return card;
}

function personCard(p){
  const photo = p.profile_path
    ? `<img class="person-photo" src="${IMG_PROFILE}${p.profile_path}" alt="" loading="lazy">`
    : `<div class="person-photo-ph">👤</div>`;
  const known = (p.known_for||[]).map(k=>k.title||k.name).slice(0,2).join(', ');

  const card = document.createElement('div');
  card.className = 'person-card';
  card.innerHTML = `
    ${photo}
    <div>
      <div class="person-name">${hesc(p.name||'')}</div>
      <div class="person-meta">${hesc(p.known_for_department||'')}${known?` · ${hesc(known)}`:''}</div>
    </div>
  `;
  card.onclick = ()=>{ location.href = `/person.html?id=${p.id}`; };
  return card;
}

/* ── 상태 ── */
let dbOffset      = 0;
let dbHasMore      = false;
let tmdbFixed      = [];   // TMDB 보충 결과 (최초 1회 조회, DB 페이징 다 소진된 뒤에만 화면에 펼침)
let tmdbRevealed   = false;
let dbTmdbIds      = new Set();

const workGrid = document.getElementById('workGrid');
// 그리드 구조: [...DB카드][더보기 버튼(있으면)]
// 더보기 클릭 시: DB에 다음 페이지가 있으면 그걸 먼저 채우고, DB가 다 떨어지면 그다음 클릭부터 TMDB 보충 결과를 펼침
let dbInsertMarker = null; // "더보기"로 불러온 새 DB카드가 항상 이 앞(=버튼 앞)에 꽂히는 기준점

function hasPoster(w){ return !!w.poster_path; } // 포스터 없는 작품은 목록에서 제외

async function loadDbPage(){
  const res = await fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=${PAGE_SIZE}&offset=${dbOffset}`);
  if(!res.ok) return { data: [], has_more: false };
  return res.json();
}

function appendDbWorks(list){
  list.filter(hasPoster).forEach(w=>{
    dbTmdbIds.add(w.tmdb_id);
    workGrid.insertBefore(workCard(w), dbInsertMarker);
  });
}

function shouldShowMore(){
  return dbHasMore || (!tmdbRevealed && tmdbFixed.length > 0);
}

function updateWorkCount(){
  const shown = workGrid.querySelectorAll('.work-card').length;
  document.getElementById('cntWorks').textContent = shown + (tmdbRevealed ? 0 : tmdbFixed.length);
}

async function loadMore(btn){
  btn.disabled = true;
  btn.textContent = '불러오는 중...';

  if(dbHasMore){
    // ① 우리 DB에 다음 페이지가 남아있으면 그것부터
    dbOffset += PAGE_SIZE;
    const j = await loadDbPage();
    appendDbWorks(j.data || []);
    dbHasMore = !!j.has_more;
  } else if(!tmdbRevealed){
    // ② DB가 다 떨어졌으면 그제서야 TMDB 보충 결과를 펼침
    tmdbFixed.forEach(w=>workGrid.insertBefore(workCard(w), dbInsertMarker));
    tmdbRevealed = true;
  }

  btn.disabled = false;
  btn.textContent = '더보기';
  if(!shouldShowMore()) btn.closest('.more-wrap')?.remove();
  updateWorkCount();
}

function renderMoreButton(){
  document.querySelector('.more-wrap')?.remove();
  if(!shouldShowMore()) return;
  const wrap = document.createElement('div');
  wrap.className = 'more-wrap';
  wrap.innerHTML = `<button class="more-btn">더보기</button>`;
  wrap.querySelector('.more-btn').onclick = (e)=>loadMore(e.target);
  workGrid.insertBefore(wrap, dbInsertMarker.nextSibling);
}

async function runSearch(){
  const personGrid = document.getElementById('personGrid');

  if(!q){
    workGrid.innerHTML = `<div class="empty">검색어를 입력해주세요.</div>`;
    return;
  }

  try{
    const [dbRes, tvRes, mvRes, personRes] = await Promise.allSettled([
      fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=${PAGE_SIZE}&offset=0`),
      fetch(`${TMDB_PROXY}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR&include_adult=false`),
      fetch(`${TMDB_PROXY}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR&include_adult=false`),
      fetch(`${TMDB_PROXY}/search/person?query=${encodeURIComponent(q)}&language=ko-KR`),
    ]);

    // 우리 DB 작품 (제목+키워드 통합검색, 15개)
    let dbWorks = [];
    if(dbRes.status==='fulfilled' && dbRes.value.ok){
      const j = await dbRes.value.json();
      dbWorks  = j.data || [];
      dbHasMore = !!j.has_more;
    }
    dbTmdbIds = new Set(dbWorks.map(w=>w.tmdb_id));

    // TMDB TV/영화 (DB에 이미 있는 건 제외, 성인물 제외) — 보충 결과, 페이징 없음
    let tmdbTv = [];
    if(tvRes.status==='fulfilled' && tvRes.value.ok){
      const j = await tvRes.value.json();
      tmdbTv = (j.results||[]).filter(r=>!r.adult).filter(r=>!dbTmdbIds.has(r.id))
        .map(r=>({...r, _type:'tv', tmdb_id:r.id}));
    }
    let tmdbMv = [];
    if(mvRes.status==='fulfilled' && mvRes.value.ok){
      const j = await mvRes.value.json();
      tmdbMv = (j.results||[]).filter(r=>!r.adult).filter(r=>!dbTmdbIds.has(r.id))
        .map(r=>({...r, _type:'movie', tmdb_id:r.id}));
    }
    tmdbFixed = [...tmdbTv, ...tmdbMv].filter(hasPoster);

    // 인물
    let persons = [];
    if(personRes.status==='fulfilled' && personRes.value.ok){
      const j = await personRes.value.json();
      persons = (j.results||[]);
    }

    // ── 작품 렌더링: DB 작품(15개)만 먼저 표시. TMDB 보충 결과는 "더보기"로 DB 소진 후에 펼침 ──
    workGrid.innerHTML = '';
    dbInsertMarker = document.createElement('span');
    dbInsertMarker.style.display = 'none';
    workGrid.appendChild(dbInsertMarker);

    appendDbWorks(dbWorks);

    const shownCount = workGrid.querySelectorAll('.work-card').length;
    if(shownCount===0 && !tmdbFixed.length){
      workGrid.innerHTML = `<div class="empty">작품 검색 결과가 없습니다.</div>`;
    } else {
      renderMoreButton();
    }
    updateWorkCount();

    // ── 인물 렌더링 ──
    personGrid.innerHTML = '';
    persons.forEach(p=>personGrid.appendChild(personCard(p)));
    if(persons.length===0) personGrid.innerHTML = `<div class="empty">인물 검색 결과가 없습니다.</div>`;
    document.getElementById('cntPersons').textContent = persons.length;

  }catch(e){
    console.warn('검색 실패:', e);
    workGrid.innerHTML = `<div class="empty">검색 중 오류가 발생했습니다.</div>`;
  }
}

runSearch();
</script>

</body>
</html>
