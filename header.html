<!-- ══════════════════════════════════════════════
     오뜨랑 공용 헤더 (header.html)
     사용법: 각 페이지 <body> 상단에 JS로 삽입
     <script>
       fetch('/header.html').then(r=>r.text()).then(h=>{
         document.getElementById('ottrang-header').innerHTML=h;
         initHeader();
       });
     </script>
     ══════════════════════════════════════════════ -->

<!-- ── 헤더 CSS ── -->
<style id="header-style">
:root {
  --bg:#0c0c10;
  --bg2:#13131a;
  --bg3:#1a1a24;
  --card:#16161f;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.16);
  --text:#ededf0;
  --muted:#7a7a96;
  --muted2:#a0a0bc;
  --accent:#e63946;
  --gold:#f0b429;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif;
  --r:10px;
  --max-w:1440px;
}
.ottrang-header-outer {
  background:rgba(12,12,16,.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  font-family:var(--sans);
}
.ottrang-header-inner {
  max-width:var(--max-w);margin:0 auto;
  padding:0 28px;height:64px;
  display:flex;align-items:center;gap:24px;
}
.ottrang-logo {
  text-decoration:none;display:flex;align-items:center;flex-shrink:0;
}
.ottrang-logo-img {
  height:44px;
  width:auto;
  max-width:220px;
  object-fit:contain;
  /* 검정 배경 로고 → 다크 헤더에 자연스럽게 합성 */
  mix-blend-mode:lighten;
  display:block;
}
.ottrang-nav { display:flex;gap:2px;flex-shrink:0; }
.ottrang-nav a {
  padding:7px 14px;border-radius:7px;
  color:var(--muted2);font-size:15px;font-weight:500;
  text-decoration:none;white-space:nowrap;
  transition:all .15s;
}
.ottrang-nav a:hover,
.ottrang-nav a.on { color:var(--text);background:var(--bg3); }

/* 검색 */
.ottrang-search-wrap { margin-left:auto;position:relative;flex-shrink:0; }
.ottrang-search-input {
  width:220px;height:40px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:22px;padding:0 40px 0 16px;
  color:var(--text);font-family:var(--sans);font-size:14px;
  outline:none;transition:all .2s;
}
.ottrang-search-input::placeholder { color:var(--muted); }
.ottrang-search-input:focus { width:300px;border-color:var(--border2);background:var(--bg2); }
.ottrang-search-icon {
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;
  display:flex;align-items:center;
}
.ottrang-search-results {
  display:none;position:absolute;top:46px;left:0;right:0;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px;overflow:hidden;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  min-width:320px;
}
.ottrang-search-results.show { display:block; }

/* 섹션 헤더 (DB결과 / TMDB결과 / 인물) */
.ottrang-sr-section {
  padding:6px 16px 4px;
  font-size:10px;font-family:var(--mono);letter-spacing:.8px;font-weight:600;
  color:var(--muted);background:var(--bg3);border-bottom:1px solid var(--border);
  text-transform:uppercase;
}

/* 검색 결과 아이템 공통 */
.ottrang-sr-item {
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;cursor:pointer;transition:background .12s;
  text-decoration:none;
}
.ottrang-sr-item:hover { background:var(--bg3); }

/* 포스터 썸네일 */
.ottrang-sr-poster {
  width:28px;height:42px;object-fit:cover;
  border-radius:3px;flex-shrink:0;background:var(--bg3);
}
.ottrang-sr-poster-ph {
  width:28px;height:42px;border-radius:3px;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:14px;
}

/* 인물 프로필 */
.ottrang-sr-profile {
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  flex-shrink:0;background:var(--bg3);
}
.ottrang-sr-profile-ph {
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:16px;
}

/* 텍스트 영역 */
.ottrang-sr-info { flex:1;min-width:0; }
.ottrang-sr-title {
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ottrang-sr-meta {
  font-size:11px;color:var(--muted);font-family:var(--mono);
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 뱃지 */
.ottrang-sr-pf {
  font-size:10px;padding:2px 7px;border-radius:3px;
  color:#fff;font-weight:600;flex-shrink:0;font-family:var(--mono);
}
.ottrang-sr-db {
  font-size:9px;padding:1px 5px;border-radius:3px;
  background:rgba(52,211,153,.15);color:#34d399;
  font-family:var(--mono);font-weight:600;flex-shrink:0;
}
.ottrang-sr-type {
  font-size:9px;padding:1px 5px;border-radius:3px;
  font-family:var(--mono);font-weight:600;flex-shrink:0;
}

/* 로딩 / 빈 결과 */
.ottrang-sr-empty { padding:18px;text-align:center;font-size:14px;color:var(--muted); }
.ottrang-sr-loading {
  padding:14px 16px;text-align:center;font-size:12px;
  color:var(--muted);font-family:var(--mono);
}

/* 전체 결과 보기 */
.ottrang-sr-more {
  display:block;padding:10px 16px;text-align:center;
  font-size:12px;color:var(--accent);font-weight:500;
  border-top:1px solid var(--border);
  background:transparent;cursor:pointer;
  text-decoration:none;transition:background .12s;
}
.ottrang-sr-more:hover { background:var(--bg3); }

.ottrang-sr-rank { font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0; }

/* 우측 버튼 */
.ottrang-hright { display:flex;align-items:center;gap:10px;flex-shrink:0; }
.ottrang-btn-login {
  padding:8px 16px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text);font-family:var(--sans);font-size:14px;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.ottrang-btn-login:hover { background:var(--bg3); }
.ottrang-btn-join {
  padding:8px 18px;border-radius:8px;
  background:var(--accent);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:500;
  border:none;cursor:pointer;white-space:nowrap;transition:background .15s;
}
.ottrang-btn-join:hover { background:#ff4d58; }
.ottrang-btn-user {
  display:none;align-items:center;gap:8px;
  padding:7px 14px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text);font-family:var(--sans);font-size:14px;
  cursor:pointer;white-space:nowrap;transition:background .15s;
  text-decoration:none;
}
.ottrang-btn-user:hover { background:var(--bg3); }
.ottrang-btn-user .u-nick { font-weight:500; }

/* 슬로건 배너 */
.ottrang-banner {
  background:var(--bg2);border-bottom:1px solid var(--border);
  font-family:var(--sans);
}
.ottrang-banner-inner {
  max-width:var(--max-w);margin:0 auto;
  padding:10px 28px;display:flex;align-items:center;justify-content:center;
}
.ottrang-slogan { font-size:13px;color:var(--muted2);letter-spacing:.3px;text-align:center; }
.ottrang-slogan b {
  background:linear-gradient(90deg,#FF5177,#FF9A3C);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-weight:700;
}

/* 모바일 */
@media(max-width:768px){
  .ottrang-header-inner { padding:0 16px;gap:12px; }
  .ottrang-nav { display:none; }
  .ottrang-search-input { width:160px; }
  .ottrang-search-input:focus { width:200px; }
}
</style>

<!-- ── 헤더 HTML ── -->
<div class="ottrang-header-outer">
  <div class="ottrang-header-inner">
    <a class="ottrang-logo" href="/" aria-label="오뜨랑 홈">
      <img
        class="ottrang-logo-img"
        src="/logo.png"
        alt="오뜨랑 OTTRANK"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
      >
      <!-- 이미지 로드 실패 시 텍스트 폴백 -->
      <span style="display:none;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#ededf0;line-height:1">오뜨랑<span style="color:#e63946">.</span></span>
    </a>
    <nav class="ottrang-nav" id="ottrangNav">
      <a href="/#tv" id="navTV">TV 시리즈</a>
      <a href="/#movie" id="navMovie">영화</a>
      <a href="/#youtube" id="navYt">유튜브</a>
      <a href="/#community" id="navComm">커뮤니티</a>
    </nav>
    <div class="ottrang-search-wrap">
      <input class="ottrang-search-input" id="ottrangSearch" type="text"
        placeholder="🔍 작품, 배우, 감독 검색"
        oninput="ottrangOnSearch(this.value)"
        onfocus="ottrangShowSR()"
        onblur="setTimeout(ottrangHideSR,200)"
        autocomplete="off">
      <button class="ottrang-search-icon"
        onclick="document.getElementById('ottrangSearch').focus()"
        aria-label="검색">⌕</button>
      <div class="ottrang-search-results" id="ottrangSearchResults"></div>
    </div>
    <div class="ottrang-hright" id="ottrangHright">
      <button class="ottrang-btn-login" id="ottrangBtnLogin">로그인</button>
      <button class="ottrang-btn-join" id="ottrangBtnJoin">1초 가입</button>
      <a class="ottrang-btn-user" id="ottrangBtnUser" href="/mypage.html">
        <span class="u-nick" id="ottrangNick"></span>
      </a>
    </div>
  </div>
</div>
<div class="ottrang-banner">
  <div class="ottrang-banner-inner">
    <p class="ottrang-slogan">오늘 OTT 뭐 볼까?&nbsp;&nbsp;<b>오뜨랑(OTTRANK)에서 확인</b>&nbsp;&nbsp;—&nbsp;&nbsp; 현재 베타버전 테스트 중, 26년 7월 1일 정식 오픈 </p>
  </div>
</div>

<script>
/* ── 헤더 공용 JS ── */
function initHeader(){
  /* 현재 페이지에 맞는 nav 활성화 */
  const path=location.pathname;
  if(path==='/'||path==='/index.html') document.getElementById('navTV')?.classList.add('on');
  else if(path.includes('title')) { /* 작품 상세 - 없음 */ }

  /* 로그인 상태 확인 */
  const API='https://ottrank-api.tdidream.workers.dev';

  // 기본값으로 먼저 onclick 설정
  const _btnLogin=document.getElementById('ottrangBtnLogin');
  const _btnJoin=document.getElementById('ottrangBtnJoin');
  if(_btnLogin) _btnLogin.onclick=()=>{ location.href='/login.html'; };
  if(_btnJoin)  _btnJoin.onclick=()=>{ location.href='/login.html'; };

  // URL에서 sid 추출 후 localStorage 저장
  const _urlSid=new URLSearchParams(location.search).get('sid');
  if(_urlSid){
    localStorage.setItem('ottrang_sid', _urlSid);
    // URL에서 sid 파라미터 제거
    const _url=new URL(location.href);
    _url.searchParams.delete('sid');
    history.replaceState({},'',_url.toString());
  }

  (async()=>{
    try {
      const sid=localStorage.getItem('ottrang_sid');
      const fetchOpts = sid
        ? { headers:{ Authorization:`Bearer ${sid}` } }
        : { credentials:'include' };
      const res=await fetch(`${API}/auth/me`, fetchOpts);
      const data=await res.json();
      const btnLogin=document.getElementById('ottrangBtnLogin');
      const btnJoin=document.getElementById('ottrangBtnJoin');
      const btnUser=document.getElementById('ottrangBtnUser');
      const nick=document.getElementById('ottrangNick');
      if(data.ok && data.user){
        // 로그인 상태
        if(btnLogin) btnLogin.style.display='none';
        if(btnJoin)  btnJoin.style.display='none';
        if(btnUser){ btnUser.style.display='flex'; }
        if(nick) nick.textContent=data.user.nickname||'유저';
      } else {
        // 비로그인 상태 - localStorage 초기화
        localStorage.removeItem('ottrang_sid');
        if(btnLogin){
          btnLogin.style.display='';
          btnLogin.onclick=()=>{ location.href='/login.html'; };
        }
        if(btnJoin){
          btnJoin.style.display='';
          btnJoin.onclick=()=>{ location.href='/login.html'; };
        }
        if(btnUser) btnUser.style.display='none';
      }
    } catch(e) {
      const btnLogin=document.getElementById('ottrangBtnLogin');
      const btnJoin=document.getElementById('ottrangBtnJoin');
      if(btnLogin) btnLogin.onclick=()=>{ location.href='/login.html'; };
      if(btnJoin)  btnJoin.onclick=()=>{ location.href='/login.html'; };
    }
  })();

  /* ── 검색 드롭다운 ── */
  window.ottrangShowSR = function() {
    const el = document.getElementById('ottrangSearchResults');
    if (el && el.innerHTML.trim()) el.classList.add('show');
  };
  window.ottrangHideSR = function() {
    document.getElementById('ottrangSearchResults')?.classList.remove('show');
  };

  /* 검색 디바운스 타이머 */
  let _srTimer = null;

  window.ottrangOnSearch = function(q) {
    clearTimeout(_srTimer);
    const el = document.getElementById('ottrangSearchResults');
    if (!el) return;
    if (!q || q.length < 2) {
      el.innerHTML = '';
      el.classList.remove('show');
      return;
    }
    // 로딩 표시
    el.innerHTML = '<div class="ottrang-sr-loading">검색 중...</div>';
    el.classList.add('show');
    _srTimer = setTimeout(() => _runSearch(q), 350);
  };

  async function _runSearch(q) {
    const el = document.getElementById('ottrangSearchResults');
    if (!el) return;

    const API        = 'https://ottrank-api.tdidream.workers.dev';
    const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
    const IMG        = 'https://image.tmdb.org/t/p/w92';
    const PC  = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브' };
    const PCO = { netflix:'넷플', tving:'티빙', disney:'디즈니', coupang:'쿠팡', wavve:'웨이브' };
    const CC  = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3' };

    /* slug 생성 헬퍼 */
    function _slug(tmdb_id) {
      return `/title/1-${new Date().getFullYear()}${tmdb_id}`;
    }

    /* 작품 아이템 HTML */
    function _workItem(w, isDB) {
      const poster  = w.poster_path ? `<img class="ottrang-sr-poster" src="${IMG}${w.poster_path}" alt="" loading="lazy">` : `<div class="ottrang-sr-poster-ph">🎬</div>`;
      const title   = w.title_ko || w.title || w.name || '';
      const titleEn = w.title_en || w.original_title || w.original_name || '';
      const year    = (w.release_year || (w.first_air_date || w.release_date || '').slice(0, 4)) || '';
      const mtype   = w.media_type || w._type || '';
      const typeLabel = mtype === 'movie' ? '영화' : 'TV';
      const typeColor = mtype === 'movie' ? 'rgba(240,180,41,.8)' : 'rgba(55,138,221,.8)';
      const dbBadge   = isDB ? '<span class="ottrang-sr-db">DB</span>' : '';
      const slug      = w.tmdb_id ? _slug(w.tmdb_id) : '#';
      // sessionStorage에 작품 정보 저장 후 이동 (기존 패턴 유지)
      const goWork = w.tmdb_id
        ? `(function(){` +
            `sessionStorage.setItem('ottrang_work',JSON.stringify({` +
              `tmdb_id:${w.tmdb_id},` +
              `type:'${mtype || 'tv'}',` +
              `platform:'',` +
              `rank:1,` +
              `title:'${title.replace(/'/g, '').replace(/"/g, '')}',` +
              `season:1,year:${new Date().getFullYear()}` +
            `}));` +
            `location.href='${slug}';` +
          `})()`
        : `location.href='#'`;

      return `<div class="ottrang-sr-item" onclick="${goWork}">
        ${poster}
        <div class="ottrang-sr-info">
          <div class="ottrang-sr-title">${_hesc(title)}</div>
          <div class="ottrang-sr-meta">${_hesc(titleEn)}${year ? ` · ${year}` : ''}</div>
        </div>
        <span class="ottrang-sr-type" style="background:${typeColor};color:#fff">${typeLabel}</span>
        ${dbBadge}
      </div>`;
    }

    /* 인물 아이템 HTML */
    function _personItem(p, isDB) {
      const profile   = p.profile_path ? `<img class="ottrang-sr-profile" src="${IMG}${p.profile_path}" alt="" loading="lazy">` : `<div class="ottrang-sr-profile-ph">👤</div>`;
      const name      = p.name || '';
      const knownFor  = (p.known_for || []).map(k => k.title || k.name).slice(0, 2).join(', ');
      const dept      = p.known_for_department || '';
      const dbBadge   = isDB ? '<span class="ottrang-sr-db">DB</span>' : '';
      const personUrl = `/person.html?id=${p.id || p.tmdb_person_id}`;

      return `<div class="ottrang-sr-item" onclick="location.href='${personUrl}'">
        ${profile}
        <div class="ottrang-sr-info">
          <div class="ottrang-sr-title">${_hesc(name)}</div>
          <div class="ottrang-sr-meta">${dept}${knownFor ? ` · ${knownFor}` : ''}</div>
        </div>
        ${dbBadge}
      </div>`;
    }

    /* HTML 이스케이프 */
    function _hesc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    try {
      // ① 우리 DB works 검색 + TMDB 작품/인물 검색 병렬 실행
      const [dbRes, tvRes, mvRes, personRes] = await Promise.allSettled([
        fetch(`${API}/admin/works?q=${encodeURIComponent(q)}`, {
          headers: { Authorization: `Bearer ${localStorage.getItem('ottrang_sid') || ''}` }
        }),
        fetch(`${TMDB_PROXY}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/person?query=${encodeURIComponent(q)}&language=ko-KR`),
      ]);

      // DB 결과
      let dbWorks = [];
      if (dbRes.status === 'fulfilled' && dbRes.value.ok) {
        const dbJson = await dbRes.value.json();
        dbWorks = (dbJson.data || []).slice(0, 4);
      }
      const dbTmdbIds = new Set(dbWorks.map(w => w.tmdb_id));

      // TMDB TV 결과
      let tmdbTv = [];
      if (tvRes.status === 'fulfilled' && tvRes.value.ok) {
        const tvJson = await tvRes.value.json();
        tmdbTv = (tvJson.results || [])
          .filter(r => !dbTmdbIds.has(r.id))   // DB에 이미 있는 건 제외
          .slice(0, 3)
          .map(r => ({ ...r, _type: 'tv', tmdb_id: r.id }));
      }

      // TMDB 영화 결과
      let tmdbMv = [];
      if (mvRes.status === 'fulfilled' && mvRes.value.ok) {
        const mvJson = await mvRes.value.json();
        tmdbMv = (mvJson.results || [])
          .filter(r => !dbTmdbIds.has(r.id))
          .slice(0, 3)
          .map(r => ({ ...r, _type: 'movie', tmdb_id: r.id }));
      }

      // TMDB 인물 결과
      let tmdbPersons = [];
      if (personRes.status === 'fulfilled' && personRes.value.ok) {
        const pJson = await personRes.value.json();
        tmdbPersons = (pJson.results || []).slice(0, 3);
      }

      // 결과가 아무것도 없으면
      const totalCount = dbWorks.length + tmdbTv.length + tmdbMv.length + tmdbPersons.length;
      if (totalCount === 0) {
        el.innerHTML = `<div class="ottrang-sr-empty">검색 결과가 없습니다</div>`;
        el.classList.add('show');
        return;
      }

      // ── 렌더링 ──
      let html = '';

      // [우리 DB 작품]
      if (dbWorks.length) {
        html += `<div class="ottrang-sr-section">🗄️ 오뜨랑 DB</div>`;
        html += dbWorks.map(w => _workItem(w, true)).join('');
      }

      // [TMDB 작품 — DB에 없는 것]
      const tmdbWorks = [...tmdbTv, ...tmdbMv];
      if (tmdbWorks.length) {
        html += `<div class="ottrang-sr-section">🎬 작품</div>`;
        html += tmdbWorks.map(w => _workItem(w, false)).join('');
      }

      // [인물]
      if (tmdbPersons.length) {
        html += `<div class="ottrang-sr-section">👤 인물</div>`;
        html += tmdbPersons.map(p => _personItem(p, false)).join('');
      }

      // [전체 결과 보기]
      html += `<a class="ottrang-sr-more" href="/search.html?q=${encodeURIComponent(q)}">전체 검색 결과 보기 →</a>`;

      el.innerHTML = html;
      el.classList.add('show');

    } catch(e) {
      el.innerHTML = `<div class="ottrang-sr-empty">검색 중 오류가 발생했습니다</div>`;
    }
  }
} // initHeader 끝
/* 헤더가 직접 삽입된 경우 자동 초기화 */
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initHeader);
} else { initHeader(); }
</script>
