<!-- ══════════════════════════════════════════════
     오뜨랑 공용 헤더 (header.html)
     사용법: 각 페이지 <body> 상단에 JS로 삽입
     <script>
       fetch('/header.html').then(r=>r.text()).then(h=>{
         document.getElementById('ottrang-header').innerHTML=h;
         initHeader();
       });
     </script>
     ══════════════════════════════════════════════ -->

<!-- ── 헤더 CSS ── -->
<style id="header-style">
:root {
  --bg:#0c0c10;
  --bg2:#13131a;
  --bg3:#1a1a24;
  --card:#16161f;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.16);
  --text:#ededf0;
  --muted:#7a7a96;
  --muted2:#a0a0bc;
  --accent:#e63946;
  --gold:#f0b429;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif;
  --r:10px;
  --max-w:1440px;
}
.ottrang-header-outer {
  background:rgba(12,12,16,.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  font-family:var(--sans);
}
.ottrang-header-inner {
  max-width:var(--max-w);margin:0 auto;
  padding:0 28px;height:64px;
  display:flex;align-items:center;gap:24px;
}
.ottrang-logo {
  text-decoration:none;display:flex;align-items:center;flex-shrink:0;
}
.ottrang-logo-img {
  height:44px;
  width:auto;
  max-width:220px;
  object-fit:contain;
  /* 검정 배경 로고 → 다크 헤더에 자연스럽게 합성 */
  mix-blend-mode:lighten;
  display:block;
}
.ottrang-nav { display:flex;gap:2px;flex-shrink:0;flex:1; }
.ottrang-nav a {
  padding:7px 14px;border-radius:7px;
  color:var(--muted2);font-size:15px;font-weight:500;
  text-decoration:none;white-space:nowrap;
  transition:all .15s;
}
.ottrang-nav a:hover,
.ottrang-nav a.on { color:var(--text);background:var(--bg3); }

/* 검색 */
.ottrang-search-wrap { position:relative;flex-shrink:0; }
.ottrang-search-input {
  width:220px;height:40px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:22px;padding:0 40px 0 16px;
  color:var(--text);font-family:var(--sans);font-size:14px;
  outline:none;
}
.ottrang-search-input::placeholder { color:var(--muted); }
.ottrang-search-input:focus { border-color:var(--border2);background:var(--bg2); }
.ottrang-search-icon {
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;
  display:flex;align-items:center;
}
.ottrang-search-results {
  display:none;position:absolute;top:46px;left:0;right:0;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:12px;overflow-y:auto;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  min-width:320px;max-height:520px;
}
.ottrang-search-results.show { display:block; }

/* 섹션 헤더 (DB결과 / TMDB결과 / 인물) */
.ottrang-sr-section {
  padding:6px 16px 4px;
  font-size:10px;font-family:var(--mono);letter-spacing:.8px;font-weight:600;
  color:var(--muted);background:var(--bg3);border-bottom:1px solid var(--border);
  text-transform:uppercase;
}

/* 검색 결과 아이템 공통 */
.ottrang-sr-item {
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;cursor:pointer;transition:background .12s;
  text-decoration:none;
}
.ottrang-sr-item:hover { background:var(--bg3); }

/* 포스터 썸네일 */
.ottrang-sr-poster {
  width:28px;height:42px;object-fit:cover;
  border-radius:3px;flex-shrink:0;background:var(--bg3);
}
.ottrang-sr-poster-ph {
  width:28px;height:42px;border-radius:3px;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:14px;
}

/* 인물 프로필 */
.ottrang-sr-profile {
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  flex-shrink:0;background:var(--bg3);
}
.ottrang-sr-profile-ph {
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:16px;
}

/* 텍스트 영역 */
.ottrang-sr-info { flex:1;min-width:0; }
.ottrang-sr-title {
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ottrang-sr-meta {
  font-size:11px;color:var(--muted);font-family:var(--mono);
  margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 뱃지 */
.ottrang-sr-pf {
  font-size:10px;padding:2px 7px;border-radius:3px;
  color:#fff;font-weight:600;flex-shrink:0;font-family:var(--mono);
}
.ottrang-sr-db {
  font-size:9px;padding:1px 5px;border-radius:3px;
  background:rgba(52,211,153,.15);color:#34d399;
  font-family:var(--mono);font-weight:600;flex-shrink:0;
}
.ottrang-sr-type {
  font-size:9px;padding:1px 5px;border-radius:3px;
  font-family:var(--mono);font-weight:600;flex-shrink:0;
}

/* 로딩 / 빈 결과 */
.ottrang-sr-empty { padding:18px;text-align:center;font-size:14px;color:var(--muted); }
.ottrang-sr-loading {
  padding:14px 16px;text-align:center;font-size:12px;
  color:var(--muted);font-family:var(--mono);
}

/* 전체 결과 보기 */
.ottrang-sr-more {
  display:block;padding:10px 16px;text-align:center;
  font-size:12px;color:var(--accent);font-weight:500;
  border-top:1px solid var(--border);
  background:transparent;cursor:pointer;
  text-decoration:none;transition:background .12s;
}
.ottrang-sr-more:hover { background:var(--bg3); }

.ottrang-sr-rank { font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0; }

/* 우측 버튼 */
.ottrang-hright { display:flex;align-items:center;gap:10px;flex-shrink:0; }
.ottrang-btn-login {
  padding:8px 16px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text);font-family:var(--sans);font-size:14px;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.ottrang-btn-login:hover { background:var(--bg3); }
.ottrang-btn-join {
  padding:8px 18px;border-radius:8px;
  background:var(--accent);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:500;
  border:none;cursor:pointer;white-space:nowrap;transition:background .15s;
}
.ottrang-btn-join:hover { background:#ff4d58; }
.ottrang-btn-user {
  display:none;align-items:center;gap:8px;
  padding:7px 14px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text);font-family:var(--sans);font-size:14px;
  cursor:pointer;white-space:nowrap;transition:background .15s;
  text-decoration:none;
}
.ottrang-btn-user:hover { background:var(--bg3); }
.ottrang-btn-user .u-nick { font-weight:600; color:#f0b429; font-size:14px; }

/* 슬로건 배너 */
.ottrang-banner {
  background:var(--bg2);border-bottom:1px solid var(--border);
  font-family:var(--sans);
}
.ottrang-banner-inner {
  max-width:var(--max-w);margin:0 auto;
  padding:10px 28px;display:flex;align-items:center;justify-content:center;
}
.ottrang-slogan { font-size:13px;color:var(--muted2);letter-spacing:.3px;text-align:center; }
.ottrang-slogan b {
  background:linear-gradient(90deg,#FF5177,#FF9A3C);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-weight:700;
}

/* ══ 모바일 전용 요소 — 데스크톱에서는 숨김 ══ */
.ottrang-mob-search-btn { display:none; }
.ottrang-mob-ham-btn    { display:none; }

/* ══ 모바일 검색 오버레이 ══ */
.ottrang-mob-search-overlay { display:none !important; } /* 오버레이 방식 미사용 */
.ottrang-mob-search-bar {
  background:rgba(12,12,16,0.96);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:8px 16px;
  height:64px; /* 헤더와 같은 높이 */
  display:flex;align-items:center;gap:10px;
}
.ottrang-mob-search-back {
  width:36px;height:36px;flex-shrink:0;
  border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--muted2);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.ottrang-mob-search-input {
  flex:1;height:42px;
  background:var(--bg3);border:1px solid rgba(255,255,255,0.12);
  border-radius:22px;padding:0 18px;
  color:var(--text);font-family:var(--sans);font-size:15px;
  outline:none;
}
.ottrang-mob-search-input::placeholder { color:var(--muted); }
.ottrang-mob-search-input:focus { border-color:rgba(230,57,70,0.5); }
.ottrang-mob-search-results {
  flex:1;overflow-y:auto;
  background:rgba(12,12,16,0.92);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* ══ 햄버거 드로어 ══ */
/* 오버레이 (드로어 바깥 어두운 배경) */
.ottrang-drawer-overlay {
  display:none;
  position:fixed;inset:0;z-index:9998;  /* 드로어보다 1 낮게 */
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(2px);
}
.ottrang-drawer-overlay.show { display:block; }

/* 드로어 본체 */
.ottrang-drawer {
  position:fixed;top:0;right:0;bottom:0;left:auto;
  /* 폭: 뷰포트의 85% - 20px 여백 → 어떤 화면/컨테이너 폭이든 절대 짤리지 않음 */
  width:calc(85vw - 20px);
  max-width:300px;
  z-index:9999;
  background:#1e1e2a;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow-x:hidden;overflow-y:auto;
  box-shadow:-8px 0 32px rgba(0,0,0,0.6);
}
.ottrang-drawer.open { transform:translateX(0); }

/* 드로어 — 헤더 줄 */
.ottrang-drawer-head {
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 12px 16px;           /* 좌우 동일 여백 */
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
  gap:8px;
}
/* 드로어 로고 이미지 */
.ottrang-drawer-logo {
  display:flex;align-items:center;text-decoration:none;flex-shrink:0;
}
.ottrang-drawer-logo-img {
  height:36px;width:auto;max-width:160px;
  object-fit:contain;mix-blend-mode:lighten;display:block;
}
.ottrang-drawer-logo-txt {
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:2px;color:#ededf0;line-height:1;
}
.ottrang-drawer-logo-txt span { color:#e63946; }
.ottrang-drawer-close {
  height:32px;padding:0 10px;
  flex-shrink:0;                         /* 절대 줄어들지 않도록 */
  border-radius:6px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--muted2);font-size:12px;font-family:var(--sans);
  cursor:pointer;display:flex;align-items:center;gap:4px;
  transition:background .15s;white-space:nowrap;
}
.ottrang-drawer-close:hover { background:rgba(255,255,255,0.1); }

/* 드로어 — 로그인/프로필 영역 */
.ottrang-drawer-auth {
  padding:12px 16px 12px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
/* 비로그인 */
.ottrang-drawer-auth-btns {
  display:flex;gap:8px;
}
.ottrang-drawer-btn-login {
  flex:1;height:38px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.16);background:transparent;
  color:#ededf0;font-family:var(--sans);font-size:13px;
  cursor:pointer;transition:background .15s;white-space:nowrap;
  min-width:0;                           /* flex 항목이 줄어들 수 있게 */
}
.ottrang-drawer-btn-login:hover { background:rgba(255,255,255,0.07); }
.ottrang-drawer-btn-join {
  flex:1;height:38px;border-radius:8px;
  background:#e63946;border:none;
  color:#fff;font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;transition:background .15s;white-space:nowrap;
  min-width:0;
}
.ottrang-drawer-btn-join:hover { background:#ff4d58; }
/* 로그인 상태 — 프로필 */
.ottrang-drawer-profile {
  display:flex;align-items:center;gap:12px;
  text-decoration:none;cursor:pointer;
  padding:4px 0;                         /* 클릭 영역 넉넉하게 */
}
/* MYPAGE 태그 */
.ottrang-drawer-mypage-tag {
  display:inline-block;margin-top:5px;
  font-size:10px;font-weight:600;letter-spacing:1px;
  color:#e63946;background:rgba(230,57,70,0.12);
  border:1px solid rgba(230,57,70,0.3);
  border-radius:4px;padding:2px 7px;
  font-family:'DM Mono',monospace;
}
.ottrang-drawer-avatar {
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:rgba(230,57,70,0.18);border:1.5px solid rgba(230,57,70,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#e63946;overflow:hidden;
}
.ottrang-drawer-avatar img { width:100%;height:100%;object-fit:cover;display:block; }
.ottrang-drawer-user-info { flex:1;min-width:0; }
.ottrang-drawer-nick {
  font-size:15px;font-weight:700;color:#ededf0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ottrang-drawer-meta {
  font-size:11px;color:var(--muted);margin-top:3px;
  font-family:'DM Mono',monospace;letter-spacing:0.3px;
}
.ottrang-drawer-meta .mbti-tag {
  color:#7ec8e3;
}
.ottrang-drawer-chevron {
  color:var(--muted);font-size:16px;flex-shrink:0;
}

/* 드로어 — 메뉴 리스트 */
.ottrang-drawer-nav {
  flex:1;padding:4px 0;
}
.ottrang-drawer-nav-item {
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;  /* 좌우 동일, 세로 최소화 */
  color:#a0a0bc;font-size:15px;font-weight:500;
  text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,0.04);
  transition:background .12s,color .12s;
  cursor:pointer;
}
.ottrang-drawer-nav-item:hover,
.ottrang-drawer-nav-item.on {
  background:rgba(255,255,255,0.05);
  color:#ededf0;
}
.ottrang-drawer-nav-item.on { color:#fff; }
/* 플랫폼 컬러 도트 */
.ottrang-drawer-dot {
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
}
/* 홈 아이콘 (도트 대신) */
.ottrang-drawer-home-icon {
  width:9px;height:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
}
.ottrang-drawer-nav-arrow {
  margin-left:auto;color:rgba(255,255,255,0.2);font-size:14px;flex-shrink:0;
}
.ottrang-drawer-nav-item:hover .ottrang-drawer-nav-arrow,
.ottrang-drawer-nav-item.on .ottrang-drawer-nav-arrow {
  color:rgba(255,255,255,0.45);
}
/* 메뉴 텍스트 래퍼 — 가로 인라인 배치 */
.ottrang-drawer-nav-text {
  display:flex;flex-direction:row;align-items:baseline;
  flex:1;min-width:0;gap:7px;
}
.ottrang-drawer-nav-ko {
  font-size:14px;font-weight:500;color:inherit;white-space:nowrap;
}
.ottrang-drawer-nav-en {
  font-size:10px;font-family:'DM Mono',monospace;
  color:rgba(255,255,255,0.28);letter-spacing:0.8px;
  white-space:nowrap;
}
.ottrang-drawer-nav-item:hover .ottrang-drawer-nav-en,
.ottrang-drawer-nav-item.on .ottrang-drawer-nav-en {
  color:rgba(255,255,255,0.5);
}
/* 드로어 안 검색창 */
.ottrang-drawer-search-wrap {
  padding:10px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.ottrang-drawer-search-inner {
  display:flex;align-items:center;gap:8px;
  background:#13131a;border:1px solid rgba(255,255,255,0.1);
  border-radius:22px;padding:0 14px;height:38px;
}
.ottrang-drawer-search-icon {
  color:rgba(255,255,255,0.3);font-size:15px;flex-shrink:0;
}
.ottrang-drawer-search-input {
  flex:1;background:none;border:none;outline:none;
  color:#ededf0;font-family:var(--sans);font-size:13px;
}
.ottrang-drawer-search-input::placeholder { color:rgba(255,255,255,0.28); }

/* 드로어 — 하단 마이페이지 버튼 (로그인 상태) */
.ottrang-drawer-footer {
  padding:12px 16px;
  border-top:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.ottrang-drawer-mypage-btn {
  display:block;width:100%;height:44px;
  border-radius:9px;
  background:rgba(230,57,70,0.1);
  border:1px solid rgba(230,57,70,0.3);
  color:#e63946;font-family:var(--sans);font-size:14px;font-weight:600;
  cursor:pointer;text-align:center;line-height:44px;
  text-decoration:none;transition:background .15s;
}
.ottrang-drawer-mypage-btn:hover { background:rgba(230,57,70,0.18); }

/* ══ 모바일 미디어쿼리 ══ */
@media(max-width:768px){
  /* 헤더 레이아웃 */
  .ottrang-header-inner { padding:0 16px;gap:0; }

  /* 데스크톱 요소 숨김 */
  .ottrang-nav          { display:none !important; }
  .ottrang-search-wrap  { display:none !important; }
  .ottrang-hright       { display:none !important; }

  /* 모바일 버튼 표시 */
  .ottrang-mob-search-btn { display:flex; }

  /* ── 헤더 검색 모드 ── */
  .ottrang-header-inner.search-mode .ottrang-logo   { display:none; }
  .ottrang-header-inner.search-mode .ottrang-hright { display:none !important; }
  .ottrang-header-inner.search-mode .ottrang-mob-right { display:none; }
  .ottrang-header-search-mode {
    display:none;
    flex:1;align-items:center;gap:8px;
  }
  .ottrang-header-inner.search-mode .ottrang-header-search-mode { display:flex; }
  /* 검색 결과 드롭다운도 모바일 전용 */
  .ottrang-header-search-results { display:none; }
  .ottrang-mob-search-back-btn {
    width:36px;height:36px;flex-shrink:0;
    border-radius:50%;background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    color:#a0a0bc;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .ottrang-header-search-input {
    flex:1;height:40px;
    background:var(--bg3);border:1px solid rgba(255,255,255,0.12);
    border-radius:22px;padding:0 18px;
    color:#ededf0;font-family:var(--sans);font-size:15px;
    outline:none;
    -webkit-text-fill-color:#ededf0;
  }
  .ottrang-header-search-input:focus { border-color:rgba(230,57,70,0.5); }
  .ottrang-header-search-input::placeholder { color:#7a7a96; }

<script>
/* ── 헤더 공용 JS ── */
function initHeader(){
  /* 현재 페이지에 맞는 nav 활성화 */
  const path=location.pathname;
  if(path==='/netflix.html')         document.getElementById('navNetflix')?.classList.add('on');
  else if(path==='/boxoffice.html')  document.getElementById('navBoxoffice')?.classList.add('on');
  else if(path==='/tving.html')      document.getElementById('navTving')?.classList.add('on');
  else if(path==='/disneyplus.html') document.getElementById('navDisney')?.classList.add('on');
  else if(path==='/coupangplay.html')document.getElementById('navCoupang')?.classList.add('on');
  else if(path==='/wavve.html')      document.getElementById('navWavve')?.classList.add('on');
  else if(path==='/community.html')  document.getElementById('navComm')?.classList.add('on');

  /* 로그인 상태 확인 */
  const API='https://ottrank-api.tdidream.workers.dev';

  // 기본값으로 먼저 onclick 설정
  const _btnLogin=document.getElementById('ottrangBtnLogin');
  const _btnJoin=document.getElementById('ottrangBtnJoin');
  if(_btnLogin) _btnLogin.onclick=()=>{ location.href='/login.html'; };
  if(_btnJoin)  _btnJoin.onclick=()=>{ location.href='/login.html'; };

  // URL에서 sid 추출 후 localStorage 저장
  const _urlSid=new URLSearchParams(location.search).get('sid');
  if(_urlSid){
    localStorage.setItem('ottrang_sid', _urlSid);
    // URL에서 sid 파라미터 제거
    const _url=new URL(location.href);
    _url.searchParams.delete('sid');
    history.replaceState({},'',_url.toString());
  }

  // ── 인증 결과를 전역 Promise로 노출 ──
  // 다른 페이지(contents_detail 등)에서 window.__ottrangAuthReady__ 를 await하면
  // 헤더의 /auth/me 결과를 그대로 재사용할 수 있어 이중 호출 & 타이밍 버그 방지
  let _authResolve;
  window.__ottrangAuthReady__ = new Promise(res => { _authResolve = res; });
  window.__ottrangUser__ = null;

  (async()=>{
    try {
      const sid=localStorage.getItem('ottrang_sid');
      // sid 있으면 Bearer + credentials 둘 다 전송 (Worker가 어느 방식이든 인증 가능하도록)
      const fetchOpts = sid
        ? { credentials:'include', headers:{ Authorization:`Bearer ${sid}` } }
        : { credentials:'include' };
      const res=await fetch(`${API}/auth/me`, fetchOpts);
      const data=await res.json();
      const btnLogin=document.getElementById('ottrangBtnLogin');
      const btnJoin=document.getElementById('ottrangBtnJoin');
      const btnUser=document.getElementById('ottrangBtnUser');
      const nick=document.getElementById('ottrangNick');
      if(data.ok && data.user){
        // 로그인 상태 — 전역에 유저 저장
        window.__ottrangUser__ = data.user;

        // 닉네임 없는 유저 → signup.html로 강제 이동 (signup.html 자체는 제외)
        const currentPath = location.pathname;
        const isSignupPage = currentPath === '/signup.html' || currentPath === '/ott_intro.html';
        if (!data.user.nickname && !isSignupPage) {
          const sid = localStorage.getItem('ottrang_sid');
          location.href = `/signup.html${sid ? '?sid=' + sid : ''}`;
          return;
        }

        if(btnLogin) btnLogin.style.display='none';
        if(btnJoin)  btnJoin.style.display='none';
        if(btnUser){ btnUser.style.display='flex'; }
        if(nick) nick.textContent=data.user.nickname||'유저';
        // ── 드로어 프로필 업데이트 (로그인 상태) ──
        _updateDrawerAuth(data.user);
      } else {
        // 비로그인 상태 - localStorage 초기화
        window.__ottrangUser__ = null;
        localStorage.removeItem('ottrang_sid');
        if(btnLogin){
          btnLogin.style.display='';
          btnLogin.onclick=()=>{ location.href='/login.html'; };
        }
        if(btnJoin){
          btnJoin.style.display='';
          btnJoin.onclick=()=>{ location.href='/login.html'; };
        }
        if(btnUser) btnUser.style.display='none';
        // ── 드로어 비로그인 상태 ──
        _updateDrawerAuth(null);
      }
    } catch(e) {
      // 네트워크 오류 시에도 반드시 null로 resolve (무한 대기 방지)
      window.__ottrangUser__ = null;
      const btnLogin=document.getElementById('ottrangBtnLogin');
      const btnJoin=document.getElementById('ottrangBtnJoin');
      if(btnLogin) btnLogin.onclick=()=>{ location.href='/login.html'; };
      if(btnJoin)  btnJoin.onclick=()=>{ location.href='/login.html'; };
    } finally {
      // 성공/실패 모두 Promise resolve → 대기 중인 페이지들에 알림
      _authResolve(window.__ottrangUser__);
    }
  })();

  /* ── 검색 드롭다운 ── */
  window.ottrangShowSR = function() {
    const el = document.getElementById('ottrangSearchResults');
    if (el && el.innerHTML.trim()) el.classList.add('show');
  };
  window.ottrangHideSR = function() {
    document.getElementById('ottrangSearchResults')?.classList.remove('show');
  };

  /* 검색 디바운스 타이머 */
  let _srTimer = null;

  window.ottrangOnSearch = function(q, immediate) {
    clearTimeout(_srTimer);
    const el = document.getElementById('ottrangSearchResults');
    if (!el) return;
    if (!q || q.length < 2) {
      el.innerHTML = '';
      el.classList.remove('show');
      return;
    }
    // 로딩 표시
    el.innerHTML = '<div class="ottrang-sr-loading">검색 중...</div>';
    el.classList.add('show');
    // 엔터/버튼 클릭이면 즉시, 타이핑이면 350ms 디바운스
    if (immediate) {
      _runSearch(q);
    } else {
      _srTimer = setTimeout(() => _runSearch(q), 350);
    }
  };

  async function _runSearch(q) {
    const el = document.getElementById('ottrangSearchResults');
    if (!el) return;

    const API        = 'https://ottrank-api.tdidream.workers.dev';
    const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
    const IMG        = 'https://image.tmdb.org/t/p/w92';
    const PC  = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브' };
    const PCO = { netflix:'넷플', tving:'티빙', disney:'디즈니', coupang:'쿠팡', wavve:'웨이브' };
    const CC  = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3' };

    /* slug 생성 헬퍼 */
    function _slug(tmdb_id) {
      return `/title/1-${new Date().getFullYear()}${tmdb_id}`;
    }

    /* 작품 아이템 HTML */
    function _workItem(w, isDB) {
      const poster  = w.poster_path ? `<img class="ottrang-sr-poster" src="${IMG}${w.poster_path}" alt="" loading="lazy">` : `<div class="ottrang-sr-poster-ph">🎬</div>`;
      const title   = w.title_ko || w.title || w.name || '';
      const titleEn = w.title_en || w.original_title || w.original_name || '';
      const year    = (w.release_year || (w.first_air_date || w.release_date || '').slice(0, 4)) || '';
      const mtype   = w.media_type || w._type || '';
      const typeLabel = mtype === 'movie' ? '영화' : 'TV';
      const typeColor = mtype === 'movie' ? 'rgba(240,180,41,.8)' : 'rgba(55,138,221,.8)';
      const dbBadge   = isDB ? '<span class="ottrang-sr-db">DB</span>' : '';
      const slug      = w.tmdb_id ? _slug(w.tmdb_id) : '#';
      // sessionStorage에 작품 정보 저장 후 이동 (기존 패턴 유지)
      const goWork = w.tmdb_id
        ? `(function(){` +
            `sessionStorage.setItem('ottrang_work',JSON.stringify({` +
              `tmdb_id:${w.tmdb_id},` +
              `type:'${mtype || 'tv'}',` +
              `platform:'',` +
              `rank:1,` +
              `title:'${title.replace(/'/g, '').replace(/"/g, '')}',` +
              `season:1,year:${new Date().getFullYear()}` +
            `}));` +
            `location.href='${slug}';` +
          `})()`
        : `location.href='#'`;

      return `<div class="ottrang-sr-item" onclick="${goWork}">
        ${poster}
        <div class="ottrang-sr-info">
          <div class="ottrang-sr-title">${_hesc(title)}</div>
          <div class="ottrang-sr-meta">${_hesc(titleEn)}${year ? ` · ${year}` : ''}</div>
        </div>
        <span class="ottrang-sr-type" style="background:${typeColor};color:#fff">${typeLabel}</span>
        ${dbBadge}
      </div>`;
    }

    /* 인물 아이템 HTML */
    function _personItem(p, isDB) {
      const profile   = p.profile_path ? `<img class="ottrang-sr-profile" src="${IMG}${p.profile_path}" alt="" loading="lazy">` : `<div class="ottrang-sr-profile-ph">👤</div>`;
      const name      = p.name || '';
      const knownFor  = (p.known_for || []).map(k => k.title || k.name).slice(0, 2).join(', ');
      const dept      = p.known_for_department || '';
      const dbBadge   = isDB ? '<span class="ottrang-sr-db">DB</span>' : '';
      const personUrl = `/person.html?id=${p.id || p.tmdb_person_id}`;

      return `<div class="ottrang-sr-item" onclick="location.href='${personUrl}'">
        ${profile}
        <div class="ottrang-sr-info">
          <div class="ottrang-sr-title">${_hesc(name)}</div>
          <div class="ottrang-sr-meta">${dept}${knownFor ? ` · ${knownFor}` : ''}</div>
        </div>
        ${dbBadge}
      </div>`;
    }

    /* HTML 이스케이프 */
    function _hesc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    try {
      // ① 우리 DB works 검색 + TMDB 작품/인물 검색 병렬 실행
      const [dbRes, tvRes, mvRes, personRes] = await Promise.allSettled([
        fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=6`),
        fetch(`${TMDB_PROXY}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/person?query=${encodeURIComponent(q)}&language=ko-KR`),
      ]);

      // DB 결과
      let dbWorks = [];
      if (dbRes.status === 'fulfilled' && dbRes.value.ok) {
        const dbJson = await dbRes.value.json();
        dbWorks = (dbJson.data || []).slice(0, 6);
      }
      const dbTmdbIds = new Set(dbWorks.map(w => w.tmdb_id));

      // TMDB TV 결과
      let tmdbTv = [];
      if (tvRes.status === 'fulfilled' && tvRes.value.ok) {
        const tvJson = await tvRes.value.json();
        tmdbTv = (tvJson.results || [])
          .filter(r => !dbTmdbIds.has(r.id))
          .slice(0, 5)
          .map(r => ({ ...r, _type: 'tv', tmdb_id: r.id }));
      }

      // TMDB 영화 결과
      let tmdbMv = [];
      if (mvRes.status === 'fulfilled' && mvRes.value.ok) {
        const mvJson = await mvRes.value.json();
        tmdbMv = (mvJson.results || [])
          .filter(r => !dbTmdbIds.has(r.id))
          .slice(0, 5)
          .map(r => ({ ...r, _type: 'movie', tmdb_id: r.id }));
      }

      // TMDB 인물 결과
      let tmdbPersons = [];
      if (personRes.status === 'fulfilled' && personRes.value.ok) {
        const pJson = await personRes.value.json();
        tmdbPersons = (pJson.results || []).slice(0, 4);
      }

      // 결과가 아무것도 없으면
      const totalCount = dbWorks.length + tmdbTv.length + tmdbMv.length + tmdbPersons.length;
      if (totalCount === 0) {
        el.innerHTML = `<div class="ottrang-sr-empty">검색 결과가 없습니다</div>`;
        el.classList.add('show');
        return;
      }

      // ── 렌더링 ──
      let html = '';

      // [우리 DB 작품]
      if (dbWorks.length) {
        html += `<div class="ottrang-sr-section">🗄️ 추천</div>`;
        html += dbWorks.map(w => _workItem(w, true)).join('');
      }

      // [TMDB 작품 — DB에 없는 것]
      const tmdbWorks = [...tmdbTv, ...tmdbMv];
      if (tmdbWorks.length) {
        html += `<div class="ottrang-sr-section">🎬 작품</div>`;
        html += tmdbWorks.map(w => _workItem(w, false)).join('');
      }

      // [인물]
      if (tmdbPersons.length) {
        html += `<div class="ottrang-sr-section">👤 인물</div>`;
        html += tmdbPersons.map(p => _personItem(p, false)).join('');
      }

      el.innerHTML = html;
      el.classList.add('show');

    } catch(e) {
      el.innerHTML = `<div class="ottrang-sr-empty">검색 중 오류가 발생했습니다</div>`;
    }
  }
  /* ── 모바일 드로어 & 검색 오버레이 JS ── */

  // 드로어 — 인증 상태에 따라 프로필/버튼 전환

  // ── 모바일 헤더 검색 모드 전환 ──────────────────────────────

  document.getElementById('ottrangMobSearchBtn')?.addEventListener('click', () => {

  // 검색 모드 닫기
  function _closeMobSearch() {

  // 기존 오버레이 닫기 함수 (호환성 유지)
  document.getElementById('ottrangMobSearchBack')?.addEventListener('click', _closeMobSearch);

  // 모바일 검색 — 기존 _runSearch 함수 재사용 (결과를 모바일 컨테이너에 출력)
  window._mobSearchRun = function(q, immediate) {
    clearTimeout(window._mobSrTimer);
    const el = document.getElementById('ottrangMobSearchResults');
    if(!el) return;
    if(!q || q.length < 2){
      el.innerHTML = '';
      return;
    }
    el.innerHTML = '<div class="ottrang-sr-loading">검색 중...</div>';
    // _runSearch는 el 파라미터 없이 'ottrangSearchResults'를 직접 참조하므로
    // 모바일용 결과 렌더 함수를 별도로 처리
    if(immediate){
      _mobRunSearch(q);
    } else {
      window._mobSrTimer = setTimeout(() => _mobRunSearch(q), 350);
    }
  };

  // 모바일 전용 검색 실행 (기존 _runSearch와 동일 로직, 결과 컨테이너만 다름)
  async function _mobRunSearch(q) {
    const el = document.getElementById('ottrangMobSearchResults');
    if(!el) return;
    const API        = 'https://ottrank-api.tdidream.workers.dev';
    const TMDB_PROXY = 'https://tmdb-proxy.tdidream.workers.dev/tmdb';
    const IMG        = 'https://image.tmdb.org/t/p/w92';
    function _slug(tmdb_id){ return `/title/1-${new Date().getFullYear()}${tmdb_id}`; }
    function _hesc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function _workItem(w, isDB){
      const poster    = w.poster_path ? `<img class="ottrang-sr-poster" src="${IMG}${w.poster_path}" alt="" loading="lazy">` : `<div class="ottrang-sr-poster-ph">🎬</div>`;
      const title     = w.title_ko||w.title||w.name||'';
      const titleEn   = w.title_en||w.original_title||w.original_name||'';
      const year      = (w.release_year||(w.first_air_date||w.release_date||'').slice(0,4))||'';
      const mtype     = w.media_type||w._type||'';
      const typeLabel = mtype==='movie'?'영화':'TV';
      const typeColor = mtype==='movie'?'rgba(240,180,41,.8)':'rgba(55,138,221,.8)';
      const dbBadge   = isDB?'<span class="ottrang-sr-db">DB</span>':'';
      const slug      = w.tmdb_id?_slug(w.tmdb_id):'#';
      const goWork    = w.tmdb_id
        ? `(function(){sessionStorage.setItem('ottrang_work',JSON.stringify({tmdb_id:${w.tmdb_id},type:'${mtype||'tv'}',platform:'',rank:1,title:'${title.replace(/'/g,'').replace(/"/g,'')}',season:1,year:${new Date().getFullYear()}}));location.href='${slug}';})()`
        : `location.href='#'`;
      return `<div class="ottrang-sr-item" onclick="${goWork}">${poster}<div class="ottrang-sr-info"><div class="ottrang-sr-title">${_hesc(title)}</div><div class="ottrang-sr-meta">${_hesc(titleEn)}${year?` · ${year}`:''}</div></div><span class="ottrang-sr-type" style="background:${typeColor};color:#fff">${typeLabel}</span>${dbBadge}</div>`;
    }
    function _personItem(p){
      const profile  = p.profile_path?`<img class="ottrang-sr-profile" src="${IMG}${p.profile_path}" alt="" loading="lazy">`:`<div class="ottrang-sr-profile-ph">👤</div>`;
      const name     = p.name||'';
      const knownFor = (p.known_for||[]).map(k=>k.title||k.name).slice(0,2).join(', ');
      const dept     = p.known_for_department||'';
      const url      = `/person.html?id=${p.id||p.tmdb_person_id}`;
      return `<div class="ottrang-sr-item" onclick="location.href='${url}'">${profile}<div class="ottrang-sr-info"><div class="ottrang-sr-title">${_hesc(name)}</div><div class="ottrang-sr-meta">${dept}${knownFor?` · ${knownFor}`:''}</div></div></div>`;
    }
    try {
      const [dbRes,tvRes,mvRes,personRes] = await Promise.allSettled([
        fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=6`),
        fetch(`${TMDB_PROXY}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR`),
        fetch(`${TMDB_PROXY}/search/person?query=${encodeURIComponent(q)}&language=ko-KR`),
      ]);
      let dbWorks=[];
      if(dbRes.status==='fulfilled'&&dbRes.value.ok){ const j=await dbRes.value.json(); dbWorks=(j.data||[]).slice(0,6); }
      const dbIds=new Set(dbWorks.map(w=>w.tmdb_id));
      let tmdbTv=[];
      if(tvRes.status==='fulfilled'&&tvRes.value.ok){ const j=await tvRes.value.json(); tmdbTv=(j.results||[]).filter(r=>!dbIds.has(r.id)).slice(0,4).map(r=>({...r,_type:'tv',tmdb_id:r.id})); }
      let tmdbMv=[];
      if(mvRes.status==='fulfilled'&&mvRes.value.ok){ const j=await mvRes.value.json(); tmdbMv=(j.results||[]).filter(r=>!dbIds.has(r.id)).slice(0,4).map(r=>({...r,_type:'movie',tmdb_id:r.id})); }
      let persons=[];
      if(personRes.status==='fulfilled'&&personRes.value.ok){ const j=await personRes.value.json(); persons=(j.results||[]).slice(0,3); }
      if(!dbWorks.length&&!tmdbTv.length&&!tmdbMv.length&&!persons.length){
        el.innerHTML='<div class="ottrang-sr-empty">검색 결과가 없습니다</div>'; return;
      }
      let html='';
      if(dbWorks.length){ html+='<div class="ottrang-sr-section">🗄️ 추천</div>'+dbWorks.map(w=>_workItem(w,true)).join(''); }
      const tmdbAll=[...tmdbTv,...tmdbMv];
      if(tmdbAll.length){ html+='<div class="ottrang-sr-section">🎬 작품</div>'+tmdbAll.map(w=>_workItem(w,false)).join(''); }
      if(persons.length){ html+='<div class="ottrang-sr-section">👤 인물</div>'+persons.map(p=>_personItem(p)).join(''); }
      el.innerHTML=html;
      el.style.display='block'; // 헤더 검색결과 표시
    } catch(e){
      el.innerHTML='<div class="ottrang-sr-empty">검색 중 오류가 발생했습니다</div>';
      el.style.display='block';
    }
  }

  // 드로어 검색 — _mobRunSearch 재사용, 결과를 드로어 내 div에 출력
  window._drawerSearchRun = function(q, immediate) {
    clearTimeout(window._drawerSrTimer);
    const el = document.getElementById('ottrangDrawerSearchResults');
    if(!el) return;
    if(!q || q.length < 2){ el.innerHTML=''; return; }
    el.innerHTML='<div class="ottrang-sr-loading">검색 중...</div>';
    const run = async () => {
      // _mobRunSearch와 동일 로직이나 el을 드로어 결과로 교체
      const API='https://ottrank-api.tdidream.workers.dev';

      const _h=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const _wi=(w,db)=>{
        const poster=w.poster_path?`<img class="ottrang-sr-poster" src="${IMG}${w.poster_path}" alt="" loading="lazy">`:`<div class="ottrang-sr-poster-ph">🎬</div>`;
        const t=w.title_ko||w.title||w.name||'';

        const mt=w.media_type||w._type||'';
        const tl=mt==='movie'?'영화':'TV';
        const tc=mt==='movie'?'rgba(240,180,41,.8)':'rgba(55,138,221,.8)';
        const sl=w.tmdb_id?_slug(w.tmdb_id):'#';
        const go=w.tmdb_id?`(function(){sessionStorage.setItem('ottrang_work',JSON.stringify({tmdb_id:${w.tmdb_id},type:'${mt||'tv'}',platform:'',rank:1,title:'${t.replace(/'/g,'').replace(/"/g,'')}',season:1,year:${new Date().getFullYear()}}));location.href='${sl}';})()`:`location.href='#'`;
        return `<div class="ottrang-sr-item" onclick="${go}">${poster}<div class="ottrang-sr-info"><div class="ottrang-sr-title">${_h(t)}</div><div class="ottrang-sr-meta">${_h(te)}${yr?` · ${yr}`:''}</div></div><span class="ottrang-sr-type" style="background:${tc};color:#fff">${tl}</span>${db?'<span class="ottrang-sr-db">DB</span>':''}</div>`;
      };
      try{
        const [dr,tr,mr,pr]=await Promise.allSettled([
          fetch(`${API}/works/search?q=${encodeURIComponent(q)}&limit=5`),
          fetch(`${TMDB}/search/tv?query=${encodeURIComponent(q)}&language=ko-KR`),
          fetch(`${TMDB}/search/movie?query=${encodeURIComponent(q)}&language=ko-KR`),
          fetch(`${TMDB}/search/person?query=${encodeURIComponent(q)}&language=ko-KR`),
        ]);
        let dw=[];if(dr.status==='fulfilled'&&dr.value.ok){const j=await dr.value.json();dw=(j.data||[]).slice(0,5);}
        const di=new Set(dw.map(w=>w.tmdb_id));
        let tv=[];if(tr.status==='fulfilled'&&tr.value.ok){const j=await tr.value.json();tv=(j.results||[]).filter(r=>!di.has(r.id)).slice(0,3).map(r=>({...r,_type:'tv',tmdb_id:r.id}));}
        let mv=[];if(mr.status==='fulfilled'&&mr.value.ok){const j=await mr.value.json();mv=(j.results||[]).filter(r=>!di.has(r.id)).slice(0,3).map(r=>({...r,_type:'movie',tmdb_id:r.id}));}
        let ps=[];if(pr.status==='fulfilled'&&pr.value.ok){const j=await pr.value.json();ps=(j.results||[]).slice(0,2);}
        if(!dw.length&&!tv.length&&!mv.length&&!ps.length){el.innerHTML='<div class="ottrang-sr-empty">검색 결과가 없습니다</div>';return;}
        let h='';
        if(dw.length)h+='<div class="ottrang-sr-section">🗄️ 추천</div>'+dw.map(w=>_wi(w,true)).join('');
        const ta=[...tv,...mv];if(ta.length)h+='<div class="ottrang-sr-section">🎬 작품</div>'+ta.map(w=>_wi(w,false)).join('');
        if(ps.length)h+='<div class="ottrang-sr-section">👤 인물</div>'+ps.map(p=>{const pf=p.profile_path?`<img class="ottrang-sr-profile" src="${IMG}${p.profile_path}" alt="" loading="lazy">`:`<div class="ottrang-sr-profile-ph">👤</div>`;return`<div class="ottrang-sr-item" onclick="location.href='/person.html?id=${p.id}'">${pf}<div class="ottrang-sr-info"><div class="ottrang-sr-title">${_h(p.name||'')}</div><div class="ottrang-sr-meta">${p.known_for_department||''}</div></div></div>`;}).join('');
        el.innerHTML=h;
      }catch(e){el.innerHTML='<div class="ottrang-sr-empty">검색 중 오류가 발생했습니다</div>';}
    };
    if(immediate){ run(); } else { window._drawerSrTimer=setTimeout(run,350); }
  };

} // initHeader 끝
/* 헤더가 직접 삽입된 경우 자동 초기화 */
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initHeader);
} else { initHeader(); }

  const GA_ID = 'G-NMN87YB7Y3';

  const s = document.createElement('script');
  s.id    = 'gtag-js';
  s.src   = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
  s.async = true;
  document.head.appendChild(s);

  // ② gtag 초기화
  const i = document.createElement('script');

    window.dataLayer = window.dataLayer || [];
