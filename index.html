<style>
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --accent:#e63946; --gold:#f0b429; --green:#34d399; --red:#f87171;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;overflow-x:hidden}



/* ══ 넷플릭스 featured 슬라이드 섹션 (메인 최상단) ══ */
.featured-section {
  margin-bottom: 12px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.featured-hd {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 0 14px;
}
/* 데스크톱: row1은 flex 인라인, row2는 숨김 */
.featured-hd-row1 {
  display: contents; /* 자식들이 부모 .featured-hd flex에 직접 참여 */
}
.featured-hd-row2 {
  display: none;     /* 데스크톱에서는 row2 완전 숨김 */
}
/* 데스크톱 전용: 헤더 안 update-info 오른쪽 정렬 */
.featured-hd-update {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}
.featured-top-badge {
  font-family: var(--disp); font-size: 20px; letter-spacing: 1px; color: var(--muted);
}
.featured-date {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.featured-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 2px; color: #E50914;
  background: rgba(229,9,20,0.12); border: 1px solid rgba(229,9,20,0.35);
  padding: 2px 10px; border-radius: 4px; white-space: nowrap;
}
.featured-title {
  font-family: var(--disp); font-size: 20px; letter-spacing: 1px; color: var(--text);
}
.featured-more {
  margin-left: auto; font-family: var(--mono); font-size: 12px;
  color: var(--muted); text-decoration: none; white-space: nowrap;
}
.featured-more:hover { color: #E50914; }
/* 슬라이드 트랙 — netflix.html과 동일 구조 */
.ft-swipe-wrap { position: relative; margin-bottom: 20px; }
.ft-swipe-track {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 4px; cursor: grab;
}
.ft-swipe-track::-webkit-scrollbar { display: none; }
.ft-swipe-track.dragging { cursor: grabbing; user-select: none; }
/* 카드 */
.ft-card {
  flex: 0 0 calc(20% - 12px); min-width: 180px; max-width: 210px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; cursor: pointer; transition: all .22s; scroll-snap-align: start;
  position: relative;
}
.ft-card:hover {
  border-color: rgba(229,9,20,0.4); transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(229,9,20,0.15);
}
.ft-poster {
  position: relative; width: 100%; aspect-ratio: 2/3;
  background: var(--bg3); overflow: hidden;
}
.ft-poster img {
  width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s;
}
.ft-card:hover .ft-poster img { transform: scale(1.04); }
.ft-poster-ph {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; font-size: 40px;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
}
.ft-rank {
  position: absolute; top: 0; left: 0;
  font-family: var(--disp); font-size: 38px; line-height: 1;
  color: rgba(255,255,255,.9); z-index: 2; padding: 4px 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,.8); letter-spacing: -1px;
}
.ft-rank.top3 { color: #E50914 !important; text-shadow: 0 2px 12px rgba(229,9,20,0.5); }
.ft-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 50%);
  display: flex; align-items: flex-end; padding: 10px;
  opacity: 0; transition: opacity .2s;
}
.ft-card:hover .ft-overlay { opacity: 1; }
.ft-play {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(229,9,20,0.9); display: flex;
  align-items: center; justify-content: center; margin: 0 auto;
}
.ft-play svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }
.ft-body { padding: 8px 10px 10px; }
.ft-title {
  font-size: 13px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.ft-en {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
}
.ft-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ft-year { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ft-rating { font-family: var(--mono); font-size: 11px; color: var(--gold); margin-left: auto; }
/* 화살표 버튼 */
.ft-btn {
  position: absolute; top: 38%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(229,9,20,0.35); background: var(--bg2);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; z-index: 10;
  transition: all .15s; opacity: 0;
}
.ft-swipe-wrap:hover .ft-btn { opacity: 1; }
.ft-btn:hover { background: rgba(229,9,20,0.18); border-color: #E50914; }
.ft-btn.prev { left: -17px; }
.ft-btn.next { right: -17px; }
/* 스켈레톤 */
.ft-skel {
  flex: 0 0 calc(20% - 12px); min-width: 180px; border-radius: var(--r);
  background: var(--card); border: 1px solid var(--border); overflow: hidden;
}
.ft-skel-poster {
  width: 100%; aspect-ratio: 2/3;
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
}
.ft-skel-line {
  height: 11px; border-radius: 4px; margin: 8px 10px 5px;
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
}
.ft-skel-line.short { width: 50%; height: 9px; margin-top: 0; }
@media(max-width:768px) {
  .ft-card { min-width: 150px; max-width: 170px; }
  .ft-btn { display: none; }
}
.period-tabs{display:flex;gap:2px;margin-left:12px}
.pb{height:28px;padding:0 12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.pb.on{background:rgba(240,180,41,.15);color:var(--gold);border-color:var(--gold);font-weight:700}
.pb:hover:not(.on){color:var(--muted2)}
.update-info{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══ 메인 ══ */
.main-outer{max-width:var(--max-w);margin:0 auto;padding:0 24px 80px}

/* 섹션 헤더 */
.sec-hd{display:flex;align-items:center;gap:12px;padding:28px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sec-icon{font-size:18px}
.sec-title{font-family:var(--disp);font-size:26px;letter-spacing:1px}
.sec-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px}
.sec-more{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.sec-more:hover{color:var(--text)}

/* OTT 5열 그리드 */
.ott-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}

/* 플랫폼 카드 */
.p-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.p-card-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.p-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.p-name{font-size:15px;font-weight:700;text-decoration:none !important}
.p-cat{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.p-cat:hover{color:var(--text)}
.p-hero{position:relative;aspect-ratio:2/3;background:var(--bg3);cursor:pointer;overflow:hidden}
.p-hero img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.p-hero:hover img{transform:scale(1.04)}
.p-hero-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.ph-emoji{font-size:30px}
.ph-title{font-size:13px;color:var(--muted);text-align:center;padding:0 10px;line-height:1.4}
.rank1{position:absolute;top:7px;left:9px;font-family:var(--disp);font-size:44px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.new-b{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--gold);color:#000;padding:2px 7px;border-radius:3px}
.rating-b{position:absolute;bottom:7px;right:7px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.78);color:var(--gold);padding:3px 8px;border-radius:4px}
.p-overlay{position:absolute;inset:0;opacity:0;transition:opacity .2s;background:linear-gradient(to top,rgba(12,12,16,.97) 0%,transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px}
.p-hero:hover .p-overlay{opacity:1}
.ov-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:5px}
.ov-meta{display:flex;gap:10px;font-family:var(--mono);font-size:10px;color:var(--muted2)}
.p-list{padding:4px 0}
.p-row{display:flex;align-items:center;gap:9px;padding:6px 12px;cursor:pointer;border-radius:5px;margin:1px 4px;min-height:34px;transition:background .12s}
.p-row:hover{background:var(--bg3)}
.p-rank{font-family:var(--mono);font-size:14px;width:20px;text-align:right;flex-shrink:0;color:var(--muted)}
.p-rank.hi{color:var(--gold);font-weight:500}
.p-title{flex:1;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-score{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}

/* ══ 오늘의 AI 추천 ══ */
.ai-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:20px}
.ai-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ai-title{font-size:18px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:10px}
.ai-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(55,138,221,.15);color:#7ec8e3;border:1px solid rgba(55,138,221,.25)}
.ai-reset{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px}
.ai-reset:hover{color:var(--text)}
.ai-filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.ai-filter-row{display:flex;align-items:flex-start;gap:16px}
.ai-flabel{font-size:14px;color:var(--muted2);font-weight:500;width:90px;flex-shrink:0;padding-top:7px}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:22px;border:1px solid var(--border);font-size:13px;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;white-space:nowrap}
.chip:hover:not(.on):not(.type-on){background:var(--bg3);color:var(--text)}
.chip.on{background:rgba(55,138,221,.12);color:#7ec8e3;border-color:rgba(55,138,221,.3)}
.chip.type-on{background:var(--bg3);color:var(--text);border-color:var(--border2);font-weight:500}
.ai-btn{width:100%;padding:13px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);font-size:15px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s}
.ai-btn:hover{background:var(--bg2)}
.ai-result{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.ai-result.show{display:block}
.ai-result-lbl{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.picks-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick-card{background:var(--bg3);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border)}
.pick-no{font-size:12px;font-family:var(--mono);color:var(--muted)}
.pick-title{font-size:16px;font-weight:500;color:var(--text);line-height:1.3}
.pick-pf{font-size:11px;padding:3px 8px;border-radius:4px;color:#fff;font-weight:600;width:fit-content}
.pick-reason{font-size:13px;color:var(--muted2);line-height:1.6;border-left:2px solid var(--border2);padding-left:10px}
.pick-rating{font-size:13px;color:var(--muted);font-family:var(--mono)}
.ai-loading{padding:28px;text-align:center;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:12px;grid-column:1/-1}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:#7ec8e3;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ 오늘의 신작 & 예정작 ══ */
.ct-preview-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:all .2s}
.ct-preview-card:hover{border-color:var(--border2);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ct-preview-thumb{position:relative;width:100%;aspect-ratio:16/9;
  background:var(--bg3);overflow:hidden}
.ct-preview-thumb img{width:100%;height:100%;object-fit:cover;
  display:block;transition:transform .3s}
.ct-preview-card:hover .ct-preview-thumb img{transform:scale(1.05)}
.ct-preview-thumb-ph{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:28px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.ct-preview-play{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.ct-preview-card:hover .ct-preview-play{opacity:1}
.ct-preview-play-icon{width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.ct-preview-play-icon svg{width:16px;height:16px;fill:#0c0c10;margin-left:2px}
.ct-preview-type{position:absolute;top:7px;left:7px;font-family:var(--mono);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px}
.ct-preview-type.trailer{background:rgba(230,57,70,.85);color:#fff}
.ct-preview-type.preview{background:rgba(240,180,41,.85);color:#000}
.ct-preview-type.teaser{background:rgba(52,211,153,.85);color:#000}
.ct-preview-type.release{background:rgba(6,182,212,.85);color:#000}
/* OTT 뱃지 — 제목 옆 인라인 */
.ct-preview-pf-inline{display:inline-block;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:3px;color:#fff;flex-shrink:0}
.ct-preview-body{padding:9px 11px 11px}
.ct-preview-work{font-size:13px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:5px;margin-bottom:2px}
.ct-preview-work-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-preview-title{font-size:11px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.4}
/* 스켈레톤 */

<script>
/* ══ 공용 헤더 동적 삽입 ══ */
(function(){
  fetch('/header.html')
    .then(r=>r.ok?r.text():Promise.reject())
    .then(h=>{
      document.getElementById('ottrang-header').innerHTML=h;
      // innerHTML로 삽입된 script는 실행 안되므로 직접 실행
      document.getElementById('ottrang-header').querySelectorAll('script').forEach(s=>{
        const ns=document.createElement('script');
        ns.textContent=s.textContent;
        document.body.appendChild(ns);
      });
      if(typeof initHeader==='function') initHeader();
      // 메인페이지에서만 베타 배너 표시
      document.getElementById('ottrangBanner')?.style.setProperty('display','block');
      /* index.html 전용: 헤더 통합 검색 사용 (ottrangSearchResults 기준) */
      // onSearch, showSR, hideSR 모두 ottrangSearchResults를 바라보도록 교체
      window.onSearch = function(q) {
        window.ottrangOnSearch && window.ottrangOnSearch(q);
      };
      window.showSR = function() {
        const el = document.getElementById('ottrangSearchResults');
        const v  = document.getElementById('ottrangSearch')?.value?.trim();
        if (el && v) window.ottrangOnSearch(v);
      };
      window.hideSR = function() {
        document.getElementById('ottrangSearchResults')?.classList.remove('show');
      };
    })
    .catch(()=>{ /* 헤더 fetch 실패 시 무시 (로컬 개발환경) */ });
})();
</script>

function buildRankings(rows) {
  const result = { tv: {}, movie: {} };
  PLATFORMS.forEach(p => { result.tv[p.id] = []; result.movie[p.id] = []; });
  result.movie['boxoffice'] = [];

    const section = (slot.toLowerCase().includes('movie') || row.category === 'movie') ? 'movie' : 'tv';

      tmdb_id: row.tmdb_id || null,

      _year:   String(row.release_year || ''),

  return result;
}

const pCache={};
async function tmdbSearch(q,type){
  if(!q)return null;
  const k=q+'|'+type;
  if(pCache[k])return pCache[k];
  try{
    async function doSearch(query){
      const r=await fetch(`${TMDB_API}/search/${type}?query=${encodeURIComponent(query)}&language=ko-KR`);
      if(!r.ok)return null;
      const d=await r.json();
      const results=(d.results||[]).filter(x=>x.poster_path);
      if(!results.length)return null;
      // 1순위: 제목 정확히 일치
      const qL=query.toLowerCase();
      let x=results.find(x=>(x.title||x.name||'').toLowerCase()===qL);
      // 2순위: popularity 5 이상 중 최고
      if(!x){x=results.filter(x=>(x.popularity||0)>=5).sort((a,b)=>b.popularity-a.popularity)[0]||null;}
      return x;
    }
    // 1차: 원제로 검색
    let x=await doSearch(q);
    // 2차: 포스터 없으면 앞 3단어만으로 재검색 (긴 제목 대응)
    if(!x&&q.split(' ').length>3){x=await doSearch(q.split(' ').slice(0,3).join(' '));}
    if(!x)return null;
    /* 시즌·연도도 함께 저장 */
    const year = (x.first_air_date||x.release_date||'').slice(0,4) || '';
    const info={
      poster:   IMG+x.poster_path,
      title_ko: x.title||x.name||q,
      season:   x.number_of_seasons||1,  // TV 시리즈만 존재, 영화는 1
      year:     year,
    };
    pCache[k]=info;
    return info;
  }catch{return null;}
}
async function enrichAll(data){
  const unique=new Map();
  // poster_path 없는 항목(_poster가 null/undefined)을 우선 등록, 이미 있으면 덮어쓰지 않음
  Object.values(data).forEach(pd=>Object.values(pd).forEach(items=>items.forEach(item=>{
    if(!unique.has(item.q)){unique.set(item.q,item);}
    // 같은 q라도 _poster가 없는 쪽이 있으면 그쪽으로 교체 (TMDB 검색 필요)
    else if(!item._poster){unique.set(item.q,item);}
  })));
  // 3개씩 묶어서 순차 처리 (속도 제한 방지)
  const entries=[...unique.entries()];
  const BATCH=3;
  for(let i=0;i<entries.length;i+=BATCH){
    const batch=entries.slice(i,i+BATCH);
    await Promise.all(batch.map(async([q,item])=>{
      // API에서 poster_path로 이미 _poster가 세팅된 항목은 TMDB 검색 생략
      if(item._poster)return;
      const info=await tmdbSearch(q,item.type);
      if(info){Object.values(data).forEach(pd=>Object.values(pd).forEach(items=>items.forEach(i=>{if(i.q===q&&!i._poster){
        i._poster = info.poster;
        i._ko     = info.title_ko;
        i._season = info.season || 1;
        i._year   = info.year   || '';
      }})));}
    }));
    if(i+BATCH<entries.length)await new Promise(r=>setTimeout(r,200));
    renderGrids(); // 배치마다 화면 갱신
  }
}

function runAI(){
  const result=document.getElementById('aiResult');

  result.classList.add('show');
  picks.innerHTML='<div class="ai-loading"><div class="spin"></div>오늘 랭킹 기반 분석 중...</div>';

  document.getElementById('aiDesc').textContent=`${tLabel} · ${selOtt.join('·')||'전체 OTT'} · ${selGenre.join('·')||'전체 장르'}`;
  setTimeout(()=>{
    const selPids=selOtt.length?selOtt.map(o=>OTT_MAP[o]).filter(Boolean):Object.values(OTT_MAP);
    const candidates=[];
    selPids.forEach(pid=>{
      const p=PLATFORMS.find(p=>p.id===pid)||MOVIE_PLATFORMS.find(p=>p.id===pid);

    });
    candidates.sort((a,b)=>a.rank-b.rank||b.score-a.score);

    }).join('');
  },600);
}

function ftGoWork(tmdbId, title) {
  if (!tmdbId) return;
  const y = new Date().getFullYear();
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: 'tv', title: title || '', platform: 'netflix'
  }));

}
function ftScrollTrack(id, dir) {
  const t = document.getElementById(id);
  if (t) t.scrollBy({ left: dir * (200 * 3), behavior: 'smooth' });
}
function ftInitSwipe(track) {
  let down = false, startX = 0, sl = 0;
  track.addEventListener('mousedown', e => {
    down = true; track.classList.add('dragging');
    startX = e.pageX - track.offsetLeft; sl = track.scrollLeft;
  });
  ['mouseleave', 'mouseup'].forEach(ev =>
    track.addEventListener(ev, () => { down = false; track.classList.remove('dragging'); })
  );
  track.addEventListener('mousemove', e => {
    if (!down) return; e.preventDefault();
    track.scrollLeft = sl - (e.pageX - track.offsetLeft - startX) * 1.2;
  });
}
function _escFt(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _escAttrFt(str) {
  return String(str || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

async function loadRankings(period='daily'){
  try{
    if(period==='daily'){
      // 새 API: /rankings/main (Admin 설정 기반)
      const res=await fetch(`${API}/rankings/main`);
      const json=await res.json();
      if(json.ok){
        const apiRankings=buildRankingsFromMain(json);
        PLATFORMS.forEach(p=>{
          if(apiRankings.tv[p.id]?.length)    RANKINGS.tv[p.id]    = apiRankings.tv[p.id];
          if(apiRankings.movie[p.id]?.length)  RANKINGS.movie[p.id] = apiRankings.movie[p.id];
        });
        if(apiRankings.movie['boxoffice']?.length)
          RANKINGS.movie['boxoffice']=apiRankings.movie['boxoffice'];
        renderGrids();
        // featured 슬라이드 섹션 렌더링 (넷플릭스 전용, 0~2개)
        renderFeatured(json.featured || []);
      }
    } else {
      // weekly/monthly — daily와 동일한 응답 구조, buildRankingsFromMain으로 처리
      const endpoint = period==='weekly' ? `${API}/rankings/weekly` : `${API}/rankings/monthly`;
      const res=await fetch(endpoint);
      const json=await res.json();
      if(json.ok){
        const apiRankings=buildRankingsFromMain(json);
        PLATFORMS.forEach(p=>{
          if(apiRankings.tv[p.id]?.length)    RANKINGS.tv[p.id]    = apiRankings.tv[p.id];
          if(apiRankings.movie[p.id]?.length)  RANKINGS.movie[p.id] = apiRankings.movie[p.id];
        });
        if(apiRankings.movie['boxoffice']?.length)
          RANKINGS.movie['boxoffice']=apiRankings.movie['boxoffice'];
        renderGrids();
      }
    }
  }catch(e){console.warn(period+' 랭킹 로드 실패:',e);}
}

  if (vid) {

    document.getElementById('ytPExtLink').href = 'https://www.youtube.com/watch?v=' + vid;
  } else {
    document.getElementById('ytPFrame').src = '';
    document.getElementById('ytPExtLink').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(title);
  }
  document.getElementById('ytOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeYtPlayer(e) {
  if (e && e.target !== document.getElementById('ytOverlay')) return;
  document.getElementById('ytPFrame').src = '';
  document.getElementById('ytOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeYtPlayer(null); });

/* ══ 최근 평점 후기 로드 ══ */
// 별점 점수(0.5~5.0, DB 저장값) → ★☆ 하프스타 문자열 변환 (5점 기준 그대로 사용)
function renderStars(score) {
  const s = parseFloat(score) || 0;
  const full  = Math.floor(s);
  const half  = (s - full) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

// 상대 시간 포맷 (초→"방금", 분→"N분 전", 시간→"N시간 전", 일→"N일 전")
function relTimeRv(dateStr) {
  if (!dateStr) return '';
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60)   return '방금';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}

// 플랫폼 색상 맵 (works 테이블 media_type은 tv/movie, 여기선 별도 플랫폼 필드 없음)
const RV_PF_COLOR = {
  netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4',
  coupang:'#1ac44d', wavve:'#0070f3', boxoffice:'#f0b429'
};

async function loadRecentReviews() {
  try {
    // GET /reviews/recent?limit=5 — 최근 평점 후기 5개 반환
    // 인증 불필요 (공개 API), 응답: { ok, reviews: [...] }
    const sid = localStorage.getItem('ottrang_sid');
    const opts = sid
      ? { credentials: 'include', headers: { Authorization: `Bearer ${sid}` } }
      : { credentials: 'include' };
    const res  = await fetch(`${API}/reviews/recent?limit=5`, opts);
    const data = await res.json();

    if (!data.ok || !data.reviews?.length) {
      // 데이터 없을 때 섹션 자체를 숨김 (빈 상태보다 깔끔)
      document.getElementById('recentReviews')?.style.setProperty('display', 'none');
      document.getElementById('reviewGrid')?.style.setProperty('display', 'none');
      return;
    }
    renderRecentReviews(data.reviews);
  } catch(e) {
    // API 오류 시 섹션 숨김
    document.getElementById('recentReviews')?.style.setProperty('display', 'none');
    document.getElementById('reviewGrid')?.style.setProperty('display', 'none');
  }
}

function renderRecentReviews(reviews) {
  const grid = document.getElementById('reviewGrid');
  if (!grid) return;

  // 플랫폼 색상: works 테이블에 platform 필드가 없을 수 있으므로 media_type으로 폴백 처리
  grid.innerHTML = reviews.map(rv => {
    const nick    = rv.nickname || '익명';
    const initial = nick.charAt(0);

    // 아바타: 프로필 이미지 있으면 img, 없으면 이니셜
    const avatar = rv.profile_image
      ? `<img src="${rv.profile_image}" alt="${nick}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
             style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%">
         <span style="display:none;font-size:15px;font-weight:700">${initial}</span>`
      : `<span style="font-size:15px;font-weight:700">${initial}</span>`;

    // MBTI 뱃지 (있을 때만 표시)
    const mbtiBadge = rv.mbti
      ? `<span class="rv-mbti">✦ ${rv.mbti}</span>`
      : '';

    // 별점: ★ 5개 기준 표시 / 숫자는 ×2해서 10점 기준으로 표시
    const stars    = renderStars(rv.score);
    const scoreNum = rv.score ? `<span class="rv-score-num">${(parseFloat(rv.score) * 2).toFixed(1).replace(/\.0$/, '')}</span>` : '';

    // 평가 태그 — evaluation 컬럼이 있을 때만 표시
    const evalTags = ['강추해요','추천해요','평범해요','별로예요'];
    const evalBadge = rv.evaluation && evalTags.includes(rv.evaluation)
      ? `<div class="rv-eval">${rv.evaluation}</div>`
      : '';

    // 플랫폼 색상: platform 필드 우선, 없으면 media_type으로 구분
    const pfColor = RV_PF_COLOR[rv.platform] || (rv.media_type === 'movie' ? '#f0b429' : '#e50914');

    // 작품 상세 이동 함수 활용
    // 작품 페이지 사용자 후기 섹션(#userReviews)으로 바로 이동
    const clickFn = rv.tmdb_id
      ? `goDetailReview(${rv.tmdb_id},'${rv.media_type||'tv'}','${(rv.title_ko||'').replace(/'/g,'')}',1,'')`
      : '';

    return `<div class="rv-card" onclick="${clickFn}">
      <!-- 유저 정보 -->
      <div class="rv-card-top">
        <div class="rv-avatar">${avatar}</div>
        <div class="rv-user">
          <div class="rv-nick">${nick}${mbtiBadge ? ' ' + mbtiBadge : ''}</div>
          <div class="rv-time">${relTimeRv(rv.created_at)}</div>
        </div>
      </div>
      <!-- 작품명 + 플랫폼 점 -->
      <div class="rv-work">
        <span class="rv-pf-dot" style="background:${pfColor}"></span>
        <span class="rv-work-title">${rv.title_ko || '작품명 미확인'}</span>
      </div>
      <!-- 별점 -->
      <div>
        <span class="rv-stars">${stars}</span>${scoreNum}
        ${evalBadge}
      </div>
      <!-- 후기 본문 -->
      <div class="rv-body">${rv.body ? rv.body.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '<span style="color:var(--muted);font-size:12px">평점만 남긴 후기입니다.</span>'}</div>
    </div>`;
  }).join('');
}

async function init(){
  const today=new Date();
  const dateStr=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')} 09:00 업데이트`;
  document.getElementById('updateTxt').textContent=dateStr;
  if(document.getElementById('updateTxt2')) document.getElementById('updateTxt2').textContent=dateStr;
  if(document.getElementById('updateTxt3')) document.getElementById('updateTxt3').textContent=dateStr;

  // API 실제 데이터 로드
  await loadRankings('daily');

  // TMDB 포스터 보강 — poster_path 없는 항목이 있을 때만 실행
  // API 응답에 poster_path가 이미 포함된 경우 enrichAll 전체 스킵
  const needEnrich = Object.values(RANKINGS)
    .flatMap(pd => Object.values(pd).flat())
    .some(item => !item._poster);
  if (needEnrich) {
    enrichAll(RANKINGS).then(() => renderGrids());
  }

  // 유튜브·신작·후기 — 병렬 로드 (순서 무관, 동시 실행)
  Promise.all([
    loadYoutubeTrending(),
    loadContentsPreview(),
    loadRecentReviews(),
  ]);
}

/* ── 오늘의 신작 & 예정작 (메인 5개) ── */
const CT_TYPE_LABEL = { trailer:'예고편', preview:'선공개', teaser:'티저', release:'신작공개' };
const CT_PF_COLOR   = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3' };
const CT_PF_NAME    = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브' };
// 노출 순서 (고정 제외 후 나머지 채우는 순서 — 역순으로 가져와서 앞에 붙임)
const CT_PF_ORDER   = ['netflix', 'tving', 'disney', 'coupang', 'wavve'];

async function loadContentsPreview(){
  try {
    // ① 고정 영상 조회
    const pinnedRes  = await fetch(`${API}/contents/pinned`);
    const pinnedData = await pinnedRes.json();
    const pinned     = pinnedData.items || [];
    const need       = 5 - pinned.length; // 나머지 슬롯 수

    // ② 나머지 슬롯만큼 플랫폼별 최신 1개씩 채움
    // 고정에 이미 포함된 플랫폼은 스킵
    // 넷플→티빙→디즈니→쿠팡→웨이브 순서로 need개만큼
    const pinnedPlatforms = new Set(pinned.map(i => i.platform));
    const fillPlatforms   = CT_PF_ORDER
      .filter(p => !pinnedPlatforms.has(p))
      .slice(0, need); // 필요한 수만큼만

    // 플랫폼별 최신 1개 병렬 조회
    const fillItems = [];
    if(fillPlatforms.length) {
      const results = await Promise.all(
        fillPlatforms.map(p =>
          fetch(`${API}/contents?platform=${p}&limit=1`)
            .then(r => r.json())
            .catch(() => ({ items:[] }))
        )
      );
      results.forEach(data => {
        const item = (data.items || [])[0];
        if(item) fillItems.push(item);
      });
    }

    // ③ 최종 합산: 고정 + 플랫폼 최신
    // 노출 순서: 넷플→티빙→디즈니→쿠팡→웨이브
    // 고정 영상은 sort_order 순, 나머지는 플랫폼 순서대로
    const allItems = [...pinned, ...fillItems];

    // 넷플→티빙→디즈니→쿠팡→웨이브 순으로 정렬
    allItems.sort((a, b) => {
      // 고정 영상은 sort_order 기준
      const aPin = a.is_pinned ? a.sort_order || 0 : 99;
      const bPin = b.is_pinned ? b.sort_order || 0 : 99;
      if(aPin !== bPin) return aPin - bPin;
      // 비고정은 플랫폼 순서
      return CT_PF_ORDER.indexOf(a.platform) - CT_PF_ORDER.indexOf(b.platform);
    });

    renderContentsPreview(allItems.slice(0, 5));
  } catch(e){
    renderContentsPreview([]);
  }
}

function renderContentsPreview(items){
  const wrap = document.getElementById('contentsPreview');
  if(!wrap) return;

  if(!items.length){
    wrap.innerHTML = `<div style="grid-column:1/-1;padding:32px;text-align:center;
      background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      font-size:14px;color:var(--muted)">등록된 신작 예고편이 없습니다.</div>`;
    return;
  }

  wrap.innerHTML = items.map(item => {
    const typeLabel = CT_TYPE_LABEL[item.type] || item.type;
    const pfColor   = CT_PF_COLOR[item.platform] || '#888';
    const pfName    = CT_PF_NAME[item.platform]  || item.platform;
    const workTitle = item.work_title || '';
    const thumb     = item.thumbnail || '';

    // 항상 영상 상세 페이지로 이동
    const clickFn = `location.href='/contents_detail.html?id=${item.id}'`;

    return `<div class="ct-preview-card" onclick="${clickFn}">
      <div class="ct-preview-thumb">
        ${thumb
          ? `<img src="${thumb}" alt="${workTitle.replace(/"/g,'')}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
             <div class="ct-preview-thumb-ph" style="display:none">🎬</div>`
          : `<div class="ct-preview-thumb-ph">🎬</div>`
        }
        <div class="ct-preview-play">
          <div class="ct-preview-play-icon">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <span class="ct-preview-type ${item.type}">${typeLabel}</span>
      </div>
      <div class="ct-preview-body">
        <div class="ct-preview-work">
          <span class="ct-preview-pf-inline" style="background:${pfColor}">${pfName}</span>
          <span class="ct-preview-work-title">${workTitle || '제목 미확인'}</span>
        </div>
        <div class="ct-preview-title">${item.title}</div>
      </div>
    </div>`;
  }).join('');
}

async function loadYoutubeTrending(){
  try{
    const res  = await fetch(`${API}/youtube/trending`);
    const data = await res.json();
    if(!data.ok || !data.data?.length) return;
    // 기존 renderYT() 구조에 맞게 YT 배열 덮어쓰기
    YT.length = 0;
    data.data.forEach(v => YT.push({
      rank:    v.rank,
      vid:     v.video_id,
      title:   v.title || '',
      channel: v.channel || '',
      views:   fmtViews(v.view_count),
      dur:     '',
    }));
    renderYT();
  }catch(e){}
}

function fmtViews(n){
  if(!n) return '';
  if(n>=100000000) return (n/100000000).toFixed(1)+'억';
  if(n>=10000)     return Math.floor(n/10000)+'만';
  if(n>=1000)      return (n/1000).toFixed(1)+'천';
  return String(n);
}
