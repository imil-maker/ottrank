<style>
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --accent:#e63946; --gold:#f0b429; --green:#34d399; --red:#f87171;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;overflow-x:hidden}

/* ══ 넷플릭스 featured 슬라이드 섹션 (메인 최상단) ══ */
.featured-section {
  margin-bottom: 12px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.featured-hd {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 0 14px;
}
/* 데스크톱: row1은 flex 인라인, row2는 숨김 */
.featured-hd-row1 {
  display: contents; /* 자식들이 부모 .featured-hd flex에 직접 참여 */
}
.featured-hd-row2 {
  display: none;     /* 데스크톱에서는 row2 완전 숨김 */
}
/* featured 날짜 하단 — 모바일 전용, PC에서 숨김 */
.featured-date-bottom { display: none; }
/* 데스크톱: featured-hd-update — margin-left:auto로 오른쪽 정렬 */
.featured-hd-update {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
}
.featured-top-badge {
  font-family: var(--disp); font-size: 20px; letter-spacing: 1px; color: var(--muted);
}
.featured-date {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.featured-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 2px; color: #E50914;
  background: rgba(229,9,20,0.12); border: 1px solid rgba(229,9,20,0.35);
  padding: 2px 10px; border-radius: 4px; white-space: nowrap;
}
.featured-title {
  font-family: var(--disp); font-size: 20px; letter-spacing: 1px; color: var(--text);
}
.featured-more {
  margin-left: auto; font-family: var(--mono); font-size: 12px;
  color: var(--muted); text-decoration: none; white-space: nowrap;
}
.featured-more:hover { color: #E50914; }
/* 슬라이드 트랙 — netflix.html과 동일 구조 */
.ft-swipe-wrap { position: relative; margin-bottom: 20px; }
.ft-swipe-track {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 4px; cursor: grab;
}
.ft-swipe-track::-webkit-scrollbar { display: none; }
.ft-swipe-track.dragging { cursor: grabbing; user-select: none; }
/* 카드 */
.ft-card {
  flex: 0 0 calc(20% - 12px); min-width: 180px; max-width: 210px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; cursor: pointer; transition: all .22s; scroll-snap-align: start;
  position: relative;
}
.ft-card:hover {
  border-color: rgba(229,9,20,0.4); transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(229,9,20,0.15);
}
.ft-poster {
  position: relative; width: 100%; aspect-ratio: 2/3;
  background: var(--bg3); overflow: hidden;
}
.ft-poster img {
  width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s;
}
.ft-card:hover .ft-poster img { transform: scale(1.04); }
.ft-poster-ph {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; font-size: 40px;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
}
.ft-rank {
  position: absolute; top: 0; left: 0;
  font-family: var(--disp); font-size: 38px; line-height: 1;
  color: rgba(255,255,255,.9); z-index: 2; padding: 4px 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,.8); letter-spacing: -1px;
}
.ft-rank.top3 { color: #E50914 !important; text-shadow: 0 2px 12px rgba(229,9,20,0.5); }
.ft-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 50%);
  display: flex; align-items: flex-end; padding: 10px;
  opacity: 0; transition: opacity .2s;
}
.ft-card:hover .ft-overlay { opacity: 1; }
.ft-play {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(229,9,20,0.9); display: flex;
  align-items: center; justify-content: center; margin: 0 auto;
}
.ft-play svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }
.ft-body { padding: 8px 10px 10px; }
.ft-title {
  font-size: 13px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.ft-en {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
}
.ft-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ft-year { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ft-rating { font-family: var(--mono); font-size: 11px; color: var(--gold); margin-left: auto; }
/* 화살표 버튼 */
.ft-btn {
  position: absolute; top: 38%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(229,9,20,0.35); background: var(--bg2);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; z-index: 10;
  transition: all .15s; opacity: 0;
}
.ft-swipe-wrap:hover .ft-btn { opacity: 1; }
.ft-btn:hover { background: rgba(229,9,20,0.18); border-color: #E50914; }
.ft-btn.prev { left: -17px; }
.ft-btn.next { right: -17px; }
.ft-btn:disabled{ opacity:0 !important; pointer-events:none; cursor:default; }
/* TV시리즈/영화 TOP10 화살표 — 데스크톱은 grid라 스크롤 자체가 없으므로 항상 숨김(모바일 전용) */
@media(min-width:769px){
  .ott-arrow-btn{ display:none !important; }
}
/* 스켈레톤 */
.ft-skel {
  flex: 0 0 calc(20% - 12px); min-width: 180px; border-radius: var(--r);
  background: var(--card); border: 1px solid var(--border); overflow: hidden;
}
.ft-skel-poster {
  width: 100%; aspect-ratio: 2/3;
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
}
.ft-skel-line {
  height: 11px; border-radius: 4px; margin: 8px 10px 5px;
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
}
.ft-skel-line.short { width: 50%; height: 9px; margin-top: 0; }
@media(max-width:768px) {
  .ft-card { min-width: 150px; max-width: 170px; }
  .ft-btn { display: none; }
}
.period-tabs{display:flex;gap:2px;margin-left:12px}
.pb{height:28px;padding:0 12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.pb.on{background:rgba(240,180,41,.15);color:var(--gold);border-color:var(--gold);font-weight:700}
.pb:hover:not(.on){color:var(--muted2)}
.update-info{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══ 메인 ══ */
.main-outer{max-width:var(--max-w);margin:0 auto;padding:0 24px 80px}

/* 섹션 헤더 */
.sec-hd{display:flex;align-items:center;gap:12px;padding:28px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sec-icon{font-size:18px}
.sec-title{font-family:var(--disp);font-size:26px;letter-spacing:1px}
.sec-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px}
.sec-more{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.sec-more:hover{color:var(--text)}

/* OTT 5열 그리드 */
.ott-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}

/* 플랫폼 카드 */
.p-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.p-card-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.p-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.p-name{font-size:15px;font-weight:700;text-decoration:none !important}
.p-cat{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.p-cat:hover{color:var(--text)}
.p-hero{position:relative;aspect-ratio:2/3;background:var(--bg3);cursor:pointer;overflow:hidden}
.p-hero img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.p-hero:hover img{transform:scale(1.04)}
.p-hero-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.ph-emoji{font-size:30px}
.ph-title{font-size:13px;color:var(--muted);text-align:center;padding:0 10px;line-height:1.4}
.rank1{position:absolute;top:7px;left:9px;font-family:var(--disp);font-size:44px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.new-b{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--gold);color:#000;padding:2px 7px;border-radius:3px}
.rating-b{position:absolute;bottom:7px;right:7px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.78);color:var(--gold);padding:3px 8px;border-radius:4px}
.p-overlay{position:absolute;inset:0;opacity:0;transition:opacity .2s;background:linear-gradient(to top,rgba(12,12,16,.97) 0%,transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px}
.p-hero:hover .p-overlay{opacity:1}
.ov-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:5px}
.ov-meta{display:flex;gap:10px;font-family:var(--mono);font-size:10px;color:var(--muted2)}
.p-list{padding:4px 0}
.p-row{display:flex;align-items:center;gap:9px;padding:6px 2px 6px 1px;cursor:pointer;border-radius:5px;margin:1px 4px 1px 1px;min-height:34px;transition:background .12s}
.p-row:hover{background:var(--bg3)}
.p-rank{font-family:var(--mono);font-size:14px;width:16px;text-align:right;flex-shrink:0;color:var(--muted)}
.p-rank.hi{color:var(--gold);font-weight:500}
.p-title{flex:1;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-score{font-family:var(--font);font-size:11px;color:var(--muted);flex-shrink:0}

/* ══ 오늘의 신작 & 예정작 ══ */
.ct-preview-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:all .2s}
.ct-preview-card:hover{border-color:var(--border2);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ct-preview-thumb{position:relative;width:100%;aspect-ratio:16/9;
  background:var(--bg3);overflow:hidden}
.ct-preview-thumb img{width:100%;height:100%;object-fit:cover;
  display:block;transition:transform .3s}
.ct-preview-card:hover .ct-preview-thumb img{transform:scale(1.05)}
.ct-preview-thumb-ph{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:28px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.ct-preview-play{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.ct-preview-card:hover .ct-preview-play{opacity:1}
.ct-preview-play-icon{width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.ct-preview-play-icon svg{width:16px;height:16px;fill:#0c0c10;margin-left:2px}
.ct-preview-type{position:absolute;top:7px;left:7px;font-family:var(--mono);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px}
.ct-preview-type.trailer{background:rgba(230,57,70,.85);color:#fff}
.ct-preview-type.preview{background:rgba(240,180,41,.85);color:#000}
.ct-preview-type.teaser{background:rgba(52,211,153,.85);color:#000}
.ct-preview-type.release{background:rgba(6,182,212,.85);color:#000}
/* OTT 뱃지 — 제목 옆 인라인 */
.ct-preview-pf-inline{display:inline-block;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:3px;color:#fff;flex-shrink:0}
.ct-preview-body{padding:9px 11px 11px}
.ct-preview-work{font-size:13px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:5px;margin-bottom:2px}
.ct-preview-work-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-preview-title{font-size:11px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.4}
/* 스켈레톤 */
.skel-ct-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.skel-ct-thumb{width:100%;aspect-ratio:16/9;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-ct-line{height:12px;border-radius:4px;margin:10px 11px 5px;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-ct-line.short{width:55%;height:10px;margin-top:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.yt-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.yt-card{display:flex;gap:10px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s}
.yt-card:hover{border-color:var(--border2);background:var(--bg3)}
.yt-th{position:relative;flex-shrink:0;width:96px;height:54px;border-radius:6px;background:var(--bg3);overflow:hidden}
.yt-th img{width:100%;height:100%;object-fit:cover;display:block}
.yt-th-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
.yt-rn{position:absolute;bottom:3px;left:5px;font-family:var(--disp);font-size:20px;line-height:1;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.95)}
.yt-rn.top3{color:var(--gold)}
.yt-dur{position:absolute;bottom:3px;right:4px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.8);color:#fff;padding:1px 5px;border-radius:3px}
.yt-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.yt-title{font-size:13px;font-weight:500;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.yt-meta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-ch{display:none}
.yt-vw{display:none}

/* ══ 최근 평점 후기 섹션 ══ */
.review-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.rv-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,transform .2s}
.rv-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.rv-card-top{display:flex;align-items:center;gap:9px}
.rv-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--bg3),var(--bg2));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;overflow:hidden}
.rv-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.rv-user{flex:1;min-width:0}
.rv-nick{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-mbti{font-size:10px;color:#7ec8e3;background:rgba(55,138,221,.12);border:1px solid rgba(55,138,221,.22);border-radius:3px;padding:1px 5px;display:inline-block;margin-top:1px}
.rv-time{font-family:var(--mono);font-size:10px;color:var(--muted)}
.rv-work{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.rv-pf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rv-work-title{font-size:12px;font-weight:600;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rv-stars{font-size:14px;color:var(--gold);letter-spacing:1px;line-height:1.2}
.rv-score-num{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:600;margin-left:3px}
.rv-body{font-size:13px;color:var(--muted2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.rv-eval{font-size:11px;padding:2px 7px;border-radius:4px;background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.2);width:fit-content}
.rv-skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}

/* ══ 유튜브 인라인 플레이어 ══ */
.yt-player-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:20px}
.yt-player-overlay.show{display:flex}
.yt-player-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;overflow:hidden;width:100%;max-width:860px}
.yt-player-head{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.yt-player-meta{flex:1;min-width:0}
.yt-player-title{font-size:16px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.yt-player-ch{font-size:13px;color:var(--muted);font-family:var(--mono)}
.yt-player-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted2);font-size:18px;cursor:pointer;padding:4px 10px;border-radius:7px;line-height:1;flex-shrink:0}
.yt-player-close:hover{color:var(--text);background:var(--bg)}
.yt-player-wrap{position:relative;width:100%;aspect-ratio:16/9}
.yt-player-wrap iframe{width:100%;height:100%;border:none;display:block}
.yt-player-foot{padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between}
.yt-player-views{font-size:13px;color:var(--muted);font-family:var(--mono)}
.yt-ext-btn{padding:8px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.yt-ext-btn:hover{background:#ff4d58}

const pCache={};
async function tmdbSearch(q,type){
  if(!q)return null;
  const k=q+'|'+type;
  if(pCache[k])return pCache[k];
  try{
    async function doSearch(query){
      const r=await fetch(`${TMDB_API}/search/${type}?query=${encodeURIComponent(query)}&language=ko-KR`);
      if(!r.ok)return null;
      const d=await r.json();
      const results=(d.results||[]).filter(x=>x.poster_path);
      if(!results.length)return null;
      // 1순위: 제목 정확히 일치
      const qL=query.toLowerCase();
      let x=results.find(x=>(x.title||x.name||'').toLowerCase()===qL);
      // 2순위: popularity 5 이상 중 최고
      if(!x){x=results.filter(x=>(x.popularity||0)>=5).sort((a,b)=>b.popularity-a.popularity)[0]||null;}
      return x;
    }
    // 1차: 원제로 검색
    let x=await doSearch(q);
    // 2차: 포스터 없으면 앞 3단어만으로 재검색 (긴 제목 대응)
    if(!x&&q.split(' ').length>3){x=await doSearch(q.split(' ').slice(0,3).join(' '));}
    if(!x)return null;
    /* 시즌·연도도 함께 저장 */
    const year = (x.first_air_date||x.release_date||'').slice(0,4) || '';
    const info={
      poster:   IMG+x.poster_path,
      title_ko: x.title||x.name||q,
      season:   x.number_of_seasons||1,  // TV 시리즈만 존재, 영화는 1
      year:     year,
    };
    pCache[k]=info;
    return info;
  }catch{return null;}
}

  Object.values(data).forEach(pd=>Object.values(pd).forEach(items=>items.forEach(item=>{

    else if(!item._poster){unique.set(item.q,item);}
  })));
  // 3개씩 묶어서 순차 처리 (속도 제한 방지)
  const entries=[...unique.entries()];
  const BATCH=3;
  for(let i=0;i<entries.length;i+=BATCH){
    const batch=entries.slice(i,i+BATCH);
    await Promise.all(batch.map(async([q,item])=>{
      // API에서 poster_path로 이미 _poster가 세팅된 항목은 TMDB 검색 생략
      if(item._poster)return;
      const info=await tmdbSearch(q,item.type);
      if(info){Object.values(data).forEach(pd=>Object.values(pd).forEach(items=>items.forEach(i=>{if(i.q===q&&!i._poster){
        i._poster = info.poster;
        i._ko     = info.title_ko;
        i._season = info.season || 1;
        i._year   = info.year   || '';
      }})));}
    }));
    if(i+BATCH<entries.length)await new Promise(r=>setTimeout(r,200));
    renderGrids(); // 배치마다 화면 갱신
  }
}

/* 채널명 7자 제한 */
function truncCh(ch){ return ch&&ch.length>7 ? ch.slice(0,7)+'…' : (ch||''); }

function makeSlug(title){

}

function renderCard(p,items){
  if(!items||!items.length)return'';
  const f=items[0],rest=items.slice(1);
  const posterEl=f._poster?`<img src="${f._poster}" alt="${f._ko||f.t}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:`<div class="p-hero-ph"><span class="ph-emoji">🎬</span><span class="ph-title">${f._ko||f.t}</span></div>`;

  // 플랫폼명: OTT 페이지 링크 / 더보기: 동일 링크
  const pUrl = p.url || '#';
  const card=`<div class="p-card"><div class="p-card-head"><div class="p-dot" style="background:${p.color}"></div><a class="p-name" href="${pUrl}" style="color:${p.color} !important;text-decoration:none">${p.name}</a><a class="p-cat" href="${pUrl}" style="color:var(--muted);text-decoration:none;margin-left:auto">더보기</a></div><div class="p-hero" ${fClick}>${posterEl}<div class="rank1">1</div>${f.ch==='new'?'<div class="new-b">NEW</div>':''}${f.r?`<div class="rating-b">★ ${fmtScore(f.r)}</div>`:''}<div class="p-overlay"><div class="ov-title">${f._ko||f.t}</div><div class="ov-meta">${f.r?`<span>⭐ ${fmtScore(f.r)}</span>`:''}</div></div></div><div class="p-list">`;
  const rows=rest.map((item,i)=>{

/* ── 구조화 데이터 (JSON-LD) — 홈페이지 플랫폼별 TOP10 목록용 ItemList ──
   구글이 실제로 지원하는 "영화/시리즈 목록" 리치 결과 패턴(ItemList)에 맞춰 작성한다.
   PLATFORMS(TV)와 MOVIE_PLATFORMS(영화) 각각, 데이터가 있는 플랫폼만 하나씩
   ItemList로 만들어 @graph 배열에 담는다. 헤더의 정적 WebSite JSON-LD와는 별도 스크립트. */
function updateHomeItemListSEO(){
  const graph=[];
  // 캐러셀 position은 "이 플랫폼 리스트 안에서 몇 번째"가 아니라 "페이지 전체에서 몇 번째"여야 함 —
  // 플랫폼(넷플릭스/디즈니+/쿠팡플레이 등)마다 1부터 다시 세면 서로 다른 리스트의 항목이 같은
  // position(예: 1)을 갖게 되어 구글이 "여러 ListItem 요소가 정의됨" 오류로 판정한다 (실제 테스트로 확인됨).
  // 플랫폼이 바뀌어도 리셋하지 않는 전역 카운터 사용 — 플랫폼/카테고리가 몇 개든 자동으로 이어짐.
  let globalPos=0;

  // platformArr: PLATFORMS 또는 MOVIE_PLATFORMS, dataMap: RANKINGS.tv 또는 RANKINGS.movie
  const buildList=(platformArr,dataMap,itemType,labelSuffix)=>{
    platformArr.forEach(p=>{
      // 상세페이지 링크가 없는(tmdb_id 없는) 항목은 목록에서 제외
      const items=(dataMap[p.id]||[]).filter(it=>it.tmdb_id);
      if(!items.length)return;
      graph.push({
        '@type':'ItemList',
        'name':`${p.name} ${labelSuffix} 순위 — 오뜨랑`,
        'itemListElement':items.map((it)=>{
          globalPos+=1;
          const y=it._year||new Date().getFullYear();
          const s=it._season||1;
          const entry={
            '@type':itemType,
            'name':it._ko||it.t||'',
            'url':`https://ottrank.kr/title/${s}-${y}${it.tmdb_id}`,
          };
          // 평점(aggregateRating)은 투표수(vote_count) 데이터가 없어 신뢰도 낮은 마크업이 되므로 넣지 않음
          if(it._poster)entry.image=it._poster;
          return{'@type':'ListItem','position':globalPos,'item':entry};
        }),
      });
    });
  };

  // 구글 캐러셀(ItemList) 리치 결과는 Course/Movie/Recipe/Restaurant 4개 타입만 지원 —
  // TVSeries는 지원 대상이 아니라서 마크업해봐야 Search Console에 오류로만 잡힘 (실제 테스트로 확인됨).
  // 그래서 TV 시리즈(PLATFORMS/RANKINGS.tv)는 ItemList로 만들지 않고, 영화만 생성한다.
  buildList(MOVIE_PLATFORMS,RANKINGS.movie,'Movie','영화');

  const ld={'@context':'https://schema.org','@graph':graph};
  const ldEl=document.getElementById('ldJsonHomeList');
  if(ldEl)ldEl.textContent=JSON.stringify(ld);
}

      <div class="featured-section">

            <span class="featured-title">${_escFt(group.display_name || '')}${topLabel ? ` <span class="featured-top-badge">${topLabel}</span>` : ''}</span>
          </div>
          <!-- 데스크톱 전용: live-dot + 날짜 — row1 밖에 배치해서 display:contents 영향 차단 -->
          <div class="featured-hd-update">
            <div class="live-dot"></div>
            <span>${dateStr}</span>
          </div>
        </div>
        <div class="ft-swipe-wrap">
          <button class="ft-btn prev" onclick="ftScrollTrack('${trackId}',-1)">‹</button>
          <div class="ft-swipe-track" id="${trackId}">
            ${Array(5).fill(0).map(() => `
              <div class="ft-skel">
                <div class="ft-skel-poster"></div>
                <div class="ft-skel-line"></div>
                <div class="ft-skel-line short"></div>
              </div>`).join('')}
          </div>
          <button class="ft-btn next" onclick="ftScrollTrack('${trackId}',1)">›</button>
        </div>
        <!-- 날짜 — 모바일에서 슬라이드 하단 오른쪽 표시 (live-dot 포함) -->
        <div class="featured-date-bottom">
          <div class="live-dot"></div>
          <span>${dateStr}</span>
        </div>
      </div>`;
  }).join('');

  // 각 그룹 카드 실제 렌더링 + 스와이프 초기화
  featuredGroups.forEach((group, gi) => {
    const track = document.getElementById(`ft-trk-${gi}`);
    if (!track) return;
    const items = group.items || [];
    if (!items.length) {
      track.innerHTML = `<div style="padding:20px;color:var(--muted);font-size:13px">데이터 없음</div>`;
      return;
    }
    track.innerHTML = items.map((item, idx) => {
      const rank   = item.rank || (idx + 1);
      const isTop3 = rank <= 3;
      const poster = item.poster_path
        ? `<img src="${TMDB_IMG_FT}${item.poster_path}"
                alt="${_escAttrFt(item.title_ko || '')}"
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const year   = item.release_year ? `<span class="ft-year">${item.release_year}</span>` : '';
      const rating = item.tmdb_rating  ? `<span class="ft-rating">★ ${parseFloat(item.tmdb_rating).toFixed(1)}</span>` : '';
      const y      = new Date().getFullYear();
      const href   = item.tmdb_id ? `/title/1-${y}${item.tmdb_id}` : '#';
      return `
        <div class="ft-card" onclick="ftGoWork(${item.tmdb_id},'${_escAttrFt(item.title_ko || '')}')">
          <div class="ft-poster">
            ${poster}
            <div class="ft-poster-ph" style="${poster ? 'display:none' : ''}">🎬</div>
            <div class="ft-overlay">
              <div class="ft-play">
                <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
              </div>
            </div>
          </div>

          <div class="ft-body">
            <div class="ft-title">${_escFt(item.title_ko || item.title_en || '—')}</div>

    // 드래그 스와이프 초기화
    ftInitSwipe(track);

function ftGoWork(tmdbId, title) {
  if (!tmdbId) return;
  const y = new Date().getFullYear();
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: 'tv', title: title || '', platform: 'netflix'
  }));
  location.href = `/title/1-${y}${tmdbId}`;
}
function ftScrollTrack(id, dir) {
  const t = document.getElementById(id);
  if (t) t.scrollBy({ left: dir * (200 * 3), behavior: 'smooth' });
  setTimeout(() => updateFtArrows(id), 350);
}
/* 화살표 활성/비활성 상태 갱신 — 스크롤 끝에 도달하면 완전히 투명해지고 클릭도 막힘 */
function updateFtArrows(id) {
  const track = document.getElementById(id);
  if (!track) return;
  const wrap = track.closest('.ft-swipe-wrap');
  if (!wrap) return;
  const prev = wrap.querySelector('.ft-btn.prev');
  const next = wrap.querySelector('.ft-btn.next');
  if (prev) prev.disabled = track.scrollLeft <= 4;
  if (next) next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
}
function ftInitSwipe(track) {
  let down = false, startX = 0, sl = 0;
  track.addEventListener('mousedown', e => {
    down = true; track.classList.add('dragging');
    startX = e.pageX - track.offsetLeft; sl = track.scrollLeft;
  });
  ['mouseleave', 'mouseup'].forEach(ev =>
    track.addEventListener(ev, () => { down = false; track.classList.remove('dragging'); })
  );
  track.addEventListener('mousemove', e => {
    if (!down) return; e.preventDefault();
    track.scrollLeft = sl - (e.pageX - track.offsetLeft - startX) * 1.2;
  });
}
function _escFt(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _escAttrFt(str) {
  return String(str || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

async function loadRankings(period='daily'){
  try{
    if(period==='daily'){
      // 새 API: /rankings/main (Admin 설정 기반)
      const res=await fetch(`${API}/rankings/main`);
      const json=await res.json();
      if(json.ok){
        const apiRankings=buildRankingsFromMain(json);
        PLATFORMS.forEach(p=>{
          if(apiRankings.tv[p.id]?.length)    RANKINGS.tv[p.id]    = apiRankings.tv[p.id];
          if(apiRankings.movie[p.id]?.length)  RANKINGS.movie[p.id] = apiRankings.movie[p.id];
        });
        if(apiRankings.movie['boxoffice']?.length)
          RANKINGS.movie['boxoffice']=apiRankings.movie['boxoffice'];
        renderGrids();
        // featured 슬라이드 섹션 렌더링 (넷플릭스 전용, 0~2개)
        renderFeatured(json.featured || []);
      }
    } else {
      // weekly/monthly — daily와 동일한 응답 구조, buildRankingsFromMain으로 처리
      const endpoint = period==='weekly' ? `${API}/rankings/weekly` : `${API}/rankings/monthly`;
      const res=await fetch(endpoint);
      const json=await res.json();
      if(json.ok){
        const apiRankings=buildRankingsFromMain(json);
        PLATFORMS.forEach(p=>{
          if(apiRankings.tv[p.id]?.length)    RANKINGS.tv[p.id]    = apiRankings.tv[p.id];
          if(apiRankings.movie[p.id]?.length)  RANKINGS.movie[p.id] = apiRankings.movie[p.id];
        });
        if(apiRankings.movie['boxoffice']?.length)
          RANKINGS.movie['boxoffice']=apiRankings.movie['boxoffice'];
        renderGrids();
      }
    }
  }catch(e){console.warn(period+' 랭킹 로드 실패:',e);}
}

/* ══ 최근 평점 후기 로드 ══ */
// 별점 점수(0.5~5.0, DB 저장값) → ★☆ 하프스타 문자열 변환 (5점 기준 그대로 사용)
function renderStars(score) {
  const s = parseFloat(score) || 0;
  const full  = Math.floor(s);
  const half  = (s - full) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

// 상대 시간 포맷 (초→"방금", 분→"N분 전", 시간→"N시간 전", 일→"N일 전")
function relTimeRv(dateStr) {
  if (!dateStr) return '';
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60)   return '방금';
  if (diff < 3600) return Math.floor(diff / 60) + '분 전';
  if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
  return Math.floor(diff / 86400) + '일 전';
}

// 플랫폼 색상 맵 (works 테이블 media_type은 tv/movie, 여기선 별도 플랫폼 필드 없음)
const RV_PF_COLOR = {
  netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4',
  coupang:'#1ac44d', wavve:'#0070f3', boxoffice:'#f0b429'
};

/* ── 평가어 판별 세트 (community.html과 동일) ── */
const EVAL_SET = new Set(['강추해요', '추천해요', '평범해요', '별로예요']);

/* ── API 응답 리뷰 1개를 ReviewCard 컴포넌트 형식으로 변환 ── */
function normalizeReview(rv) {
  // emotions: DB에 JSON 문자열로 저장됨 → 배열로 파싱
  let emotions = [];
  if (typeof rv.emotions === 'string') {
    try { emotions = JSON.parse(rv.emotions); } catch (e) { emotions = []; }
  } else if (Array.isArray(rv.emotions)) {
    emotions = rv.emotions;
  }

  // 첫 번째 값이 평가어(강추해요 등)이면 evaluation으로 분리
  let evaluation = '';
  if (emotions.length > 0 && EVAL_SET.has(emotions[0])) {
    evaluation = emotions[0];
    emotions   = emotions.slice(1);
  }

  // poster_path: 경로만 있으면 풀 TMDB URL로 변환
  let poster_path = rv.poster_path || '';
  if (poster_path && !poster_path.startsWith('http')) {
    poster_path = 'https://image.tmdb.org/t/p/w300' + poster_path;
  }

  return { ...rv, emotions, evaluation, poster_path };
}

async function loadRecentReviews() {
  // 로딩 중 스켈레톤 5개 표시
  ReviewCard.skeleton('reviewGrid', 5);
  try {
    // 넉넉히 20개 가져와서 JS에서 닉네임 중복 제거
    // (한 명이 연속 도배해도 5개의 서로 다른 닉네임을 확보하기 위함)
    const sid = localStorage.getItem('ottrang_sid');
    const res  = await fetch(`${API}/reviews/recent?limit=20`,
      sid ? { headers: { Authorization: 'Bearer ' + sid } } : {});
    const data = await res.json();

    if (!data.ok || !data.reviews?.length) {
      // 리뷰 없으면 그리드만 숨김 (섹션 헤더는 항상 표시)
      document.getElementById('reviewGrid')?.style.setProperty('display', 'none');
      return;
    }

    // 닉네임 중복 제거 — 최신순으로 순회하며 닉네임이 처음 나온 것만 채택
    // 같은 닉네임이 나오면 다음 리뷰로 패스, 5개 채워지면 종료
    const seen   = new Set();
    const unique = [];
    for (const rv of data.reviews) {
      const nick = rv.nickname || '익명';
      if (!seen.has(nick)) {
        seen.add(nick);
        unique.push(rv);
      }
      if (unique.length >= 5) break;
    }

    if (!unique.length) {
      // 유효한 리뷰 없으면 그리드만 숨김 (섹션 헤더는 항상 표시)
      document.getElementById('reviewGrid')?.style.setProperty('display', 'none');
      return;
    }

    // emotions 파싱 + poster_path 변환 후 ReviewCard 컴포넌트로 렌더링
    const reviews = unique.map(normalizeReview);
    ReviewCard.renderGrid(reviews, 'reviewGrid');

  } catch(e) {
    // API 오류 시 그리드만 숨김 (섹션 헤더는 항상 표시)
    document.getElementById('reviewGrid')?.style.setProperty('display', 'none');
  }
}

function _hhCardStep(row){
  const card = row.querySelector('.hh-card');
  if (!card) return 0;

  return card.getBoundingClientRect().width + gap;
}

function hhShiftWindow(dir){
  const row = document.getElementById('hhCardRow');
  const step = _hhCardStep(row);
  if (!step) return;
  row.scrollBy({ left: dir * step, behavior: 'smooth' });
}

function _hhUpdateArrowVisibility(){
  const row = document.getElementById('hhCardRow');
  const leftArrow  = document.querySelector('#hot100HeroWrap .hh-arrow-left');
  const rightArrow = document.querySelector('#hot100HeroWrap .hh-arrow-right');
  if (!row || !leftArrow || !rightArrow) return;
  const noScrollNeeded = row.scrollWidth <= row.clientWidth + 1;
  const atStart = row.scrollLeft <= 2;
  const atEnd   = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
  leftArrow.classList.toggle('hide', noScrollNeeded || atStart);
  rightArrow.classList.toggle('hide', noScrollNeeded || atEnd);
}

let _hhArrowVisTimer = null;
function hhSetupArrowVisibility(row){
  if (!row) return;
  row.addEventListener('scroll', () => {
    clearTimeout(_hhArrowVisTimer);
    _hhArrowVisTimer = setTimeout(_hhUpdateArrowVisibility, 60);
  });
  window.addEventListener('resize', () => {
    clearTimeout(_hhArrowVisTimer);
    _hhArrowVisTimer = setTimeout(_hhUpdateArrowVisibility, 60);
  });
}

const CT_TYPE_LABEL = { trailer:'예고편', preview:'선공개', teaser:'티저', release:'신작공개' };
const CT_PF_COLOR   = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3' };
const CT_PF_NAME    = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브' };
// 노출 순서 (고정 제외 후 나머지 채우는 순서 — 역순으로 가져와서 앞에 붙임)
const CT_PF_ORDER   = ['netflix', 'tving', 'disney', 'coupang', 'wavve'];

async function loadContentsPreview(){
  try {
    // ① 고정 영상 조회
    const pinnedRes  = await fetch(`${API}/contents/pinned`);
    const pinnedData = await pinnedRes.json();
    const pinned     = pinnedData.items || [];
    const need       = 5 - pinned.length; // 나머지 슬롯 수

    // ② 나머지 슬롯만큼 플랫폼별 최신 1개씩 채움
    // 고정에 이미 포함된 플랫폼은 스킵
    // 넷플→티빙→디즈니→쿠팡→웨이브 순서로 need개만큼
    const pinnedPlatforms = new Set(pinned.map(i => i.platform));
    const fillPlatforms   = CT_PF_ORDER
      .filter(p => !pinnedPlatforms.has(p))
      .slice(0, need); // 필요한 수만큼만

    // 플랫폼별 최신 1개 병렬 조회
    const fillItems = [];
    if(fillPlatforms.length) {
      const results = await Promise.all(
        fillPlatforms.map(p =>
          fetch(`${API}/contents?platform=${p}&limit=1`)
            .then(r => r.json())
            .catch(() => ({ items:[] }))
        )
      );
      results.forEach(data => {
        const item = (data.items || [])[0];
        if(item) fillItems.push(item);
      });
    }

    // ③ 최종 합산: 고정 + 플랫폼 최신
    // 노출 순서: 넷플→티빙→디즈니→쿠팡→웨이브
    // 고정 영상은 sort_order 순, 나머지는 플랫폼 순서대로
    const allItems = [...pinned, ...fillItems];

    // 넷플→티빙→디즈니→쿠팡→웨이브 순으로 정렬
    allItems.sort((a, b) => {
      // 고정 영상은 sort_order 기준
      const aPin = a.is_pinned ? a.sort_order || 0 : 99;
      const bPin = b.is_pinned ? b.sort_order || 0 : 99;
      if(aPin !== bPin) return aPin - bPin;
      // 비고정은 플랫폼 순서
      return CT_PF_ORDER.indexOf(a.platform) - CT_PF_ORDER.indexOf(b.platform);
    });

    renderContentsPreview(allItems.slice(0, 5));
  } catch(e){
    renderContentsPreview([]);
  }
}

async function loadYoutubeTrending(){
  try{
    const res  = await fetch(`${API}/youtube/trending`);
    const data = await res.json();
    if(!data.ok || !data.data?.length) return;
    // 기존 renderYT() 구조에 맞게 YT 배열 덮어쓰기
    YT.length = 0;
    data.data.forEach(v => YT.push({
      rank:    v.rank,
      vid:     v.video_id,
      title:   v.title || '',
      channel: v.channel || '',
      views:   fmtViews(v.view_count),
      dur:     '',
    }));
    renderYT();
  }catch(e){}
}

function fmtViews(n){
  if(!n) return '';
  if(n>=100000000) return (n/100000000).toFixed(1)+'억';
  if(n>=10000)     return Math.floor(n/10000)+'만';
  if(n>=1000)      return (n/1000).toFixed(1)+'천';
  return String(n);
}

init();

/* ── bfcache 복원 시 리뷰 섹션 재로드 ──
   뒤로가기로 돌아올 때 브라우저가 페이지를 메모리에서 복원(bfcache)하면
   DOMContentLoaded가 재실행되지 않아 reviewGrid가 비어 보이는 버그 방지
   loadRecentReviews()만 재호출 — 가볍고 랭킹 등 다른 섹션에 영향 없음 */
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    loadRecentReviews();
  }
});
</script>
