<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검색어 로그 | 오뜨랑 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;--red:#e63946;
  --sans:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh}

/* ── 로그인 화면 (다른 관리자 페이지와 동일 패턴) ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:40px;width:360px;text-align:center}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-input{width:100%;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);outline:none;margin-bottom:12px}
.login-input:focus{border-color:var(--border2)}
.login-btn{width:100%;padding:11px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.login-btn:hover{background:#ff4d58}
.login-err{font-size:13px;color:var(--accent);margin-top:10px;display:none}

/* ── 메인 레이아웃 ── */
.admin-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.admin-header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--border);background:transparent;
  color:var(--muted2);font-size:13px;cursor:pointer;
  text-decoration:none;transition:background .15s;
}
.back-btn:hover{background:var(--bg3);color:var(--text)}

.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}

.stat-row{display:flex;gap:12px;margin-bottom:20px}
.stat-card{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:22px;font-weight:700;font-family:var(--mono)}

/* ── 목록 테이블 (작품관리 스타일 참고) ── */
.log-table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.log-table thead th{
  background:var(--bg3);text-align:left;padding:12px 16px;
  font-size:12px;color:var(--muted2);font-weight:600;border-bottom:1px solid var(--border);
}
.log-table tbody td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.log-table tbody tr:last-child td{border-bottom:none}
.log-table tbody tr:hover{background:var(--bg3)}
.log-query{font-weight:600;color:var(--text)}
.log-count{font-family:var(--mono);color:var(--gold)}
.log-time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.empty-box{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}

.more-wrap{display:flex;justify-content:center;padding:20px 0}
.btn-secondary{padding:10px 16px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:14px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn-secondary:hover{background:var(--bg3);color:var(--text)}
.btn-secondary:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>🔍 검색어 로그</h2>
    <p>관리자 인증이 필요합니다</p>
    <input class="login-input" id="secretInput" type="password" placeholder="관리자 비밀번호"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">확인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- ── 메인 페이지 ── -->
<div id="mainWrap" style="display:none">

  <div class="admin-header">
    <h1>🔍 검색어 로그</h1>
    <a class="back-btn" href="/admin.html">← 관리자 홈</a>
  </div>

  <div class="wrap">

    <div class="stat-row">
      <div class="stat-card">
        <div class="label">전체 검색 기록</div>
        <div class="value" id="statTotal">-</div>
      </div>
    </div>

    <table class="log-table">
      <thead>
        <tr>
          <th style="width:55%">검색어</th>
          <th style="width:20%">검색결과 수</th>
          <th style="width:25%">검색 시각</th>
        </tr>
      </thead>
      <tbody id="logTbody">
        <tr><td colspan="3" class="empty-box">불러오는 중...</td></tr>
      </tbody>
    </table>

    <div class="more-wrap" id="moreWrap" style="display:none">
      <button class="btn-secondary" id="moreBtn" onclick="loadLogs(false)">더보기</button>
    </div>

  </div>
</div>

<script>
const API = 'https://ottrank-api.tdidream.workers.dev';
let ADMIN_SECRET = '';
let curPage = 1;
const PAGE_SIZE = 50;

/* ══ 로그인 ══ */
function doLogin(){
  const val = document.getElementById('secretInput').value.trim();
  if(!val) return;
  ADMIN_SECRET = val;
  verifySecret();
}
async function verifySecret(){
  try{
    const res = await fetch(`${API}/admin/search-logs?limit=1`, {
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
    });
    if(res.ok){
      localStorage.setItem('admin_token', ADMIN_SECRET);
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('mainWrap').style.display = 'block';
      loadLogs(true);
    } else {
      document.getElementById('loginErr').style.display = 'block';
      ADMIN_SECRET = '';
    }
  }catch(e){
    document.getElementById('loginErr').style.display = 'block';
  }
}

/* ══ 초기화 (다른 관리자 페이지와 같은 토큰 키를 써서, 이미 로그인돼 있으면 자동 통과) ══ */
(function init(){
  const stored = localStorage.getItem('admin_token');
  if(stored){
    ADMIN_SECRET = stored;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    loadLogs(true);
  }
})();

function hesc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtTime(iso){
  if(!iso) return '-';
  // "YYYY-MM-DD HH:MM:SS" 형태를 그대로 받아서 "MM.DD HH:MM"만 짧게 보여줌
  const m = iso.match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  return m ? `${m[1]}.${m[2]} ${m[3]}:${m[4]}` : iso;
}

/* ══ 목록 로드 — reset=true면 1페이지부터 새로, false면 다음 페이지 이어붙이기 ══ */
async function loadLogs(reset){
  if(reset) curPage = 1;
  const tbody   = document.getElementById('logTbody');
  const moreBtn = document.getElementById('moreBtn');
  const moreWrap = document.getElementById('moreWrap');

  if(reset) tbody.innerHTML = `<tr><td colspan="3" class="empty-box">불러오는 중...</td></tr>`;
  else { moreBtn.disabled = true; moreBtn.textContent = '불러오는 중...'; }

  try{
    const res = await fetch(`${API}/admin/search-logs?page=${curPage}&limit=${PAGE_SIZE}`, {
      headers: { Authorization: `Bearer ${ADMIN_SECRET}` }
    });
    const json = await res.json();
    if(!json.ok){ tbody.innerHTML = `<tr><td colspan="3" class="empty-box">불러오기 실패</td></tr>`; return; }

    document.getElementById('statTotal').textContent = (json.total || 0).toLocaleString();

    const rows = (json.data || []).map(row => `
      <tr>
        <td class="log-query">${hesc(row.query)}</td>
        <td class="log-count">${row.result_count}</td>
        <td class="log-time">${fmtTime(row.created_at)}</td>
      </tr>
    `).join('');

    if(reset){
      tbody.innerHTML = rows || `<tr><td colspan="3" class="empty-box">아직 기록된 검색어가 없습니다</td></tr>`;
    } else {
      tbody.insertAdjacentHTML('beforeend', rows);
    }

    moreWrap.style.display = json.has_more ? 'flex' : 'none';
    moreBtn.disabled = false;
    moreBtn.textContent = '더보기';
    if(json.has_more) curPage += 1;

  }catch(e){
    tbody.innerHTML = `<tr><td colspan="3" class="empty-box">불러오기 중 오류가 발생했습니다</td></tr>`;
  }
}
</script>

</body>
</html>
