# 2026-07-29 rev.3 — daily_crawl.yml (셀프호스팅 윈도우 러너로 전환 — runs-on: self-hosted,
#   defaults.run.shell: bash 지정(Git Bash 사용), 우분투 전용 playwright install-deps 삭제.
#   GitHub Actions 클라우드 IP가 FlixPatrol/KOBIS에 막히는 문제 우회 목적)
# 2026-07-29 rev.2 — daily_crawl.yml (진단 단계가 KOBIS 타임아웃 때문에 전체 실패로 번지던 버그
#   수정 — curl 명령마다 `|| true` + continue-on-error 추가, 실패해도 이후 크롤링 단계 정상 진행)
name: OTT Ranking Crawler v2

on:
  schedule:
    - cron: '17 0 * * *'   # 09:17 KST (UTC 00:17)
    - cron: '17 6 * * *'   # 15:17 KST (UTC 06:17)
    - cron: '17 12 * * *'  # 21:17 KST (UTC 12:17)
    - cron: '17 18 * * *'  # 03:17 KST (UTC 18:17)
  workflow_dispatch:        # 수동 실행 (Actions 탭에서 버튼으로 실행 가능)

jobs:
  crawl:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    permissions:
      contents: write

    steps:
      # ── 1. 코드 체크아웃 ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 설치 ───────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 의존성 설치 ───────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install playwright requests anthropic beautifulsoup4
          playwright install chromium

      # ── 4. D1 → 로컬 동기화 (⚠️ 절대 삭제 금지!) ───────────
      # Admin 수동 저장 데이터 + ott_categories 슬롯 설정 로컬 반영
      - name: Sync D1 data to local DB
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          echo "=== D1 동기화 시작 ==="
          python sync_works.py
          echo "=== D1 동기화 완료 ==="

      # ── 4-2. 네트워크 진단 (2026-07-29 신규, 임시) ───────────
      # FlixPatrol 403 / KOBIS 타임아웃 원인 확인용. 이 서버의 실제 IP와,
      # 두 사이트에 실제로 어떤 응답이 오는지 로그로 남김. 크롤링 자체엔
      # 영향 없음(조회만 함). 원인 파악되면 이 단계는 지워도 됨.
      - name: 네트워크 진단 (IP 확인 + FlixPatrol/KOBIS 접속 테스트)
        continue-on-error: true
        run: |
          echo "=== 현재 서버 공인 IP ==="
          curl -s https://ifconfig.me || true
          echo ""
          echo ""
          echo "=== FlixPatrol 접속 테스트 ==="
          curl -s -o /dev/null -w "HTTP %{http_code} (%{time_total}초)\n" --max-time 20 https://flixpatrol.com/top10/netflix/south-korea/ || true
          echo ""
          echo "=== KOBIS 접속 테스트 ==="
          curl -s -o /dev/null -w "HTTP %{http_code} (%{time_total}초)\n" --max-time 20 "http://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=test&targetDt=20260728" || true

      # ── 5. 크롤링 실행 ───────────────────────────────────────
      - name: Run crawlers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        run: |
          echo "=== 크롤링 시작 ==="
          python run_all.py
          echo "=== 크롤링 완료 ==="

      # ── 6. D1 직접 업로드 (wrangler-action 대체) ────────────
      # Python으로 D1 REST API 직접 호출 → 안정성 향상
      - name: Upload to Cloudflare D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          echo "=== D1 업로드 시작 ==="
          python upload_to_d1.py
          echo "=== D1 업로드 완료 ==="

      # ── 6-2. 티빙 날짜 자동 채움 (2026-07-28 신규) ───────────
      # 티빙 category01은 크롤링이 아니라 관리자가 "순위 저장"을 눌러야 그날 날짜로
      # 기록됨. 깜빡하고 안 누른 날은 오늘 날짜 데이터가 없는 상태 → N일간 TOP10
      # 히스토리가 하루 끊김. 이 스텝은 크론이 돌 때마다(하루 여러 번) 항상 실행되며,
      # 오늘 데이터 있으면 API가 아무것도 안 하므로 몇 번 호출돼도 안전함.
      - name: Tving 날짜 자동 채움
        run: |
          curl -s -X POST "https://ottrank-api.tdidream.workers.dev/admin/rankings/tving-autofill" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"
          echo ""

      # ── 7. rankings.db 커밋 ──────────────────────────────────
      - name: Commit rankings.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rankings.db
          git diff --staged --quiet || git commit -m "chore: update rankings $(date +'%Y-%m-%d')"
          git push
