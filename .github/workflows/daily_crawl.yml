#   빠져있던 문제 수정 — flixpatrol_api.py가 API 키를 못 받아 전부 스킵되던 원인.
#   Secrets 등록은 되어있었으나 워크플로우 env 목록에 연결이 안 되어 있었음)
# 2026-07-29 rev.7 — daily_crawl.yml (셀프호스팅 윈도우 러너에서 다시 GitHub 서버(ubuntu-latest)로
