# 2026-07-30 rev.1 — deploy.yml (Node.js 20 지원종료 경고 해결 — actions/checkout v4→v6,
#   cloudflare/wrangler-action v3→v4로 업그레이드. 배포 명령/프로젝트명 등 동작은 그대로)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ott-ranking01
