# 2026-07-30 rev.1 — build-workers.yml (Node.js 20 지원종료 경고 해결 — actions/checkout v4→v6,
#   actions/setup-node v4→v6로 업그레이드. node-version도 '20' 고정 대신 'lts/*'로 바꿔서
#   앞으로 Node 버전이 또 바뀌어도 이 경고가 재발하지 않게 함)
name: Build Workers

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'        # workers/ 폴더 변경 시에만 실행

  workflow_dispatch:        # 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: 의존성 설치 (esbuild)
        run: npm ci
        working-directory: workers

      - name: workers.js 번들 빌드
        run: npx esbuild index.js --bundle --outfile=../workers.js --format=esm --platform=browser --minify
        working-directory: workers

      - name: 빌드 결과 크기 확인
        run: |
          SIZE=$(wc -c < workers.js)
          echo "✅ workers.js 빌드 완료: ${SIZE} bytes ($(echo "$SIZE / 1024" | bc)KB)"
          # Cloudflare Workers 크기 제한 경고 (1MB = 1048576 bytes)
          if [ "$SIZE" -gt 1048576 ]; then
            echo "⚠️  경고: 1MB 초과! Cloudflare Workers 무료 플랜 제한에 걸릴 수 있습니다."
            exit 1
          fi

      - name: 변경된 workers.js 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workers.js
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "build: workers.js 자동 번들 업데이트 [skip ci]"
            git push
          fi
