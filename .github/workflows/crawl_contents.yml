name: Crawl OTT Contents

on:
  # 하루 2회 자동 실행 (오전 8시, 오후 8시 KST = UTC 23:00, 11:00)
  schedule:
    - cron: "0 23 * * *"   # 오전 8시 KST
    - cron: "0 11 * * *"   # 오후 8시 KST

  # 수동 실행
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: OTT 콘텐츠 크롤링 실행
        env:
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          ADMIN_SECRET:      ${{ secrets.ADMIN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY:      ${{ secrets.TMDB_API_KEY }}
        run: python crawlers/crawl_contents.py
