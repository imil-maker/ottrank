name: Add Google Analytics to all HTML files

on:
  workflow_dispatch:

jobs:
  add-ga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Insert GA tag into all HTML files
        run: |
          python3 << 'PYEOF'
          import os, re

          GA_TAG = """  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NMN87YB7Y3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NMN87YB7Y3');
  </script>"""

          SKIP_FILES = {'header.html', 'footer.html'}
          pattern = re.compile(r'(<meta\s+charset=["\']UTF-8["\']>)', re.IGNORECASE)

          for root, dirs, files in os.walk('.'):
              # .github 폴더 제외
              dirs[:] = [d for d in dirs if d != '.github']
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  if fname in SKIP_FILES:
                      print(f'SKIP (excluded): {fname}')
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                      content = f.read()
                  # 이미 GA 태그 있으면 스킵
                  if 'G-NMN87YB7Y3' in content:
                      print(f'SKIP (already has GA): {fpath}')
                      continue
                  # charset 태그 없으면 스킵
                  if not pattern.search(content):
                      print(f'SKIP (no charset tag): {fpath}')
                      continue
                  new_content = pattern.sub(r'\1\n' + GA_TAG, content, count=1)
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f'DONE: {fpath}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "변경된 파일 없음" || git commit -m "feat: add Google Analytics (G-NMN87YB7Y3) to all HTML pages"
          git push || echo "push 할 변경사항 없음"
