<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="seoTitle">작품 상세 | 오뜨랑 — OTT 랭킹·평점·후기</title>
<meta id="seoDesc" name="description" content="OTT 작품 평점, 사용자 후기, 해외반응, 순위 히스토리를 오뜨랑에서 확인하세요.">
<meta id="seoKw" name="keywords" content="OTT 평점, 드라마 후기, 영화 후기, 넷플릭스 평점, 티빙 평점, 해외반응">
<meta name="robots" content="index, follow">
<link id="seoCanonical" rel="canonical" href="https://ottrank.kr/title.html">
<meta property="og:type" content="article">
<meta property="og:site_name" content="오뜨랑">
<meta id="seoOgTitle" property="og:title" content="작품 상세 | 오뜨랑">
<meta id="seoOgDesc" property="og:description" content="OTT 작품 평점과 사용자 후기를 확인하세요.">
<meta id="seoOgUrl" property="og:url" content="https://ottrank.kr/title.html">
<meta id="seoOgImg" property="og:image" content="https://ottrank.kr/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta id="seoTwTitle" name="twitter:title" content="작품 상세 | 오뜨랑">
<meta id="seoTwDesc" name="twitter:description" content="OTT 작품 평점과 사용자 후기를 확인하세요.">
<meta id="seoTwImg" name="twitter:image" content="https://ottrank.kr/og-image.png">
<script id="ldJson" type="application/ld+json">{}</script>
<!-- 폰트/아이콘 -->
<!-- 스타일 -->
<link rel="stylesheet" href="/title_detail.css">
</head>
<body>

<div id="ottrang-header"></div>

<div id="detailPage">

<!-- ══ 히어로 ══ -->
<div class="hero-backdrop" id="heroBackdrop">
  <div id="heroLoading" class="loading-row"><div class="spinner"></div><span>작품 정보 불러오는 중…</span></div>
  <img id="backdropImg" class="hero-backdrop-img" src="" alt="">
  <div class="hero-backdrop-overlay"></div>

  <!-- 뒤로가기 — 화살표만, 이전 페이지로 -->
  <a class="back-floating" href="#" onclick="history.back();return false;" aria-label="이전 페이지">
    <i class="ti ti-arrow-left"></i>
  </a>

  <div class="hero-content" id="heroContent">
    <!-- 포스터 -->
    <div class="hero-poster" id="heroPoster">

      <div class="hero-poster-ph" id="posterPh">🎬</div>
      <img id="posterImg" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="eager">
      <a class="platform-pill" id="platformPill" style="display:none;text-decoration:none;cursor:pointer" href="#" target="_blank" rel="noopener"></a>

    </div>

    <!-- 정보 -->
    <div class="hero-info">
      <div>
        <h1 class="hero-main-title" id="mainTitle">작품명</h1>
        <div class="hero-orig-title" id="origTitle"></div>
      </div>
      <div class="hero-tags" id="genreTags"></div>
      <div class="hero-meta" id="metaRow"></div>
      <p class="hero-overview" id="overview">줄거리 정보 불러오는 중…</p>

      <!-- 감정 표현 4버튼 -->
      <div class="feeling-btns">
        <button class="feeling-btn f-great" onclick="feelingClick('강추해요')"><span class="f-emoji">🔥</span>강추해요</button>
        <button class="feeling-btn f-good" onclick="feelingClick('추천해요')"><span class="f-emoji">👍</span>추천해요</button>
        <button class="feeling-btn f-meh" onclick="feelingClick('평범해요')"><span class="f-emoji">😐</span>평범해요</button>
        <button class="feeling-btn f-bad" onclick="feelingClick('별로예요')"><span class="f-emoji">👎</span>별로예요</button>
      </div>

      <!-- 랭킹 정보 행 -->
      <!-- 찜 + 공유 + 랭킹 칩 한 행 -->
      <div class="hero-action-row">
        <button class="hero-wish-btn" id="wishBtn" onclick="toggleWish()">♡ 찜하기</button>
        <button class="hero-share-btn" onclick="shareNative()">
          <i class="ti ti-share" style="font-size:18px"></i> 공유
        </button>
        <div id="heroRankRow" style="display:contents"></div>
      </div>
    </div>
  </div>
</div><!-- /hero-backdrop -->

<!-- ══ 본문 ══ -->
<div class="page-wrap">

<!-- 출연진 -->
<div class="cast-section" id="castSection" style="display:none">
  <div class="sec-title"><i class="ti ti-users" style="font-size:16px"></i>출연진 &amp; 제작진</div>
  <div class="director-row" id="directorRow"></div>
  <div class="cast-scroll" id="castScroll"></div>
</div>

<!-- 평점 4블록 -->
<div class="ratings-row">
  <div class="r-card">
    <div class="r-logo" style="color:#F5C518">IMDb</div>
    <div class="r-score-wrap"><div class="r-score" id="imdbScore" style="color:#F5C518">—</div><span class="r-out-of">/10</span></div>
    <div class="r-sub" id="imdbVotes" style="font-size:15px;margin-top:4px">—</div>
  </div>
  <div class="r-card">
    <div class="r-logo" style="color:#01b4e4">TMDB</div>
    <div class="r-score-wrap"><div class="r-score" id="tmdbScore" style="color:#01b4e4">—</div><span class="r-out-of">/10</span></div>
    <div class="r-sub" id="tmdbVotes" style="font-size:15px;margin-top:4px">—</div>
  </div>
  <div class="r-card" style="position:relative">
    <div class="r-logo" style="background:linear-gradient(90deg,#FF5177,#FF9A3C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">오뜨랑</div>
    <div id="userRatingEmpty" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;width:100%" onclick="goReview(0)">
      <span style="font-size:28px">🎬</span>
      <span style="font-size:18px;color:var(--muted2);font-family:var(--font-mono);text-align:center;line-height:1.4">이 작품의 첫번째<br>평점을 남겨보세요</span>
    </div>
    <div id="userRatingFilled" style="display:none;flex-direction:column;align-items:center;width:100%">
      <div class="r-score-wrap"><div class="r-score" id="userScore" style="color:var(--accent)">—</div><span class="r-out-of">/10</span></div>
      <div style="font-size:15px;color:var(--gold);margin-top:6px;letter-spacing:2px;line-height:1" id="userStarDisplay"></div>
      <div class="r-sub" id="userVotes" style="font-size:15px;margin-top:6px">—</div>
    </div>
  </div>
  <div class="r-card">
    <div class="r-logo" style="color:var(--muted2)">내 평점</div>
    <div id="myRatingDisplay" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;width:100%" onclick="goReview(0)">
      <span style="font-size:28px">✍️</span>
      <span style="font-size:15px;color:var(--info);font-family:var(--font-mono)">평점 남기기</span>
    </div>
  </div>
</div>

<!-- 시청가이드 + 지금 보러가기 -->
<div class="wg-outer" id="wgOuter" style="display:none;gap:16px;margin-bottom:24px">
  <!-- 시청가이드 -->
  <div class="watch-guide" id="watchGuideSection" style="flex:1;margin-bottom:0">
    <div class="sec-title"><i class="ti ti-shield-check" style="font-size:16px"></i>시청가이드 <small id="watchGradeLabel"></small></div>
    <div class="wg-grid" id="watchGuideGrid"></div>
    <div style="font-size:15px;color:var(--muted);margin-top:10px;font-family:var(--font-mono)">출처: 영상물등급위원회</div>
  </div>
  <!-- 지금 보러가기 -->
  <div class="watch-now-box" id="watchNowBox" style="display:none">
    <div class="sec-title" style="margin-bottom:12px"><i class="ti ti-player-play" style="font-size:16px"></i>지금 보러가기</div>
    <div class="watch-now-btns" id="watchNowBtns"></div>
  </div>
</div>

<!-- 평점/후기 요약 박스 -->
<div class="my-review-box" id="myReviewBox">
  <!-- 내 후기 없을 때 -->
  <div id="myReviewEmpty">
    <p style="font-size:18px;color:var(--muted2);margin-bottom:14px">이 작품 어떠셨나요?</p>
    <div class="my-star-row" id="myStarRow">
      <span class="my-star" data-v="1" onclick="goReview(1)">★</span>
      <span class="my-star" data-v="2" onclick="goReview(2)">★</span>
      <span class="my-star" data-v="3" onclick="goReview(3)">★</span>
      <span class="my-star" data-v="4" onclick="goReview(4)">★</span>
      <span class="my-star" data-v="5" onclick="goReview(5)">★</span>
    </div>
    <button class="go-review-btn" onclick="goReview(0)">
      <i class="ti ti-pencil" style="font-size:18px"></i> 후기 작성하기
    </button>
  </div>
  <!-- 내 후기 있을 때 -->
  <div id="myReviewFilled" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:13px;color:var(--muted)">내 평점</span>
      <span id="myReviewStars" style="color:var(--gold);font-size:18px;letter-spacing:2px"></span>
      <span id="myReviewScore" style="font-size:18px;font-weight:700;color:var(--gold);font-family:var(--font-mono)"></span>
      <button class="go-review-btn" style="margin-left:auto;padding:6px 14px;font-size:16px" onclick="goReview(0)">
        <i class="ti ti-pencil" style="font-size:16px"></i> 수정
      </button>
    </div>
    <div id="myReviewEval" style="margin-bottom:6px"></div>
    <div id="myReviewText" style="font-size:18px;color:var(--muted2);line-height:1.6"></div>
  </div>
</div>

<!-- 사용자 댓글 -->
<div id="commentSection">
  <div class="sec-title"><i class="ti ti-message-circle" style="font-size:16px"></i>사용자 댓글 <small id="commentCount">0개</small></div>
  <div class="comment-sort-row">
    <button class="sort-btn on" id="sortLatest" onclick="setSort('latest')">최신순</button>
    <button class="sort-btn" id="sortLikes" onclick="setSort('likes')">좋아요순</button>
  </div>
  <div id="commentsArea"></div>
  <div id="pagination" class="pagination"></div>
</div>

<!-- 유튜브 -->
<div class="yt-section">
  <div class="sec-title"><i class="ti ti-brand-youtube" style="font-size:16px"></i>관련 영상 <small id="ytSubtitle"></small></div>
  <div id="ytModal" class="modal-wrap">
    <div class="modal-head">
      <span class="modal-ttl" id="ytModalTitle"></span>
      <button class="modal-close" onclick="closePlayer()">✕</button>
    </div>
    <div class="yt-player-wrap">
      <iframe id="ytFrame" src="" allowfullscreen allow="autoplay;encrypted-media" title="유튜브 영상"></iframe>
    </div>
  </div>
  <div id="ytArea"></div>
  <div class="yt-pagination" id="ytPagination" style="display:none"></div>
</div>

<!-- TMDB 이미지 갤러리 -->
<div class="gallery-section" id="gallerySection" style="display:none">
  <div class="sec-title"><i class="ti ti-photo" style="font-size:16px"></i>이미지</div>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

</div><!-- /.page-wrap -->
</div><!-- /#detailPage -->

<!-- 프로필 페이지 -->
<div id="profilePage" style="display:none">
<div class="page-wrap-inner">
<button class="back" onclick="showDetail()"><i class="ti ti-arrow-left" style="font-size:15px"></i><span id="profileBackLabel">작품으로 돌아가기</span></button>
<div class="profile-hero">
  <div class="profile-avatar" id="profileAvatar">?</div>
  <div class="profile-info">
    <div class="profile-name" id="profileName">사용자</div>
    <div class="profile-join" id="profileJoin"></div>
    <div class="profile-stats">
      <div class="pstat"><div class="pstat-num" id="pstatReviews">0</div><div class="pstat-label">평점</div></div>
      <div class="pstat"><div class="pstat-num" id="pstatAvg">—</div><div class="pstat-label">평균 별점</div></div>
      <div class="pstat"><div class="pstat-num" id="pstatLikes">0</div><div class="pstat-label">받은 좋아요</div></div>
    </div>
  </div>
</div>
<div class="dist-card">
  <div class="sec-title"><i class="ti ti-chart-bar" style="font-size:16px"></i>평점 분포</div>
  <div id="distBars"></div>
</div>
<div class="sec-title"><i class="ti ti-history" style="font-size:16px"></i>평점 남긴 작품 <small id="profileReviewCount">0개</small></div>
<div class="user-reviews" id="userReviews"></div>
</div>
</div>

<div class="share-toast" id="shareToast"></div>
<!-- Chart.js -->
<!-- 페이지 로직 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="/title_detail.js"></script>
</body>
</html>
