<style>
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;
  --info:#378ADD;--info-bg:rgba(55,138,221,.12);--info-border:rgba(55,138,221,.35);
  --warn-bg:rgba(240,180,41,.12);--warn-border:rgba(240,180,41,.35);
  --danger-bg:rgba(230,57,70,.12);--danger-border:rgba(230,57,70,.35);
  --font-sans:'Noto Sans KR',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-disp:'Bebas Neue',sans-serif;
  --r:10px;--r-lg:14px;
  --content-w:900px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.6;min-height:100vh;overflow-x:hidden}

/* ══ 히어로 backdrop ══ */
.hero-backdrop{position:relative;width:100%;min-height:440px;background:var(--bg2);overflow:hidden}
.hero-backdrop-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:0;transition:opacity .6s ease}
.hero-backdrop-img.loaded{opacity:1}
.hero-backdrop-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(12,12,16,.3) 0%,rgba(12,12,16,.55) 40%,rgba(12,12,16,.88) 75%,rgba(12,12,16,1) 100%),
             linear-gradient(to right,rgba(12,12,16,.65) 0%,transparent 55%);
}
.hero-content{position:relative;z-index:2;max-width:var(--content-w);margin:0 auto;padding:28px 20px 36px;display:none;gap:32px;align-items:flex-end}
.hero-content.visible{display:flex}

/* 뒤로가기 — 화살표만 */
.back-floating{
  position:absolute;top:16px;left:16px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);border:.5px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.85);cursor:pointer;text-decoration:none;
  transition:all .15s;backdrop-filter:blur(8px);font-size:16px;
}
.back-floating:hover{background:rgba(0,0,0,.7);color:#fff}

/* 수동 랭킹 배지 (포스터 위) */
.manual-badges{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;flex-direction:column;gap:4px}
.manual-badge{
  font-size:10px;font-weight:700;padding:4px 9px;border-radius:5px;
  background:rgba(240,180,41,.9);color:#1a1200;
  font-family:var(--font-mono);letter-spacing:.3px;
  backdrop-filter:blur(4px);text-align:center;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 포스터 */
.hero-poster{flex-shrink:0;width:180px;aspect-ratio:2/3;border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 64px rgba(0,0,0,.7);position:relative;background:var(--bg3);transition:transform .2s ease}
.hero-poster:hover{transform:translateY(-4px)}
.hero-poster img{width:100%;height:100%;object-fit:cover;display:block}
.hero-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.platform-pill{position:absolute;top:10px;left:10px;color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;font-family:var(--font-mono);letter-spacing:.5px;backdrop-filter:blur(4px)}

/* 히어로 정보 */
.hero-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.hero-main-title{font-size:36px;font-weight:900;line-height:1.1;letter-spacing:-.5px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hero-orig-title{font-size:13px;color:rgba(255,255,255,.5);margin-top:2px;font-family:var(--font-mono)}
.hero-tags{display:flex;flex-wrap:wrap;gap:6px}
.hero-tag{font-size:11px;padding:3px 11px;border-radius:20px;border:.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-family:var(--font-mono);backdrop-filter:blur(4px);background:rgba(255,255,255,.05)}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero-meta-item{font-size:13px;color:rgba(255,255,255,.6)}
.hero-meta-item b{color:#fff;font-weight:600}
.hero-meta-sep{color:rgba(255,255,255,.2);font-size:12px}
.hero-overview{font-size:14px;color:rgba(255,255,255,.6);line-height:1.75;max-width:520px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 감정 표현 4버튼 (히어로 하단) */
.feeling-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.feeling-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 16px;border-radius:var(--r-lg);
  border:.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.8);font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--font-sans);
  transition:all .2s ease;backdrop-filter:blur(8px);min-width:72px;
}
.feeling-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.feeling-btn .f-emoji{font-size:22px;line-height:1}
.feeling-btn.f-great{border-color:rgba(240,180,41,.4);color:#f0b429}
.feeling-btn.f-great:hover{background:rgba(240,180,41,.12)}
.feeling-btn.f-good{border-color:rgba(52,211,153,.4);color:#34d399}
.feeling-btn.f-good:hover{background:rgba(52,211,153,.1)}
.feeling-btn.f-meh{border-color:rgba(160,160,188,.4);color:var(--muted2)}
.feeling-btn.f-meh:hover{background:rgba(160,160,188,.08)}
.feeling-btn.f-bad{border-color:rgba(230,57,70,.4);color:var(--accent)}
.feeling-btn.f-bad:hover{background:rgba(230,57,70,.08)}

/* TOP10 일수 + 찜 버튼 행 */
.hero-action-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.top10-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:9px 16px;border-radius:var(--r);
  background:rgba(240,180,41,.12);
  border:.5px solid rgba(240,180,41,.4);
  color:var(--gold);font-size:13px;font-weight:700;
  font-family:var(--font-mono);
}
.hero-wish-btn{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r);background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:all .15s;backdrop-filter:blur(8px)}
.hero-wish-btn:hover{background:rgba(255,255,255,.18)}
.hero-wish-btn.wished{background:rgba(240,180,41,.15);border-color:rgba(240,180,41,.5);color:var(--gold)}
.hero-share-btn{display:flex;align-items:center;gap:5px;padding:9px 14px;border-radius:var(--r);background:transparent;border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.65);font-size:13px;cursor:pointer;font-family:var(--font-sans);transition:all .15s}
.hero-share-btn:hover{background:rgba(255,255,255,.08);color:#fff}

/* ══ 본문 ══ */
.page-wrap{max-width:var(--content-w);margin:0 auto;padding:24px 20px 80px}

/* ══ 출연진 ══ */
.cast-section{margin-bottom:28px}
.cast-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none}
.cast-scroll::-webkit-scrollbar{display:none}
.cast-card{flex-shrink:0;width:88px;cursor:pointer;text-decoration:none;transition:transform .2s ease}
.cast-card:hover{transform:translateY(-3px)}
.cast-photo{width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--bg3);border:2px solid var(--border);margin-bottom:7px;position:relative}
.cast-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cast-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--info);background:var(--info-bg);font-family:var(--font-mono)}
.cast-name{font-size:12px;font-weight:600;text-align:center;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-role{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}
.director-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.director-chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:30px;border:.5px solid var(--border2);background:var(--bg2);cursor:pointer;text-decoration:none;transition:all .15s}
.director-chip:hover{border-color:var(--info-border);background:var(--info-bg)}
.director-photo{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--bg3);flex-shrink:0}
.director-photo img{width:100%;height:100%;object-fit:cover;display:block}
.director-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--info)}
.director-name{font-size:13px;font-weight:600;color:var(--text)}
.director-label{font-size:10px;color:var(--muted);font-family:var(--font-mono)}

/* ══ 평점 4블록 ══ */
.ratings-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.r-card{background:var(--bg2);border-radius:var(--r);padding:16px 12px;text-align:center;border:.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:border-color .15s}
.r-card:hover{border-color:var(--border2)}
.r-logo{font-size:16px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.r-score{font-size:30px;font-weight:700;line-height:1}
.r-score-wrap{display:flex;align-items:baseline;gap:3px}
.r-out-of{font-size:13px;color:var(--muted);font-weight:400;font-family:var(--font-mono)}
.r-sub{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--font-mono)}

/* ══ 섹션 공통 ══ */
.sec-title{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title small{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--font-mono)}

/* ══ TMDB 이미지 갤러리 ══ */
.gallery-section{margin-bottom:28px}
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-item{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--bg3);cursor:pointer;transition:opacity .15s}
.gallery-item:hover{opacity:.85}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}

/* ══ 평점 CTA 배너 ══ */
/* ══ 별점 입력 ══ */
.user-rating-box{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:24px}
.star-input{display:flex;gap:2px;margin:12px 0;align-items:center}
.star-wrap{position:relative;width:38px;height:38px;cursor:pointer;flex-shrink:0}
.star-wrap .s-full,.star-wrap .s-half{position:absolute;top:0;left:0;font-size:34px;line-height:1;color:var(--border);transition:color .1s;user-select:none}
.star-wrap .s-full{z-index:1}.star-wrap .s-half{width:50%;overflow:hidden;z-index:2}
.star-wrap.half .s-half{color:var(--gold)}.star-wrap.half .s-full{color:var(--border)}
.star-wrap.full .s-full{color:var(--gold)}.star-wrap.full .s-half{color:var(--gold)}
#starLabel{font-size:14px;color:var(--muted);margin-left:12px}

/* 평가 버튼 4개 (후기 입력 내부) */
.eval-btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.eval-btn{
  display:flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:30px;
  border:.5px solid var(--border);
  background:var(--bg2);color:var(--muted2);
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:var(--font-sans);transition:all .2s ease;
}
.eval-btn:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px)}
.eval-btn.on{box-shadow:0 2px 12px rgba(55,138,221,.15);transform:translateY(-1px)}
.eval-btn[data-val="강추해요"].on{background:rgba(240,180,41,.12);color:var(--gold);border-color:rgba(240,180,41,.4)}
.eval-btn[data-val="추천해요"].on{background:rgba(52,211,153,.1);color:#34d399;border-color:rgba(52,211,153,.4)}
.eval-btn[data-val="평범해요"].on{background:rgba(160,160,188,.08);color:var(--muted2);border-color:rgba(160,160,188,.4)}
.eval-btn[data-val="별로예요"].on{background:rgba(230,57,70,.1);color:var(--accent);border-color:rgba(230,57,70,.4)}

/* 감정 태그 */
.etag-section-label{font-size:12px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.3px;margin-bottom:8px}
.etag-grid{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.etag{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:30px;border:.5px solid var(--border);font-size:13px;color:var(--muted2);cursor:pointer;background:var(--bg2);transition:all .2s ease;font-family:var(--font-sans);user-select:none}
.etag:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px)}
.etag.on{background:linear-gradient(135deg,var(--info-bg),rgba(55,138,221,.06));color:var(--info);border-color:var(--info-border);box-shadow:0 2px 12px rgba(55,138,221,.15);transform:translateY(-1px)}
.etag.disabled{opacity:.3;cursor:default;transform:none}
.etag-emoji{font-size:16px;line-height:1}
.etag-count{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px}

.comment-input-row{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.comment-input-row textarea{flex:1;min-height:80px;resize:none;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:12px;color:var(--text);font-size:14px;font-family:var(--font-sans);outline:none;line-height:1.6;transition:border-color .15s}
.comment-input-row textarea:focus{border-color:var(--border2)}
.submit-btn{padding:12px 22px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-sans);transition:background .15s;white-space:nowrap;align-self:flex-end}
.submit-btn:hover{background:#ff4d58}
.char-count{font-size:11px;color:var(--muted);font-family:var(--font-mono);text-align:right;margin-top:4px}
.char-count.warn{color:var(--accent)}
.comment-share-row{margin-top:16px;padding-top:12px;border-top:.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comment-share-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:.5px solid var(--border);font-size:12px;color:var(--muted2);cursor:pointer;background:transparent;transition:all .15s;font-family:var(--font-sans)}
.comment-share-btn:hover{border-color:var(--border2);color:var(--text)}


/* ══ 댓글 ══ */
.comment-sort-row{display:flex;gap:6px;margin-bottom:14px}
.sort-btn{padding:5px 14px;border-radius:20px;border:.5px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);background:transparent;transition:all .15s}
.sort-btn.on{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.comments-section{display:flex;flex-direction:column;gap:1px}
.comment-item{padding:16px 0;border-bottom:.5px solid var(--border)}
.comment-item:last-child{border-bottom:none}
.comment-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--info);cursor:pointer;flex-shrink:0;border:.5px solid var(--info-border)}
.avatar:hover{opacity:.75}
.c-name-wrap{display:flex;align-items:center;gap:6px;cursor:pointer}
.c-name{font-size:14px;font-weight:600;color:var(--text)}
.c-name:hover{color:var(--info);text-decoration:underline}
.c-stars{display:flex;gap:1px}
.c-star{font-size:12px;color:var(--gold)}
.c-star.off{color:var(--border2)}
.c-time{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-left:auto}
.c-text{font-size:15px;color:var(--muted2);line-height:1.65;margin-bottom:8px}
.c-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-like{font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;border:.5px solid var(--border);transition:all .15s}
.c-like:hover{color:var(--accent);border-color:rgba(230,57,70,.4);background:var(--danger-bg)}
.c-share{font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);display:flex;align-items:center;gap:3px;background:none;border:none;padding:0;transition:color .15s}
.c-share:hover{color:var(--info)}
.c-delete-btn{background:none;border:none;font-size:11px;color:var(--accent);cursor:pointer;font-family:var(--font-mono);padding:0}
.c-delete-btn:hover{text-decoration:underline}
.c-ebadge{font-size:11px;padding:2px 10px;border-radius:10px;background:var(--info-bg);color:var(--info);font-family:var(--font-mono)}
.c-cbadge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--warn-bg);color:#c89a10;font-family:var(--font-mono)}
.sp-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--danger-bg);color:var(--accent);font-family:var(--font-mono)}
.empty-comments{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;text-align:center}
.empty-comments-btn{margin-top:4px;padding:10px 24px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-sans)}

/* ══ 페이지네이션 ══ */
.pagination{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0 24px}
.pg-btn{min-width:34px;height:34px;padding:0 8px;border-radius:var(--r);border:.5px solid var(--border);background:transparent;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;transition:all .15s}
.pg-btn:hover{background:var(--bg3);color:var(--text)}
.pg-btn.on{background:var(--bg3);color:var(--text);border-color:var(--border2);font-weight:600}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{font-size:12px;color:var(--muted);padding:0 4px}

/* ══ 유튜브 ══ */
.yt-section{margin-bottom:24px}
.yt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.yt-featured{grid-column:1/-1;margin-bottom:4px}
.yt-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.yt-card:hover{border-color:var(--border2)}
.yt-thumb{position:relative;aspect-ratio:16/9;background:var(--bg3);overflow:hidden}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
.yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.yt-card:hover .yt-play{opacity:1}
.yt-play-icon{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.yt-dur{position:absolute;bottom:5px;right:7px;background:rgba(0,0,0,.85);color:#fff;font-size:10px;font-family:var(--font-mono);padding:2px 6px;border-radius:3px}
.yt-badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;font-family:var(--font-mono)}
.yt-info{padding:12px}
.yt-title{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.yt-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.modal-wrap{display:none;border:.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:24px;background:var(--bg)}
.modal-wrap.show{display:block}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border)}
.modal-ttl{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.yt-player-wrap{position:relative;width:100%;aspect-ratio:16/9}
.yt-player-wrap iframe{width:100%;height:100%;border:none;display:block}
/* 유튜브 페이지네이션 */
.yt-pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px}
.yt-pg-btn{width:28px;height:28px;border-radius:50%;border:.5px solid var(--border);background:transparent;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;transition:all .15s}
.yt-pg-btn:hover{background:var(--bg3);color:var(--text)}
.yt-pg-btn.on{background:var(--bg3);color:var(--text);border-color:var(--border2)}

/* ══ 토스트 ══ */
.share-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;border-radius:22px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;font-family:var(--font-mono)}
.share-toast.show{opacity:1}

/* ══ 로딩 ══ */
.loading-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-family:var(--font-mono);min-height:380px}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--info);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ 프로필 ══ */
.page-wrap-inner{max-width:var(--content-w);margin:0 auto;padding:24px 20px 80px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted2);cursor:pointer;margin-bottom:20px;padding:7px 14px;border-radius:var(--r);border:.5px solid var(--border);background:transparent;transition:background .15s;text-decoration:none}
.back:hover{background:var(--bg3)}
.profile-hero{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;display:flex;align-items:flex-start;gap:20px}
.profile-avatar{width:68px;height:68px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:var(--info);flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:20px;font-weight:700;margin-bottom:4px}
.profile-join{font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-bottom:14px}
.profile-stats{display:flex;gap:24px;flex-wrap:wrap}
.pstat{text-align:center}
.pstat-num{font-size:20px;font-weight:700;color:var(--text)}
.pstat-label{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:2px}
.dist-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:18px}
.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dist-label{font-size:12px;font-family:var(--font-mono);color:var(--muted);width:22px;text-align:right;flex-shrink:0}
.dist-bar-bg{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.dist-bar-fill{height:100%;border-radius:4px;background:var(--gold);transition:width .5s ease}
.dist-count{font-size:11px;font-family:var(--font-mono);color:var(--muted);width:26px;text-align:right;flex-shrink:0}
.user-reviews{display:flex;flex-direction:column;gap:10px}
.review-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;gap:14px;cursor:pointer;transition:border-color .15s}
.review-card:hover{border-color:var(--border2)}
.review-poster{width:48px;height:68px;border-radius:7px;background:var(--bg3);flex-shrink:0;overflow:hidden}
.review-poster img{width:100%;height:100%;object-fit:cover;display:block}
.review-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px}
.review-body{flex:1;min-width:0}
.review-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.review-title{font-size:14px;font-weight:600}
.review-stars{display:flex;align-items:center;gap:2px;font-size:12px;margin-left:auto}
.review-star{color:var(--gold)}.review-star.off{color:var(--border2)}
.review-score-num{font-family:var(--font-mono);font-size:12px;color:var(--gold);margin-left:3px}
.review-text{font-size:13px;color:var(--muted2);line-height:1.55;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.review-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.review-time{font-size:11px;color:var(--muted);font-family:var(--font-mono)}

/* ══ 시청가이드 ══ */
.watch-guide{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:24px}
.wg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.wg-item{background:var(--bg3);border-radius:var(--r);padding:12px 8px;text-align:center;border:.5px solid var(--border)}
.wg-emoji{font-size:22px;margin-bottom:6px}
.wg-label{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px}
.wg-level{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.wg-level.none{background:rgba(52,211,153,.1);color:#34d399}
.wg-level.low{background:rgba(240,180,41,.1);color:var(--gold)}
.wg-level.mid{background:rgba(230,57,70,.1);color:var(--accent)}
.wg-level.high{background:rgba(230,57,70,.2);color:#ff6b6b;border:.5px solid rgba(230,57,70,.4)}
@media(max-width:640px){.wg-grid{grid-template-columns:repeat(2,1fr)}}


/* ══ 랭킹 정보 행 ══ */
.hero-rank-row{display:flex;flex-wrap:wrap;gap:6px}
.rank-info-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:var(--r);
  font-size:12px;font-weight:700;font-family:var(--font-mono);
  backdrop-filter:blur(8px);
}
.rank-info-chip.chip-rank{background:rgba(230,57,70,.15);border:.5px solid rgba(230,57,70,.4);color:var(--accent)}
.rank-info-chip.chip-top10{background:rgba(240,180,41,.12);border:.5px solid rgba(240,180,41,.4);color:var(--gold)}
.rank-info-chip.chip-manual{background:rgba(240,180,41,.15);border:.5px solid rgba(240,180,41,.5);color:#f0b429}

/* ══ 시청가이드 + 보러가기 래퍼 ══ */
.wg-outer{display:flex;align-items:flex-start}
.watch-guide{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:0}
.watch-now-box{
  width:200px;flex-shrink:0;
  background:var(--bg2);border:.5px solid var(--border);
  border-radius:var(--r-lg);padding:20px;
}
.watch-now-btns{display:flex;flex-direction:column;gap:8px}
.watch-now-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:var(--r);
  border:.5px solid var(--border2);
  background:var(--bg3);color:var(--text);
  font-size:13px;font-weight:600;
  cursor:pointer;text-decoration:none;
  transition:all .15s;
}
.watch-now-btn:hover{border-color:var(--info-border);background:var(--info-bg);color:var(--info)}
.watch-now-btn .wn-icon{font-size:16px}
@media(max-width:640px){
  .wg-outer{flex-direction:column}
  .watch-now-box{width:100%}
  .watch-now-btns{flex-direction:row;flex-wrap:wrap}
}

/* ══ rating-cta-banner 삭제됐으므로 관련 CSS도 제거 ══ */
/* ══ 모바일 ══ */
@media(max-width:640px){
  .hero-content{flex-direction:column;align-items:flex-start;gap:16px;padding-bottom:24px}
  .hero-poster{width:130px}
  .hero-main-title{font-size:26px}
  .hero-overview{-webkit-line-clamp:2}
  .hero-backdrop{min-height:320px}
  .ratings-row{grid-template-columns:1fr 1fr}
  .r-score{font-size:24px}
  .yt-grid{grid-template-columns:1fr}
  .cast-card{width:72px}.cast-photo{width:72px;height:72px}
  .feeling-btns{gap:6px}
  .feeling-btn{min-width:60px;padding:8px 10px;font-size:11px}
  .feeling-btn .f-emoji{font-size:18px}
  .gallery-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
<style>
#ottrang-header{position:sticky;top:0;z-index:200}
/* 헤더 슬로건 배너 — 메인 제외 숨김 */
.ottrang-banner{display:none!important}
/* ══ 내 평점/후기 박스 ══ */
.my-review-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:24px;text-align:center}
.my-star-row{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.my-star{font-size:36px;color:var(--border2);cursor:pointer;transition:color .1s,transform .1s;user-select:none;display:inline-block}
.my-star:hover,.my-star.lit{color:var(--gold);transform:scale(1.1)}
.go-review-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:var(--r);background:var(--accent);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-sans);transition:background .15s}
.go-review-btn:hover{background:#ff4d58}
</style>
</head>
<body>

<div id="ottrang-header"></div>

<div id="detailPage">

<!-- ══ 히어로 ══ -->
<div class="hero-backdrop" id="heroBackdrop">
  <div id="heroLoading" class="loading-row"><div class="spinner"></div><span>작품 정보 불러오는 중…</span></div>
  <img id="backdropImg" class="hero-backdrop-img" src="" alt="">
  <div class="hero-backdrop-overlay"></div>

  <!-- 뒤로가기 — 화살표만, 이전 페이지로 -->
  <a class="back-floating" href="#" onclick="history.back();return false;" aria-label="이전 페이지">
    <i class="ti ti-arrow-left"></i>
  </a>

  <div class="hero-content" id="heroContent">
    <!-- 포스터 -->
    <div class="hero-poster" id="heroPoster">

      <div class="hero-poster-ph" id="posterPh">🎬</div>
      <img id="posterImg" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="eager">
      <a class="platform-pill" id="platformPill" style="display:none;text-decoration:none;cursor:pointer" href="#" target="_blank" rel="noopener"></a>

    </div>

    <!-- 정보 -->
    <div class="hero-info">
      <div>
        <h1 class="hero-main-title" id="mainTitle">작품명</h1>
        <div class="hero-orig-title" id="origTitle"></div>
      </div>
      <div class="hero-tags" id="genreTags"></div>
      <div class="hero-meta" id="metaRow"></div>
      <p class="hero-overview" id="overview">줄거리 정보 불러오는 중…</p>

      <!-- 감정 표현 4버튼 -->
      <div class="feeling-btns">
        <button class="feeling-btn f-great" onclick="feelingClick('강추해요')"><span class="f-emoji">🔥</span>강추해요</button>
        <button class="feeling-btn f-good" onclick="feelingClick('추천해요')"><span class="f-emoji">👍</span>추천해요</button>
        <button class="feeling-btn f-meh" onclick="feelingClick('평범해요')"><span class="f-emoji">😐</span>평범해요</button>
        <button class="feeling-btn f-bad" onclick="feelingClick('별로예요')"><span class="f-emoji">👎</span>별로예요</button>
      </div>

      <!-- 랭킹 정보 행 -->
      <div class="hero-rank-row" id="heroRankRow" style="display:none;flex-wrap:wrap;gap:6px;margin-top:2px"></div>

      <!-- 찜 + 공유 -->
      <div class="hero-action-row">
        <button class="hero-wish-btn" id="wishBtn" onclick="toggleWish()">♡ 찜하기</button>
        <button class="hero-share-btn" onclick="shareNative()">
          <i class="ti ti-share" style="font-size:14px"></i> 공유
        </button>
      </div>
    </div>
  </div>
</div><!-- /hero-backdrop -->

<!-- ══ 본문 ══ -->
<div class="page-wrap">

<!-- 출연진 -->
<div class="cast-section" id="castSection" style="display:none">
  <div class="sec-title"><i class="ti ti-users" style="font-size:16px"></i>출연진 &amp; 제작진</div>
  <div class="director-row" id="directorRow"></div>
  <div class="cast-scroll" id="castScroll"></div>
</div>

<!-- 평점 4블록 -->
<div class="ratings-row">
  <div class="r-card">
    <div class="r-logo" style="color:#F5C518">IMDb</div>
    <div class="r-score-wrap"><div class="r-score" id="imdbScore" style="color:#F5C518">—</div><span class="r-out-of">/10</span></div>
    <div class="r-sub" id="imdbVotes" style="font-size:11px;margin-top:4px">—</div>
  </div>
  <div class="r-card">
    <div class="r-logo" style="color:#01b4e4">TMDB</div>
    <div class="r-score-wrap"><div class="r-score" id="tmdbScore" style="color:#01b4e4">—</div><span class="r-out-of">/10</span></div>
    <div class="r-sub" id="tmdbVotes" style="font-size:11px;margin-top:4px">—</div>
  </div>
  <div class="r-card" style="position:relative">
    <div class="r-logo" style="background:linear-gradient(90deg,#FF5177,#FF9A3C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">오뜨랑</div>
    <div id="userRatingEmpty" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;width:100%" onclick="goReview(0)">
      <span style="font-size:28px">🎬</span>
      <span style="font-size:10px;color:var(--muted2);font-family:var(--font-mono);text-align:center;line-height:1.4">이 작품의 첫번째<br>평점을 남겨보세요</span>
    </div>
    <div id="userRatingFilled" style="display:none;flex-direction:column;align-items:center;width:100%">
      <div class="r-score-wrap"><div class="r-score" id="userScore" style="color:var(--accent)">—</div><span class="r-out-of">/10</span></div>
      <div style="font-size:15px;color:var(--gold);margin-top:6px;letter-spacing:2px;line-height:1" id="userStarDisplay"></div>
      <div class="r-sub" id="userVotes" style="font-size:11px;margin-top:6px">—</div>
    </div>
  </div>
  <div class="r-card">
    <div class="r-logo" style="color:var(--muted2)">내 평점</div>
    <div id="myRatingDisplay" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;width:100%" onclick="goReview(0)">
      <span style="font-size:28px">✍️</span>
      <span style="font-size:11px;color:var(--info);font-family:var(--font-mono)">평점 남기기</span>
    </div>
  </div>
</div>

<!-- 시청가이드 + 지금 보러가기 -->
<div class="wg-outer" id="wgOuter" style="display:none;gap:16px;margin-bottom:24px">
  <!-- 시청가이드 -->
  <div class="watch-guide" id="watchGuideSection" style="flex:1;margin-bottom:0">
    <div class="sec-title"><i class="ti ti-shield-check" style="font-size:16px"></i>시청가이드 <small id="watchGradeLabel"></small></div>
    <div class="wg-grid" id="watchGuideGrid"></div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;font-family:var(--font-mono)">출처: 영상물등급위원회</div>
  </div>
  <!-- 지금 보러가기 -->
  <div class="watch-now-box" id="watchNowBox" style="display:none">
    <div class="sec-title" style="margin-bottom:12px"><i class="ti ti-player-play" style="font-size:16px"></i>지금 보러가기</div>
    <div class="watch-now-btns" id="watchNowBtns"></div>
  </div>
</div>

<!-- 평점/후기 요약 박스 -->
<div class="my-review-box" id="myReviewBox">
  <!-- 내 후기 없을 때 -->
  <div id="myReviewEmpty">
    <p style="font-size:14px;color:var(--muted2);margin-bottom:14px">이 작품 어떠셨나요?</p>
    <div class="my-star-row" id="myStarRow">
      <span class="my-star" data-v="1" onclick="goReview(1)">★</span>
      <span class="my-star" data-v="2" onclick="goReview(2)">★</span>
      <span class="my-star" data-v="3" onclick="goReview(3)">★</span>
      <span class="my-star" data-v="4" onclick="goReview(4)">★</span>
      <span class="my-star" data-v="5" onclick="goReview(5)">★</span>
    </div>
    <button class="go-review-btn" onclick="goReview(0)">
      <i class="ti ti-pencil" style="font-size:14px"></i> 후기 작성하기
    </button>
  </div>
  <!-- 내 후기 있을 때 -->
  <div id="myReviewFilled" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:13px;color:var(--muted)">내 평점</span>
      <span id="myReviewStars" style="color:var(--gold);font-size:18px;letter-spacing:2px"></span>
      <span id="myReviewScore" style="font-size:14px;font-weight:700;color:var(--gold);font-family:var(--font-mono)"></span>
      <button class="go-review-btn" style="margin-left:auto;padding:6px 14px;font-size:12px" onclick="goReview(0)">
        <i class="ti ti-pencil" style="font-size:12px"></i> 수정
      </button>
    </div>
    <div id="myReviewEval" style="margin-bottom:6px"></div>
    <div id="myReviewText" style="font-size:14px;color:var(--muted2);line-height:1.6"></div>
  </div>
</div>

<!-- 사용자 댓글 -->
<div id="commentSection">

/* ══ URL 파싱 ══ */
function parseSlug(pathname){
  const slug=pathname.replace(/^\/title\/?/,'').replace(/\.html$/,'');
  if(!slug)return null;
  const m=slug.match(/-(\d+)$/);
  if(!m)return null;
  const numStr=m[1];
  let season=1,year=new Date().getFullYear(),tmdb_id=null;
  if(numStr.length>=6){
    for(let sLen=1;sLen<=2;sLen++){
      const s=parseInt(numStr.slice(0,sLen));
      const y=parseInt(numStr.slice(sLen,sLen+4));
      const tid=numStr.slice(sLen+4);
      if(tid.length>=1&&y>=1900&&y<=2100&&s>=1){season=s;year=y;tmdb_id=parseInt(tid);break;}
    }
  }
  return{tmdb_id,season,year,titleSlug:slug.slice(0,m.index)};
}

})();

  const s=WORK.season||1,y=WORK.year||(new Date().getFullYear()),tid=WORK.tmdb_id||'';
  const slug=`${s}-${y}${tid}`;
  const canonical=`https://ottrank.kr/title/${slug}`;
  document.title=seoT;
  setMeta('seoTitle','textContent',seoT);setMeta('seoDesc','content',seoD);
  setMeta('seoOgTitle','content',seoT);setMeta('seoOgDesc','content',seoD);setMeta('seoOgUrl','content',canonical);
  setMeta('seoTwTitle','content',seoT);setMeta('seoTwDesc','content',seoD);

  if(tid&&slug){const targetUrl=`/title/${slug}`;if(location.pathname!==targetUrl)history.replaceState(null,'',targetUrl);sessionStorage.setItem('ottrang_slug',targetUrl);sessionStorage.setItem('ottrang_work',JSON.stringify({tmdb_id:WORK.tmdb_id,type:WORK.type,platform:WORK.platform,rank:WORK.rank,title:WORK.title,season:WORK.season,year:WORK.year}));}
  if(posterUrl){const ogImg=`https://image.tmdb.org/t/p/w780${posterUrl}`;setMeta('seoOgImg','content',ogImg);setMeta('seoTwImg','content',ogImg);}
  const ld={'@context':'https://schema.org','@type':'TVSeries','name':t,'description':overview||seoD,'url':canonical,'aggregateRating':{'@type':'AggregateRating','ratingCount':ALL_COMMENTS.length,'ratingValue':ALL_COMMENTS.length?(ALL_COMMENTS.reduce((s,c)=>s+c.score,0)/ALL_COMMENTS.length).toFixed(1):'0','bestRating':'5','worstRating':'0.5'}};

      <div class="yt-player-wrap"><iframe id="ytFrame2" src="" allowfullscreen allow="autoplay;encrypted-media"></iframe></div>
    </div>

        <div class="yt-thumb">
          <img src="https://img.youtube.com/vi/${v.key}/mqdefault.jpg" alt="${v.name||''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="yt-thumb-ph" style="display:none"><i class="ti ti-brand-youtube" style="font-size:26px"></i></div>
          <div class="yt-play"><div class="yt-play-icon"><i class="ti ti-player-play" style="font-size:13px"></i></div></div>
          ${isOfficial?`<div class="yt-badge">${v.type}</div>`:''}
        </div>
        <div class="yt-info"><div class="yt-title">${v.name||''}</div><div class="yt-meta"><span>${v.type||''}</span></div></div>
      </div>`;
    }).join('')}</div>`;

  /* 페이지네이션 */
  const totalPages=Math.ceil(total/YT_PER_PAGE);
  const pgEl=document.getElementById('ytPagination');
  if(totalPages<=1){pgEl.style.display='none';return;}
  pgEl.style.display='flex';

function renderHalfStars(score){let h='';for(let i=1;i<=5;i++){if(score>=i)h+=`<span class="c-star">★</span>`;else if(score>=i-0.5)h+=`<span class="c-star" style="position:relative;display:inline-block;overflow:hidden;width:.7em">★</span>`;else h+=`<span class="c-star off">★</span>`;}return h;}

        <span class="c-time">${c.time}</span>
      </div>
      ${c.spoiler?'<span class="sp-badge" style="display:inline-block;margin-bottom:8px">⚠ 스포일러</span>':''}
      <div class="c-text">${c.text}</div>
      <div class="c-footer">
        <span class="c-like" onclick="likeComment('${c.id}')"><i class="ti ti-heart" style="font-size:11px;vertical-align:-1px"></i> <span id="like_cmt_${c.id}">${c.likes}</span></span>
        <button class="c-share" onclick="shareComment('${c.id}','${c.user.replace(/'/g,"\\'")}')">🔗 이 후기 공유</button>
        ${c.emotions.map(e=>`<span class="c-ebadge">${ETAG_EMOJI[e]||''}${e}</span>`).join('')}

function renderPagination(){
  const total=Math.ceil(ALL_COMMENTS.length/PER_PAGE);
  if(total<=1){document.getElementById('pagination').innerHTML='';return;}
  let html=`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
  const pages=total<=7?Array.from({length:total},(_,i)=>i+1):[1,...(curPage>3?['…']:[]),...Array.from({length:3},(_,i)=>Math.max(2,curPage-1)+i).filter(p=>p>1&&p<total),...(curPage<total-2?['…']:[]),total];
  pages.forEach(p=>p==='…'?html+=`<span class="pg-dots">···</span>`:html+=`<button class="pg-btn${p===curPage?' on':''}" onclick="goPage(${p})">${p}</button>`);
  html+=`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===total?'disabled':''}>›</button>`;
  document.getElementById('pagination').innerHTML=html;
}
function goPage(p){const t=Math.ceil(ALL_COMMENTS.length/PER_PAGE);if(p<1||p>t)return;curPage=p;renderComments();document.getElementById('commentsArea').scrollIntoView({behavior:'smooth',block:'start'});}

/* ══ 댓글 등록 ══ */
async function submitComment(){
  const txt=document.getElementById('commentInput').value.trim();
  if(!myStars){showToast('별점을 먼저 선택해주세요');return;}
  if(!txt){showToast('한줄 감상을 입력해주세요');return;}
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid){const redirect=encodeURIComponent(location.pathname+location.search);location.href='/login.html?redirect='+redirect;return;}
  const spoiler=document.getElementById('spoilerCheck').checked;
  // 감정 태그 — 이모티콘 제거하고 텍스트만
  const preset=[...document.querySelectorAll('.etag.on')].map(e=>e.textContent.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27FF]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/gu,'').trim()).filter(Boolean);
  // 평가 버튼 추가
  if(selectedEval)preset.unshift(selectedEval);
  const tmdbId=WORK?.tmdb_id;if(!tmdbId){showToast('작품 정보를 불러오는 중입니다.');return;}
  try{
    const res=await fetch(`${REVIEW_API}/reviews/${tmdbId}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sid},body:JSON.stringify({score:myStars,emotions:preset,custom_tags:[],text:txt,spoiler})});
    const data=await res.json();
    if(!data.ok){showToast(data.message||'오류가 발생했어요');return;}
    await loadReviews(tmdbId);
    document.getElementById('commentInput').value='';document.getElementById('charCount').textContent='0 / 140';document.getElementById('spoilerCheck').checked=false;
    renderStarInput(0);myStars=0;document.getElementById('starLabel').textContent='별점을 선택하세요';
    document.querySelectorAll('.etag').forEach(b=>{b.classList.remove('on','disabled');});
    document.querySelectorAll('.eval-btn').forEach(b=>b.classList.remove('on'));selectedEval='';
    updateEtagCount();showToast('후기가 등록됐어요! 공유해보세요 🎉');
  }catch(e){showToast('네트워크 오류가 발생했어요');}
}

async function loadReviews(tmdbId){
  if(!tmdbId)return;
  try{
    const sid=localStorage.getItem('ottrang_sid');
    const res=await fetch(`${REVIEW_API}/reviews/${tmdbId}`);const data=await res.json();
    if(data.ok){ALL_COMMENTS=(data.data||[]).map(r=>({id:r.id,user:r.nickname||'익명',init:(r.nickname||'익')[0],score:r.score,emotions:_safeParseArr(r.emotions),customTags:_safeParseArr(r.custom_tags),text:r.text||'',time:formatTime(r.created_at),likes:r.likes||0,spoiler:!!r.spoiler,user_id:r.user_id,isMe:false}));}
    if(sid){const meRes=await fetch(`${REVIEW_API}/reviews/${tmdbId}/me`,{headers:{Authorization:'Bearer '+sid}});const meData=await meRes.json();MY_REVIEW=meData.data||null;if(MY_REVIEW){ALL_COMMENTS=ALL_COMMENTS.map(c=>({...c,isMe:c.id===MY_REVIEW.id}));}}
    renderMyReview();
    curPage=1;renderComments();updateUserRatingCard();
  }catch(e){}
}

async function deleteMyReview(reviewId){
  if(!confirm('이 후기를 삭제할까요?'))return;
  const sid=localStorage.getItem('ottrang_sid');if(!sid)return;
  const tmdbId=WORK?.tmdb_id;
  try{
    const res=await fetch(`${REVIEW_API}/reviews/${tmdbId}`,{method:'DELETE',headers:{Authorization:'Bearer '+sid}});

    if(data.ok){MY_REVIEW=null;myStars=0;renderStarInput(0);document.getElementById('starLabel').textContent='별점을 선택하세요';document.getElementById('commentInput').value='';document.getElementById('charCount').textContent='0 / 140';await loadReviews(tmdbId);showToast('후기가 삭제됐어요');}
    else showToast(data.message||'삭제 실패');
  }catch(e){showToast('네트워크 오류');}
}

function _safeParseArr(v){if(!v)return[];try{const r=JSON.parse(v);return Array.isArray(r)?r:[];}catch(e){return[];}}
function formatTime(isoStr){if(!isoStr)return'';const str=isoStr.endsWith('Z')||isoStr.includes('+')?isoStr:isoStr+' UTC';const d=new Date(str),now=new Date();const diff=Math.floor((now-d)/1000);if(diff<60)return'방금';if(diff<3600)return Math.floor(diff/60)+'분 전';if(diff<86400)return Math.floor(diff/3600)+'시간 전';return Math.floor(diff/86400)+'일 전';}

  document.getElementById('detailPage').style.display='none';document.getElementById('profilePage').style.display='block';
}
function showDetail(){document.getElementById('profilePage').style.display='none';document.getElementById('detailPage').style.display='block';}

/* ══ 별점 호버 (내 평점 박스) ══ */
document.querySelectorAll && document.addEventListener('DOMContentLoaded',()=>{
  const stars=document.querySelectorAll('.my-star');
  stars.forEach(s=>{
    s.addEventListener('mouseover',()=>{
      const v=parseInt(s.dataset.v);
      stars.forEach(x=>x.classList.toggle('lit',parseInt(x.dataset.v)<=v));
    });
    s.addEventListener('mouseleave',()=>{
      stars.forEach(x=>x.classList.remove('lit'));
      renderMyStarCurrent();
    });
  });
});
function renderMyStarCurrent(){
  // 이미 평점 있으면 별 유지
  if(MY_REVIEW&&MY_REVIEW.score){
    const v=Math.round(MY_REVIEW.score);
    document.querySelectorAll('.my-star').forEach(x=>x.classList.toggle('lit',parseInt(x.dataset.v)<=v));
  }
}

/* ══ 후기 작성 페이지로 이동 ══ */
function goReview(starVal, evalPreset){
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid){const redirect=encodeURIComponent(location.pathname+location.search);location.href='/login.html?redirect='+redirect;return;}
  // sessionStorage에 작품 정보 + 초기값 전달
  const reviewData={
    tmdb_id:WORK.tmdb_id,
    type:WORK.type,
    platform:WORK.platform,
    title:WORK.title,
    season:WORK.season,
    year:WORK.year,
    rank:WORK.rank,
    poster_path:document.getElementById('posterImg')?.src||'',
    star:starVal||0,
    eval:evalPreset||'',
    back_url:getShareUrl().replace('https://ottrank.kr',''),
  };
  sessionStorage.setItem('ottrang_review_data',JSON.stringify(reviewData));
  location.href='/review.html';
}

/* ══ 내 후기 표시 ══ */
function renderMyReview(){
  if(!MY_REVIEW){
    document.getElementById('myReviewEmpty').style.display='block';
    document.getElementById('myReviewFilled').style.display='none';
    // 내 평점 카드도 초기화
    document.getElementById('myRatingDisplay').style.display='flex';
    return;
  }
  document.getElementById('myReviewEmpty').style.display='none';
  document.getElementById('myReviewFilled').style.display='block';
  const score10=(MY_REVIEW.score*2).toFixed(1);
  const stars='★'.repeat(Math.round(MY_REVIEW.score))+'☆'.repeat(5-Math.round(MY_REVIEW.score));
  document.getElementById('myReviewStars').textContent=stars;
  document.getElementById('myReviewScore').textContent=score10+'점';
  // 감정 평가 배지
  const emotions=_safeParseArr(MY_REVIEW.emotions);
  const evalVal=emotions[0]||'';
  const evalColors={'강추해요':'rgba(240,180,41,.15)','추천해요':'rgba(52,211,153,.1)','평범해요':'rgba(160,160,188,.08)','별로예요':'rgba(230,57,70,.1)'};
  document.getElementById('myReviewEval').innerHTML=evalVal
    ?`<span style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;background:${evalColors[evalVal]||'var(--bg3)'};margin-bottom:6px">${evalVal}</span>`
    :'';
  document.getElementById('myReviewText').textContent=MY_REVIEW.text||'';
  // 내 평점 카드 업데이트
  document.getElementById('myRatingDisplay').innerHTML=`
    <div style="font-size:18px;color:var(--gold);letter-spacing:2px">${stars}</div>
    <div style="font-size:13px;font-weight:700;color:var(--gold);font-family:var(--font-mono)">${score10}점</div>
    <div style="font-size:11px;color:var(--info);cursor:pointer;margin-top:2px" onclick="goReview(0)">수정하기</div>`;
  renderMyStarCurrent();
}

/* ══ KMRB 시청가이드 — boxoffice만 ══ */
async function loadWatchGuide(){
  // boxoffice 플랫폼일 때만 호출
  if(WORK.platform!=='boxoffice')return;
  if(!WORK.tmdb_id||!WORK.title)return;
  try{
    const res=await fetch(`${OTTRANK_API}/kmrb/${WORK.tmdb_id}?title_ko=${encodeURIComponent(WORK.title)}`);
    const data=await res.json();
    if(!data.ok||!data.data)return;
    const d=data.data;
    const gradeEl=document.getElementById('watchGradeLabel');
    if(gradeEl&&d.watch_grade)gradeEl.textContent=d.watch_grade;
    const items=[
      {key:'subject',  label:'주제',     emoji:'📖'},
      {key:'sexuality',label:'선정성',   emoji:'🔞'},
      {key:'violence', label:'폭력성',   emoji:'⚔️'},
      {key:'language', label:'대사',     emoji:'💬'},
      {key:'horror',   label:'공포',     emoji:'😱'},
      {key:'drug',     label:'약물',     emoji:'💊'},
      {key:'imitation',label:'모방위험', emoji:'⚠️'},
    ];
    const levelClass=(val)=>{
      if(!val||val==='없음'||val==='해당없음'||val==='전체관람가')return'none';
      if(val.includes('12세'))return'low';
      if(val.includes('15세'))return'mid';
      return'high';
    };
    const grid=document.getElementById('watchGuideGrid');
    const hasAny=items.some(i=>d[i.key]&&d[i.key]!=='');
    if(!hasAny)return;
    grid.innerHTML=items.map(i=>`
      <div class="wg-item">
        <div class="wg-emoji">${i.emoji}</div>
        <div class="wg-label">${i.label}</div>
        <span class="wg-level ${levelClass(d[i.key])}">${d[i.key]||'없음'}</span>
      </div>`).join('');
    document.getElementById('watchGuideSection').style.display='block';
    document.getElementById('wgOuter').style.display='flex';
    // 극장 연결 버튼
    const title=WORK.title||'';
    const btnBox=document.getElementById('watchNowBtns');
    btnBox.innerHTML=[
      `<a class="watch-now-btn" href="https://www.cgv.co.kr/search/?query=${encodeURIComponent(title)}" target="_blank" rel="noopener"><span class="wn-icon">🎬</span>CGV</a>`,
      `<a class="watch-now-btn" href="https://www.lottecinema.co.kr/NLCHS/Movie/MovieList#/Search/${encodeURIComponent(title)}" target="_blank" rel="noopener"><span class="wn-icon">🎬</span>롯데시네마</a>`,
      `<a class="watch-now-btn" href="https://www.megabox.co.kr/movie?searchText=${encodeURIComponent(title)}" target="_blank" rel="noopener"><span class="wn-icon">🎬</span>메가박스</a>`,
    ].join('');
    document.getElementById('watchNowBox').style.display='block';
  }catch(e){}
}

/* ══ 초기화 ══ */
async function init(){
  await loadTmdb();
  // 병렬 로드
  if(WORK.tmdb_id){
    Promise.all([loadTop10Days(),loadManualBadges(),loadReviews(WORK.tmdb_id),loadWatchGuide()]);
  }else{renderComments();updateUserRatingCard();}
  if(location.hash)setTimeout(()=>{const el=document.querySelector(location.hash);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},700);
}
init();
</script>
