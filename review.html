<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후기 작성 | 오뜨랑</title>
<link rel="icon" href="/img/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ── CSS 변수 (header.html / mypage.html 완전 동일) ── */
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;
  --info:#378ADD;--info-bg:rgba(55,138,221,.12);--info-border:rgba(55,138,221,.35);
  --warn-bg:rgba(240,180,41,.12);--warn-border:rgba(240,180,41,.35);
  --danger-bg:rgba(230,57,70,.12);--danger-border:rgba(230,57,70,.35);
  --font-sans:'Noto Sans KR',sans-serif;
  --font-mono:'DM Mono',monospace;
  --r:10px;--r-lg:14px;
  --content-w:640px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── 헤더 ── */
#ottrang-header{position:sticky;top:0;z-index:200}
.ottrang-banner{display:none!important}

/* ── 레이아웃 ── */
.review-wrap{max-width:var(--content-w);margin:0 auto;padding:8px 20px 80px}

/* ── 뒤로가기 (mypage page-back 동일 패턴) ── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted2);cursor:pointer;
  margin-bottom:24px;padding:6px 12px;border-radius:8px;
  border:.5px solid var(--border);background:transparent;
  transition:all .15s;text-decoration:none;font-family:var(--font-mono);
}
.back-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}

/* ── 페이지 타이틀 ── */
.page-title{font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:8px}

/* ── 작품 헤더 카드 (mypage profile-card 톤) ── */
.work-header{
  display:flex;gap:16px;align-items:flex-start;
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
  border:.5px solid var(--border2);border-radius:var(--r-lg);
  padding:12px;margin-bottom:8px;position:relative;overflow:hidden;
}
.work-header::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(230,57,70,.07),transparent 70%);
  pointer-events:none;
}
.work-poster{
  width:68px;height:102px;border-radius:8px;
  overflow:hidden;background:var(--bg3);flex-shrink:0;
  border:.5px solid var(--border);
}
.work-poster img{width:100%;height:100%;object-fit:cover;display:block}
.work-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px}
.work-info{flex:1;min-width:0;padding-top:2px}
.work-title{font-size:18px;font-weight:700;margin-bottom:6px;line-height:1.3}
.work-sub{font-size:12px;color:var(--muted);font-family:var(--font-mono)}

/* ── 섹션 공통 (mypage sec-wrap 동일) ── */
.review-section{
  background:var(--bg2);border:.5px solid var(--border);
  border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;
}
.review-section-title{
  font-size:13px;font-weight:600;margin-bottom:8px;
  display:flex;align-items:center;gap:7px;color:var(--text);
}
.review-section-title .title-sub{
  font-size:11px;color:var(--muted);font-weight:400;
  font-family:var(--font-mono);margin-left:2px;
}

/* ── 별점 — 한 줄 인라인 (작은 별) ── */
.star-row{display:flex;gap:3px;align-items:center}
.star-wrap{position:relative;width:32px;height:32px;cursor:pointer;flex-shrink:0}
.star-wrap .s-full,.star-wrap .s-half{
  position:absolute;top:0;left:0;font-size:28px;line-height:1;
  color:var(--border2);transition:color .1s;user-select:none;
}
.star-wrap .s-full{z-index:1}
.star-wrap .s-half{width:50%;overflow:hidden;z-index:2}
.star-wrap.half .s-half{color:var(--gold)}
.star-wrap.half .s-full{color:var(--border2)}
.star-wrap.full .s-full{color:var(--gold)}
.star-wrap.full .s-half{color:var(--gold)}
.star-label{
  font-size:15px;font-family:var(--font-mono);font-weight:700;
  color:var(--muted);margin-left:10px;line-height:32px;
}
.star-label.active{color:var(--gold)}

/* ── 평가 4버튼 — 가로 슬라이드 ── */
.eval-slide{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.eval-slide::-webkit-scrollbar{display:none}
.eval-btn{
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  padding:7px 12px;border-radius:24px;
  border:.5px solid var(--border);
  background:var(--bg3);color:var(--muted2);
  font-size:13px;font-weight:500;cursor:pointer;
  font-family:var(--font-sans);transition:all .2s;white-space:nowrap;
}
.eval-btn:hover{border-color:var(--border2);color:var(--text)}
.eval-btn.on{box-shadow:0 2px 12px rgba(0,0,0,.2)}
.eval-btn[data-val="강추해요"].on{background:var(--warn-bg);color:var(--gold);border-color:rgba(240,180,41,.4)}
.eval-btn[data-val="추천해요"].on{background:rgba(52,211,153,.1);color:var(--green);border-color:rgba(52,211,153,.4)}
.eval-btn[data-val="평범해요"].on{background:rgba(160,160,188,.08);color:var(--muted2);border-color:rgba(160,160,188,.4)}
.eval-btn[data-val="별로예요"].on{background:var(--danger-bg);color:var(--accent);border-color:rgba(230,57,70,.4)}

/* ── 감정 태그 — 헤더 한 줄 + 가로 슬라이드 ── */
.etag-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.etag-counter{
  font-size:11px;color:var(--muted);font-family:var(--font-mono);
  background:var(--bg3);border:.5px solid var(--border);
  padding:2px 8px;border-radius:10px;white-space:nowrap;
}
.etag-slide{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.etag-slide::-webkit-scrollbar{display:none}
.etag{
  display:flex;align-items:center;gap:4px;flex-shrink:0;
  padding:5px 10px;border-radius:24px;
  border:.5px solid var(--border);font-size:12px;
  color:var(--muted2);cursor:pointer;background:var(--bg3);
  transition:all .2s;font-family:var(--font-sans);user-select:none;
  white-space:nowrap;
}
.etag:hover{border-color:var(--border2);color:var(--text)}
.etag.on{
  background:var(--info-bg);color:var(--info);
  border-color:var(--info-border);
  box-shadow:0 2px 10px rgba(55,138,221,.12);
}
.etag.disabled{opacity:.3;cursor:default}
.etag-emoji{font-size:14px;line-height:1}

/* ── 텍스트 입력 ── */
.review-textarea{
  width:100%;min-height:72px;resize:none;
  background:var(--bg3);border:.5px solid var(--border);
  border-radius:var(--r);padding:10px 12px;
  color:var(--text);font-size:14px;font-family:var(--font-sans);
  outline:none;line-height:1.6;transition:border-color .15s;
  margin-bottom:6px;
}
.review-textarea:focus{border-color:var(--border2);background:var(--bg2)}
.review-textarea::placeholder{color:var(--muted)}
/* 글자수 + 스포일러 한 줄 */
.review-bottom-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:4px;
}
.char-count{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.char-count.warn{color:var(--accent)}
.spoiler-row{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--muted);cursor:pointer;
  font-family:var(--font-mono);
}
.spoiler-row input{accent-color:var(--accent);width:14px;height:14px}

/* ── 제출 버튼 영역 ── */
.submit-row{display:flex;gap:10px;margin-top:6px}
.submit-btn{
  flex:1;padding:13px;border-radius:var(--r);border:none;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;font-family:var(--font-sans);transition:background .15s;
}
.submit-btn:hover{background:#ff4d58}
.submit-btn:disabled{opacity:.5;cursor:default}
.cancel-btn{
  padding:13px 22px;border-radius:var(--r);
  border:.5px solid var(--border);background:transparent;
  color:var(--muted2);font-size:14px;cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;white-space:nowrap;
}
.cancel-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}

/* ── 삭제 버튼 ── */
.delete-btn{
  width:100%;margin-top:10px;padding:11px;border-radius:var(--r);
  border:.5px solid var(--danger-border);background:var(--danger-bg);
  color:var(--accent);font-size:13px;cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.delete-btn:hover{background:rgba(230,57,70,.2);border-color:var(--accent)}

/* ── 토스트 ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;border-radius:22px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;font-family:var(--font-mono)}
.toast.show{opacity:1}

/* ── 모바일 ── */
@media(max-width:640px){
  .review-wrap{padding:24px 16px 60px}
  .eval-btns{gap:6px}
  .eval-btn{padding:8px 12px;font-size:12px}
  .star-wrap{width:28px;height:28px}
  .star-wrap .s-full,.star-wrap .s-half{font-size:24px}
  .star-label{line-height:28px;font-size:14px}
}

/* ══ 공유 카드 (이미지 생성용 — 화면에는 숨김) ══ */
/* 540x960 기준 작성 → html2canvas scale:2 → 1080x1920 출력 */
/* ── 공유 카드 — 내용 길이에 따라 자동 높이 ── */
#shareCard{
  position:fixed;left:-9999px;top:0;
  width:540px;
  /* height 고정 제거 → 내용에 따라 자동 */
  overflow:visible;
  background:#13131a;
  font-family:'Noto Sans KR',sans-serif;
}

/* 포스터 — relative로 카드 높이에 포함 + 그라디언트 직접 합성 */
#shareCardPoster{
  position:relative;
  width:100%;height:610px;
  background-size:cover;
  background-position:center 25%;
  background-repeat:no-repeat;
  /* 그라디언트를 포스터에 직접 합성 — html2canvas 완벽 지원 */
  background-image:
    linear-gradient(
      180deg,
      transparent 0%,
      transparent 50%,
      rgba(13,13,20,.4) 65%,
      rgba(13,13,20,.8) 80%,
      #13131a 100%
    );
  display:block;
  flex-shrink:0;
}

/* 포스터 없을 때 대체 배경 */
#shareCardPosterFallback{
  position:relative;
  width:100%;height:610px;
  background:linear-gradient(135deg,#3a2e22 0%,#6b4a2e 45%,#d4a05a 100%);
  display:none;
}

/* shareCardFade 별도 div 제거 — 포스터에 직접 합성으로 대체 */
#shareCardFade{ display:none; }

/* 좌상단 — 오뜨랑 리뷰 배지 (포스터 위에 absolute) */
#shareCardBadgeRow{
  position:absolute;top:28px;left:32px;
  display:flex;align-items:center;gap:10px;z-index:2;
}
#shareCardLogoBox{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#e63946,#f0b429);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#shareCardLogoBox i{font-size:24px;color:#1a1410}
#shareCardBadgeText{font-size:26px;font-weight:500;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}

/* 정보 영역 — 포스터 바로 아래 (normal flow) */
#shareCardInner{
  position:relative;z-index:2;
  /* 포스터와 자연스럽게 겹치도록 위로 올림 */
  margin-top:-80px;
  padding:0 28px 40px;
  display:flex;flex-direction:column;color:#ededf0;
  background:#13131a;
}
#shareCardTitle{font-size:32px;font-weight:700;margin-bottom:6px;line-height:1.25;word-break:break-all;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#shareCardMeta{font-size:17px;color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:16px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#shareCardScoreRow{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
#shareCardStars{font-size:28px;letter-spacing:3px;color:#f0b429;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#shareCardScore{font-size:32px;font-weight:700;color:#f0b429;font-family:'DM Mono',monospace;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#shareCardDivider{height:1.5px;background:rgba(255,255,255,.12);margin-bottom:16px}
#shareCardText{font-size:21px;line-height:1.6;color:rgba(255,255,255,.92);font-style:italic;word-break:keep-all;margin-bottom:16px}
#shareCardTags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#shareCardTags span{font-size:18px;padding:5px 16px;border-radius:24px;font-family:'Noto Sans KR',sans-serif}
#shareCardFooter{display:flex;align-items:center;justify-content:space-between;border-top:1.5px solid rgba(255,255,255,.12);padding-top:18px}
#shareCardNick{font-size:19px;color:#a0a0bc}
#shareCardBrand{font-size:19px;letter-spacing:2px;color:rgba(255,255,255,.32);font-family:'DM Mono',monospace}

/* ── 공유 버튼 (제출 후 노출) ── */
.share-row{display:none;margin-top:12px}
.share-row.show{display:block}
.share-btn{
  width:100%;padding:13px;border-radius:var(--r);
  border:.5px solid var(--info-border);background:var(--info-bg);
  color:var(--info);font-size:14px;font-weight:600;cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.share-btn:hover{background:rgba(55,138,221,.2)}
.share-btn:disabled{opacity:.5;cursor:default}

/* ── 공유 완료 모달 — 전체 스크롤 방식 ── */
.share-preview-modal{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);overflow-y:auto}
.share-preview-modal.show{display:block}
.share-preview-box{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column}

/* 카드 이미지 — 전체 너비 꽉 차게 */
.share-preview-imgwrap{width:100%;line-height:0}
.share-preview-img{width:100%;display:block}

/* 등록 완료 알림 — 카드 이미지 바로 위 */
.share-registered-badge{
  padding:14px 20px 10px;text-align:center;
  font-size:15px;font-weight:700;color:var(--gold);
  letter-spacing:.3px;
}

/* ── SNS 공유 액션 영역 ── */
.share-action-area{padding:16px 20px 40px;background:var(--bg2)}

/* 이미지 저장 버튼 */
.share-save-btn{
  width:100%;padding:13px;border-radius:var(--r);
  border:.5px solid var(--border2);background:var(--bg3);
  color:var(--text);font-size:14px;font-weight:600;cursor:pointer;
  font-family:var(--font-sans);display:flex;align-items:center;
  justify-content:center;gap:7px;text-decoration:none;
  transition:all .15s;margin-bottom:14px;
}
.share-save-btn:hover{background:rgba(255,255,255,.08)}

/* 구분선 — 노란색·크게 (수정4) */
.share-divider{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
}
.share-divider span{
  font-size:13px;font-weight:700;color:var(--gold);
  white-space:nowrap;letter-spacing:.3px;
}
.share-divider::before,.share-divider::after{
  content:'';flex:1;height:.5px;background:var(--border2);
}

/* SNS 버튼 2열 그리드 */
.share-sns-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.share-sns-btn{
  padding:12px 8px;border-radius:var(--r);
  border:.5px solid var(--border2);background:var(--bg3);
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  font-family:var(--font-sans);display:flex;align-items:center;
  justify-content:center;gap:6px;transition:all .15s;
}
.share-sns-btn:hover{background:rgba(255,255,255,.08)}
.share-sns-btn.kakao{background:#FEE500;color:#3C1E1E;border-color:#e6cf00}
.share-sns-btn.kakao:hover{background:#f5db00}

/* 닫기 버튼 */
.share-close-btn{
  width:100%;padding:10px;border-radius:var(--r);
  border:none;background:transparent;
  color:var(--muted);font-size:13px;cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;
}
.share-close-btn:hover{color:var(--text)}

/* ── 등록 완료 안내 모달 ── */
.complete-modal-box{
  background:var(--bg2);border:.5px solid var(--border2);
  border-radius:var(--r-lg);max-width:340px;width:100%;
  padding:32px 24px 24px;text-align:center;
  box-shadow:0 16px 48px rgba(0,0,0,.7);
}
.complete-modal-icon{font-size:40px;margin-bottom:12px}
.complete-modal-title{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text)}
.complete-modal-desc{font-size:14px;color:var(--muted2);line-height:1.6;margin-bottom:24px}
.complete-modal-actions{display:flex;gap:8px}
.complete-modal-later{
  flex:1;padding:12px;border-radius:var(--r);
  border:.5px solid var(--border);background:transparent;
  color:var(--muted2);font-size:14px;cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;
}
.complete-modal-later:hover{background:var(--bg3);color:var(--text)}
.complete-modal-make{
  flex:1.4;padding:12px;border-radius:var(--r);border:none;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--font-sans);transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.complete-modal-make:hover{background:#ff4d58}
</style>
</head>
<body>

<div id="ottrang-header"></div>

<div class="review-wrap">

  <!-- 작품 헤더 + 돌아가기 버튼 통합 -->
  <div class="work-header">
    <div class="work-poster" id="workPoster">
      <div class="work-poster-ph">🎬</div>
    </div>
    <div class="work-info" style="display:flex;flex-direction:column;justify-content:space-between">
      <div>
        <div class="work-title" id="workTitle">작품명</div>
        <div class="work-sub" id="workSub"></div>
      </div>
      <!-- 돌아가기 버튼 — 포스터 오른쪽 하단 -->
      <button class="back-btn" onclick="goBack()" style="margin-bottom:0;align-self:flex-start">
        <i class="ti ti-arrow-left" style="font-size:14px"></i> 돌아가기
      </button>
    </div>
  </div>

  <!-- 별점 -->
  <div class="review-section">

<!-- 푸터 -->
<div id="ottrang-footer"></div>

<script>
/* ══ 헤더 + 푸터 삽입 ══ */
(function(){
  const el=document.getElementById('ottrang-header');
  if(!el)return;
  fetch('/header.html').then(r=>r.ok?r.text():Promise.reject()).then(h=>{
    el.innerHTML=h;
    el.querySelectorAll('script').forEach(s=>{const ns=document.createElement('script');ns.textContent=s.textContent;document.body.appendChild(ns);});
    if(typeof initHeader==='function')initHeader();
  }).catch(()=>{}).finally(()=>{
    fetch('/footer.html').then(r=>r.ok?r.text():Promise.reject()).then(h=>{document.getElementById('ottrang-footer').innerHTML=h;}).catch(()=>{});
  });
})();

const OTTRANK_API='https://ottrank-api.tdidream.workers.dev';
const REVIEW_API=OTTRANK_API;

/* ══ 작품 데이터 로드 ══ */
let RDATA=null;
let myStars=0,hoverVal=0,selectedEval='',MY_REVIEW=null;
let LAST_REVIEW=null; // 공유 카드용 — 제출 성공 시 채워짐

(function init(){
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid){location.href='/login.html?redirect='+encodeURIComponent(location.pathname);return;}

  try{
    const stored=sessionStorage.getItem('ottrang_review_data');
    if(!stored){goBack();return;}
    RDATA=JSON.parse(stored);
  }catch(e){goBack();return;}

  // 작품 정보 표시
  document.getElementById('workTitle').textContent=RDATA.title||'작품명';
  document.getElementById('workSub').textContent=[RDATA.platform?({netflix:'넷플릭스',tving:'티빙',disney:'디즈니+',coupang:'쿠팡플레이',wavve:'웨이브',boxoffice:'박스오피스'}[RDATA.platform]||RDATA.platform):'',RDATA.year].filter(Boolean).join(' · ');

  // 포스터
  if(RDATA.poster_path&&RDATA.poster_path.includes('image.tmdb.org')){
    const ph=document.getElementById('workPoster');
    ph.innerHTML=`<img src="${RDATA.poster_path}" alt="${RDATA.title}" onerror="this.parentNode.innerHTML='<div class=work-poster-ph>🎬</div>'">`;
  }

  // 초기 별점 설정 (작품 페이지에서 별 클릭하고 온 경우)
  if(RDATA.star>0){setStar(null,RDATA.star);}

  // 초기 평가 설정 (감정 버튼 클릭하고 온 경우)
  if(RDATA.eval){
    document.querySelectorAll('.eval-btn').forEach(b=>{
      if(b.dataset.val===RDATA.eval){b.classList.add('on');selectedEval=RDATA.eval;}
    });
  }

  // 기존 내 후기 불러오기
  loadMyReview();
  // 기존 내 추천 선택 불러오기 (work_reactions)
  loadMyReaction();
})();

/* ══ 기존 내 추천 선택 불러오기 (work_reactions) ══ */
async function loadMyReaction(){
  if(!RDATA?.tmdb_id) return;
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid) return;
  try{
    const res=await fetch(`${OTTRANK_API}/reactions/work/${RDATA.tmdb_id}`,{
      headers:{Authorization:'Bearer '+sid},
      credentials:'include',
    });
    const data=await res.json();
    if(!data.ok||!data.data?.my_reaction) return;
    const myReaction=data.data.my_reaction;
    // reaction 키 → 한글 레이블 변환
    const reactionToLabel={great:'강추해요',good:'추천해요',meh:'평범해요',bad:'별로예요'};
    const labelVal=reactionToLabel[myReaction];
    if(!labelVal) return;
    // 이미 eval(감정 버튼)이 선택된 경우 덮어쓰지 않음 (작품 페이지에서 클릭하고 온 경우 우선)
    if(selectedEval) return;
    document.querySelectorAll('.eval-btn').forEach(b=>{
      b.classList.remove('on');
      if(b.dataset.val===labelVal){b.classList.add('on');selectedEval=labelVal;}
    });
  }catch(e){}
}

/* ══ 기존 내 후기 ══ */
async function loadMyReview(){
  if(!RDATA?.tmdb_id)return;
  const sid=localStorage.getItem('ottrang_sid');
  try{
    const res=await fetch(`${REVIEW_API}/reviews/${RDATA.tmdb_id}/me`,{headers:{Authorization:'Bearer '+sid}});
    const data=await res.json();
    MY_REVIEW=data.data||null;
    if(MY_REVIEW){
      // 기존 데이터로 폼 채우기
      myStars=MY_REVIEW.score;
      renderStarInput(myStars);
      const labels={0.5:'1점',1:'2점',1.5:'3점',2:'4점',2.5:'5점',3:'6점',3.5:'7점',4:'8점',4.5:'9점',5:'10점'};
      document.getElementById('starLabel').textContent=(labels[myStars]||'')+'  (10점 만점)';
      // 평가 버튼
      const emotions=_safeParseArr(MY_REVIEW.emotions);
      const evalVal=emotions[0]||'';
      if(evalVal){
        document.querySelectorAll('.eval-btn').forEach(b=>{
          if(b.dataset.val===evalVal){b.classList.add('on');selectedEval=evalVal;}
        });
      }
      // 감정 태그 (첫번째 제외 — 평가버튼용)
      const tags=emotions.slice(1);
      document.querySelectorAll('.etag').forEach(btn=>{
        const label=btn.textContent.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27FF]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/gu,'').trim();
        if(tags.includes(label)){btn.classList.add('on');}
      });
      updateEtagCount();
      // 텍스트
      document.getElementById('reviewText').value=MY_REVIEW.text||'';
      updateCharCount(document.getElementById('reviewText'));
      document.getElementById('spoilerCheck').checked=!!MY_REVIEW.spoiler;
      // 삭제 버튼 표시
      document.getElementById('deleteBtn').style.display='block';
      document.getElementById('submitBtn').textContent='후기 수정';
    }
  }catch(e){}
}

/* ══ 별점 ══ */
function hoverStar(e,v){const wrap=e.currentTarget;const rect=wrap.getBoundingClientRect();const isLeft=(e.clientX-rect.left)<rect.width/2;hoverVal=isLeft?v-0.5:v;renderStarInput(hoverVal);}
function leaveStar(){renderStarInput(myStars);}
function setStar(wrap,val){
  myStars=val||hoverVal||(wrap?.dataset.v*1)||0;
  renderStarInput(myStars);
  const score10=myStars*2;
  const labels={0.5:'1점',1:'2점',1.5:'3점',2:'4점',2.5:'5점',3:'6점',3.5:'7점',4:'8점',4.5:'9점',5:'10점'};
  document.getElementById('starLabel').textContent=(labels[myStars]||'별점을 선택하세요')+'  (10점 만점)';
}
function renderStarInput(val){
  document.querySelectorAll('.star-wrap').forEach((w,i)=>{
    const v=i+1;w.classList.remove('full','half');
    // val>=v 면 full (앞의 별 전부 노랗게)
    if(val>=v)w.classList.add('full');
    // val>=v-0.5 면 half (반별)
    else if(val>=v-0.5)w.classList.add('half');
    // 나머지는 빈별 (기본)
  });
}

/* ══ 평가 버튼 ══ */
function toggleEval(btn){
  const val=btn.dataset.val;
  if(btn.classList.contains('on')){btn.classList.remove('on');selectedEval='';}
  else{document.querySelectorAll('.eval-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');selectedEval=val;}
}

/* ══ 감정 태그 ══ */
function getEtagCount(){return document.querySelectorAll('.etag.on').length;}
function updateEtagCount(){
  const cnt=getEtagCount();
  document.getElementById('etagCount').textContent=`${cnt} / 3 태그 선택`;
  document.querySelectorAll('.etag').forEach(b=>{if(!b.classList.contains('on'))b.classList.toggle('disabled',cnt>=3);});
}
function toggleEtag(b){if(b.classList.contains('disabled'))return;b.classList.toggle('on');updateEtagCount();}

/* ══ 글자수 ══ */
function updateCharCount(el){
  const len=el.value.length;
  const el2=document.getElementById('charCount');
  el2.textContent=`${len} / 140`;
  el2.classList.toggle('warn',len>120);
}

/* ══ 제출 ══ */
async function submitReview(){
  if(!myStars){showToast('별점을 먼저 선택해주세요');return;}
  const txt=document.getElementById('reviewText').value.trim();
  if(!txt){showToast('한줄 감상을 입력해주세요');return;}
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid){location.href='/login.html';return;}

  const spoiler=document.getElementById('spoilerCheck').checked;
  const emotions=[];
  if(selectedEval)emotions.push(selectedEval);
  document.querySelectorAll('.etag.on').forEach(e=>{
    const label=e.textContent.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27FF]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/gu,'').trim();
    emotions.push(label);
  });

  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='등록 중...';

  try{
    const res=await fetch(`${REVIEW_API}/reviews/${RDATA.tmdb_id}`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sid},
      body:JSON.stringify({score:myStars,emotions,custom_tags:[],text:txt,spoiler}),
    });
    const data=await res.json();
    if(!data.ok){showToast(data.message||'오류가 발생했어요');btn.disabled=false;btn.textContent='후기 등록';return;}

    // 추천 버튼 선택값도 work_reactions에 저장 (selectedEval이 있는 경우)
    if(selectedEval){
      const labelToReaction={'강추해요':'great','추천해요':'good','평범해요':'meh','별로예요':'bad'};
      const reactionKey=labelToReaction[selectedEval];
      if(reactionKey){
        fetch(`${OTTRANK_API}/reactions/work`,{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+sid},
          credentials:'include',
          body:JSON.stringify({tmdb_id:RDATA.tmdb_id,reaction:reactionKey}),
        }).catch(()=>{});
      }
    }

    // 공유 카드용 데이터 저장
    LAST_REVIEW={score:myStars,emotions,text:txt};

    btn.textContent='등록 완료 ✓';
    document.getElementById('cancelBtn').textContent='돌아가기';
    document.getElementById('shareRow').classList.add('show');
    document.getElementById('deleteBtn').style.display='block';

    // 수정2: 등록 완료 모달 없이 즉시 카드 생성
    shareReviewCard();
  }catch(e){showToast('네트워크 오류');btn.disabled=false;btn.textContent='후기 등록';}
}

/* ══ 삭제 ══ */
async function deleteReview(){
  if(!confirm('내 후기를 삭제할까요?'))return;
  const sid=localStorage.getItem('ottrang_sid');
  try{
    const res=await fetch(`${REVIEW_API}/reviews/${RDATA.tmdb_id}`,{method:'DELETE',headers:{Authorization:'Bearer '+sid}});
    const data=await res.json();
    if(data.ok){showToast('후기가 삭제됐어요');setTimeout(()=>goBack(),1200);}
    else showToast(data.message||'삭제 실패');
  }catch(e){showToast('네트워크 오류');}
}

/* ══ 공유 이미지 카드 ══ */
const EVAL_TAGS=['강추해요','추천해요','평범해요','별로예요'];
// 점수 포맷 — 정수면 정수로, 소수면 소수 1자리로 (예: 7 → "7", 7.5 → "7.5")
function fmtScore(n){return Number.isInteger(n)?String(n):n.toFixed(1);}

async function shareReviewCard(){
  if(!LAST_REVIEW){showToast('먼저 후기를 등록해주세요');return;}
  const shareBtn=document.getElementById('shareBtn');
  shareBtn.disabled=true;
  shareBtn.innerHTML='<i class="ti ti-loader-2" style="font-size:16px"></i> 이미지 생성 중...';

  try{
    // ── 카드 데이터 채우기 ──
    const posterUrl=RDATA.poster_path&&RDATA.poster_path.includes('image.tmdb.org')
      ? RDATA.poster_path.replace('/w300/','/w780/').replace('/w500/','/w780/')
      : '';

    // 포스터를 base64 dataURL로 변환 (html2canvas CORS 회피)
    let posterDataUrl='';
    if(posterUrl){
      try{
        const imgRes=await fetch(posterUrl);
        const imgBlob=await imgRes.blob();
        posterDataUrl=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=reject;
          reader.readAsDataURL(imgBlob);
        });
      }catch(e){posterDataUrl='';}
    }

    const posterEl=document.getElementById('shareCardPoster');
    const fallbackEl=document.getElementById('shareCardPosterFallback');
    if(posterDataUrl){
      // 그라디언트 + 포스터 background-image 직접 합성
      // html2canvas는 background-image 레이어 합성을 완벽 지원
      posterEl.style.backgroundImage=`
        linear-gradient(
          180deg,
          transparent 0%,
          transparent 50%,
          rgba(13,13,20,.4) 65%,
          rgba(13,13,20,.8) 80%,
          #13131a 100%
        ),
        url(${posterDataUrl})
      `;
      posterEl.style.display='block';
      fallbackEl.style.display='none';
    }else{
      posterEl.style.display='none';
      fallbackEl.style.display='block';
    }

    // 작품명
    document.getElementById('shareCardTitle').textContent=RDATA.title||'';

    const platformLabel={netflix:'넷플릭스',tving:'티빙',disney:'디즈니+',coupang:'쿠팡플레이',wavve:'웨이브',boxoffice:'박스오피스'}[RDATA.platform]||'';
    document.getElementById('shareCardMeta').textContent=
      [RDATA.year,platformLabel].filter(Boolean).join(' · ');

    // 별점 (myStars: 0.5~5 → score10: 1~10)
    const score10=fmtScore(LAST_REVIEW.score*2);
    const fullStars=Math.floor(LAST_REVIEW.score);
    const halfStar=(LAST_REVIEW.score%1)>=0.5?1:0;
    const emptyStars=5-fullStars-halfStar;
    document.getElementById('shareCardStars').textContent=
      '★'.repeat(fullStars)+(halfStar?'½':'')+'☆'.repeat(Math.max(0,emptyStars));
    document.getElementById('shareCardScore').innerHTML=
      `${score10}<span style="font-size:22px;color:#7a7a96;font-weight:400">/10</span>`;

    // 한줄 감상
    const text=LAST_REVIEW.text||'';
    document.getElementById('shareCardText').textContent=
      text.length>70?'"'+text.slice(0,70)+'…"':'"'+text+'"';

    // 감정 태그 (최대 3개 — 카드 높이 안전을 위해)
    const tagsHtml=(LAST_REVIEW.emotions||[]).slice(0,3).map(e=>{
      const isEval=EVAL_TAGS.includes(e);
      const bg=isEval?'rgba(240,180,41,.15)':'rgba(55,138,221,.12)';
      const fg=isEval?'#f0b429':'#378ADD';
      const bd=isEval?'rgba(240,180,41,.35)':'rgba(55,138,221,.35)';
      return `<span style="background:${bg};color:${fg};border:.5px solid ${bd}">${e}</span>`;
    }).join('');
    document.getElementById('shareCardTags').innerHTML=tagsHtml;

    // 닉네임
    const nick=window.__ottrangUser__?.nickname||localStorage.getItem('ottrang_nick')||'오뜨랑 유저';
    document.getElementById('shareCardNick').textContent=nick+'의 리뷰';

    // ── 이미지 생성 ──
    await new Promise(r=>setTimeout(r,80));
    const card=document.getElementById('shareCard');
    const canvas=await html2canvas(card,{
      scale:2,
      useCORS:true,
      backgroundColor:'#13131a',
      logging:false,
    });

    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    const fileName=`ottrank_${(RDATA.title||'review').replace(/[^\w가-힣]/g,'')}.png`;

    // ── 전역 공유 상태 저장 (SNS 버튼에서 참조) ──
    const url=URL.createObjectURL(blob);
    window.__shareBlob__  = blob;
    window.__shareFile__  = new File([blob],fileName,{type:'image/png'});
    window.__shareUrl__   = url;
    window.__shareFileName__ = fileName;

    // ── 미리보기 이미지 & 저장 링크 세팅 ──
    document.getElementById('sharePreviewImg').src=url;
    const dl=document.getElementById('sharePreviewDownload');
    dl.href=url;
    dl.download=fileName;

    // ── 모달 열기 + 스크롤 맨 위로 ──
    document.getElementById('sharePreviewModal').classList.add('show');
    document.getElementById('sharePreviewModal').scrollTop=0;

  }catch(e){
    if(e.name!=='AbortError')showToast('이미지 생성에 실패했어요');
  }finally{
    shareBtn.disabled=false;
    shareBtn.innerHTML='<i class="ti ti-share-2" style="font-size:16px"></i> 후기 이미지로 공유하기';
  }
}

/* ══ 오뜨 공유 적립 공통 함수 (1일 1회) ══
   어떤 SNS 버튼을 눌러도 이 함수 하나로 처리.
   서버에서 이미 오늘 적립된 경우 already:true 반환 → 토스트만 다르게 표시 */
async function claimShareOtt(){
  const sid=localStorage.getItem('ottrang_sid');
  if(!sid)return;
  try{
    const r=await fetch(`${API}/reviews/share`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sid},
    }).then(r=>r.json()).catch(()=>null);
    if(r?.ok && !r?.already) showToast('🎉 공유! +10 오뜨 획득');
    else if(r?.already)       showToast('공유 완료! (오뜨는 1일 1회)');
    else                      showToast('공유 완료!');
  }catch(e){/* 적립 실패해도 공유 동작에는 영향 없음 */}
}

/* ── 모바일 기기 판별 헬퍼 ── */
function isMobile(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

/* ── X(트위터) 공유
   모바일: twitter:// 앱 실행 → 1.5초 후 웹 폴백
   PC    : x.com 새 탭 바로 열기 ── */
function shareToX(){
  const title = RDATA?.title || '오뜨랑 리뷰';
  const score = LAST_REVIEW ? fmtScore(LAST_REVIEW.score*2) : '';
  const scoreText = score ? ` ★${score}/10` : '';
  const tweetText = encodeURIComponent(`${title}${scoreText}\n#오뜨랑 #OTT후기\nhttps://ottrank.kr`);
  const webUrl = `https://x.com/intent/tweet?text=${tweetText}`;

  if(isMobile()){
    // 앱 실행 시도
    window.location.href = `twitter://post?message=${tweetText}`;
    // 앱 없으면 1.5초 후 웹으로 폴백
    setTimeout(()=>{
      window.open(webUrl, '_blank', 'noopener,noreferrer');
    }, 1500);
  } else {
    // PC는 바로 웹
    window.open(webUrl, '_blank', 'noopener,noreferrer');
  }
  claimShareOtt();
  showToast('이미지도 함께 올리면 더 좋아요! 💡');
}

/* ── 인스타그램 공유
   이미지 자동 저장 후
   모바일: instagram:// 앱 실행 → 1.5초 후 웹 폴백
   PC    : instagram.com 새 탭 바로 열기 ── */
function shareToInstagram(){
  // 이미지 자동 다운로드 트리거
  const dl=document.getElementById('sharePreviewDownload');
  if(dl && dl.href) dl.click();

  setTimeout(()=>{
    if(isMobile()){
      // 앱 실행 시도
      window.location.href = 'instagram://';
      // 앱 없으면 1.5초 후 웹으로 폴백
      setTimeout(()=>{
        window.open('https://www.instagram.com', '_blank', 'noopener,noreferrer');
      }, 1500);
    } else {
      // PC는 바로 웹
      window.open('https://www.instagram.com', '_blank', 'noopener,noreferrer');
    }
  }, 400); // 이미지 저장 트리거 후 잠깐 대기

  claimShareOtt();
  showToast('이미지 저장 후 인스타에 올려보세요!');
}

/* ── 카카오톡 공유
   이미지 자동 저장 후
   모바일: kakaolink://home 앱 실행
   PC    : kakaotalk:// PC 앱 실행 ── */
function shareToKakao(){
  // 1. 이미지 자동 다운로드 트리거
  const dl=document.getElementById('sharePreviewDownload');
  if(dl && dl.href) dl.click();

  // 2. 모바일/PC 분기해서 카카오톡 앱 실행
  setTimeout(()=>{
    if(isMobile()){
      window.location.href='kakaolink://home'; // 모바일 앱
    } else {
      window.location.href='kakaotalk://';     // PC 앱
    }
  }, 500);

  // 3. 오뜨 적립
  claimShareOtt();
  showToast('이미지 저장됐어요! 카카오톡에서 파일 첨부로 보내세요 📎');
}

/* ── 기타 공유
   모바일: navigator.share (파일 첨부 포함)
   PC    : 링크 클립보드 복사 ── */
async function shareToEtc(){
  const file = window.__shareFile__;

  // 모바일 등 Web Share API + 파일 공유 지원 환경
  if(navigator.canShare && file && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:`${RDATA?.title||'오뜨랑'} 후기 | 오뜨랑`,
        text:`오뜨랑에서 ${RDATA?.title||''} 후기를 남겼어요!\nhttps://ottrank.kr`,
      });
      claimShareOtt();
    }catch(e){
      if(e.name!=='AbortError') showToast('공유를 취소했어요');
    }
    return;
  }

  // PC — 링크 클립보드 복사
  try{
    await navigator.clipboard.writeText(`https://ottrank.kr`);
    showToast('링크가 복사됐어요!');
    claimShareOtt();
  }catch(e){
    showToast('링크: https://ottrank.kr');
  }
}

function closeSharePreview(){
  document.getElementById('sharePreviewModal').classList.remove('show');
}

/* ══ 유틸 ══ */
function _safeParseArr(v){if(!v)return[];try{const r=JSON.parse(v);return Array.isArray(r)?r:[];}catch(e){return[];}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function goBack(){
  let backUrl=RDATA?.back_url||'/';
  if(LAST_REVIEW)backUrl+='#myReviewBox';
  location.href=backUrl;
}
