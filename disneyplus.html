/* ── CSS 변수 (공통 + 디즈니+ 브랜드 컬러) ── */
:root {

  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);

}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
html { scroll-behavior:smooth }
body {

}

#ottrang-header { position:sticky; top:0; z-index:200 }

/* ── 히어로 배너 ── */

.hero-sub {

.hero-logo {

/* 포스터 */

/* 호버 오버레이 */

  position:absolute; inset:0;

}
.rk-card:hover .rk-overlay { opacity:1 }
.rk-play {

  margin:0 auto;
}
.rk-play svg { width:16px; height:16px; fill:#fff; margin-left:2px }

/* 카드 본문 */
.rk-body { padding:10px 12px 12px }
.rk-title-row { display:flex; align-items:center; gap:5px; margin-bottom:3px; min-width:0 }

}
.rk-en {

.rk-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.rk-year { font-family:var(--mono); font-size:12px; color:var(--muted) }
.rk-season {

.rk-memo {

}
.rk-rating {

}

/* ── 스와이프 화살표 ── */
.swipe-btn {
  position:absolute; top:38%; transform:translateY(-50%);

  border:1px solid rgba(17,60,207,0.35); background:var(--bg2);
  color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:10;
  transition:all .15s; opacity:0;
}
.swipe-wrap:hover .swipe-btn { opacity:1 }
.swipe-btn:hover { background:rgba(17,60,207,0.18); border-color:#113CCF }
.swipe-btn.prev { left:-19px }
.swipe-btn.next { right:-19px }
.swipe-btn:disabled { opacity:0!important; pointer-events:none }

/* ── 스켈레톤 ── */
.skel-card {
  flex:0 0 calc(20% - 13px); min-width:200px; border-radius:var(--r);
  background:var(--card); border:1px solid var(--border); overflow:hidden;

.skel-poster {
  width:100%; aspect-ratio:2/3;

}
.skel-line {
  height:12px; border-radius:4px; margin:10px 12px 6px;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);

}
.skel-line.short { width:55%; height:10px; margin-top:0 }

/* ── 빈 상태 / 에러 ── */
.sec-empty {

  background:var(--card); border:1px solid var(--border); border-radius:var(--r);
}

/* ── 애니메이션 ── */
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── 섹션 헤더 1줄화 ── */
  .sec-hd{ flex-wrap:nowrap; padding:18px 16px 10px; gap:6px; overflow:hidden; }

  .sec-sub{ display:none; }
  .sec-live{ display:none; }  /* 모바일: 날짜 섹션헤더에서 숨김 */
  /* ── 슬라이드 화살표 — 모바일 상시 표시 ── */
  .swipe-btn{ display:flex !important; opacity:1 !important; transition:opacity .2s; }
  .swipe-btn.prev{ left:4px; }
  .swipe-btn.next{ right:4px; }
  /* swipe-wrap을 main-outer 좌우 패딩(14px)만큼 밖으로 빼서 카드가 화면 끝까지 붙도록 함 */
  .swipe-wrap{ margin:0 -14px; }
  /* swipe-track 좌우 여백 — 카드 2개가 화면에 딱 맞게 */
  .swipe-track{ padding:0 0 6px; gap:12px; }
}

/* ott-date-bottom — 모바일 전용, 첫 섹션 하단 날짜 */

.faq-section { margin-top:8px }

<script type="application/ld+json">
{

<script>
/* ════════════════════════════════════════════════════
   디즈니+ 순위 페이지
   - /rankings/platform?platform=disney 단일 API 호출
   - ott_categories의 platform_section/platform_order/platform_limit 반영
   - 어드민에서 노출/순서/개수 변경 시 자동 반영 (하드코딩 없음)
════════════════════════════════════════════════════ */

/* ── 타이틀에 오늘 날짜 자동 삽입 (GEO 대응) ──
   검색엔진·AI가 "최신 정보"임을 바로 인식하도록, 정적 title 뒤에 오늘 날짜를 붙인다.
   기존에 검색 데이터 기반으로 튜닝해둔 키워드 순서는 그대로 두고 날짜만 추가. */
(function () {
  const d = new Date();
  const dateStr = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
  document.title = document.title.replace(' | 오뜨랑', ` (${dateStr}) | 오뜨랑`);
})();

const API      = 'https://ottrank-api.tdidream.workers.dev';
const TMDB_IMG = 'https://poster.ottrank.kr/tmdb-img/w342'; // [2026-07-17] TMDB 직접 연결 -> 캐싱 프록시로 변경 (로딩속도 개선)
const PLATFORM = 'disney';
const PLATFORM_LABEL = '디즈니플러스'; // ItemList JSON-LD의 name에 사용

/* ── 작품 상세 페이지 이동 ── */
function goWork(tmdbId, title) {
  if (!tmdbId) return;
  const y   = new Date().getFullYear();
  const url = `/title/1-${y}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: 'tv', title: title || '', platform: PLATFORM
  }));
  location.href = url;
}

/* ── 순위 카드 HTML 생성 ── */
function makeCard(item, idx) {
  const rank    = item.rank || (idx + 1);
  const isTop3  = rank <= 3;

  // 포스터: 이미지 있으면 img 태그, 없으면 이모지 placeholder
  const posterHtml = item.poster_path
    ? `<img src="${TMDB_IMG}${item.poster_path}"
            alt="${escAttr(item.title_ko || '')}"
            loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const posterPh = `<div class="rk-poster-ph">🎬</div>`;

  // 메타 정보
  const season = item.season
    ? `<span class="rk-season">시즌 ${item.season}</span>` : '';
  const memo   = item.memo
    ? `<span class="rk-memo">${escHtml(item.memo)}</span>` : '';
  const year   = item.release_year
    ? `<span class="rk-year">${item.release_year}</span>` : '';
  const rating = item.tmdb_rating
    ? `<span class="rk-rating">★ ${parseFloat(item.tmdb_rating).toFixed(1)}</span>` : '';

  return `
    <div class="rk-card" onclick="goWork(${item.tmdb_id},'${escAttr(item.title_ko || '')}')">
      <div class="rk-poster">
        ${posterHtml}${posterPh}
        <div class="rk-overlay">
          <div class="rk-play">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
      </div>
      <span class="rk-num${isTop3 ? ' top3' : ''}">${rank}</span>
      <div class="rk-body">
        <div class="rk-title-row">
          <span class="rk-title">${escHtml(item.title_ko || item.title_en || '—')}</span>
          ${season}
        </div>
        <div class="rk-en">${escHtml(item.title_en || '')}</div>
        <div class="rk-meta">${year}${memo}${rating}</div>
      </div>
    </div>`;
}

/* ── 스켈레톤 카드 HTML ── */
function makeSkel(n = 5) {
  return Array(n).fill(0).map(() => `
    <div class="skel-card">
      <div class="skel-poster"></div>
      <div class="skel-line"></div>
      <div class="skel-line short"></div>
    </div>`).join('');
}

/* ── 스와이프 드래그 초기화 ── */
function initSwipe(track) {
  let down = false, startX = 0, sl = 0;
  track.addEventListener('mousedown', e => {
    down = true; track.classList.add('dragging');
    startX = e.pageX - track.offsetLeft; sl = track.scrollLeft;
  });
  ['mouseleave', 'mouseup'].forEach(ev =>
    track.addEventListener(ev, () => { down = false; track.classList.remove('dragging'); })
  );
  track.addEventListener('mousemove', e => {
    if (!down) return; e.preventDefault();
    track.scrollLeft = sl - (e.pageX - track.offsetLeft - startX) * 1.2;
  });
}

/* ── 트랙 좌우 스크롤 ── */
function scrollTrack(id, dir) {
  const t = document.getElementById(id);
  if (!t) return;
  t.scrollBy({ left: dir * (210 * 3), behavior: 'smooth' });
  // 스크롤 후 화살표 표시/숨김 갱신
  setTimeout(() => updateSwipeBtns(t), 350);
}

function updateSwipeBtns(track) {
  const wrap = track.closest('.swipe-wrap');
  if (!wrap) return;
  const prev = wrap.querySelector('.swipe-btn.prev');
  const next = wrap.querySelector('.swipe-btn.next');
  const atStart = track.scrollLeft <= 4;
  const atEnd   = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  // PC와 동일한 방식: disabled 속성 → .swipe-btn:disabled CSS 적용
  if (prev) prev.disabled = atStart;
  if (next) next.disabled = atEnd;
}

/* 초기 화살표 상태 설정 — 로드 시 */
function initSwipeBtns() {
  document.querySelectorAll('.swipe-track').forEach(track => {
    updateSwipeBtns(track);
    track.addEventListener('scroll', () => updateSwipeBtns(track), { passive:true });
  });
}

/* ── 날짜 포맷: 오늘 기준 업데이트 텍스트 ── */
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 업데이트`;
}

/* ── 메인 데이터 로드 및 렌더링 ── */
async function loadAll() {
  const wrap = document.getElementById('sectionsWrap');

  // 1) 로딩 중 스켈레톤 먼저 표시 (UX 개선)
  wrap.innerHTML = `
    <div class="rank-section">
      <div class="sec-hd">
        <span class="sec-num">TOP 10</span>
        <span class="sec-title">불러오는 중...</span>
      </div>
      <div class="swipe-wrap">
        <div class="swipe-track">${makeSkel(5)}</div>
      </div>
    </div>`;

  let groups = [];
  try {
    // 2) /rankings/platform API 호출
    //    - ott_categories.platform_section IS NOT NULL 인 카테고리만 반환
    //    - platform_order 순으로 정렬
    //    - platform_limit 개수만큼 items 포함
    const res = await fetch(`${API}/rankings/platform?platform=${PLATFORM}`);
    if (!res.ok) throw new Error(`API 오류: ${res.status}`);
    const json = await res.json();
    groups = json.data || [];
  } catch (e) {
    wrap.innerHTML = `
      <div class="sec-empty">
        순위 데이터를 불러오지 못했습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${e.message}</span>
      </div>`;
    return;
  }

  // 3) 데이터 없을 때
  if (!groups.length) {
    wrap.innerHTML = `
      <div class="sec-empty">
        아직 등록된 순위이 없습니다.<br>
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">
          어드민 OTT 페이지 설정에서 카테고리를 노출로 설정해주세요.
        </span>
      </div>`;
    return;
  }

  const dateStr = getTodayStr();

  // 4) platform_order 순으로 이미 정렬되어 있음 (API 보장)
  //    각 그룹을 섹션으로 렌더링
  wrap.innerHTML = groups.map((group, i) => {
    const trackId  = `trk-${i}`;
    const topLabel = `TOP ${group.items?.length || 0}`;

    return `
      <div class="rank-section">
        <div class="sec-hd">
          <span class="sec-num">DISNEY+</span>
          <span class="sec-title">${escHtml(getSectionTitle(group.display_name))}</span>
          <span class="sec-count" id="cnt-${i}"></span>
          <div class="sec-live">
            <div class="sec-live-dot"></div>
            <span>${dateStr}</span>
          </div>
        </div>
        <div class="swipe-wrap">
          <button class="swipe-btn prev" onclick="scrollTrack('${trackId}',-1)">‹</button>
          <div class="swipe-track" id="${trackId}">${makeSkel(5)}</div>
          <button class="swipe-btn next" onclick="scrollTrack('${trackId}',1)">›</button>
        </div>
        ${i === 0 ? `<div class="ott-date-bottom"><div class="ott-live-dot"></div><span>${dateStr}</span></div>` : ''}
      </div>`;
  }).join('');

  // 5) 각 섹션 카드 렌더링 및 스와이프 초기화
  groups.forEach((group, i) => {
    const track = document.getElementById(`trk-${i}`);
    const items = group.items || [];

    if (!items.length) {
      track.innerHTML = `<div class="sec-empty">아직 등록된 순위이 없습니다.</div>`;
      return;
    }

    // TOP N 카운트 업데이트
    const cntEl = document.getElementById(`cnt-${i}`);
    if (cntEl) cntEl.textContent = `TOP ${items.length}`;

    // 카드 렌더링
    track.innerHTML = items.map((item, idx) => makeCard(item, idx)).join('');

    // 스와이프 드래그 초기화
    initSwipe(track);
    // 화살표 초기 상태 갱신
    updateSwipeBtns(track);
  });

  // 전체 트랙 scroll 이벤트 등록
  setTimeout(initSwipeBtns, 100);

  // 렌더링에 사용한 데이터 그대로 JSON-LD ItemList 생성 (화면에 보이는 것과 마크업 내용 일치)
  updateItemListSEO(groups);
}

/* ── 구조화 데이터 (JSON-LD) — TOP10 목록 페이지용 ItemList ──
   개별 작품 상세페이지의 Movie/TVSeries 단독 마크업과 달리, 구글이 실제로
   지원하는 "영화/시리즈 목록" 리치 결과 패턴(ItemList)에 맞춰 작성한다.
   ⚠️ 카테고리(그룹)마다 ItemList를 따로 만들거나(@graph로 묶든, 별도 <script> 태그로
   쪼개든 둘 다) 구글이 "이 페이지의 진짜 캐러셀이 무엇인지" 헷갈려해 "페이지에 여러
   ListItem 요소가 정의됨" 오류가 난다 (boxoffice.html에서 두 방식 모두 실패로 실제 확인됨).
   지금은 "영화" 카테고리가 1개뿐이라 문제가 없지만, 나중에 어드민이 카테고리를 추가해도
   안전하도록 처음부터 하나의 ItemList로 합치는 방식으로 작성한다(화면의 카테고리별 섹션은
   그대로 유지, SEO 마크업만 합침). */
function updateItemListSEO(groups) {
  const y = new Date().getFullYear();
  // 카테고리가 몇 개든 하나의 ItemList로 합치기 위해, itemListElement를 그룹 바깥에서 누적한다.
  const itemListElement = [];
  let globalPos = 0;
  // 구글 캐러셀은 모든 ListItem이 "고유한 URL"을 가리켜야 함 — 같은 작품이 "TV 시리즈"와
  // "영화" 등 여러 카테고리에 동시에 있으면 URL(/title/1-{연도}{tmdb_id})이 똑같아져서
  // 중복이 생긴다. 먼저 등장한 것만 남기고 뒤 카테고리의 중복 작품은 건너뛴다.
  const seenTmdbIds = new Set();

  (groups || []).forEach(group => {
    // media_type 판별 — API가 media_type을 직접 안 내려주므로, 카테고리명(display_name)에
    // "영화"가 포함되는지로 추정한다. (어드민이 카테고리명에서 "영화"를 빼면 오분류될 수 있음 — 알려진 한계)
    const isMovie = (group.display_name || '').includes('영화');
    // 구글 캐러셀(ItemList) 리치 결과는 Course/Movie/Recipe/Restaurant 4개 타입만 지원 —
    // TVSeries는 지원 대상이 아니라서 마크업해봐야 Search Console에 오류로만 잡힘. 영화 카테고리만 생성.
    if (!isMovie) return;

    (group.items || []).forEach(it => {
      if (!it.tmdb_id || seenTmdbIds.has(it.tmdb_id)) return; // 링크 없거나 이미 마크업된 작품 제외
      seenTmdbIds.add(it.tmdb_id);
      globalPos += 1;
      const entry = {
        '@type': 'Movie',
        'name' : it.title_ko || it.title_en || '',
        'url'  : `https://ottrank.kr/title/1-${y}${it.tmdb_id}`,
      };
      // 평점(aggregateRating)은 이 API에 투표수(vote_count)가 없어 신뢰도 낮은 마크업이 되므로 넣지 않음
      if (it.poster_path) entry.image = `${TMDB_IMG}${it.poster_path}`;
      itemListElement.push({ '@type': 'ListItem', 'position': globalPos, 'item': entry });
    });
  });

  const ldEl = document.getElementById('ldJsonList');
  if (!ldEl) return;
  if (!itemListElement.length) { ldEl.textContent = '{}'; return; }

  // ItemList를 항상 1개만(최상위 @type)로 출력 — @graph나 별도 script 태그로 쪼개지 않음
  const ld = {
    '@context': 'https://schema.org',
    '@type'   : 'ItemList',
    'name'    : `${PLATFORM_LABEL} 영화 순위 — 오뜨랑`,
    'itemListElement': itemListElement,
  };
  ldEl.textContent = JSON.stringify(ld);
}

/* ── 카테고리 타이틀 — 어드민에서 설정한 display_name 그대로 표시 ──
   플랫폼명 프리픽스나 "일간" 접두어 없이 그대로 사용
   OTT 브랜드 태그(DISNEY+)는 sec-num에 별도 표시됨 ── */
function getSectionTitle(displayName) {
  return displayName || '';
}

/* ── FAQ 아코디언 토글 — 클릭한 항목만 열고 닫음(다른 항목엔 영향 없음) ── */
function toggleFaq(btn) {
  const item = btn.closest('.faq-item');
  if (item) item.classList.toggle('open');
}

/* ── XSS 방지 유틸 ── */
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str || '').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
