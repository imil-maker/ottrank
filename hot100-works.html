<!DOCTYPE html>
<!-- 2026-08-06 rev.1 — hot100-works.html (신규 생성 — 작품 랭킹 HOT100 전용 페이지.
     1~3위는 큰 카드, 4~100위는 리스트. 왼쪽 메뉴에서 OTT 선택 시 종합 100위 리스트 안에서
     해당 OTT 서비스 중인 작품만 걸러서 보여줌(순위 번호는 재계산 안 하고 종합 순위 그대로 유지).
     데이터는 GET /hot100 한 번만 호출해서 클라이언트에서 필터링(추가 API 호출 없음).
     인물 HOT100 / 드라마 HOT100은 왼쪽 메뉴에 "준비중"으로만 표시, 추후 별도 작업) -->
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 랭킹 HOT100 — 오뜨랑</title>
<meta name="description" content="넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·박스오피스를 합산한 오뜨랑 작품 랭킹 HOT100. OTT별로 골라볼 수 있어요.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ottrank.kr/hot100-works.html">
<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
<meta name="theme-color" content="#0c0c10">

<link rel="preconnect" href="https://ottrank-api.tdidream.workers.dev">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Black+Han+Sans&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Black+Han+Sans&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Black+Han+Sans&display=swap" rel="stylesheet">
</noscript>

<style>
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --accent:#e63946; --gold:#f0b429; --green:#34d399; --red:#f87171;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Bebas Neue',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}

.hh-outer{max-width:var(--max-w);margin:0 auto;padding:24px 20px 80px;display:flex;gap:28px;align-items:flex-start}

/* ── 왼쪽 메뉴 ── */
.hh-sidebar{flex:0 0 200px;position:sticky;top:20px}
.hh-side-group{margin-bottom:24px}
.hh-side-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:8px;padding:0 4px}
.hh-side-link{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--muted2);
  font-size:14px;font-weight:600;text-decoration:none;margin-bottom:2px}
.hh-side-link:hover{background:var(--bg3)}
.hh-side-link.active{background:var(--gold);color:#000}
.hh-side-link.disabled{color:var(--muted);cursor:default;pointer-events:none;display:flex;justify-content:space-between}
.hh-soon{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg3);border-radius:4px;padding:2px 6px}
.hh-filter{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:8px;
  background:none;border:none;color:var(--muted2);font-size:14px;font-weight:600;text-align:left;
  cursor:pointer;font-family:var(--sans);margin-bottom:2px}
.hh-filter:hover{background:var(--bg3)}
.hh-filter.on{background:var(--bg3);color:var(--gold)}
.hh-filter img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
.hh-filter-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── 메인 ── */
.hh-main{flex:1;min-width:0}
.hh-h1{font-size:20px;font-weight:800;margin-bottom:2px}
.hh-sub{font-size:13px;color:var(--muted);margin-bottom:22px}

.hh-top3{display:flex;gap:16px;margin-bottom:28px}
.hh-top3-card{flex:1;position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
  aspect-ratio:2/2.6;background:var(--bg3)}
.hh-top3-card img.bg{width:100%;height:100%;object-fit:cover;display:block}
.hh-top3-fade{position:absolute;left:0;right:0;bottom:0;height:65%;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 55%,transparent 100%)}
.hh-top3-rank{position:absolute;top:8px;left:12px;font-family:var(--disp);font-size:56px;font-style:italic;
  color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7);line-height:1}
.hh-top3-rank.r1{color:var(--gold)}
.hh-top3-info{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.hh-top3-title{color:#fff;font-size:18px;font-weight:800;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hh-top3-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hh-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;color:#fff}
.hh-rating{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;
  font-family:var(--mono);color:#fff}
.hh-rating .star{color:var(--gold)}
.hh-ott-row{display:flex;gap:4px;margin-top:8px}
.hh-ott-row img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.4)}

.hh-list{display:flex;flex-direction:column}
.hh-row{display:flex;align-items:center;gap:14px;padding:11px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.hh-row:hover{background:var(--bg2)}
.hh-row-rank{flex:0 0 34px;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--muted2);text-align:center}
.hh-row-poster{flex:0 0 42px;width:42px;height:60px;border-radius:5px;overflow:hidden;background:var(--bg3)}
.hh-row-poster img{width:100%;height:100%;object-fit:cover;display:block}
.hh-row-mid{flex:1;min-width:0}
.hh-row-title{font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-row-meta{display:flex;align-items:center;gap:8px;margin-top:3px}
.hh-row-rating{font-size:12px;font-family:var(--mono);color:var(--muted2);display:inline-flex;align-items:center;gap:3px}
.hh-row-rating .star{color:var(--gold)}
.hh-row-ott{display:flex;gap:3px;flex-shrink:0}
.hh-row-ott img{width:18px;height:18px;border-radius:50%;object-fit:cover}

.hh-empty,.hh-loading{color:var(--muted);font-size:13px;padding:40px 0;text-align:center}

@media (max-width:860px){
  .hh-sidebar{display:none}
  .hh-top3{flex-direction:column}
  .hh-top3-card{aspect-ratio:3/1.6}
}
</style>
</head>
<body>

<script>
/* ══ 공용 헤더 동적 삽입 ══ */
(function(){
  fetch('/header.html')
    .then(r=>r.ok?r.text():Promise.reject())
    .then(h=>{
      document.getElementById('ottrang-header').innerHTML=h;
      document.getElementById('ottrang-header').querySelectorAll('script').forEach(s=>{
        const ns=document.createElement('script');
        ns.textContent=s.textContent;
        document.body.appendChild(ns);
      });
      if(typeof initHeader==='function') initHeader();
    })
    .catch(()=>{ /* 헤더 fetch 실패 시 무시 (로컬 개발환경) */ });
})();
</script>
<div id="ottrang-header"></div>

<div class="hh-outer">

  <!-- ══ 왼쪽 메뉴 ══ -->
  <aside class="hh-sidebar">
    <div class="hh-side-group">
      <div class="hh-side-title">🏆 HOT100</div>
      <a class="hh-side-link active" href="/hot100-works.html">작품 랭킹</a>
      <a class="hh-side-link disabled" href="#">인물 랭킹 <span class="hh-soon">준비중</span></a>
      <a class="hh-side-link disabled" href="#">드라마 랭킹 <span class="hh-soon">준비중</span></a>
    </div>
    <div class="hh-side-group" id="hhFilterGroup">
      <div class="hh-side-title">OTT별 보기</div>
      <!-- JS(renderFilters)가 채움 -->
    </div>
  </aside>

  <!-- ══ 메인 ══ -->
  <main class="hh-main">
    <div class="hh-h1">🏆 작품 랭킹 HOT100</div>
    <div class="hh-sub" id="hhSub">넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·박스오피스를 합산한 오뜨랑 종합 랭킹</div>

    <div class="hh-top3" id="hhTop3"><div class="hh-loading">불러오는 중...</div></div>
    <div class="hh-list" id="hhList"></div>
  </main>

</div>

<div id="ottrang-footer"></div>
<script>
  fetch('/footer.html').then(r=>r.ok?r.text():Promise.reject())
    .then(h=>{ document.getElementById('ottrang-footer').innerHTML=h; })
    .catch(()=>{});
</script>

<script>
const API = 'https://ottrank-api.tdidream.workers.dev';
const IMG = 'https://image.tmdb.org/t/p/w300';
const IMG_BACKDROP = 'https://image.tmdb.org/t/p/w780';
const ICON_BASE = 'https://ottrank.kr/img/';
const PLATFORM_KO = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브', boxoffice:'박스오피스' };
const PC = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3', boxoffice:'#f0b429' };
const PLATFORM_ICON = {
  netflix:'netflix-icon.jpg', tving:'tving-icon.jpg', disney:'disneyplus-icon.jpg',
  coupang:'coupangplay-icon.jpg', wavve:'wavve-icon.jpg', boxoffice:'boxoffice-icon.jpg',
};
// 왼쪽 메뉴 OTT 노출 순서 — 관리자 지정 순서(다른 화면들과 동일)
const OTT_ORDER = ['netflix','tving','disney','boxoffice','wavve','coupang'];

function _esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function _ottIcon(key){ return PLATFORM_ICON[key] ? `${ICON_BASE}${PLATFORM_ICON[key]}` : ''; }

let allItems = [];
let curFilter = 'all';

async function loadHot100Works(){
  try{
    const res  = await fetch(`${API}/hot100?limit=100`);
    const json = await res.json();
    allItems = json.data || [];
    renderFilters();
    renderPage();
  }catch(e){
    document.getElementById('hhTop3').innerHTML = `<div class="hh-empty">불러오는 중 오류가 발생했어요.</div>`;
  }
}

function renderFilters(){
  const box = document.getElementById('hhFilterGroup');
  let html = `<div class="hh-side-title" style="margin-top:0">OTT별 보기</div>`;
  html += `<button class="hh-filter ${curFilter==='all'?'on':''}" onclick="setFilter('all')">
             <span class="hh-filter-dot" style="background:var(--gold)"></span>전체</button>`;
  OTT_ORDER.forEach(key=>{
    const icon = _ottIcon(key);
    html += `<button class="hh-filter ${curFilter===key?'on':''}" onclick="setFilter('${key}')">
               ${icon ? `<img src="${icon}" alt="">` : `<span class="hh-filter-dot" style="background:${PC[key]}"></span>`}
               ${PLATFORM_KO[key] || key}</button>`;
  });
  box.innerHTML = html;
}

function setFilter(key){
  curFilter = key;
  renderFilters();
  renderPage();
}

// 필터가 걸려도 순위 번호(hot_rank)는 종합 순위 그대로 유지 — 재계산하지 않음
function _filteredItems(){
  if (curFilter === 'all') return allItems;
  return allItems.filter(it => Array.isArray(it.ott_keys) && it.ott_keys.includes(curFilter));
}

function renderPage(){
  const items = _filteredItems();
  document.getElementById('hhSub').textContent = curFilter === 'all'
    ? '넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·박스오피스를 합산한 오뜨랑 종합 랭킹'
    : `종합 HOT100 중 ${PLATFORM_KO[curFilter] || curFilter}에서 볼 수 있는 작품 (순위는 종합 기준)`;

  if (!items.length){
    document.getElementById('hhTop3').innerHTML = '';
    document.getElementById('hhList').innerHTML = '<div class="hh-empty">해당 조건의 작품이 없어요.</div>';
    return;
  }

  const top3  = items.slice(0, 3);
  const rest  = items.slice(3);

  document.getElementById('hhTop3').innerHTML = top3.map(_top3Html).join('');
  document.getElementById('hhList').innerHTML = rest.map(_rowHtml).join('');
}

function _bgOf(item){
  if (item.hero_custom_image_url) return item.hero_custom_image_url;
  if (item.hero_backdrop_path)    return `${IMG_BACKDROP}${item.hero_backdrop_path}`;
  if (item.poster_path)           return `${IMG}${item.poster_path}`;
  return '';
}

function _ottRowHtml(item, size){
  const keys = Array.isArray(item.ott_keys) ? item.ott_keys : [];
  if (!keys.length) return '';
  return `<div class="${size==='sm'?'hh-row-ott':'hh-ott-row'}">${
    keys.map(k => _ottIcon(k) ? `<img src="${_ottIcon(k)}" alt="${PLATFORM_KO[k]||k}">` : '').join('')
  }</div>`;
}

function _top3Html(item){
  const bg = _bgOf(item);
  const badgeColor = PC[item.best_platform] || '#666';
  const badgeLabel = PLATFORM_KO[item.best_platform] || item.best_platform || '';
  const title = _esc(item.title_ko || item.title_en || '');
  const goAttr = `data-tmdb="${item.tmdb_id}" data-title-ko="${_esc(item.title_ko||'')}" `
    + `data-title-en="${_esc(item.title_en||'')}" data-media-type="${item.media_type||'tv'}" `
    + `data-year="${item.release_year||''}" data-rank="${item.hot_rank}" data-platform="${item.best_platform||''}"`;

  return `
    <div class="hh-top3-card" ${goAttr} onclick="goCard(this)">
      ${bg ? `<img class="bg" src="${bg}" loading="lazy">` : ''}
      <div class="hh-top3-fade"></div>
      <div class="hh-top3-rank${item.hot_rank===1?' r1':''}">${item.hot_rank}</div>
      <div class="hh-top3-info">
        <div class="hh-top3-title">${title}</div>
        <div class="hh-top3-meta">
          <span class="hh-badge" style="background:${badgeColor}">${badgeLabel}</span>
          ${item.tmdb_rating != null ? `<span class="hh-rating"><span class="star">★</span>${Number(item.tmdb_rating).toFixed(1)}</span>` : ''}
        </div>
        ${_ottRowHtml(item)}
      </div>
    </div>
  `;
}

function _rowHtml(item){
  const title = _esc(item.title_ko || item.title_en || '');
  const goAttr = `data-tmdb="${item.tmdb_id}" data-title-ko="${_esc(item.title_ko||'')}" `
    + `data-title-en="${_esc(item.title_en||'')}" data-media-type="${item.media_type||'tv'}" `
    + `data-year="${item.release_year||''}" data-rank="${item.hot_rank}" data-platform="${item.best_platform||''}"`;

  return `
    <div class="hh-row" ${goAttr} onclick="goCard(this)">
      <div class="hh-row-rank">${item.hot_rank}</div>
      <div class="hh-row-poster">${item.poster_path ? `<img src="${IMG}${item.poster_path}" loading="lazy">` : ''}</div>
      <div class="hh-row-mid">
        <div class="hh-row-title">${title}</div>
        <div class="hh-row-meta">
          ${item.tmdb_rating != null ? `<span class="hh-row-rating"><span class="star">★</span>${Number(item.tmdb_rating).toFixed(1)}</span>` : ''}
        </div>
      </div>
      ${_ottRowHtml(item, 'sm')}
    </div>
  `;
}

// 작품페이지 이동 — 사이트 표준 패턴(goDetail)과 동일: sessionStorage에 저장 후 이동
function goCard(el){
  const tmdbId = el.dataset.tmdb;
  if (!tmdbId) return;
  const season = 1;
  const year = parseInt(el.dataset.year) || new Date().getFullYear();
  const url = `/title/${season}-${year}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: el.dataset.mediaType || 'tv',
    platform: el.dataset.platform || '', rank: el.dataset.rank || 0,
    title: el.dataset.titleKo || el.dataset.titleEn || '',
    season, year
  }));
  sessionStorage.setItem('ottrang_slug', url);
  location.href = url;
}

loadHot100Works();
</script>
</body>
</html>
