<!DOCTYPE html>
<!-- 2026-08-06 rev.7 — hot100-works.html (테두리(stroke)로 두껍게 보이게 하던 방식은 두 자리 숫자에서
     획끼리 뭉개져 안 보이는 문제가 있어 폐기 — 순위 숫자 폰트를 아주 두꺼운 전용 숫자 폰트
     Anton(Google Fonts)으로 교체. 기울임(italic)도 가독성을 위해 제거) -->
<!-- 2026-08-06 rev.6 — hot100-works.html (순위 숫자 폰트(Bebas Neue)가 두께 종류가 하나뿐이라
     font-weight만으론 안 두꺼워짐 — -webkit-text-stroke으로 테두리를 더해 두껍게 보이도록 처리) -->
<!-- 2026-08-06 rev.5 — hot100-works.html (순위변동 표시(▲▼NEW)를 숫자 옆 세로 가운데 정렬로 수정,
     5~100위 OTT 로고 크기 20% 축소(44→35px)) -->
<!-- 2026-08-06 rev.4 — hot100-works.html (순위 숫자 뒤 검은 배경 제거, 왼쪽/위 여백을 OTT 로고와
     맞추고, 숫자 크기를 OTT 로고보다 10% 크게 조정(top4: 52→58px, 포스터: 44→48px)) -->
<!-- 2026-08-06 rev.3 — hot100-works.html (① 순위 숫자를 포스터/카드 좌측상단 큰 숫자로 통일(1~4위와 동일 스타일)
     ② 순위 숫자 옆에 어제 대비 변동(▲상승/▼하락/–유지/NEW신규, hot100.js prev_rank 기반) 표시 추가
     ③ 1~4위 카드의 OTT 이름표(hh-badge) 제거 — 평점만 남김 ④ OTT 로고 크기 2배로(top4: 26→52px, 포스터: 22→44px)) -->
<!-- 2026-08-06 rev.2 — hot100-works.html (레이아웃 변경 — 1~4위는 배경이미지 카드 2개씩 2줄,
     5~100위는 검색결과 페이지(search-results.html)와 동일한 포스터 카드 1줄 4개로 교체.
     OTT 로고는 두 영역 모두 포스터/카드 우측 상단에 표시(work-ott 클래스, 검색결과 페이지와 동일 위치)) -->
<!-- 2026-08-06 rev.1 — hot100-works.html (신규 생성 — 작품 랭킹 HOT100 전용 페이지.
     1~3위는 큰 카드, 4~100위는 리스트. 왼쪽 메뉴에서 OTT 선택 시 종합 100위 리스트 안에서
     해당 OTT 서비스 중인 작품만 걸러서 보여줌(순위 번호는 재계산 안 하고 종합 순위 그대로 유지).
     데이터는 GET /hot100 한 번만 호출해서 클라이언트에서 필터링(추가 API 호출 없음).
     인물 HOT100 / 드라마 HOT100은 왼쪽 메뉴에 "준비중"으로만 표시, 추후 별도 작업) -->
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 랭킹 HOT100 — 오뜨랑</title>
<meta name="description" content="넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·박스오피스를 합산한 오뜨랑 작품 랭킹 HOT100. OTT별로 골라볼 수 있어요.">

  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Anton&family=Black+Han+Sans&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Anton&family=Black+Han+Sans&display=swap"

<style>
:root {
  --bg:#0c0c10; --bg2:#13131a; --bg3:#1a1a24; --card:#16161f;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.16);
  --text:#ededf0; --muted:#7a7a96; --muted2:#a0a0bc;
  --accent:#e63946; --gold:#f0b429; --green:#34d399; --red:#f87171;
  --NF:#e50914; --TV:#ff153c; --DS:#06b6d4; --CP:#1ac44d; --WV:#0070f3;
  --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  --disp:'Anton',sans-serif; --r:10px; --max-w:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}

.hh-outer{max-width:var(--max-w);margin:0 auto;padding:24px 20px 80px;display:flex;gap:28px;align-items:flex-start}

/* ── 왼쪽 메뉴 ── */
.hh-sidebar{flex:0 0 200px;position:sticky;top:20px}
.hh-side-group{margin-bottom:24px}
.hh-side-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:8px;padding:0 4px}
.hh-side-link{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--muted2);
  font-size:14px;font-weight:600;text-decoration:none;margin-bottom:2px}
.hh-side-link:hover{background:var(--bg3)}
.hh-side-link.active{background:var(--gold);color:#000}
.hh-side-link.disabled{color:var(--muted);cursor:default;pointer-events:none;display:flex;justify-content:space-between}
.hh-soon{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg3);border-radius:4px;padding:2px 6px}
.hh-filter{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:8px;
  background:none;border:none;color:var(--muted2);font-size:14px;font-weight:600;text-align:left;
  cursor:pointer;font-family:var(--sans);margin-bottom:2px}
.hh-filter:hover{background:var(--bg3)}
.hh-filter.on{background:var(--bg3);color:var(--gold)}
.hh-filter img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
.hh-filter-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── 메인 ── */
.hh-main{flex:1;min-width:0}
.hh-h1{font-size:20px;font-weight:800;margin-bottom:2px}
.hh-sub{font-size:13px;color:var(--muted);margin-bottom:22px}

.hh-top4{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:32px}
.hh-top4-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
  aspect-ratio:16/9;background:var(--bg3)}
.hh-top4-card img.bg{width:100%;height:100%;object-fit:cover;display:block}
.hh-top4-fade{position:absolute;left:0;right:0;bottom:0;height:70%;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.5) 60%,transparent 100%)}
.hh-top4-rank-wrap{position:absolute;top:12px;left:16px;display:flex;align-items:center;gap:8px;z-index:2}
.hh-top4-rank{font-family:var(--disp);font-size:58px;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9);line-height:1}
.hh-top4-rank.r1{color:var(--gold)}
.hh-top4-ott{position:absolute;top:12px;right:16px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:60%}
.hh-top4-ott img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.hh-top4-info{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}
.hh-top4-title{color:#fff;font-size:20px;font-weight:800;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hh-top4-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hh-rating{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;
  font-family:var(--mono);color:#fff}
.hh-rating .star{color:var(--gold)}

/* ── 순위 변동 표시(공통) — ▲상승/▼하락/–유지/NEW신규 ── */
.hh-chg{font-family:var(--mono);font-weight:700;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.hh-chg.up{color:var(--green)}
.hh-chg.down{color:var(--red)}
.hh-chg.same{color:var(--muted)}
.hh-chg.new{color:var(--gold)}

/* ── 5위부터: 검색결과 페이지와 동일한 포스터 카드(1줄 4개) ── */
.hh-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 16px}
.work-card{cursor:pointer;min-width:0}
.work-poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3);margin-bottom:8px}
.work-poster>img{width:100%;height:100%;object-fit:cover;display:block}
.work-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.work-rank-wrap{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:4px;z-index:2}
.work-rank-num{font-family:var(--disp);font-size:48px;color:#fff;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)}
.hh-chg.sm{font-size:10px}
.work-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.work-rating{color:var(--gold);flex-shrink:0}
/* 포스터 우측상단 OTT 서비스중 로고 */
.work-ott{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.ott-logo{width:35px;height:35px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.hh-empty,.hh-loading{color:var(--muted);font-size:13px;padding:40px 0;text-align:center}

@media (max-width:860px){
  .hh-sidebar{display:none}
  .hh-top4{grid-template-columns:1fr}
  .hh-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<div id="ottrang-header"></div>

<div class="hh-outer">

  <!-- ══ 왼쪽 메뉴 ══ -->
  <aside class="hh-sidebar">
    <div class="hh-side-group">
      <div class="hh-side-title">🏆 HOT100</div>

<div id="ottrang-footer"></div>
<script>
  fetch('/footer.html').then(r=>r.ok?r.text():Promise.reject())
    .then(h=>{ document.getElementById('ottrang-footer').innerHTML=h; })

<script>
const API = 'https://ottrank-api.tdidream.workers.dev';
const IMG = 'https://image.tmdb.org/t/p/w300';
const IMG_BACKDROP = 'https://image.tmdb.org/t/p/w780';
const ICON_BASE = 'https://ottrank.kr/img/';
const PLATFORM_KO = { netflix:'넷플릭스', tving:'티빙', disney:'디즈니+', coupang:'쿠팡플레이', wavve:'웨이브', boxoffice:'박스오피스' };
const PC = { netflix:'#e50914', tving:'#ff153c', disney:'#06b6d4', coupang:'#1ac44d', wavve:'#0070f3', boxoffice:'#f0b429' };
const PLATFORM_ICON = {
  netflix:'netflix-icon.jpg', tving:'tving-icon.jpg', disney:'disneyplus-icon.jpg',
  coupang:'coupangplay-icon.jpg', wavve:'wavve-icon.jpg', boxoffice:'boxoffice-icon.jpg',
};
// 왼쪽 메뉴 OTT 노출 순서 — 관리자 지정 순서(다른 화면들과 동일)
const OTT_ORDER = ['netflix','tving','disney','boxoffice','wavve','coupang'];

function _esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function _ottIcon(key){ return PLATFORM_ICON[key] ? `${ICON_BASE}${PLATFORM_ICON[key]}` : ''; }

let allItems = [];
let curFilter = 'all';

async function loadHot100Works(){
  try{
    const res  = await fetch(`${API}/hot100?limit=100`);
    const json = await res.json();
    allItems = json.data || [];
    renderFilters();
    renderPage();
  }catch(e){
    document.getElementById('hhTop4').innerHTML = `<div class="hh-empty">불러오는 중 오류가 발생했어요.</div>`;
  }
}

function renderFilters(){
  const box = document.getElementById('hhFilterGroup');
  let html = `<div class="hh-side-title" style="margin-top:0">OTT별 보기</div>`;
  html += `<button class="hh-filter ${curFilter==='all'?'on':''}" onclick="setFilter('all')">
             <span class="hh-filter-dot" style="background:var(--gold)"></span>전체</button>`;
  OTT_ORDER.forEach(key=>{
    const icon = _ottIcon(key);
    html += `<button class="hh-filter ${curFilter===key?'on':''}" onclick="setFilter('${key}')">
               ${icon ? `<img src="${icon}" alt="">` : `<span class="hh-filter-dot" style="background:${PC[key]}"></span>`}
               ${PLATFORM_KO[key] || key}</button>`;
  });
  box.innerHTML = html;
}

function setFilter(key){
  curFilter = key;
  renderFilters();
  renderPage();
}

// 필터가 걸려도 순위 번호(hot_rank)는 종합 순위 그대로 유지 — 재계산하지 않음
function _filteredItems(){
  if (curFilter === 'all') return allItems;
  return allItems.filter(it => Array.isArray(it.ott_keys) && it.ott_keys.includes(curFilter));
}

function renderPage(){
  const items = _filteredItems();
  document.getElementById('hhSub').textContent = curFilter === 'all'
    ? '넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·박스오피스를 합산한 오뜨랑 종합 랭킹'
    : `종합 HOT100 중 ${PLATFORM_KO[curFilter] || curFilter}에서 볼 수 있는 작품 (순위는 종합 기준)`;

  if (!items.length){
    document.getElementById('hhTop4').innerHTML = '';
    document.getElementById('hhGrid').innerHTML = '<div class="hh-empty">해당 조건의 작품이 없어요.</div>';
    return;
  }

  const top4  = items.slice(0, 4);
  const rest  = items.slice(4);

  document.getElementById('hhTop4').innerHTML = top4.map(_top4Html).join('');
  document.getElementById('hhGrid').innerHTML = rest.map(_posterCardHtml).join('');
}

function _bgOf(item){
  if (item.hero_custom_image_url) return item.hero_custom_image_url;
  if (item.hero_backdrop_path)    return `${IMG_BACKDROP}${item.hero_backdrop_path}`;
  if (item.poster_path)           return `${IMG}${item.poster_path}`;
  return '';
}

// 포스터/카드 우측상단 OTT 서비스중 로고 — search-results.html의 .work-ott와 동일한 자리/스타일
function _ottBadgeHtml(item, cls){
  const keys = Array.isArray(item.ott_keys) ? item.ott_keys : [];
  if (!keys.length) return '';
  return `<div class="${cls}">${
    keys.map(k => _ottIcon(k) ? `<img class="ott-logo" src="${_ottIcon(k)}" alt="${PLATFORM_KO[k]||k}">` : '').join('')
  }</div>`;
}

// 순위 변동 표시 — prev_rank(어제 계산 시점 순위)와 오늘 순위(hot_rank) 비교.
// prev_rank가 없으면(어제 기록이 아직 없거나 신규 진입) "NEW"로 표시.
function _rankChangeHtml(item, size){
  const cls = size === 'sm' ? 'hh-chg sm' : 'hh-chg';
  if (item.prev_rank == null) return `<span class="${cls} new">NEW</span>`;
  const diff = item.prev_rank - item.hot_rank;
  if (diff > 0) return `<span class="${cls} up">▲${diff}</span>`;
  if (diff < 0) return `<span class="${cls} down">▼${-diff}</span>`;
  return `<span class="${cls} same">–</span>`;
}

function _top4Html(item){
  const bg = _bgOf(item);
  const title = _esc(item.title_ko || item.title_en || '');
  const goAttr = `data-tmdb="${item.tmdb_id}" data-title-ko="${_esc(item.title_ko||'')}" `
    + `data-title-en="${_esc(item.title_en||'')}" data-media-type="${item.media_type||'tv'}" `
    + `data-year="${item.release_year||''}" data-rank="${item.hot_rank}" data-platform="${item.best_platform||''}"`;

  return `
    <div class="hh-top4-card" ${goAttr} onclick="goCard(this)">
      ${bg ? `<img class="bg" src="${bg}" loading="lazy">` : ''}
      <div class="hh-top4-fade"></div>
      <div class="hh-top4-rank-wrap">
        <div class="hh-top4-rank${item.hot_rank===1?' r1':''}">${item.hot_rank}</div>
        ${_rankChangeHtml(item)}
      </div>
      ${_ottBadgeHtml(item, 'hh-top4-ott')}
      <div class="hh-top4-info">
        <div class="hh-top4-title">${title}</div>
        <div class="hh-top4-meta">
          ${item.tmdb_rating != null ? `<span class="hh-rating"><span class="star">★</span>${Number(item.tmdb_rating).toFixed(1)}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

// 5위부터 — search-results.html의 .work-card와 동일한 포스터 카드 스타일 재사용
function _posterCardHtml(item){
  const title = _esc(item.title_ko || item.title_en || '');
  const poster = item.poster_path
    ? `<img src="${IMG}${item.poster_path}" alt="" loading="lazy">`
    : `<div class="work-poster-ph">🎬</div>`;
  const goAttr = `data-tmdb="${item.tmdb_id}" data-title-ko="${_esc(item.title_ko||'')}" `
    + `data-title-en="${_esc(item.title_en||'')}" data-media-type="${item.media_type||'tv'}" `
    + `data-year="${item.release_year||''}" data-rank="${item.hot_rank}" data-platform="${item.best_platform||''}"`;

  return `
    <div class="work-card" ${goAttr} onclick="goCard(this)">
      <div class="work-poster">
        ${poster}
        <div class="work-rank-wrap">
          <div class="work-rank-num">${item.hot_rank}</div>
          ${_rankChangeHtml(item, 'sm')}
        </div>
        ${_ottBadgeHtml(item, 'work-ott')}
      </div>
      <div class="work-title">${title}</div>
      <div class="work-meta">
        <span>${item.release_year || '-'}</span>
        ${item.tmdb_rating != null ? `<span class="work-rating">★ ${Number(item.tmdb_rating).toFixed(1)}</span>` : ''}
      </div>
    </div>
  `;
}

// 작품페이지 이동 — 사이트 표준 패턴(goDetail)과 동일: sessionStorage에 저장 후 이동
function goCard(el){
  const tmdbId = el.dataset.tmdb;
  if (!tmdbId) return;
  const season = 1;
  const year = parseInt(el.dataset.year) || new Date().getFullYear();
  const url = `/title/${season}-${year}${tmdbId}`;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id: tmdbId, type: el.dataset.mediaType || 'tv',
    platform: el.dataset.platform || '', rank: el.dataset.rank || 0,
    title: el.dataset.titleKo || el.dataset.titleEn || '',
    season, year
  }));
  sessionStorage.setItem('ottrang_slug', url);
  location.href = url;
}

loadHot100Works();
</script>
