<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평점·후기 | 오뜨랑</title>
<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/img/site.webmanifest">
<meta name="theme-color" content="#0c0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<!-- 리뷰 카드 공통 컴포넌트 CSS -->
<link rel="stylesheet" href="/components/review-card.css">
<style>
:root{
  --bg:#0c0c10;--bg2:#13131a;--bg3:#1a1a24;--card:#16161f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.16);
  --text:#ededf0;--muted:#7a7a96;--muted2:#a0a0bc;
  --accent:#e63946;--gold:#f0b429;--green:#34d399;
  --info:#378ADD;--info-bg:rgba(55,138,221,.12);--info-border:rgba(55,138,221,.35);
  --font-sans:'Noto Sans KR',sans-serif;--font-mono:'DM Mono',monospace;
  --r:10px;--r-lg:14px;--content-w:860px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.6;min-height:100vh}
#ottrang-header{position:sticky;top:0;z-index:200}

/* ── 본문 ── */
.page-wrap{max-width:var(--content-w);margin:0 auto;padding:32px 20px 80px}

/* 페이지 헤더 —
   PC: [화살표] [가운데 정렬 타이틀] [개수]  한 줄
   모바일: 1줄=타이틀(가운데정렬), 2줄=화살표(좌)…개수(우) */
.page-header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"back title count";
  align-items:center;
  column-gap:12px;
  margin-bottom:28px;
}
.page-back{grid-area:back;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;text-decoration:none;color:var(--muted2);border:.5px solid var(--border);transition:all .15s;flex-shrink:0}
.page-back:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}
.page-title{grid-area:title;font-size:20px;font-weight:700;text-align:center}
.page-title-nick{color:var(--gold)}
.page-count-wrap{grid-area:count;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.page-count{font-size:13px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.share-tag{
  font-size:10px;padding:3px 8px;border-radius:10px;
  background:rgba(240,180,41,.18);color:var(--gold);border:.5px solid rgba(240,180,41,.4);
  cursor:pointer;font-family:var(--font-sans);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
  transition:background .15s;
}
.share-tag:hover{background:rgba(240,180,41,.28)}

/* 로딩 */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:14px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap p{font-size:13px;color:var(--muted);font-family:var(--font-mono)}

/* 빈 상태 */
.sec-empty{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);padding:48px 20px;text-align:center;font-size:13px;color:var(--muted)}
.sec-empty i{font-size:32px;opacity:.3;display:block;margin-bottom:10px}

/* 후기 리스트 */
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;transition:border-color .15s;display:flex;gap:14px;align-items:flex-start}
.review-item:hover{border-color:var(--border2)}
.review-poster-link{text-decoration:none;flex-shrink:0}
.review-poster{width:48px;height:72px;border-radius:6px;background:var(--bg3);overflow:hidden}
.review-poster img{width:100%;height:100%;object-fit:cover;display:block}
.review-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px}
.review-body{flex:1;min-width:0}
.review-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.review-work-title{font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.review-work-title:hover{color:var(--accent)}

/* 10점 만점 별점 */
.stars-wrap{display:flex;align-items:center;gap:1px;margin-left:auto;flex-shrink:0}
.star{font-size:13px;color:var(--gold);line-height:1}
.star.half{position:relative;color:var(--border2)}
.star.half::before{content:'★';position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--gold)}
.star.off{color:var(--border2)}
.score-num{font-size:12px;color:var(--gold);font-family:var(--font-mono);margin-left:4px}

.review-text{font-size:13px;color:var(--muted2);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.review-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.review-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--info-bg);color:var(--info);font-family:var(--font-mono)}
.review-time{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.review-likes{font-size:11px;color:var(--muted);font-family:var(--font-mono);display:flex;align-items:center;gap:3px}
.del-btn{margin-left:auto;background:none;border:.5px solid rgba(230,57,70,.3);color:var(--accent);font-size:11px;font-family:var(--font-mono);padding:2px 10px;border-radius:4px;cursor:pointer;transition:all .15s;flex-shrink:0}
.del-btn:hover{background:rgba(230,57,70,.1)}

/* 페이지네이션 */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap}
.page-btn{width:34px;height:34px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted2);font-size:13px;font-family:var(--font-mono);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.page-btn:hover{border-color:var(--border2);color:var(--text)}
.page-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn.arrow{font-size:16px}

/* 토스트 */
.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:rgba(30,30,40,.95);color:#fff;font-size:14px;padding:12px 24px;border-radius:22px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;font-family:var(--font-mono);word-break:keep-all}
.toast.show{opacity:1}

/* 삭제 버튼 — 포스터 좌상단 고정 (닉네임 뱃지와 동일 구조) */
.rc-del-badge {
  position: absolute;
  top: 8px; left: 8px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono, monospace);
  padding: 3px 10px;
  border-radius: 4px;
  color: #fff;
  background: rgba(230,57,70,.75);
  border: .5px solid rgba(230,57,70,.9);
  z-index: 4;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background .15s;
}
.rc-del-badge:hover {
  background: rgba(230,57,70,.95);
}

/* ══════════════════════════════════════
   이 페이지 전용 — 리뷰 카드 구조 변경
   review-card.css 원본은 글 영역(.rc-content)이 포스터(.rc-poster) "안"에
   position:absolute로 겹쳐 떠 있는 구조라, 글이 길어지면 포스터의
   overflow:hidden에 그대로 잘림 (2줄 제한을 풀어도 동일하게 잘림).
   여긴 평점·후기 전체 보기 페이지라 글이 절대 잘리면 안 되므로,
   #reviewArea 안에서만 "포스터 위 + 글은 그 아래 별도 영역"으로 재배치.
   review-card.css 파일 자체는 손대지 않아 index/mypage/community에는 영향 없음.
═══════════════════════════════════════ */
#reviewArea .rc-content {
  position: static;                 /* 절대배치 해제 → 포스터 다음에 자연스럽게 쌓임 */
  background: var(--bg2);
  border-radius: 0 0 var(--r) var(--r);
}
#reviewArea .rc-body {
  display: block;                   /* -webkit-box(줄 제한) 해제 */
  -webkit-line-clamp: unset;
  overflow: visible;
  white-space: pre-wrap;            /* 줄바꿈 입력한 그대로 표시 */
  word-break: break-word;
  text-shadow: none;                /* 더 이상 이미지 위에 겹치지 않으므로 그림자 불필요 */
}
#reviewArea .rc-title {
  text-shadow: none;
}
/* 카드마다 글 길이가 달라 높이가 제각각이므로, 한 행의 가장 긴 카드에
   맞춰 나머지 카드까지 늘어나지 않도록(stretch 기본값 해제) start로 고정 */
#reviewArea .rc-grid {
  align-items: start;
}

@media(max-width:600px){
  .page-wrap{padding:24px 16px 60px}

  /* 헤더 2줄 배치: 1줄=타이틀(전체너비, 가운데정렬), 2줄=화살표(좌)…개수(우) */
  .page-header{
    grid-template-columns:auto 1fr auto;
    grid-template-areas:
      "title title title"
      "back  .     count";
    row-gap:10px;
  }

  /* 모바일 — 2열 그리드로 전환 */
  #reviewArea .rc-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    overflow-x: unset !important;
    scroll-snap-type: unset !important;
    padding: 0 !important;
    row-gap: 16px !important;
  }
  #reviewArea .rc-card {
    flex: unset !important;
    min-width: unset !important;
    scroll-snap-align: unset !important;
  }
  /* rc-poster는 기본 aspect-ratio(2/3) 그대로 사용 —
     이제 글이 포스터 아래 별도 블록이라 오버레이용 높이 보정이 필요 없음 */
}
</style>
</head>
<body>

<!-- 헤더 -->
<div id="ottrang-header"></div>

<div class="page-wrap">

  <!-- 페이지 헤더 -->
  <div class="page-header">
    <a class="page-back" id="backBtn" href="/mypage.html">
      <i class="ti ti-arrow-left" style="font-size:15px"></i>
    </a>
    <span class="page-title" id="pageTitle">⭐ <span class="page-title-nick" id="pageTitleNick"></span> 평점·후기</span>
    <span class="page-count-wrap" id="pageCountWrap">
      <button class="rc-tag share-tag" id="shareBtn" onclick="shareCurrentPage()">
        <i class="ti ti-link" style="font-size:11px"></i> 공유하기
      </button>
      <span class="page-count" id="totalCount"></span>
    </span>
  </div>

  <!-- 로딩 -->
  <div class="loading-wrap" id="loadingWrap">
    <div class="loading-spinner"></div>
    <p>불러오는 중...</p>
  </div>

  <!-- 후기 목록 -->
  <div id="reviewArea" style="display:none"></div>
  <div class="pagination" id="reviewPager"></div>

</div>

<div class="toast" id="toast"></div>

<!-- 푸터 -->
<div id="ottrang-footer"></div>

<script>
const API  = 'https://ottrank-api.tdidream.workers.dev';
const IMG  = 'https://image.tmdb.org/t/p/w300';
const PER  = 20; // 한 페이지당 후기 수 (PC 20개, 모바일은 동일 적용)

let ALL_REVIEWS = [];
let IS_OWN      = false;
let curPage     = 1;

/* ── 헤더 삽입 ── */
fetch('/header.html')
  .then(r => r.text())
  .then(h => {
    document.getElementById('ottrang-header').innerHTML = h;
    document.querySelectorAll('#ottrang-header script').forEach(s => {
      const ns = document.createElement('script');
      ns.textContent = s.textContent;
      document.body.appendChild(ns);
    });
    if (typeof initHeader === 'function') initHeader();
  })
  .catch(() => {})
  .finally(() => {
    init();
    /* 푸터 삽입 */
    fetch('/footer.html')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(h => { document.getElementById('ottrang-footer').innerHTML = h; })
      .catch(() => {});
  });

async function init() {
  const params    = new URLSearchParams(location.search);
  const targetUid = params.get('uid');
  const sid       = localStorage.getItem('ottrang_sid');

  try {
    if (targetUid) {
      /* ── 타인 프로필 조회 — 리뷰만 가볍게 ── */
      IS_OWN = false;
      const json = await (await fetch(`${API}/user/${targetUid}/reviews`,
        sid ? { headers: { Authorization: 'Bearer ' + sid } } : {})).json();
      if (!json.ok) { showError('유저를 찾을 수 없어요'); return; }
      ALL_REVIEWS = json.reviews || [];
      // 뒤로가기 → 해당 유저 마이페이지
      document.getElementById('backBtn').href = `/mypage.html?uid=${targetUid}`;
      document.title = `${json.nickname || '유저'}의 평점·후기 | 오뜨랑`;
      document.getElementById('pageTitleNick').textContent = json.nickname || '유저';
    } else {
      /* ── 내 리뷰 — 리뷰만 가볍게 ── */
      IS_OWN = true;
      if (!sid) { showError('로그인이 필요해요'); return; }
      const json = await (await fetch(`${API}/mypage/reviews`, { headers: { Authorization: 'Bearer ' + sid } })).json();
      if (!json.ok) { showError('로그인이 필요해요'); return; }
      ALL_REVIEWS = json.reviews || [];
      document.title = `${json.nickname || '나'}의 평점·후기 | 오뜨랑`;
      document.getElementById('pageTitleNick').textContent = json.nickname || '나';
    }

    document.getElementById('totalCount').textContent = `전체 ${ALL_REVIEWS.length}개`;
    document.getElementById('loadingWrap').style.display = 'none';
    document.getElementById('reviewArea').style.display  = 'block';
    renderReviews(1);

  } catch(e) {
    showError('데이터를 불러오지 못했어요: ' + e.message);
  }
}

/* ── 후기 렌더링 — rc-card 그리드 (community.html과 동일 구조) ── */
function renderReviews(page) {
  curPage = page;
  const el = document.getElementById('reviewArea');
  if (!ALL_REVIEWS.length) {
    el.innerHTML = '<div class="sec-empty"><i class="ti ti-star"></i>아직 쓴 후기가 없어요</div>';
    document.getElementById('reviewPager').innerHTML = '';
    return;
  }
  const total = ALL_REVIEWS.length;
  const pages = Math.ceil(total / PER);
  const slice = ALL_REVIEWS.slice((page - 1) * PER, page * PER);

  const EVAL_SET = ['강추해요','추천해요','평범해요','별로예요'];

  el.innerHTML = '<div class="rc-grid">'
    + slice.map(function(r) {
      var score    = parseFloat(r.score) || 0;  // 5점 기준
      var scoreNum = score ? (score * 2).toFixed(1).replace(/\.0$/, '') : '';
      var emotions = _json(r.emotions, []);

      // evaluation / emotions 분리
      var evaluation = '';
      var emoList = emotions.slice();
      if (emoList.length > 0 && EVAL_SET.indexOf(emoList[0]) !== -1) {
        evaluation = emoList.shift();
      }

      // 별점 렌더링 (★½☆)
      var full  = Math.floor(score);
      var half  = (score - full) >= 0.5 ? 1 : 0;
      var empty = 5 - full - half;
      var stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);

      // 포스터 URL
      var posterUrl = r.poster_path || '';
      if (posterUrl && posterUrl.indexOf('http') !== 0) {
        posterUrl = 'https://image.tmdb.org/t/p/w300' + posterUrl;
      }

      // 태그
      var evalBadge = evaluation ? '<span class="rc-tag eval">' + evaluation + '</span>' : '';
      var emoTags   = emoList.slice(0, 2).map(function(e) {
        return '<span class="rc-tag emo">' + e + '</span>';
      }).join('');

      // 한줄 감상
      var bodyHtml = r.text
        ? '<div class="rc-body">"' + r.text + '"</div>'
        : '<div class="rc-body rc-body-empty">평점만 남긴 후기</div>';

      // 작품 이동 — 기존 goTitle() 방식 완전 유지
      var goAttr = 'data-tmdb-id="' + r.tmdb_id + '"'
        + ' data-title-ko="' + (r.title_ko || '').replace(/"/g, '&quot;') + '"'
        + ' data-category="' + (r.category || 'tv') + '"'
        + ' data-release-year="' + (r.release_year || '') + '"'
        + ' onclick="goTitle(this)" style="cursor:pointer"';

      // 삭제 버튼 — 포스터 좌상단 고정 (본인만)
      var delBadge = IS_OWN
        ? '<button class="rc-del-badge"'
          + ' onclick="event.stopPropagation();delReview(' + r.tmdb_id + ',' + r.id + ')">삭제</button>'
        : '';

      // 좋아요 — 우상단 (원래 있던 별점 뱃지 자리)
      // 내 리뷰(IS_OWN)는 클릭 불가, 빈 하트+숫자만 표시
      // 남의 리뷰는 클릭 가능한 좋아요 버튼 (색상/채움 로직은 community.html의 review-card.js와 동일)
      var likeCount = r.likes || 0;
      var likedByMe = !!r.liked_by_me;
      var likeHtml;
      if (IS_OWN) {
        likeHtml = '<div class="rc-like-badge" style="cursor:default">'
          + '<span class="rc-like-icon">♡</span>'
          + '<span class="rc-like-count"' + (likeCount < 2 ? ' style="display:none"' : '') + '>' + likeCount + '</span>'
          + '</div>';
      } else {
        likeHtml = '<button type="button" class="rc-like-badge' + (likedByMe ? ' liked' : '') + '"'
          + ' id="rc_like_' + r.id + '" data-pending="0"'
          + ' onclick="event.stopPropagation();toggleLike(' + r.tmdb_id + ',' + r.id + ',this)">'
          + '<span class="rc-like-icon">' + (likedByMe ? '♥' : '♡') + '</span>'
          + '<span class="rc-like-count"' + (likeCount < 2 ? ' style="display:none"' : '') + '>' + likeCount + '</span>'
          + '</button>';
      }

      return '<div class="rc-card" ' + goAttr + '>'
        + '<div class="rc-poster">'
        + (posterUrl
            ? '<div class="rc-poster-bg" style="background-image:url(\'' + posterUrl + '\')"></div>'
            : '<div class="rc-poster-ph">🎬</div>')
        + '<div class="rc-poster-fade"></div>'
        + delBadge
        + likeHtml
        + '</div>'
        + '<div class="rc-content">'
        + '<div class="rc-title">' + (r.title_ko || '작품 #' + r.tmdb_id) + '</div>'
        + '<div class="rc-stars-row">'
        + '<span class="rc-stars">' + stars + '</span>'
        + (scoreNum ? '<span class="rc-score-num">' + scoreNum + '/10</span>' : '')
        + '</div>'
        + '<div class="rc-divider"></div>'
        + bodyHtml
        + ((evalBadge || emoTags) ? '<div class="rc-tags">' + evalBadge + emoTags + '</div>' : '')
        + '</div>'
        + '</div>';
    }).join('')
    + '</div>';

  renderPager(page, pages);
  if (page > 1) window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── 별점 렌더링 (10점 만점 → 별 5개) ── */
function renderStars(score) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    const threshold = i * 2; // 별 1개 = 2점, 반개 = 1점
    if (score >= threshold)        html += `<span class="star">★</span>`;
    else if (score >= threshold-1) html += `<span class="star half">★</span>`;
    else                           html += `<span class="star off">★</span>`;
  }
  return html;
}

/* ── 작품 페이지 이동 ── */
function goTitle(el) {
  const tmdb_id     = parseInt(el.dataset.tmdbId);
  const title_ko    = el.dataset.titleKo || '';
  const category    = el.dataset.category || 'tv';
  const release_year= el.dataset.releaseYear || null;
  if (!tmdb_id) return;
  const y   = release_year ? String(release_year).slice(0,4) : String(new Date().getFullYear());
  const url = '/title/1-' + y + tmdb_id;
  sessionStorage.setItem('ottrang_work', JSON.stringify({
    tmdb_id, type: category, platform: '', rank: '—',
    title: title_ko, season: 1, year: parseInt(y)
  }));
  location.href = url;
}

/* ── 좋아요 뱃지 화면 갱신 ── */
function _applyLikeUI(id, liked, likes) {
  const btn = document.getElementById('rc_like_' + id);
  if (!btn) return;
  btn.classList.toggle('liked', liked);
  const icon = btn.querySelector('.rc-like-icon');
  if (icon) icon.textContent = liked ? '♥' : '♡';
  const count = btn.querySelector('.rc-like-count');
  if (count) {
    count.textContent = likes;
    count.style.display = likes < 2 ? 'none' : '';
  }
}

/* ── 좋아요 토글 (남의 리뷰에서만 호출됨 — 내 리뷰는 클릭 불가) ── */
async function toggleLike(tmdbId, reviewId, btnEl) {
  if (!reviewId || !tmdbId) return;

  const sid = localStorage.getItem('ottrang_sid');
  if (!sid) {
    location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  const btn = btnEl || document.getElementById('rc_like_' + reviewId);
  if (btn) {
    if (btn.dataset.pending === '1') return; // 연타 방지
    btn.dataset.pending = '1';
  }

  const wasLiked  = btn?.classList.contains('liked') || false;
  const countEl   = btn?.querySelector('.rc-like-count');
  const prevLikes = parseInt(countEl?.textContent || '0', 10) || 0;

  // 낙관적 업데이트
  const optimisticLiked = !wasLiked;
  const optimisticLikes = prevLikes + (optimisticLiked ? 1 : -1);
  _applyLikeUI(reviewId, optimisticLiked, optimisticLikes);

  try {
    const res  = await fetch(`${API}/reviews/${tmdbId}/like/${reviewId}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + sid },
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok) {
      _applyLikeUI(reviewId, wasLiked, prevLikes); // 롤백
      return;
    }
    _applyLikeUI(reviewId, !!data.liked, data.likes);
  } catch (e) {
    _applyLikeUI(reviewId, wasLiked, prevLikes); // 네트워크 오류 — 롤백
  } finally {
    if (btn) btn.dataset.pending = '0';
  }
}

/* ── 후기 삭제 ── */
async function delReview(tmdb_id, review_id) {
  const sid = localStorage.getItem('ottrang_sid');
  if (!confirm('후기를 삭제할까요?')) return;
  try {
    const res  = await fetch(`${API}/reviews/${tmdb_id}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + sid } });
    const json = await res.json();
    if (json.ok) {
      ALL_REVIEWS = ALL_REVIEWS.filter(r => r.id !== review_id);
      document.getElementById('totalCount').textContent = `전체 ${ALL_REVIEWS.length}개`;
      renderReviews(curPage > Math.ceil(ALL_REVIEWS.length / PER) ? 1 : curPage);
      showToast('후기가 삭제됐어요');
    } else showToast(json.message || '삭제 실패');
  } catch(e) { showToast('오류: ' + e.message); }
}

/* ── 페이지네이션 ── */
function renderPager(cur, total) {
  const el = document.getElementById('reviewPager');
  if (total <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (cur > 1) html += `<button class="page-btn arrow" onclick="renderReviews(${cur-1})">‹</button>`;
  for (let i = 1; i <= total; i++) {
    html += `<button class="page-btn ${i===cur?'on':''}" onclick="renderReviews(${i})">${i}</button>`;
  }
  if (cur < total) html += `<button class="page-btn arrow" onclick="renderReviews(${cur+1})">›</button>`;
  el.innerHTML = html;
}

/* ── 유틸 ── */
function _json(str, fb) { try { return JSON.parse(str); } catch(e) { return fb; } }
function _date(d) {
  if (!d) return '';
  const k = new Date(new Date(d).getTime() + 9*60*60*1000);
  return `${k.getFullYear()}.${String(k.getMonth()+1).padStart(2,'0')}.${String(k.getDate()).padStart(2,'0')}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ══════════════════════════════════════
   공유하기 — 현재 페이지 주소를 클립보드에 복사
   본인 페이지(uid 없음): /auth/me로 내 고유번호를 가져와 ?uid= 링크를 새로 생성
   타인 페이지(?uid= 있음): 지금 주소(location.href) 그대로 복사
═══════════════════════════════════════ */
async function shareCurrentPage() {
  let url = location.href;

  if (IS_OWN) {
    let uid = null;
    try {
      if (window.__ottrangAuthReady__) {
        const timeout = new Promise(res => setTimeout(() => res(null), 3000));
        const u = await Promise.race([window.__ottrangAuthReady__, timeout]);
        uid = u?.id || null;
      }
      if (!uid) {
        const sid = localStorage.getItem('ottrang_sid');
        if (sid) {
          const res  = await fetch(`${API}/auth/me`, { headers: { Authorization: 'Bearer ' + sid } });
          const data = await res.json();
          if (data.ok && data.user) uid = data.user.id;
        }
      }
    } catch (e) { /* 실패 시 아래 fallback으로 현재 주소 복사 */ }

    if (uid) url = `${location.origin}/my_review.html?uid=${uid}`;
  }

  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    // 클립보드 API 미지원 구형 브라우저 대응
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }

  showToast('이 페이지 주소가 복사되었습니다.');
}
function showError(msg) {
  document.getElementById('loadingWrap').innerHTML = `<p style="color:var(--accent);font-family:var(--font-mono)">${msg}</p>`;
}
